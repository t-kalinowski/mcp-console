name: Babysit sandbox boundary pull request CI

on:
  push:
    branches:
      - sandbox-boundary-ci-babysit
  workflow_dispatch:

permissions:
  actions: write
  checks: read
  contents: write
  pull-requests: read

concurrency:
  group: babysit-sandbox-boundary-pull-request-ci
  cancel-in-progress: false

env:
  FEATURE_BRANCH: use-bundled-codex-sandbox-runner-validated
  CODEX_BRANCH: mcp-console/sandbox-runner-v1-validated

jobs:
  babysit:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the babysitter branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: sandbox-boundary-ci-babysit

      - name: Wait for the draft pull request
        id: pr
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            pr_url=$(gh pr list --repo t-kalinowski/mcp-console --head "$FEATURE_BRANCH" --base main --state open --json url --jq '.[0].url // empty')
            if [[ -n "$pr_url" ]]; then
              pr_number=$(gh pr view "$pr_url" --repo t-kalinowski/mcp-console --json number --jq .number)
              echo "url=$pr_url" >> "$GITHUB_OUTPUT"
              echo "number=$pr_number" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 20
          done
          echo 'The sandbox boundary draft pull request did not appear' >&2
          exit 1

      - name: Wait for pull-request checks and retry failures once
        id: checks
        shell: bash
        env:
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 180); do
            count=$(gh pr checks "$PR_URL" --repo t-kalinowski/mcp-console --json name 2>/dev/null | jq 'length' || echo 0)
            if [[ "$count" -gt 0 ]]; then break; fi
            sleep 20
          done

          set +e
          gh pr checks "$PR_URL" --repo t-kalinowski/mcp-console --watch --interval 20
          first_status=$?
          set -e

          if [[ "$first_status" -ne 0 ]]; then
            head_sha=$(gh pr view "$PR_URL" --repo t-kalinowski/mcp-console --json headRefOid --jq .headRefOid)
            gh run list --repo t-kalinowski/mcp-console --branch "$FEATURE_BRANCH" --event pull_request --limit 20 \
              --json databaseId,conclusion,status,workflowName,url,headSha > "${RUNNER_TEMP}/runs.json"
            mapfile -t failed_ids < <(jq -r --arg head "$head_sha" '.[] | select(.headSha == $head and .conclusion == "failure") | .databaseId' "${RUNNER_TEMP}/runs.json")
            for run_id in "${failed_ids[@]}"; do
              gh run view "$run_id" --repo t-kalinowski/mcp-console --log-failed > "${RUNNER_TEMP}/run-${run_id}-failed.log" 2>&1 || true
              gh run rerun "$run_id" --repo t-kalinowski/mcp-console --failed || true
            done
            sleep 30
            gh pr checks "$PR_URL" --repo t-kalinowski/mcp-console --watch --interval 20
          fi

          gh pr checks "$PR_URL" --repo t-kalinowski/mcp-console > "${RUNNER_TEMP}/checks.txt"

      - name: Record successful CI result
        if: success()
        shell: bash
        env:
          PR_URL: ${{ steps.pr.outputs.url }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          head_sha=$(gh pr view "$PR_URL" --repo t-kalinowski/mcp-console --json headRefOid --jq .headRefOid)
          codex_sha=$(git ls-remote https://github.com/t-kalinowski/codex.git "refs/heads/${CODEX_BRANCH}" | awk '{print $1}')
          cat > sandbox-boundary-ci-result.md <<EOF
          # Sandbox boundary CI result

          - Draft pull request: ${PR_URL}
          - Pull request number: ${PR_NUMBER}
          - MCP Console head: `${head_sha}`
          - Codex runner commit: `${codex_sha}`
          - CI result: passed
          - PR state: open, draft, and not merged
          EOF
          cp "${RUNNER_TEMP}/checks.txt" sandbox-boundary-ci-checks.txt
          git rm .github/workflows/babysit-sandbox-boundary-ci.yml
          git add sandbox-boundary-ci-result.md sandbox-boundary-ci-checks.txt
          git config user.name 'Tomasz Kalinowski'
          git config user.email 'kalinowskit@gmail.com'
          git commit -m 'Record sandbox boundary pull request CI result'
          git push origin HEAD:sandbox-boundary-ci-babysit

      - name: Preserve failed logs
        if: failure()
        shell: bash
        env:
          PR_URL: ${{ steps.pr.outputs.url }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          mkdir -p sandbox-boundary-ci-failure-logs
          cp "${RUNNER_TEMP}"/run-*-failed.log sandbox-boundary-ci-failure-logs/ 2>/dev/null || true
          cp "${RUNNER_TEMP}/runs.json" sandbox-boundary-ci-failure-logs/ 2>/dev/null || true
          cat > sandbox-boundary-ci-failure.md <<EOF
          # Sandbox boundary CI failure

          - Draft pull request: ${PR_URL}
          - Pull request number: ${PR_NUMBER}
          - CI result: failed after one retry

          Failed-job logs are preserved in `sandbox-boundary-ci-failure-logs/` on this branch.
          EOF
          git rm .github/workflows/babysit-sandbox-boundary-ci.yml
          git add sandbox-boundary-ci-failure.md sandbox-boundary-ci-failure-logs
          git config user.name 'Tomasz Kalinowski'
          git config user.email 'kalinowskit@gmail.com'
          git commit -m 'Record sandbox boundary pull request CI failure'
          git push origin HEAD:sandbox-boundary-ci-babysit
