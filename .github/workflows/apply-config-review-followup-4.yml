name: Apply config review follow-up 4

on:
  push:
    branches:
      - design/config-yaml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: design/config-yaml
          fetch-depth: 0

      - name: Apply guarded documentation edits
        run: echo '' | base64 -d | python

      - name: Commit documentation update and remove helper workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/apply-config-review-followup-4.yml
          git add design-sketches/CONFIGURATION.md
          git commit -m "Make configuration sketch review contract self-contained"
          git push origin HEAD:design/config-yaml
