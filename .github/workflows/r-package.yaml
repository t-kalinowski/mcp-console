name: R package

on:
  pull_request:
    paths:
      - "r/**"
      - ".github/workflows/r-package.yaml"
  push:
    branches:
      - main
    paths:
      - "r/**"
      - ".github/workflows/r-package.yaml"

permissions:
  contents: read

jobs:
  check:
    name: R CMD check (macos-latest)
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install R
        uses: r-lib/actions/setup-r@v2

      - name: Install package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r
          packages: |
            deps::.
            any::sessioninfo

      - name: Check package
        working-directory: r
        run: |
          R CMD build .
          R CMD check --no-manual mcp.console_*.tar.gz
