name: R package

on:
  pull_request:
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "build.rs"
      - "src/**"
      - "r/**"
      - ".github/workflows/r-package.yaml"
  push:
    branches:
      - main
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "build.rs"
      - "src/**"
      - "r/**"
      - ".github/workflows/r-package.yaml"

permissions:
  contents: read

jobs:
  check:
    name: R CMD check (macos-latest)
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install R
        uses: r-lib/actions/setup-r@v2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@v2

      - name: Build MCP Console
        run: |
          cargo build --locked --bin mcp-console
          echo "MCP_CONSOLE_TEST_BINARY=$GITHUB_WORKSPACE/target/debug/mcp-console" >> "$GITHUB_ENV"

      - name: Install package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r
          packages: |
            deps::.

      - name: Check package
        working-directory: r
        run: |
          R CMD build .
          R CMD check --no-manual mcp.console_*.tar.gz
