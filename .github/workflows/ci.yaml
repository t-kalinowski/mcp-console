name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  snapshot:
    name: Export SQL documentation sources
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: sql-doc-snapshot
          path: |
            src/server.rs
            docs/TOOL_DESCRIPTIONS.md
            docs/BUILTIN_RUNTIME.md
            tests/transcripts/client_server/server.py
            tests/transcripts/golden/client_server/server/initializes_and_lists_tools.yaml
