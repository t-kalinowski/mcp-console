name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (macos-latest)
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install R
        if: runner.os == 'macOS'
        uses: r-lib/actions/setup-r@v2

      - name: Install R dependencies
        if: runner.os == 'macOS'
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::arrow
            any::DBI
            any::dbplyr
            any::dplyr
            any::duckdb
            any::nanoarrow
            any::pillar
            any::processx
            any::tibble
            github::rstudio/reticulate

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Install tools
        run: |
          uv tool install r-lib-ir
          uv tool install yamark
          uv tool dir --bin >> "$GITHUB_PATH"

      - name: Prewarm default R environment
        env:
          GITHUB_PAT: ${{ github.token }}
          IR_NO_LOCAL_SOURCES: "1"
        run: |
          ir run \
            --with tidyverse \
            --with github::rstudio/reticulate \
            --with DBI \
            --with duckdb \
            --with arrow \
            --with nanoarrow \
            --isolated \
            --vanilla \
            -e 'invisible(NULL)'

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@v2

      - name: Run checks
        env:
          GITHUB_PAT: ${{ github.token }}
        run: scripts/check
