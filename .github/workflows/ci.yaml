name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  merge-main:
    name: Merge current main into feature branch
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          ref: sql-python-dbapi-connections
          fetch-depth: 0

      - name: Merge main and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          git push origin HEAD:sql-python-dbapi-connections
