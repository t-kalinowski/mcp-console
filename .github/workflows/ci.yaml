name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Preserve compiler state for debug, test, and release builds across revisions.
  CARGO_INCREMENTAL: "1"
  # Manual version used by GitHub Actions cache keys and restore prefixes.
  # Bump for build inputs outside the hashed files, such as workflow build
  # flags or native dependency setup. Cargo and Maturin do not read this value.
  CI_BUILD_CACHE_VERSION: "2"
  IR_LATEST_RESOLUTION_MAX_AGE_SECONDS: "604800"
  UV_VERSION: 0.12.4

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Select weekly cache epoch
        id: cache-epoch
        run: |
          printf 'value=%s\n' "$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
          printf 'image=%s-%s\n' "${ImageOS:?}" "${ImageVersion:?}" >> "$GITHUB_OUTPUT"

      - name: Install Python
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Read private sandbox source pin
        id: sandbox-pin
        run: scripts/stage-sandbox-runner --github-output "$GITHUB_OUTPUT"

      - name: Check out private sandbox source
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.sandbox-pin.outputs.repository }}
          ref: ${{ steps.sandbox-pin.outputs.commit }}
          path: .sandbox-runner-source

      - name: Restore private sandbox source timestamps
        id: sandbox-source-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/sandbox-source.tar
          key: sandbox-source-v1-${{ steps.cache-epoch.outputs.value }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.sandbox-pin.outputs.commit }}

      - name: Prepare private sandbox source archive
        run: |
          if [ -f "$RUNNER_TEMP/sandbox-source.tar" ]; then
            tar -xf "$RUNNER_TEMP/sandbox-source.tar" -C .sandbox-runner-source
          else
            # Preserve tracked-source mtimes with the build cache, excluding
            # checkout credentials and the separately cached Cargo outputs.
            tar -cf "$RUNNER_TEMP/sandbox-source.tar" \
              --exclude=./.git --exclude=./codex-rs/target \
              -C .sandbox-runner-source .
          fi
          test -z "$(git -C .sandbox-runner-source status --porcelain --untracked-files=all)"

      - name: Save private sandbox source timestamps
        if: steps.sandbox-source-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/sandbox-source.tar
          key: ${{ steps.sandbox-source-cache.outputs.cache-primary-key }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          cache-local-path: ${{ runner.temp }}/mcp-console-cache
          cache-suffix: runtime-v2-${{ steps.cache-epoch.outputs.value }}
          prune-cache: false
          save-cache: true

      - name: Install tools
        id: tools
        run: |
          uv tool install r-lib-ir
          uv tool install yamark
          uv tool dir --bin >> "$GITHUB_PATH"
          printf 'ir_version=%s\n' "$(ir --version | tr ' ' '-')" >> "$GITHUB_OUTPUT"

      # Chrome is unused here; its repository can block apt with inconsistent metadata.
      - name: Disable unused Chrome apt repository
        if: runner.os == 'Linux'
        run: |
          sudo find /etc/apt/sources.list.d -type f \
            \( -name '*.list' -o -name '*.sources' \) \
            -exec grep -qF 'dl.google.com/linux/chrome' {} \; \
            -print -delete

      - name: Install R
        id: setup-r
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: always

      # The managed R environment can build data.table from source. Its NLS
      # code needs libintl.h in R's /opt/R/<arch> build prefix.
      - name: Install gettext for R source packages
        if: runner.os == 'macOS'
        run: |
          sudo Rscript --vanilla -e \
            'source("https://mac.R-project.org/bin/install.R"); install.libs("gettext"); stopifnot(file.exists(file.path("/opt/R", Sys.info()[["machine"]], "include", "libintl.h")))'

      - name: Install Rust
        id: rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Linux build and sandbox dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libcurl4-openssl-dev libcap-dev
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Configure R cache paths
        run: |
          printf 'IR_CACHE_DIR=%s\n' "$RUNNER_TEMP/mcp-console-r-cache/ir" >> "$GITHUB_ENV"
          printf 'RENV_PATHS_CACHE=%s\n' "$RUNNER_TEMP/mcp-console-r-cache/renv" >> "$GITHUB_ENV"

      - name: Restore R environments
        id: ir-cache
        uses: actions/cache/restore@v6
        with:
          # v3 covers the inline prewarm contract. Bump it when that contract changes.
          path: ${{ runner.temp }}/mcp-console-r-cache
          key: >-
            ir-v3-${{ steps.cache-epoch.outputs.value }}-${{ runner.os }}-${{ runner.arch }}-r-${{ steps.setup-r.outputs.installed-r-version }}-${{ steps.tools.outputs.ir_version }}-${{ hashFiles('src/worker_client.rs', 'src/resolver/managed_r.rs', 'tests/boundaries/client_server/requirements/test_r_automatic.py', 'tests/boundaries/client_server/requirements/test_r.py') }}
          restore-keys: |
            ir-v3-${{ steps.cache-epoch.outputs.value }}-${{ runner.os }}-${{ runner.arch }}-r-${{ steps.setup-r.outputs.installed-r-version }}-${{ steps.tools.outputs.ir_version }}-

      - name: Restore Cargo downloads
        id: cargo-downloads
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: >-
            cargo-downloads-v1-${{ steps.cache-epoch.outputs.value }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', '.sandbox-runner-source/codex-rs/Cargo.lock') }}
          restore-keys: |
            cargo-downloads-v1-${{ steps.cache-epoch.outputs.value }}-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore Rust build data
        id: rust-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            target/debug
            target/release
            target/libexec
            target/share/licenses
          # Keep one baseline per dependency set, shared from main by ordinary PRs.
          # Source edits reuse it without uploading another large target snapshot.
          # Every restore prefix includes the UTC week to start fresh on Monday.
          key: >-
            cargo-build-v${{ env.CI_BUILD_CACHE_VERSION }}-${{ steps.cache-epoch.outputs.value }}-${{ steps.cache-epoch.outputs.image }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.cachekey }}-r-${{ steps.setup-r.outputs.installed-r-version }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', '.cargo/**') }}
          restore-keys: |
            cargo-build-v${{ env.CI_BUILD_CACHE_VERSION }}-${{ steps.cache-epoch.outputs.value }}-${{ steps.cache-epoch.outputs.image }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.cachekey }}-r-${{ steps.setup-r.outputs.installed-r-version }}-

      - name: Restore private sandbox runner
        id: sandbox-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            wheel-data
            target/sandbox-runner-build.json
          # The pin, runner image, and recipe identify the native build inputs.
          key: >-
            sandbox-runner-v3-${{ steps.cache-epoch.outputs.value }}-${{ steps.cache-epoch.outputs.image }}-${{ runner.os }}-${{ runner.arch }}-recipe-${{ env.CI_BUILD_CACHE_VERSION }}-${{ hashFiles('sandbox-runner.json', 'scripts/stage-sandbox-runner') }}

      - name: Restore private sandbox build data
        id: sandbox-build-cache
        uses: actions/cache/restore@v6
        with:
          path: .sandbox-runner-source/codex-rs/target
          # Source-install checks need intermediates even with a staged runner.
          # Reuse workspace crates from the preceding pin when rebuilding it.
          # Keep every restore prefix within the current UTC week.
          key: >-
            sandbox-build-v${{ env.CI_BUILD_CACHE_VERSION }}-${{ steps.cache-epoch.outputs.value }}-${{ steps.cache-epoch.outputs.image }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.sandbox-runner-source/codex-rs/rust-toolchain.toml') }}-${{ hashFiles('.sandbox-runner-source/codex-rs/Cargo.toml', '.sandbox-runner-source/codex-rs/Cargo.lock', '.sandbox-runner-source/codex-rs/.cargo/**') }}-${{ steps.sandbox-pin.outputs.commit }}
          restore-keys: |
            sandbox-build-v${{ env.CI_BUILD_CACHE_VERSION }}-${{ steps.cache-epoch.outputs.value }}-${{ steps.cache-epoch.outputs.image }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.sandbox-runner-source/codex-rs/rust-toolchain.toml') }}-${{ hashFiles('.sandbox-runner-source/codex-rs/Cargo.toml', '.sandbox-runner-source/codex-rs/Cargo.lock', '.sandbox-runner-source/codex-rs/.cargo/**') }}-
            sandbox-build-v${{ env.CI_BUILD_CACHE_VERSION }}-${{ steps.cache-epoch.outputs.value }}-${{ steps.cache-epoch.outputs.image }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.sandbox-runner-source/codex-rs/rust-toolchain.toml') }}-

      - name: Stage private sandbox runner
        # Rebuild on either miss so source-install checks retain a warm workspace.
        if: >-
          steps.sandbox-cache.outputs.cache-hit != 'true' ||
          steps.sandbox-build-cache.outputs.cache-hit != 'true'
        run: scripts/stage-sandbox-runner .sandbox-runner-source

      # Save each completed build before any tests run.
      - name: Save private sandbox runner
        if: steps.sandbox-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            wheel-data
            target/sandbox-runner-build.json
          key: ${{ steps.sandbox-cache.outputs.cache-primary-key }}

      - name: Save private sandbox build data
        if: steps.sandbox-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .sandbox-runner-source/codex-rs/target
          key: ${{ steps.sandbox-build-cache.outputs.cache-primary-key }}

      - name: Restore release outputs
        id: release-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            target/release/mcp-console
            target/libexec
            target/share/licenses
            dist
          # Only exact matches skip packaging. On a miss, Maturin invokes Cargo
          # using the build data restored above, including earlier revisions.
          key: >-
            release-v1-${{ steps.cache-epoch.outputs.value }}-${{ steps.cache-epoch.outputs.image }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.cachekey }}-r-${{ steps.setup-r.outputs.installed-r-version }}-py-${{ steps.python.outputs.python-version }}-recipe-${{ env.CI_BUILD_CACHE_VERSION }}-${{ hashFiles('src/**', 'python/**', 'Cargo.toml', 'Cargo.lock', '.cargo/**', 'build.rs', 'build_backend.py', 'pyproject.toml', 'sandbox-runner.json', 'target/sandbox-runner-build.json', 'scripts/stage-sandbox-runner', 'README.md', 'LICENSE') }}

      - name: Build Rust test targets
        run: cargo test --locked --no-run --all-targets --all-features

      - name: Prepare Clippy build data
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Build Python package
        if: steps.release-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          GITHUB_PAT: ${{ github.token }}
          UV_TOOL_DIR: ${{ runner.temp }}/mcp-console-tool
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/mcp-console-bin
          UV_CACHE_DIR: ${{ runner.temp }}/mcp-console-cache
          UV_PYTHON_DOWNLOADS: never
          UV_NO_CONFIG: "1"
        run: |
          set -euo pipefail

          rm -rf dist
          uvx --from 'maturin==1.15.0' \
            maturin build \
            --release \
            --locked \
            --compatibility pypi \
            --out dist

      - name: Save release outputs
        if: steps.release-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            target/release/mcp-console
            target/libexec
            target/share/licenses
            dist
          key: ${{ steps.release-cache.outputs.cache-primary-key }}

      - name: Save Cargo downloads
        if: steps.cargo-downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.cargo-downloads.outputs.cache-primary-key }}

      - name: Save Rust build data
        if: steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            target/debug
            target/release
            target/libexec
            target/share/licenses
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}

      - name: Run core checks
        env:
          GITHUB_PAT: ${{ github.token }}
        run: scripts/check-core

      - name: Smoke-test Python package
        env:
          GITHUB_PAT: ${{ github.token }}
          UV_TOOL_DIR: ${{ runner.temp }}/mcp-console-tool
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/mcp-console-bin
          UV_CACHE_DIR: ${{ runner.temp }}/mcp-console-cache
          UV_PYTHON_DOWNLOADS: never
          UV_NO_CONFIG: "1"
        run: |
          python3 scripts/release.py \
            smoke-wheel \
            dist/*.whl \
            target/release/mcp-console

      - name: Install R package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        env:
          R_LIBS_USER: ${{ runner.temp }}/mcp-console-r-package
        with:
          cache: always
          cache-version: r-package-v1-${{ steps.cache-epoch.outputs.value }}
          working-directory: r
          upgrade: "FALSE"
          packages: |
            deps::.

      - name: Check R package
        env:
          MCP_CONSOLE_TEST_BINARY: ${{ github.workspace }}/target/release/mcp-console
          R_LIBS_USER: ${{ runner.temp }}/mcp-console-r-package
          _R_CHECK_TESTS_NLINES_: "0"
        working-directory: r
        run: |
          R CMD build .
          R CMD check --no-manual mcp.console_*.tar.gz

      - name: Install transcript dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: transcripts-v1-${{ steps.cache-epoch.outputs.value }}
          install-quarto: true
          upgrade: "FALSE"
          packages: |
            any::devtools
            any::processx
            any::reticulate

      - name: Prewarm default R environment
        env:
          GITHUB_PAT: ${{ github.token }}
          IR_NO_LOCAL_SOURCES: "1"
          IR_LATEST_RESOLUTION_MAX_AGE_SECONDS: ${{ github.ref == 'refs/heads/main' && steps.ir-cache.outputs.cache-hit != 'true' && '0' || '604800' }}
        run: |
          ir run \
            --with tidyverse \
            --with reticulate \
            --with DBI \
            --with duckdb \
            --with arrow \
            --with nanoarrow \
            --isolated \
            --vanilla \
            -e 'sessionInfo(package = c("tidyverse", "reticulate", "DBI", "duckdb", "arrow", "nanoarrow"))'

      - name: Run transcripts
        env:
          GITHUB_PAT: ${{ github.token }}
        # Use the prepared executable; scripts/test also invokes Cargo.
        run: uv run --script tests/boundaries/_run.py --jobs 6

      - name: Check uv source installations
        env:
          # Run last: these checks replace and hide the shared target directory.
          MCP_CONSOLE_SANDBOX_SOURCE: ${{ github.workspace }}/.sandbox-runner-source
          UV_CACHE_DIR: ${{ runner.temp }}/mcp-console-cache
          UV_PYTHON_DOWNLOADS: never
          UV_NO_CONFIG: "1"
        run: python3 tests/install.py

      - name: Save R environments
        if: >-
          github.ref == 'refs/heads/main' && steps.ir-cache.outputs.cache-hit !=
          'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/mcp-console-r-cache
          key: ${{ steps.ir-cache.outputs.cache-primary-key }}
