name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (macos-latest)
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install R
        if: runner.os == 'macOS'
        uses: r-lib/actions/setup-r@v2

      # The tidyverse prewarm can build data.table from source. Its NLS code
      # needs libintl.h in R's /opt/R/<arch> build prefix.
      - name: Install gettext for R source packages
        if: runner.os == 'macOS'
        run: |
          sudo Rscript --vanilla -e \
            'source("https://mac.R-project.org/bin/install.R"); install.libs("gettext"); stopifnot(file.exists(file.path("/opt/R", Sys.info()[["machine"]], "include", "libintl.h")))'

      - name: Install R dependencies
        if: runner.os == 'macOS'
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::arrow
            any::DBI
            any::dbplyr
            any::dplyr
            any::duckdb
            any::nanoarrow
            any::pillar
            any::processx
            any::tibble
            github::rstudio/reticulate

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.4"

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install tools
        run: |
          uv tool install r-lib-ir
          uv tool install yamark
          uv tool dir --bin >> "$GITHUB_PATH"

      - name: Prewarm default R environment
        env:
          GITHUB_PAT: ${{ github.token }}
          IR_NO_LOCAL_SOURCES: "1"
        run: |
          ir run \
            --with tidyverse \
            --with github::rstudio/reticulate \
            --with DBI \
            --with duckdb \
            --with arrow \
            --with nanoarrow \
            --isolated \
            --vanilla \
            -e 'invisible(NULL)'

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@v2

      - name: Run checks
        env:
          GITHUB_PAT: ${{ github.token }}
        run: scripts/check

      - name: Build and smoke-test Python package
        shell: bash
        env:
          GITHUB_PAT: ${{ github.token }}
          UV_TOOL_DIR: ${{ runner.temp }}/mcp-console-tool
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/mcp-console-bin
          UV_CACHE_DIR: ${{ runner.temp }}/mcp-console-cache
          UV_PYTHON_DOWNLOADS: never
          UV_NO_CONFIG: "1"
        run: |
          set -euo pipefail

          rm -rf dist
          cargo build --locked --bin mcp-console
          uvx --from 'maturin==1.14.1' \
            maturin build \
            --release \
            --locked \
            --compatibility pypi \
            --out dist
          python3 scripts/release.py \
            smoke-wheel \
            dist/*.whl \
            target/debug/mcp-console
