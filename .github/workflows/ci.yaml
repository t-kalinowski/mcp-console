name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (macos-latest)
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install R
        if: runner.os == 'macOS'
        uses: r-lib/actions/setup-r@v2

      - name: Install IR
        env:
          IR_INSTALL_DIR: ${{ runner.temp }}/ir/bin
          IR_NO_MODIFY_PATH: "1"
        run: |
          curl -fsSL https://raw.githubusercontent.com/r-lib/ir/main/scripts/install.sh | sh
          echo "$IR_INSTALL_DIR" >> "$GITHUB_PATH"

      - name: Install R dependencies
        if: runner.os == 'macOS'
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::arrow
            any::DBI
            any::dbplyr
            any::dplyr
            any::duckdb
            any::nanoarrow
            any::pillar
            any::processx
            any::tibble
            github::rstudio/reticulate

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@v2

      - name: Run checks
        run: scripts/check
