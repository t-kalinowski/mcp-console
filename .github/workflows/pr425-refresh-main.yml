name: Refresh main in PR 425
on:
  push:
    branches: [feat/background-runtime-startup]
    paths: [.github/workflows/pr425-refresh-main.yml]
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: false
      - name: Install source formatters
        run: |
          uv tool install ruff
          uv tool install yamark
          uv tool install air-formatter
          uv tool dir --bin >> "$GITHUB_PATH"
      - name: Merge main and resolve preparation ownership
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags origin main feat/background-runtime-startup
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/feat/background-runtime-startup)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 2ae02cf2bddce17784d312117df228e083464973
          test "$(git rev-parse origin/main)" = 9d15213db60e6f45c42493f8b998d9c30382c00e
          set +e
          git merge --no-commit --no-ff origin/main
          MERGE_STATUS=$?
          set -e
          test "$MERGE_STATUS" -le 1
          test "$(git diff --name-only --diff-filter=U)" = src/resolver/preparation/client.rs
          python - <<'PY'
          from pathlib import Path
          import subprocess
          s = subprocess.check_output(["git", "show", "9d15213db60e6f45c42493f8b998d9c30382c00e:src/resolver/preparation/client.rs"], text=True)
          def edit(old, new, count=1):
              global s
              assert s.count(old) >= count, old
              s = s.replace(old, new, count)
          edit('''        selections: Selections,
                  on_started:''', '''        selections: Selections,
                  diagnostics: crate::process_output::Diagnostics,
                  on_started:''')
          edit('let _ = (session, selections, on_started);', 'let _ = (session, selections, diagnostics, on_started);')
          edit('''            Self::open_with(command, session.blocked.clone(), open, false, on_started)''', '''            Self::open_with(
                          command,
                          session.blocked.clone(),
                          open,
                          false,
                          diagnostics,
                          on_started,
                      )''')
          edit('''        mode: Mode,
                  on_started:''', '''        mode: Mode,
                  diagnostics: crate::process_output::Diagnostics,
                  on_started:''')
          edit('Self::open_with(command, Arc::default(), open, true, on_started)', 'Self::open_with(command, Arc::default(), open, true, diagnostics, on_started)')
          edit('''        local: bool,
                  on_started:''', '''        local: bool,
                  diagnostics: crate::process_output::Diagnostics,
                  on_started:''')
          edit('''        #[cfg(unix)]
                  command.stdin(Stdio::piped()).stdout(Stdio::piped());
                  command.stderr(Stdio::inherit());''', '''        #[cfg(unix)]
                  command
                      .stdin(Stdio::piped())
                      .stdout(Stdio::piped())
                      .stderr(Stdio::piped());
                  #[cfg(windows)]
                  {
                      let _ = diagnostics;
                      command.stderr(Stdio::inherit());
                  }''')
          edit('''        #[cfg(unix)]
                  let reader_abort = aborted.try_clone().map_err(|e| e.to_string())?;''', '''        #[cfg(unix)]
                  let (diagnostic_exit, notify_diagnostic_exit) = io::pipe().map_err(|e| e.to_string())?;
                  #[cfg(unix)]
                  let diagnostic_reader = {
                      let stderr = child.stderr.take().expect("preparation stderr");
                      let diagnostic_events = events.clone();
                      thread::spawn(move || {
                          if let Err(error) =
                              crate::process_output::forward(stderr, diagnostic_exit, diagnostics)
                          {
                              let _ = diagnostic_events.send(Event::Received(Err(format!(
                                  "{} stderr read failed: {error}",
                                  label(local)
                              ))));
                          }
                      })
                  };
                  #[cfg(unix)]
                  let reader_abort = aborted.try_clone().map_err(|e| e.to_string())?;''')
          edit('''            crate::process_exit::ChildExitWaiter::start_notifying(child.id(), move || {
                          let _ = exit_events.send(Event::Exited);''', '''            crate::process_exit::ChildExitWaiter::start_notifying(child.id(), move || {
                          #[cfg(unix)]
                          drop(notify_diagnostic_exit);
                          let _ = exit_events.send(Event::Exited);''')
          edit('''            result.and(reaped)''', '''            #[cfg(unix)]
                      let _ = diagnostic_reader.join();
                      result.and(reaped)''')
          edit('''                // Join preparation cleanup before the MCP process can exit.
                          let _ = connection.close();
                          Err(error)''', '''                // Join preparation cleanup before the MCP process can exit.
                          match connection.close() {
                              Ok(()) => Err(error),
                              Err(cleanup) => Err(format!("{error}; {cleanup}")),
                          }''')
          Path("src/resolver/preparation/client.rs").write_text(s)
          PY
          test "$(git hash-object src/resolver/preparation/client.rs)" = e0643c54accb3135ae82b359eb8285731374c625
          git add src/resolver/preparation/client.rs
          git rm .github/workflows/pr425-refresh-main.yml
          test -z "$(git ls-files -u)"
          scripts/format --strict
          python scripts/validate_runtime_sources.py
          python tests/architecture.py
          git add -u
          git diff --cached --check
          test ! -e .github/workflows/pr425-refresh-main.yml
          git commit -m 'Merge main into feat/background-runtime-startup' -m 'Include main 9d15213 and reconcile preparation ownership: retain bounded cancellation, owner joining and child reaping while preserving Unix diagnostic capture and native Windows preparation. Remove the temporary in-branch merge workflow.'
          git fetch --no-tags origin main feat/background-runtime-startup
          test "$(git rev-parse origin/main)" = 9d15213db60e6f45c42493f8b998d9c30382c00e
          test "$(git rev-parse origin/feat/background-runtime-startup)" = "$GITHUB_SHA"
          git merge-base --is-ancestor origin/main HEAD
          git push origin HEAD:refs/heads/feat/background-runtime-startup
          echo "MERGED_HEAD=$(git rev-parse HEAD)"
          echo "MERGED_TREE=$(git rev-parse HEAD^{tree})"
          git show -s --format='PARENTS=%P' HEAD
          git diff --stat origin/main HEAD
          printf '%s\n' 'Merged and pushed only feat/background-runtime-startup. No other remote branches were created.'
