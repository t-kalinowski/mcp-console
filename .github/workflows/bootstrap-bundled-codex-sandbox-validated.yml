name: Publish recovered sandbox work for handoff

on:
  push:
    branches:
      - use-bundled-codex-sandbox-runner-validated
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-recovered-sandbox-handoff
  cancel-in-progress: false

env:
  CODEX_BASE_REVISION: 855e8f9ef5b4211408791252e02e38b4757218cc
  CODEX_BRANCH: mcp-console/sandbox-runner-v1-validated
  FEATURE_BRANCH: use-bundled-codex-sandbox-runner-validated

jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      TOKEN_CODEX_REPO_PAT: ${{ secrets.CODEX_REPO_PAT }}
      TOKEN_CODEX_REPO_TOKEN: ${{ secrets.CODEX_REPO_TOKEN }}
      TOKEN_CODEX_PAT: ${{ secrets.CODEX_PAT }}
      TOKEN_CODEX_GITHUB_TOKEN: ${{ secrets.CODEX_GITHUB_TOKEN }}
      TOKEN_CROSS_REPO_PAT: ${{ secrets.CROSS_REPO_PAT }}
      TOKEN_CROSS_REPO_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
      TOKEN_GH_PAT: ${{ secrets.GH_PAT }}
      TOKEN_GITHUB_PAT: ${{ secrets.GITHUB_PAT }}
      TOKEN_PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      TOKEN_PAT: ${{ secrets.PAT }}
      TOKEN_REPOSITORY: ${{ github.token }}
    steps:
      - name: Check out the MCP Console handoff branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: use-bundled-codex-sandbox-runner-validated

      - name: Reconstruct and publish the Codex runner patch
        id: codex
        shell: bash
        run: |
          set -euo pipefail

          git clone --filter=blob:none --no-checkout \
            https://github.com/t-kalinowski/codex.git \
            "${RUNNER_TEMP}/codex"
          git -C "${RUNNER_TEMP}/codex" checkout --detach "$CODEX_BASE_REVISION"

          for part in 00 01 02; do
            curl -fsSL \
              "https://raw.githubusercontent.com/t-kalinowski/mcp-console/codex-sandbox-runner/.validation/codex.patch.gz.b64.${part}"
          done \
            | tr -d '\r\n' \
            | base64 --decode \
            | gzip -dc > "${RUNNER_TEMP}/codex.patch"

          git -C "${RUNNER_TEMP}/codex" apply --index --binary \
            "${RUNNER_TEMP}/codex.patch"
          git -C "${RUNNER_TEMP}/codex" diff --cached --check
          git -C "${RUNNER_TEMP}/codex" config user.name 'Tomasz Kalinowski'
          git -C "${RUNNER_TEMP}/codex" config user.email 'kalinowskit@gmail.com'
          git -C "${RUNNER_TEMP}/codex" commit \
            -m 'Add the private MCP Console sandbox runner' \
            -m "MCP-Console-Sandbox-Base: ${CODEX_BASE_REVISION}"
          codex_revision=$(git -C "${RUNNER_TEMP}/codex" rev-parse HEAD)

          token=''
          for variable in \
            TOKEN_CODEX_REPO_PAT \
            TOKEN_CODEX_REPO_TOKEN \
            TOKEN_CODEX_PAT \
            TOKEN_CODEX_GITHUB_TOKEN \
            TOKEN_CROSS_REPO_PAT \
            TOKEN_CROSS_REPO_TOKEN \
            TOKEN_GH_PAT \
            TOKEN_GITHUB_PAT \
            TOKEN_PERSONAL_ACCESS_TOKEN \
            TOKEN_PAT \
            TOKEN_REPOSITORY
          do
            candidate=${!variable:-}
            if [[ -n "$candidate" ]]; then
              token=$candidate
              break
            fi
          done
          if [[ -z "$token" ]]; then
            echo 'No GitHub write credential was available' >&2
            exit 1
          fi

          git -C "${RUNNER_TEMP}/codex" remote set-url origin \
            "https://x-access-token:${token}@github.com/t-kalinowski/codex.git"
          git -C "${RUNNER_TEMP}/codex" push --force-with-lease \
            origin "HEAD:refs/heads/${CODEX_BRANCH}"

          echo "revision=${codex_revision}" >> "$GITHUB_OUTPUT"

      - name: Publish the recovered MCP Console integration
        shell: bash
        env:
          CODEX_REVISION: ${{ steps.codex.outputs.revision }}
        run: |
          set -euo pipefail

          for part in 00 01 02 03 04; do
            curl -fsSL \
              "https://raw.githubusercontent.com/t-kalinowski/mcp-console/codex-sandbox-runner/.validation/mcp.patch.gz.b64.${part}"
          done \
            | tr -d '\r\n' \
            | base64 --decode \
            | gzip -dc > "${RUNNER_TEMP}/mcp-console.patch"

          git apply --index --binary "${RUNNER_TEMP}/mcp-console.patch"
          while IFS= read -r file; do
            perl -0pi -e \
              "s/855e8f9ef5b4211408791252e02e38b4757218cc/${CODEX_REVISION}/g; s/__CODEX_SANDBOX_REVISION__/${CODEX_REVISION}/g" \
              "$file"
          done < <(grep -RIl --exclude-dir=.git -E \
            '855e8f9ef5b4211408791252e02e38b4757218cc|__CODEX_SANDBOX_REVISION__' \
            . || true)

          git rm \
            .github/workflows/bootstrap-bundled-codex-sandbox-validated.yml \
            .github/workflows/finalize-sandbox-pr-metadata.yml
          git add -A
          git diff --cached --check
          git config user.name 'Tomasz Kalinowski'
          git config user.email 'kalinowskit@gmail.com'
          git commit \
            -m 'Use a bundled Codex-derived sandbox runner' \
            -m "Codex-Sandbox-Revision: ${CODEX_REVISION}"
          git push origin "HEAD:${FEATURE_BRANCH}"
