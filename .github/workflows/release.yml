name: Release

# Build native macOS and Linux wheels and publish them to PyPI.
#
# Releases are tag-driven. A manual workflow run builds artifacts for
# inspection but does not publish.
#
# If publication partially fails, rerun the failed job while the original
# artifacts are retained. Do not rebuild an already partially uploaded version.

on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  wheels:
    name: pypi-${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            runner_target: aarch64-unknown-linux-musl
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            runner_target: x86_64-unknown-linux-musl

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Read private sandbox source pin
        id: sandbox-pin
        run: scripts/stage-sandbox-runner --github-output "$GITHUB_OUTPUT"

      - name: Check out private sandbox source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.sandbox-pin.outputs.repository }}
          ref: ${{ steps.sandbox-pin.outputs.commit }}
          path: .sandbox-runner-source

      # Chrome is unused here; its repository can block apt with inconsistent metadata.
      - name: Disable unused Chrome apt repository
        if: runner.os == 'Linux'
        run: |
          sudo find /etc/apt/sources.list.d -type f \
            \( -name '*.list' -o -name '*.sources' \) \
            -exec grep -qF 'dl.google.com/linux/chrome' {} \; \
            -print -delete

      - name: Set up R
        uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2.12.1

      # The default R environment may build data.table from source. Its NLS code
      # needs libintl.h in R's /opt/R/<arch> build prefix.
      - name: Install gettext for R source packages
        if: runner.os == 'macOS'
        run: |
          sudo Rscript --vanilla -e \
            'source("https://mac.R-project.org/bin/install.R"); install.libs("gettext"); stopifnot(file.exists(file.path("/opt/R", Sys.info()[["machine"]], "include", "libintl.h")))'

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.12.4

      - name: Install Linux build and sandbox dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libcurl4-openssl-dev libcap-dev
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install private sandbox Rust toolchain
        run: >-
          rustup toolchain install
          "${{ steps.sandbox-pin.outputs.rust_toolchain }}"
          --profile minimal

      - name: Install the release Zig compiler
        if: runner.os == 'Linux'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.14.0

      - name: Prepare the pinned Linux release recipe
        if: runner.os == 'Linux'
        env:
          TARGET: ${{ matrix.runner_target }}
        run: |
          rustup target add --toolchain '${{ steps.sandbox-pin.outputs.rust_toolchain }}' "$TARGET"
          # Scope the compilers to staging. Actions reserves GITHUB_ENV in env:.
          GITHUB_ENV='${{ runner.temp }}/sandbox-musl.env' \
            bash .sandbox-runner-source/.github/scripts/install-musl-build-tools.sh
          echo 'AWS_LC_SYS_NO_JITTER_ENTROPY=1' >> '${{ runner.temp }}/sandbox-musl.env'

      - name: Stage private sandbox runner
        shell: bash
        run: |
          if [[ '${{ runner.os }}' == Linux ]]; then
            while IFS= read -r setting; do export "${setting?}"; done < '${{ runner.temp }}/sandbox-musl.env'
          fi
          scripts/stage-sandbox-runner .sandbox-runner-source \
            --target '${{ matrix.runner_target || matrix.target }}'

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.15.0
          rust-toolchain: ${{ steps.sandbox-pin.outputs.rust_toolchain || 'stable' }}
          target: ${{ matrix.target }}
          manylinux: off
          args: --release --locked --compatibility pypi --out dist

      - name: Audit Linux wheel dependencies and platform tags
        if: runner.os == 'Linux'
        run: python3 scripts/release.py audit-linux-wheel dist/*.whl

      - name: Smoke-test wheel
        env:
          GITHUB_PAT: ${{ github.token }}
          UV_TOOL_DIR: ${{ runner.temp }}/mcp-console-tool
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/mcp-console-bin
          UV_CACHE_DIR: ${{ runner.temp }}/mcp-console-cache
          UV_PYTHON_DOWNLOADS: never
          UV_NO_CONFIG: "1"
        run: |
          python3 scripts/release.py \
            smoke-wheel \
            dist/*.whl \
            target/${{ matrix.target }}/release/mcp-console \
            --target "${{ matrix.target }}"
          python3 tests/sandbox_installation.py "$UV_TOOL_BIN_DIR/mcp-console"

      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pypi-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  publish-pypi:
    name: publish PyPI
    needs: wheels

    # Manual dispatch is build-only. Only tag-triggered runs may publish.
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}

    runs-on: ubuntu-22.04
    environment: pypi

    permissions:
      actions: read
      contents: read
      id-token: write

    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Validate release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py validate-publish

      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: pypi-*
          path: dist
          merge-multiple: true

      - name: Verify wheel set
        run: python3 scripts/release.py verify-wheel-set dist

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.12.4

      - name: Publish wheels to PyPI
        run: |
          uv publish \
            --trusted-publishing always \
            --check-url https://pypi.org/simple \
            dist/*.whl
