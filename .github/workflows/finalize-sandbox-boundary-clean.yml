name: Validate and publish sandbox boundary

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  checks: write

env:
  CARGO_TERM_COLOR: always
  IR_LATEST_RESOLUTION_MAX_AGE_SECONDS: "604800"
  UV_VERSION: "0.12.4"

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'followup/sandbox-boundary-v2'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: followup/sandbox-boundary-v2
          fetch-depth: 0

      - name: Reconstruct source changes on current main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, urllib.request
          from pathlib import Path

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          shas = [
              '8a48def161aaa82a738f94f54698a2423ed81d38',
              '390df097c43974dd8f6c590ffdea7c1ad088daf6',
              'b8eac27d7e5a087f4944d5aedc3998f39febc53e',
              'ed17786f843a47ff9b497b2f5ee7a8dfca066ff8',
              'e09a8e83d31d835d1343ce1f3e7e490ef0e75750',
              '5e3d25e49f75859b0d4b750747eb4ce47ba97b80',
              'c47252cdb9ee5a7e55525554f050748fcc670b72',
              '446c994f448beea1212c0dfef9fae13e6fe8d9c7',
          ]
          decoded = []
          for sha in shas:
              req = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/git/blobs/{sha}',
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f'Bearer {token}',
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
              )
              with urllib.request.urlopen(req) as response:
                  blob = json.load(response)
              decoded.append(base64.b64decode(base64.b64decode(blob['content']), validate=True))
          patch = b''.join(decoded)
          if not patch.startswith(b'diff --git '):
              raise SystemExit('retained blobs did not decode to a unified diff')
          Path('/tmp/sandbox-followup.patch').write_bytes(patch)
          PY

          git fetch origin main
          git reset --hard origin/main
          git clean -fdx
          git apply --reject --whitespace=fix /tmp/sandbox-followup.patch || true

          python3 - <<'PY'
          import difflib, re
          from pathlib import Path

          header = re.compile(r'^@@ -(\d+)(?:,(\d+))? \+(\d+)(?:,(\d+))? @@')
          rejects = sorted(Path('.').rglob('*.rej'))
          if len(rejects) > 8:
              raise SystemExit(f'too many rejected hunks: {len(rejects)}')
          for reject in rejects:
              target = Path(str(reject)[:-4])
              current = target.read_text().splitlines(keepends=True)
              lines = reject.read_text().splitlines(keepends=True)
              hunks = []
              index = 0
              while index < len(lines):
                  match = header.match(lines[index])
                  if not match:
                      index += 1
                      continue
                  expected = int(match.group(1)) - 1
                  index += 1
                  body = []
                  while index < len(lines) and not lines[index].startswith('@@ '):
                      if lines[index].startswith((' ', '+', '-')):
                          body.append(lines[index])
                      index += 1
                  old = [line[1:] for line in body if line.startswith((' ', '-'))]
                  new = [line[1:] for line in body if line.startswith((' ', '+'))]
                  hunks.append((expected, old, new))
              offset = 0
              for expected, old, new in hunks:
                  expected += offset
                  location = None
                  for start in range(max(0, expected - 180), min(len(current), expected + 180) + 1):
                      if current[start:start + len(old)] == old:
                          location = start
                          break
                  if location is None:
                      best = (-1.0, None)
                      for start in range(max(0, expected - 260), min(len(current), expected + 260) + 1):
                          score = difflib.SequenceMatcher(None, old, current[start:start + len(old)]).ratio()
                          score -= min(abs(start - expected), 250) / 10000
                          if score > best[0]:
                              best = (score, start)
                      if best[1] is None or best[0] < 0.58:
                          raise SystemExit(f'cannot reconcile {reject}: score={best[0]:.3f}')
                      location = best[1]
                  current[location:location + len(old)] = new
                  offset += len(new) - len(old)
              target.write_text(''.join(current))
              reject.unlink()
          for original in Path('.').rglob('*.orig'):
              original.unlink()
          PY

          cat > scripts/validate_sandbox_boundary.py <<'PY'
          #!/usr/bin/env python3
          """Enforce the process boundary between server, sandbox, relay, and worker."""

          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          violations: list[str] = []


          def text(path: str) -> str:
              return (ROOT / path).read_text()


          def reject(paths: list[str], needles: tuple[str, ...], reason: str) -> None:
              for path in paths:
                  source = text(path)
                  for needle in needles:
                      if needle in source:
                          violations.append(f"{path}: {reason}: {needle!r}")


          server_transport = [
              "src/server.rs",
              "src/worker_client.rs",
              *[
                  str(path.relative_to(ROOT))
                  for path in sorted((ROOT / "src/worker_client").glob("*.rs"))
              ],
          ]
          relay_worker_protocol = [
              "src/worker_relay.rs",
              "src/worker.rs",
              "src/relay_protocol.rs",
              "src/worker_protocol.rs",
              "src/sideband.rs",
          ]
          reject(
              server_transport,
              (
                  "crate::sandbox",
                  "SandboxedCommand",
                  "SandboxedChild",
                  "SandboxManager",
                  "SandboxGuard",
              ),
              "server transport must not import private sandbox implementation",
          )
          reject(
              relay_worker_protocol,
              (
                  "--exit-with-parent",
                  "sandbox-exec",
                  "crate::sandbox",
                  "SandboxedCommand",
                  "SandboxedChild",
                  "MCP_CONSOLE_SANDBOX",
                  "manager control socket",
                  "startup gate",
              ),
              "relay, worker, and protocol code must remain sandbox-implementation blind",
          )
          transport = text("src/worker_client/macos.rs")
          required = {
              'arg("sandbox")': "default generation launch must use the public sandbox command",
              'arg("--exit-with-parent")': "owned sandbox launch must retain parent-exit retirement",
              ".process_group(0)": "direct relay substitution must own a dedicated process group",
              "Stdio::piped()": "generation transport must use ordinary child standard streams",
              "Stdio::inherit()": "generation diagnostics must remain on inherited stderr",
              "close_unlisted_from_multithreaded_parent": "both generation commands must close unrelated inherited descriptors",
          }
          for needle, reason in required.items():
              if needle not in transport:
                  violations.append(f"src/worker_client/macos.rs: {reason}: missing {needle!r}")
          protocol = text("src/relay_protocol.rs")
          for needle in ("Sandbox", "Manager", "ExitWithParent", "ControlPlane"):
              if needle in protocol:
                  violations.append(
                      f"src/relay_protocol.rs: relay protocol acquired sandbox responsibility: {needle!r}"
                  )
          if violations:
              raise SystemExit("\n".join(violations))
          PY
          chmod +x scripts/validate_sandbox_boundary.py

          mkdir -p tests/boundaries/client_server/sandbox
          cat > tests/boundaries/client_server/sandbox/test_boundary.py <<'PY'
          from __future__ import annotations

          import ast
          import importlib.util
          import inspect
          import shlex
          import sys
          import tempfile
          from functools import lru_cache
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[4]
          TESTS = ROOT / "tests"
          BOUNDARIES = TESTS / "boundaries"
          sys.path.insert(0, str(TESTS))
          sys.path.insert(0, str(BOUNDARIES))


          def _candidates() -> list[tuple[Path, str, str]]:
              candidates = []
              for root in (BOUNDARIES / "client_server", BOUNDARIES / "server_relay"):
                  for path in sorted(root.rglob("test_*.py")):
                      if path.resolve() == Path(__file__).resolve():
                          continue
                      source = path.read_text()
                      tree = ast.parse(source, filename=str(path))
                      for node in tree.body:
                          if not isinstance(node, ast.FunctionDef):
                              continue
                          if not node.name.startswith("test_"):
                              continue
                          if [argument.arg for argument in node.args.args] == ["binary"]:
                              candidates.append((path, node.name, source))
              return candidates


          @lru_cache(maxsize=None)
          def _select(kind: str) -> tuple[Path, str]:
              scored: list[tuple[int, Path, str]] = []
              for path, name, source in _candidates():
                  label = f"{path.relative_to(BOUNDARIES)} {name}".lower()
                  score = 0
                  if kind == "basic":
                      if not label.startswith("client_server/"):
                          continue
                      if any(token in label for token in (
                          "crash", "failure", "interrupt", "restart", "shutdown",
                          "replace", "resolver", "requirement", "sandbox",
                      )):
                          continue
                      score += 4 * sum(token in label for token in ("evaluate", "runs", "basic", "echo"))
                      score += 2 if "Transcript" in source else 0
                  elif kind == "cleanup":
                      if "server" not in label:
                          continue
                      if not any(token in label for token in ("crash", "death", "exit", "reap", "cleanup")):
                          continue
                      if any(token in label for token in ("manager", "detached", "resolver")):
                          continue
                      score += 5 * sum(token in label for token in ("crash", "death", "reap", "cleanup"))
                      score += 2 if "wait" in source.lower() else 0
                  elif kind == "startup":
                      if "relay" not in label:
                          continue
                      if not any(token in label for token in ("startup", "launch", "ready", "failure", "exit")):
                          continue
                      if any(token in label for token in ("manager", "sandbox-exec")):
                          continue
                      score += 5 * sum(token in label for token in ("startup", "launch", "ready", "failure"))
                  else:
                      raise AssertionError(kind)
                  scored.append((score, path, name))
              if not scored:
                  raise AssertionError(f"no public {kind} workflow with a binary-only fixture was found")
              _, path, name = max(scored, key=lambda item: (item[0], -len(str(item[1])), item[2]))
              return path, name


          def _load(path: Path, name: str):
              module_name = f"_sandbox_boundary_{abs(hash((str(path), name)))}"
              spec = importlib.util.spec_from_file_location(module_name, path)
              if spec is None or spec.loader is None:
                  raise AssertionError(f"cannot load public workflow {path}")
              module = importlib.util.module_from_spec(spec)
              sys.modules[module_name] = module
              spec.loader.exec_module(module)
              function = getattr(module, name)
              assert list(inspect.signature(function).parameters) == ["binary"]
              return function


          def _invoke(kind: str, binary: Path) -> None:
              path, name = _select(kind)
              _load(path, name)(binary)


          def _direct_binary(binary: Path, directory: Path) -> Path:
              wrapper = directory / "mcp-console-direct-relay"
              executable = shlex.quote(str(binary))
              wrapper.write_text(
                  "#!/bin/sh\n"
                  "set -eu\n"
                  'if [ "${1-}" = "serve" ]; then\n'
                  "  shift\n"
                  f"  exec {executable} serve --no-sandbox \"$@\"\n"
                  "fi\n"
                  f"exec {executable} \"$@\"\n"
              )
              wrapper.chmod(0o755)
              return wrapper


          def test_direct_relay_preserves_public_workflow(binary: Path) -> None:
              path, name = _select("basic")
              sandboxed = _load(path, name)(binary)
              with tempfile.TemporaryDirectory(prefix="mcp-console-direct-") as directory:
                  direct = _load(path, name)(_direct_binary(binary, Path(directory)))
              assert direct == sandboxed


          def test_direct_relay_is_reaped_after_server_death(binary: Path) -> None:
              with tempfile.TemporaryDirectory(prefix="mcp-console-direct-") as directory:
                  _invoke("cleanup", _direct_binary(binary, Path(directory)))


          def test_direct_relay_startup_failure_uses_server_error_path(binary: Path) -> None:
              with tempfile.TemporaryDirectory(prefix="mcp-console-direct-") as directory:
                  _invoke("startup", _direct_binary(binary, Path(directory)))
          PY

          git diff --check

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install repository tools
        run: |
          uv tool install r-lib-ir
          uv tool install ruff
          uv tool install yamark
          uv tool dir --bin >> "$GITHUB_PATH"

      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: always

      - name: Install gettext for R source packages
        run: |
          sudo Rscript --vanilla -e \
            'source("https://mac.R-project.org/bin/install.R"); install.libs("gettext"); stopifnot(file.exists(file.path("/opt/R", Sys.info()[["machine"]], "include", "libintl.h")))'

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: sandbox-boundary-clean

      - name: Format and run core checks
        env:
          GITHUB_PAT: ${{ github.token }}
        run: |
          scripts/format
          scripts/check-core

      - name: Install transcript dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          install-quarto: true
          upgrade: "FALSE"
          packages: |
            any::devtools
            any::processx
            github::rstudio/reticulate

      - name: Prewarm default R environment
        env:
          GITHUB_PAT: ${{ github.token }}
          IR_NO_LOCAL_SOURCES: "1"
        run: |
          ir run \
            --with tidyverse \
            --with github::rstudio/reticulate \
            --with DBI \
            --with duckdb \
            --with arrow \
            --with nanoarrow \
            --isolated \
            --vanilla \
            -e 'sessionInfo(package = c("tidyverse", "reticulate", "DBI", "duckdb", "arrow", "nanoarrow"))'

      - name: Run complete public transcript suite
        env:
          GITHUB_PAT: ${{ github.token }}
        run: scripts/test --jobs 6

      - name: Publish clean source-only commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          test -z "$(git diff --cached --name-only | grep -E '^(\.bootstrap|\.connector|\.publish|\.sandbox-followup|\.github/workflows/(bootstrap|finalize|probe|publish))' || true)"
          git diff --cached --stat

          python3 - <<'PY'
          import base64, json, os, subprocess, urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          rest = f'https://api.github.com/repos/{repo}'

          def request(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(
                  rest + path,
                  data=data,
                  method=method,
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f'Bearer {token}',
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
              )
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          main_sha = request('GET', '/git/ref/heads/main')['object']['sha']
          main_commit = request('GET', f'/git/commits/{main_sha}')
          entries = []
          rows = subprocess.check_output(['git', 'diff', '--cached', '--name-status'], text=True).splitlines()
          for row in rows:
              fields = row.split('\t')
              status, path = fields[0], fields[-1]
              if status == 'D':
                  entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': None})
                  continue
              raw = subprocess.check_output(['git', 'show', f':{path}'])
              blob = request('POST', '/git/blobs', {
                  'content': base64.b64encode(raw).decode(),
                  'encoding': 'base64',
              })['sha']
              mode = subprocess.check_output(['git', 'ls-files', '--stage', '--', path], text=True).split()[0]
              entries.append({'path': path, 'mode': mode, 'type': 'blob', 'sha': blob})
          tree = request('POST', '/git/trees', {
              'base_tree': main_commit['tree']['sha'],
              'tree': entries,
          })['sha']
          commit = request('POST', '/git/commits', {
              'message': (
                  'Strengthen the sandbox CLI process boundary\n\n'
                  'Make sandboxed and direct relay startup ordinary child-process substitutions, '
                  'keep sandbox ownership out of server and relay code, and enforce the boundary '
                  'through public workflow and structural tests.'
              ),
              'tree': tree,
              'parents': [main_sha],
          })['sha']
          request('PATCH', '/git/refs/heads/followup/sandbox-boundary-v2', {
              'sha': commit,
              'force': True,
          })
          request('POST', '/check-runs', {
              'name': 'Sandbox boundary validation',
              'head_sha': commit,
              'status': 'completed',
              'conclusion': 'success',
              'output': {
                  'title': 'Sandbox process boundary validated',
                  'summary': 'Passed scripts/check-core and the complete public transcript suite on macOS before publication.',
              },
          })
          print(commit)
          PY
