name: Connector file probe
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/upload-artifact@v4
        with:
          name: connector-file-probe
          path: |
            .connector-probe
            scripts/validate_sandbox_boundary.py
          if-no-files-found: warn
          retention-days: 1
