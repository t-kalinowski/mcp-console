name: Bootstrap SQL DBI connection slice

on:
  push:
    branches:
      - feat/select-sql-dbi-connection

permissions:
  contents: write

concurrency:
  group: bootstrap-sql-dbi-connection-slice
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  IR_LATEST_RESOLUTION_MAX_AGE_SECONDS: "604800"
  UV_VERSION: "0.12.4"
  BASE_SHA: "0bb7db0842961e95edad05996df02877bce5b4da"

jobs:
  bootstrap:
    name: Implement and validate SQL connection selection
    runs-on: macos-latest

    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: feat/select-sql-dbi-connection
          fetch-depth: 0

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          cache-suffix: sql-dbi-connection-slice
          prune-cache: true

      - name: Install development tools
        run: |
          uv tool install r-lib-ir
          uv tool install yamark
          uv tool dir --bin >> "$GITHUB_PATH"

      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: always

      - name: Install gettext for R source packages
        run: |
          sudo Rscript --vanilla -e \
            'source("https://mac.R-project.org/bin/install.R"); install.libs("gettext"); stopifnot(file.exists(file.path("/opt/R", Sys.info()[["machine"]], "include", "libintl.h")))'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: debug
          save-if: false

      - name: Configure managed R cache paths
        run: |
          printf 'IR_CACHE_DIR=%s\n' "$RUNNER_TEMP/mcp-console-r-cache/ir" >> "$GITHUB_ENV"
          printf 'RENV_PATHS_CACHE=%s\n' "$RUNNER_TEMP/mcp-console-r-cache/renv" >> "$GITHUB_ENV"

      - name: Install transcript dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          install-quarto: true
          upgrade: "FALSE"
          packages: |
            any::processx
            github::rstudio/reticulate

      - name: Apply SQL connection slice
        run: python3 .github/codex/apply_sql_slice.py

      - name: Prewarm managed R environment
        env:
          GITHUB_PAT: ${{ github.token }}
          IR_NO_LOCAL_SOURCES: "1"
        run: |
          ir run \
            --with tidyverse \
            --with github::rstudio/reticulate \
            --with DBI \
            --with duckdb \
            --with arrow \
            --with nanoarrow \
            --with RSQLite \
            --isolated \
            --vanilla \
            -e 'sessionInfo(package = c("tidyverse", "reticulate", "DBI", "duckdb", "arrow", "nanoarrow", "RSQLite"))'

      - name: Format sources
        run: scripts/format

      - name: Generate SQL connection transcript
        env:
          GITHUB_PAT: ${{ github.token }}
        run: scripts/test --update client_server/sql_connection

      - name: Format generated records
        run: scripts/format

      - name: Run repository checks
        env:
          GITHUB_PAT: ${{ github.token }}
        run: scripts/check

      - name: Commit validated slice
        run: |
          set -euo pipefail
          rm -f \
            .github/codex/apply_sql_slice.py \
            .github/workflows/codex-sql-slice.yml
          git reset --soft "$BASE_SHA"
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Allow selecting a DBI connection for SQL cells"
          git push --force origin HEAD:refs/heads/feat/sql-dbi-connection
