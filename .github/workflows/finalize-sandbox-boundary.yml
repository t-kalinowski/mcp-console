name: Finalize sandbox boundary pull request

on:
  push:
    branches:
      - sandbox-boundary-validation-v2
  workflow_dispatch:

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: write

concurrency:
  group: finalize-sandbox-boundary-pull-request
  cancel-in-progress: false

env:
  EXPECTED_MCP_MAIN: 50d2f5c613f382b1381447b64505e269262ff2a9
  CODEX_BASE_REVISION: 855e8f9ef5b4211408791252e02e38b4757218cc
  CODEX_BRANCH: mcp-console/sandbox-runner-v1-validated
  FEATURE_BRANCH: use-bundled-codex-sandbox-runner-validated

jobs:
  finalize:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the validation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: sandbox-boundary-validation-v2

      - name: Wait for clean implementation commits
        id: implementation
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 150); do
            current_main=$(git ls-remote https://github.com/t-kalinowski/mcp-console.git refs/heads/main | awk '{print $1}')
            if [[ "$current_main" != "$EXPECTED_MCP_MAIN" ]]; then
              echo "mcp-console main moved from $EXPECTED_MCP_MAIN to $current_main" >&2
              exit 1
            fi

            codex_sha=$(git ls-remote https://github.com/t-kalinowski/codex.git "refs/heads/${CODEX_BRANCH}" | awk '{print $1}')
            feature_sha=$(git ls-remote https://github.com/t-kalinowski/mcp-console.git "refs/heads/${FEATURE_BRANCH}" | awk '{print $1}')

            if [[ -n "$codex_sha" && "$codex_sha" != "$CODEX_BASE_REVISION" && -n "$feature_sha" && "$feature_sha" != "$EXPECTED_MCP_MAIN" ]]; then
              rm -rf "${RUNNER_TEMP}/feature" "${RUNNER_TEMP}/codex"
              git clone --quiet --filter=blob:none --single-branch --branch "$FEATURE_BRANCH" https://github.com/t-kalinowski/mcp-console.git "${RUNNER_TEMP}/feature"
              git clone --quiet --filter=blob:none --single-branch --branch "$CODEX_BRANCH" https://github.com/t-kalinowski/codex.git "${RUNNER_TEMP}/codex"

              feature_message=$(git -C "${RUNNER_TEMP}/feature" log -1 --format=%B)
              pinned_codex=$(printf '%s\n' "$feature_message" | sed -n 's/^Codex-Sandbox-Revision: \([0-9a-f]\{40\}\)$/\1/p' | tail -1)

              if [[ "$pinned_codex" == "$codex_sha" ]] \
                && [[ ! -e "${RUNNER_TEMP}/feature/.github/workflows/bootstrap-bundled-codex-sandbox-validated.yml" ]] \
                && [[ ! -e "${RUNNER_TEMP}/codex/.github/workflows/bootstrap-mcp-console-sandbox-runner-validated.yml" ]]; then
                git -C "${RUNNER_TEMP}/codex" merge-base --is-ancestor "$CODEX_BASE_REVISION" "$codex_sha"
                echo "codex_sha=$codex_sha" >> "$GITHUB_OUTPUT"
                echo "feature_sha=$feature_sha" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi

            sleep 30
          done

          echo 'The implementation branches did not become ready in time' >&2
          exit 1

      - name: Open or update the draft pull request
        id: pull_request
        shell: bash
        env:
          CODEX_SHA: ${{ steps.implementation.outputs.codex_sha }}
          FEATURE_SHA: ${{ steps.implementation.outputs.feature_sha }}
        run: |
          set -euo pipefail
          body_file="${RUNNER_TEMP}/pull-request-body.md"
          cat > "$body_file" <<EOF
          ## Summary

          Replace MCP Console's home-grown macOS Seatbelt launcher with a separately built, privately bundled `mcp-console-sandbox` executable derived from the pinned Codex sandbox patch.

          - **Codex revision:** `${CODEX_SHA}`
          - **Runner topology:** direct-exec. The helper validates protocol version 1, reports startup status over a private descriptor, and replaces itself with the native sandbox launcher and target.
          - **Launch protocol:** a strict, typed JSON launch specification with `protocol_version: 1`. Native target program and argument values remain trailing OS arguments; the target environment remains inherited.
          - **Private packaging:** the matching-architecture helper is injected into the wheel's private `mcp-console-libexec` layout. It is resolved by absolute installed-layout path and is not exposed as another uv tool command or found through arbitrary `PATH` entries.

          ## Boundary and lifecycle

          MCP Console owns the normalized application policy and Codex owns the native sandbox implementation. Relay stdin/stdout remain the existing native pipes, relay stderr remains inherited diagnostics, and neither the relay nor worker protocol changes.

          The direct-exec path preserves the relay as the direct sandboxed child, process-group and session leader. Existing non-reaping exit observation, relay-led worker shutdown and stream drain, bounded descendant retirement, exact one-time reap, generation-safe replacement, and private temporary-directory cleanup remain in MCP Console.

          This removes the old `src/sandbox/macos.rs` Seatbelt profile and MCP Console's direct `/usr/bin/sandbox-exec` construction. There is no fallback or feature-flagged copy of the old backend.

          MCP Console links no Codex crates. The private helper is built from the Codex repository using that repository's toolchain, lockfile, native sandbox crates, and focused tests, then assembled into the MCP Console wheel. R, Python, and DuckDB requirement resolution remains outside the sandbox.

          ## Validation

          The implementation bootstrap completed these checks before publishing `${FEATURE_SHA}`:

          - Codex focused tests for `codex-sandbox-api` and `codex-sandboxing`
          - Codex scoped fixes, formatting, Bazel dependency metadata refresh, and release build of only `mcp-console-sandbox`
          - `scripts/format`
          - `scripts/check`
          - `git diff --exit-code -- tests/transcripts/golden`
          - `cargo tree` verification that no Codex crates enter MCP Console's dependency graph
          - installed-wheel helper discovery, architecture, private-command, sandbox, and MCP/R smoke tests

          Golden transcripts are unchanged.

          ## Non-goals

          This does not add named profiles, an MCP Console config file, Codex `_meta` inheritance, managed networking, domain or socket policy, elicitation or approvals, Docker, SSH, remote bootstrap, Linux, or Windows support. It does not change the MCP, relay, or worker protocols.
          EOF

          pr_url=$(gh pr list --repo t-kalinowski/mcp-console --head "$FEATURE_BRANCH" --base main --state open --json url --jq '.[0].url // empty')
          if [[ -z "$pr_url" ]]; then
            pr_url=$(gh pr create \
              --repo t-kalinowski/mcp-console \
              --draft \
              --base main \
              --head "$FEATURE_BRANCH" \
              --title 'Use a bundled Codex-derived sandbox runner' \
              --body-file "$body_file")
          else
            gh pr edit "$pr_url" \
              --repo t-kalinowski/mcp-console \
              --title 'Use a bundled Codex-derived sandbox runner' \
              --body-file "$body_file"
          fi

          pr_number=$(gh pr view "$pr_url" --repo t-kalinowski/mcp-console --json number --jq .number)
          echo "url=$pr_url" >> "$GITHUB_OUTPUT"
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Wait for externally triggered pull-request checks
        id: checks
        shell: bash
        env:
          PR_URL: ${{ steps.pull_request.outputs.url }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            count=$(gh pr checks "$PR_URL" --repo t-kalinowski/mcp-console --json name 2>/dev/null | jq 'length' || echo 0)
            if [[ "$count" -gt 0 ]]; then
              break
            fi
            sleep 30
          done

          set +e
          gh pr checks "$PR_URL" --repo t-kalinowski/mcp-console --watch --interval 20
          status=$?
          set -e

          gh pr checks "$PR_URL" --repo t-kalinowski/mcp-console > "${RUNNER_TEMP}/pr-checks.txt" 2>&1 || true
          if [[ "$status" -ne 0 ]]; then
            echo 'Pull-request CI failed' >&2
            cat "${RUNNER_TEMP}/pr-checks.txt" >&2
            exit "$status"
          fi

      - name: Remove the temporary external CI trigger
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${RUNNER_TEMP}/feature-cleanup"
          git clone --quiet --single-branch --branch "$FEATURE_BRANCH" https://github.com/t-kalinowski/mcp-console.git "${RUNNER_TEMP}/feature-cleanup"
          cd "${RUNNER_TEMP}/feature-cleanup"
          if [[ -e .github/sandbox-boundary-ci-trigger.md ]]; then
            git rm .github/sandbox-boundary-ci-trigger.md
            git config user.name 'Tomasz Kalinowski'
            git config user.email 'kalinowskit@gmail.com'
            git commit -m 'Remove temporary CI trigger'
            git push origin HEAD:"$FEATURE_BRANCH"
          fi

      - name: Record successful completion
        if: success()
        shell: bash
        env:
          PR_URL: ${{ steps.pull_request.outputs.url }}
          PR_NUMBER: ${{ steps.pull_request.outputs.number }}
          CODEX_SHA: ${{ steps.implementation.outputs.codex_sha }}
          FEATURE_SHA: ${{ steps.implementation.outputs.feature_sha }}
        run: |
          set -euo pipefail
          cat > sandbox-boundary-result.md <<EOF
          # Sandbox boundary implementation result

          - Draft pull request: ${PR_URL}
          - Pull request number: ${PR_NUMBER}
          - Codex runner commit: `${CODEX_SHA}`
          - MCP Console implementation commit before CI trigger cleanup: `${FEATURE_SHA}`
          - Runner topology: direct-exec
          - Launch protocol: version 1
          - Pull-request CI: passed
          - Golden transcripts: unchanged in the implementation validation
          - PR state: open, draft, and not merged
          EOF
          cp "${RUNNER_TEMP}/pr-checks.txt" sandbox-boundary-pr-checks.txt
          git rm .github/workflows/finalize-sandbox-boundary.yml
          git add sandbox-boundary-result.md sandbox-boundary-pr-checks.txt
          git config user.name 'Tomasz Kalinowski'
          git config user.email 'kalinowskit@gmail.com'
          git commit -m 'Record sandbox boundary validation result'
          git push origin HEAD:sandbox-boundary-validation-v2
