name: Validate sandbox boundary follow-up

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  UV_VERSION: "0.12.4"

jobs:
  validate:
    runs-on: macos-latest
    steps:
      - name: Check out staging branch
        uses: actions/checkout@v7

      - name: Reconstruct follow-up patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import gzip
          from pathlib import Path

          encoded = b"".join(
              part.read_bytes().strip()
              for part in sorted(Path(".validation-patch").glob("part-*"))
          )
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          Path("/tmp/sandbox-followup.patch").write_bytes(patch)
          PY
          printf '%s  %s\n' \
            '5d63643dd4252ab6a8c6d97da90710feac0a7a59f1473f7ad21d386c1306d640' \
            /tmp/sandbox-followup.patch | shasum -a 256 -c -
          git apply --check /tmp/sandbox-followup.patch
          git apply --index /tmp/sandbox-followup.patch

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install formatters
        run: |
          uv tool install ruff
          uv tool install yamark
          uv tool dir --bin >> "$GITHUB_PATH"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: sandbox-boundary-followup

      - name: Format staged changes
        run: scripts/format

      - name: Check architectural boundary
        run: python3 scripts/validate_sandbox_boundary.py

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Lint Rust
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test Rust
        run: cargo test --all-targets --all-features

      - name: Update new public snapshots
        run: |
          scripts/test --update --jobs 1 \
            client_server/sandbox/test_boundary \
            client_server/sandbox/test_descriptors

      - name: Verify sandbox boundary workflows
        run: |
          scripts/test --jobs 1 \
            client_server/sandbox/test_boundary \
            client_server/sandbox/test_descriptors \
            client_server/sandbox/test_startup \
            client_server/sandbox/test_crashes::server_crash_retires_the_worker_generation \
            client_server/sandbox/test_crashes::manager_crash_retires_the_worker_generation \
            client_server/lifecycle/test_restart::restart_outer_force_stops_unresponsive_relay \
            client_server/lifecycle/test_restart::restart_reports_nonzero_sandbox_launcher_exit

      - name: Review generated diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check HEAD
          git diff --stat HEAD

      - name: Capture validated patch
        if: always()
        shell: bash
        run: |
          git diff HEAD --binary > /tmp/validated.patch || true
          git status --short > /tmp/validation-status.txt || true
          git diff --stat HEAD > /tmp/validation-diff-stat.txt || true

      - name: Upload validated patch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-boundary-validation
          path: |
            /tmp/validated.patch
            /tmp/validation-status.txt
            /tmp/validation-diff-stat.txt
          retention-days: 1
