name: Update rmcp migration branch

on:
  push:
    branches:
      - update-rmcp-3-1-4

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: update-rmcp-3-1-4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply RMCP 3.x migration
        run: python3 scripts/apply_rmcp_migration.py

      - name: Update the lockfile
        run: cargo update -p rmcp --precise 3.1.4

      - name: Format Rust sources
        run: cargo fmt --all

      - name: Remove temporary helpers
        run: rm .github/workflows/update-rmcp-branch.yml scripts/apply_rmcp_migration.py

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update rmcp and MCP protocol support"
          git push origin HEAD:update-rmcp-3-1-4
