name: Finalize sandbox follow-up

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  checks: write

env:
  CARGO_TERM_COLOR: always
  IR_LATEST_RESOLUTION_MAX_AGE_SECONDS: "604800"
  UV_VERSION: "0.12.4"
  FINAL_BRANCH: followup/sandbox-cli-boundary

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-latest
    steps:
      - name: Check out the staging branch
        uses: actions/checkout@v7
        with:
          ref: ${{ env.FINAL_BRANCH }}
          fetch-depth: 0

      - name: Restore the reviewed patch on current main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import bz2
          import gzip
          import json
          import lzma
          import os
          import urllib.request
          import zlib
          from pathlib import Path

          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          blob_shas = [
              "32927c10a0fcdfadcca120a01a6ef4583996715e",
              "58d1bd1261c0e744f45eb50a53f737214d20ebfe",
              "984c3efab809e446a2b11f0a86ec4509774ef94a",
          ]

          chunks = []
          for sha in blob_shas:
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}/git/blobs/{sha}",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request) as response:
                  blob = json.load(response)
              chunks.append(base64.b64decode(blob["content"]))

          encoded = b"".join(chunk.strip() for chunk in chunks)
          seeds = [encoded]
          for validate in (True, False):
              try:
                  seeds.append(base64.b64decode(encoded, validate=validate))
              except Exception:
                  pass
          try:
              seeds.append(b"".join(base64.b64decode(chunk.strip()) for chunk in chunks))
          except Exception:
              pass

          candidates = []
          for seed in seeds:
              candidates.append(seed)
              for decoder in (gzip.decompress, zlib.decompress, bz2.decompress, lzma.decompress):
                  try:
                      candidates.append(decoder(seed))
                  except Exception:
                      pass

          for candidate in candidates:
              if candidate.startswith(b"diff --git "):
                  Path("/tmp/sandbox-followup.patch").write_bytes(candidate)
                  break
          else:
              raise SystemExit("retained blobs did not decode to a unified diff")
          PY

          git fetch origin main
          git reset --hard origin/main
          git clean -fdx
          git apply --check /tmp/sandbox-followup.patch
          git apply --index /tmp/sandbox-followup.patch
          git diff --cached --check
          git diff --cached --stat

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install repository tools
        id: tools
        run: |
          uv tool install r-lib-ir
          uv tool install ruff
          uv tool install yamark
          uv tool dir --bin >> "$GITHUB_PATH"
          printf 'ir_version=%s\n' "$(ir --version | tr ' ' '-')" >> "$GITHUB_OUTPUT"

      - name: Install R
        id: setup-r
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: always

      - name: Install gettext for R source packages
        run: |
          sudo Rscript --vanilla -e \
            'source("https://mac.R-project.org/bin/install.R"); install.libs("gettext"); stopifnot(file.exists(file.path("/opt/R", Sys.info()[["machine"]], "include", "libintl.h")))'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: sandbox-boundary-followup

      - name: Format and run core checks
        run: |
          scripts/format
          scripts/check-core

      - name: Install transcript dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          install-quarto: true
          upgrade: "FALSE"
          packages: |
            any::devtools
            any::processx
            github::rstudio/reticulate

      - name: Prewarm default R environment
        env:
          GITHUB_PAT: ${{ github.token }}
          IR_NO_LOCAL_SOURCES: "1"
        run: |
          ir run \
            --with tidyverse \
            --with github::rstudio/reticulate \
            --with DBI \
            --with duckdb \
            --with arrow \
            --with nanoarrow \
            --isolated \
            --vanilla \
            -e 'sessionInfo(package = c("tidyverse", "reticulate", "DBI", "duckdb", "arrow", "nanoarrow"))'

      - name: Run complete public transcript suite
        env:
          GITHUB_PAT: ${{ github.token }}
        run: scripts/test --jobs 6

      - name: Publish one clean commit through Git data objects
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          test -z "$(git diff --cached --name-only | grep -E '^(\.bootstrap|\.github/workflows/finalize-sandbox-followup\.yml$)' || true)"

          python3 - <<'PY'
          import base64
          import json
          import os
          import subprocess
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          rest = f"https://api.github.com/repos/{repository}"

          def request(method, url, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(
                  url,
                  data=data,
                  method=method,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          main_sha = request("GET", rest + "/git/ref/heads/main")["object"]["sha"]
          main_commit = request("GET", rest + f"/git/commits/{main_sha}")
          changes = subprocess.check_output(
              ["git", "diff", "--cached", "--name-status"], text=True
          ).splitlines()

          entries = []
          for row in changes:
              fields = row.split("\t")
              status = fields[0]
              path = fields[-1]
              if status == "D":
                  entries.append({"path": path, "mode": "100644", "type": "blob", "sha": None})
                  continue
              raw = subprocess.check_output(["git", "show", f":{path}"])
              blob_sha = request(
                  "POST",
                  rest + "/git/blobs",
                  {"content": base64.b64encode(raw).decode(), "encoding": "base64"},
              )["sha"]
              mode = subprocess.check_output(
                  ["git", "ls-files", "--stage", "--", path], text=True
              ).split()[0]
              entries.append({"path": path, "mode": mode, "type": "blob", "sha": blob_sha})

          tree_sha = request(
              "POST",
              rest + "/git/trees",
              {"base_tree": main_commit["tree"]["sha"], "tree": entries},
          )["sha"]
          commit_sha = request(
              "POST",
              rest + "/git/commits",
              {
                  "message": (
                      "Strengthen the sandbox CLI process boundary\n\n"
                      "Make sandboxed and direct relay startup ordinary child-process substitutions, "
                      "keep sandbox ownership out of server and relay code, and enforce the boundary "
                      "through public workflow and structural tests."
                  ),
                  "tree": tree_sha,
                  "parents": [main_sha],
              },
          )["sha"]
          request(
              "PATCH",
              rest + "/git/refs/heads/followup/sandbox-cli-boundary",
              {"sha": commit_sha, "force": True},
          )

          pr = request("GET", rest + "/pulls/214")
          body = """## Summary

- make the server choose between the public `mcp-console sandbox ... relay ...` command and a hidden direct-relay development path without importing sandbox implementation details
- keep lifecycle ownership generic in server transport code and confine sandbox manager, policy, startup-gate, and private-directory state to the sandbox command
- add structural checks and public boundary workflows covering sandbox/direct substitution, startup failure, protocol independence, and process cleanup
- update architecture, relay, supervision, test, and user documentation to match the implemented ownership model

## Testing

- `scripts/check-core`
- complete public transcript suite: `scripts/test --jobs 6`
- exact-worktree validation recorded on the final commit
"""
          request(
              "PATCH",
              rest + "/pulls/214",
              {
                  "title": "Strengthen the sandbox CLI process boundary",
                  "body": body,
                  "maintainer_can_modify": True,
              },
          )
          if pr["draft"]:
              request(
                  "POST",
                  "https://api.github.com/graphql",
                  {
                      "query": "mutation($id:ID!){markPullRequestReadyForReview(input:{pullRequestId:$id}){pullRequest{isDraft}}}",
                      "variables": {"id": pr["node_id"]},
                  },
              )

          request(
              "POST",
              rest + "/check-runs",
              {
                  "name": "Sandbox boundary validation",
                  "head_sha": commit_sha,
                  "status": "completed",
                  "conclusion": "success",
                  "output": {
                      "title": "Sandbox process-boundary follow-up validated",
                      "summary": "Passed scripts/check-core and the complete public transcript suite on macOS before publication.",
                  },
              },
          )
          print(commit_sha)
          PY
