project:
  type: website
  pre-render:
    - >-
      uv run --no-project --isolated --with-requirements requirements.txt
      python _python.py
  post-render:
    - _pkgdown.R
    - >-
      uv run --no-project --isolated --with-requirements requirements.txt
      python _urls.py
  render:
    - index.qmd
    - getting-started.qmd
    - cli-help.qmd
    - README.md
    - "*.md"
    - benchmarks/*.md
    - python/index.qmd
    - python/reference/*.qmd
    - "!python/**/*.md"
    - "!templates/"
  resources:
    - python/objects.json
    - python/index.md
    - python/reference/*.md
    - python/llms*.txt

website:
  title: MCP Console
  description: >-
    An interactive, sandboxed workspace for AI agents working with data in
    R, Python, and SQL.
  site-url: https://t-kalinowski.github.io/mcp-console/
  repo-url: https://github.com/t-kalinowski/mcp-console
  repo-subdir: docs
  repo-actions: [edit, issue]
  navbar:
    left:
      - href: getting-started.qmd
        text: Get started
      - href: README.md
        text: Documentation
      - href: REFERENCE.md
        text: API reference
    right:
      - icon: github
        href: https://github.com/t-kalinowski/mcp-console
        aria-label: GitHub repository
  sidebar:
    - id: documentation
      title: Documentation
      style: docked
      collapse-level: 2
      contents:
      - href: README.md
        text: Overview
      - section: Learn Console
        contents:
        - BUILTIN_RUNTIME.md
        - getting-started.qmd
        - REQUIREMENTS.md
        - SANDBOX.md
        - RECORDING.md
      - section: Connect to Console
        contents:
        - href: CLIENTS.md
          text: MCP clients
        - R.md
        - PYTHON.md
      - section: Configuration
        contents:
        - BUILD_ON_CONSOLE.md
        - CONFIGURATION.md
        - RUNTIME_CONFIGURATION.md
        - TOOL_CONFIGURATION.md
        - SANDBOX_CONFIGURATION.md
        - RESOLVER.md
        - ENVIRONMENT.md
      - section: Reference
        contents:
        - RUNTIME_REFERENCE.md
        - INSTALLATION.md
        - CLI.md
        - cli-help.qmd
        - href: SANDBOX_COMMAND.md
          text: Sandbox command
        - GLOSSARY.md
    - id: reference
      title: API reference
      style: docked
      collapse-level: 1
      contents:
      - href: REFERENCE.md
        text: API overview
      - href: API.md
        text: MCP send
      - SEND_OPERATIONS.md
      - REQUIREMENTS_API.md
      - href: python/reference/index.qmd
        text: Python API
      - href: r/reference/index.html
        text: R API
    - id: development
      title: Development
      style: docked
      collapse-level: 1
      contents:
      - DEVELOPMENT.md
      - ARCHITECTURE.md
      - RELAY_PROTOCOL.md
      - WORKER_PROTOCOL.md
      - TOOL_DESCRIPTIONS.md
      - WINDOWS_DEVELOPMENT.md
      - TODO.md
      - section: Evidence and release
        contents:
        - RESOLVER_RELEASE_AUDIT.md
        - benchmarks/transcript-concurrency.md
        - href: https://github.com/t-kalinowski/mcp-console/blob/main/RELEASE.md
          text: Release procedure
  page-footer:
    left: MCP Console · MIT License
    right:
      - text: Development
        href: DEVELOPMENT.md
      - text: Source
        href: https://github.com/t-kalinowski/mcp-console

filters:
  - _filters/python-reference.lua
  - _filters/website.lua

execute:
  enabled: false

format:
  html:
    theme:
      light: [cosmo, theme.scss]
      dark: [cosmo, theme.scss, dark.scss]
    respect-user-color-scheme: true
    css: styles.css
    toc: true
    code-copy: true
    code-overflow: wrap
