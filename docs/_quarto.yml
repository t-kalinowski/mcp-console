project:
  type: website
  pre-render:
    - _python.py
  post-render:
    - _pkgdown.R
  render:
    - index.qmd
    - getting-started.qmd
    - cli-help.qmd
    - README.md
    - "*.md"
    - benchmarks/*.md
    - python/index.qmd
    - python/reference/*.qmd
    - "!python/**/*.md"
    - "!templates/"
  resources:
    - python/objects.json
    - python/index.md
    - python/reference/*.md
    - python/llms*.txt

website:
  title: MCP Console
  description: >-
    An interactive, sandboxed workspace for AI agents working with data in
    R, Python, and SQL.
  site-url: https://t-kalinowski.github.io/mcp-console/
  repo-url: https://github.com/t-kalinowski/mcp-console
  repo-subdir: docs
  repo-actions: [edit, issue]
  navbar:
    left:
      - href: getting-started.qmd
        text: Get started
      - href: README.md
        text: Guides
      - href: REFERENCE.md
        text: Reference
    right:
      - icon: github
        href: https://github.com/t-kalinowski/mcp-console
        aria-label: GitHub repository
  sidebar:
    - id: get-started
      title: Get started
      style: docked
      collapse-level: 1
      contents:
      - href: getting-started.qmd
        text: Overview
      - href: CLIENTS.md
        text: MCP clients
      - R.md
      - PYTHON.md
      - INSTALLATION.md
      - section: Platform setup
        contents:
        - LINUX_COMPATIBILITY.md
        - BUILD_FROM_SOURCE.md
    - id: guides
      title: Guides
      style: docked
      collapse-level: 1
      contents:
      - href: README.md
        text: Overview
      - BUILTIN_RUNTIME.md
      - REQUIREMENTS.md
      - SANDBOX.md
      - RECORDING.md
      - BUILD_ON_CONSOLE.md
      - GLOSSARY.md
    - id: reference
      title: Reference
      style: docked
      collapse-level: 1
      contents:
      - href: REFERENCE.md
        text: Overview
      - section: Configuration
        contents:
        - CONFIGURATION.md
        - RUNTIME_CONFIGURATION.md
        - TOOL_CONFIGURATION.md
        - SANDBOX_CONFIGURATION.md
        - RESOLVER.md
        - ENVIRONMENT.md
      - RUNTIME_REFERENCE.md
      - section: Command line
        contents:
        - CLI.md
        - cli-help.qmd
        - href: SANDBOX_COMMAND.md
          text: Sandbox command
      - section: MCP API
        contents:
        - API.md
        - SEND_OPERATIONS.md
        - REQUIREMENTS_API.md
      - href: r/reference/index.html
        text: R API
      - href: python/reference/index.qmd
        text: Python API
    - id: development
      title: Development
      style: docked
      collapse-level: 1
      contents:
      - DEVELOPMENT.md
      - ARCHITECTURE.md
      - RELAY_PROTOCOL.md
      - WORKER_PROTOCOL.md
      - TOOL_DESCRIPTIONS.md
      - WINDOWS_DEVELOPMENT.md
      - TODO.md
      - section: Evidence and release
        contents:
        - RESOLVER_RELEASE_AUDIT.md
        - benchmarks/transcript-concurrency.md
        - href: https://github.com/t-kalinowski/mcp-console/blob/main/RELEASE.md
          text: Release procedure
  page-footer:
    left: MCP Console · MIT License
    right:
      - text: Development
        href: DEVELOPMENT.md
      - text: Source
        href: https://github.com/t-kalinowski/mcp-console

filters:
  - _filters/python-reference.lua
  - _filters/website.lua

execute:
  enabled: false

format:
  html:
    theme:
      light: [cosmo, theme.scss]
      dark: [cosmo, theme.scss, dark.scss]
    respect-user-color-scheme: true
    css: styles.css
    toc: true
    code-copy: true
    code-overflow: wrap
