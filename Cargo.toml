[package]
name = "mcp-console"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Persistent R, Python, and SQL sessions for MCP clients"
repository = "https://github.com/t-kalinowski/mcp-console"
license = "MIT"
publish = false

[dependencies]
amalthea = { path = "/Users/tomasz/github/t-kalinowski/ark/crates/amalthea" }
ark = { path = "/Users/tomasz/github/t-kalinowski/ark/crates/ark" }
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
rand = "0.10"
rmcp = { version = "2.2.0", default-features = false, features = ["macros", "server", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "time"] }
zmq = { git = "https://github.com/erickt/rust-zmq", rev = "5d78967" }
