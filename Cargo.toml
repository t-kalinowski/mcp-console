[package]
name = "mcp-console"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Persistent R, Python, and SQL sessions for MCP clients"
repository = "https://github.com/t-kalinowski/mcp-console"
license = "MIT"
publish = false

[dependencies]
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
rmcp = { version = "2.2.0", default-features = false, features = ["macros", "server", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "sync"] }
