[package]
name = "mcp-console"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Persistent R, Python, and SQL sessions for MCP clients"
repository = "https://github.com/t-kalinowski/mcp-console"
license = "MIT"
publish = false

[dependencies]
rmcp = { version = "2.2.0", default-features = false, features = ["macros", "server", "transport-io"] }
tokio = { version = "1", features = ["macros", "rt"] }
