        ### 1.2 Export to text files

        Exporting results from R is usually a less contentious task, but there are still
        a number of pitfalls. There will be a target application in mind, and often a
        text file will be the most convenient interchange vehicle. (If a binary file is
        required, see [Binary files](05-binary-files-part-001.md#Binary-files).)

        Function `cat` underlies the functions for exporting data. It takes a `file`
        argument, and the `append` argument allows a text file to be written via
        successive calls to `cat`. Better, especially if this is to be done many times, is
        to open a `file` connection for writing or appending, and `cat` to that connection,
        then `close` it.

        The most common task is to write a matrix or data frame to file as a rectangular
        grid of numbers, possibly with row and column labels. This can be done by the
        functions `write.table` and `write`. Function `write` just writes out a matrix or
        vector in a specified number of columns (and transposes a matrix). Function
        `write.table` is more convenient, and writes out a data frame (or an object that
        can be coerced to a data frame) with row and column labels.

        There are a number of issues that need to be considered in writing out a data
        frame to a text file.


        Next file: .console$manual("R-data/01.02-export-to-text-files-part-001.md")
