    - type: text
      text: |
        Cache: <fixture>/cache/mcp-console/manuals/<identity>
        File: R-data/01.02-export-to-text-files-part-001.md

        Manual: R Data Import/Export (R-data)
        Location: R Data Import/Export > 1 Introduction > 1.2 Export to text files

        [Parent](01-introduction-part-001.md#Introduction) · [TOC](index.md) · [Previous](01.01-imports-part-001.md) · [Next](01.02-export-to-text-files-part-002.md)

        1. **Precision**
           
           Most of the conversions of real/complex numbers done by these functions is to
           full precision, but those by `write` are governed by the current setting of
           `options(digits)`. For more control, use `format` on a data frame, possibly
           column-by-column.
        2. **Header line**
           
           R prefers the header line to have no entry for the row names, so the file
           looks like
           
                           dist    climb   time
           Greenmantle     2.5     650     16.083
              ...
           
           Some other systems require a (possibly empty) entry for the row names, which
           is what `write.table` will provide if argument `col.names = NA` is specified.
           Excel is one such system.
        3. **Separator**
           
           A common field separator to use in the file is a comma, as that is unlikely
           to appear in any of the fields in English-speaking countries. Such files are
           known as CSV (comma separated values) files, and wrapper function `write.csv`
           provides appropriate defaults. In some locales the comma is used as the
           decimal point (set this in `write.table` by `dec = ","`) and there CSV files use
           the semicolon as the field separator: use `write.csv2` for appropriate
           defaults. There is an IETF standard for CSV files (which mandates commas and
           CRLF line endings, for which use `eol = "\r\n"`), RFC4180 (see
           [https://www.rfc-editor.org/rfc/rfc4180](https://www.rfc-editor.org/rfc/rfc4180)), but what is more important in
           practice is that the file is readable by the application it is targeted at.
           
           Using a semicolon or tab (`sep = "\t"`) are probably the safest options.
        4. **Missing values**
           
           By default missing values are output as `NA`, but this may be changed by
           argument `na`. Note that `NaN`s are treated as `NA` by `write.table`, but not by `cat`
           nor `write`.
        5. **Quoting strings**
           
           By default strings are quoted (including the row and column names). Argument
           `quote` controls if character and factor variables are quoted: some programs,
           for example **Mondrian** ([https://en.wikipedia.org/wiki/Mondrian_(software)](https://en.wikipedia.org/wiki/Mondrian_(software))), do
           not accept quoted strings.
           
           Some care is needed if the strings contain embedded quotes. Three useful
           forms are
           
           > df <- data.frame(a = I("a \" quote"))
           > write.table(df)
           "a"
           "1" "a \" quote"
           > write.table(df, qmethod = "double")
           "a"
           "1" "a "" quote"
           > write.table(df, quote = FALSE, sep = ",")
           a
           1,a " quote
           
           The second is the form of escape commonly used by spreadsheets.
        6. **Encodings**
           
           Text files do not contain metadata on their encodings, so for non-ASCII data
           the file needs to be targetted to the application intended to read it. All of
           these functions can write to a *connection* which allows an encoding to be
           specified for the file, and `write.table` has a `fileEncoding` argument to make
           this easier.
           
           The hard part is to know what file encoding to use. For use on Windows, it is
           best to use what Windows calls ‘Unicode’[²](99.043-concept-index-part-003.md#FOOT2), that is `"UTF-16LE"`. Using UTF-8 is
           a good way to make portable files that will not easily be confused with any
           other encoding, but even macOS applications (where UTF-8 is the system
           encoding) may not recognize them, and Windows applications are most unlikely
           to. Apparently Excel:mac 2004/8 expected `.csv` files in `"macroman"` encoding
           (the encoding used in much earlier versions of Mac OS).

        Function `write.matrix` in package [**MASS**](https://CRAN.R-project.org/package=MASS) provides a specialized interface for
        writing matrices, with the option of writing them in blocks and thereby reducing
        memory usage.

        It is possible to use `sink` to divert the standard R output to a file, and

