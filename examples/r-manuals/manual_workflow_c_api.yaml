        Cache: <fixture>/cache/mcp-console/manuals/<identity>
        File: R-exts.md
        Location: Writing R Extensions > 5 System and foreign language interfaces > 5.9 Handling R objects in C > 5.9.2 Allocating storage

        One that is commonly used is `Rf_allocVector`, the C-level equivalent of R-level
        `vector()` and its wrappers such as `integer()` and `character()`. One distinction is
        that whereas the R functions always initialize the elements of the vector,
        `Rf_allocVector` only does so for lists, expressions and character vectors (the
        cases where the elements are themselves R objects). Other useful allocation
        functions are `Rf_alloc3DArray`, `Rf_allocArray`, and `Rf_allocMatrix`.

        When creating new result objects it can be useful to fill them in with values
        from an existing object. The functions `Rf_copyVector` and `Rf_copyMatrix` can be
        used for this. `Rf_copyMostAttributes` can also simplify setting up a result
        object; it is used internally for results of arithmetic operations.

        If storage is required for C objects during the calculations this is best
        allocated by calling `R_alloc`; see [Memory allocation](#Memory-allocation). All of these memory
        allocation routines do their own error-checking, so the programmer may assume
        that they will raise an error and not return if the memory cannot be allocated.


