        When creating new result objects it can be useful to fill them in with values
        from an existing object. The functions `Rf_copyVector` and `Rf_copyMatrix` can be
        used for this. `Rf_copyMostAttributes` can also simplify setting up a result
        object; it is used internally for results of arithmetic operations.

        If storage is required for C objects during the calculations this is best
        allocated by calling `R_alloc`; see [Memory allocation](06-the-r-api-entry-points-for-c-code-part-002.md#Memory-allocation). All of these memory
        allocation routines do their own error-checking, so the programmer may assume
        that they will raise an error and not return if the memory cannot be allocated.

        #### 5.9.3 Details of R types

        Users of the Rinternals.h macros will need to know how the R types are known
        internally. The different R data types are represented in C by *SEXPTYPE*. Some of
        these are familiar from R and some are internal data types. The usual R object
        modes are given in the table.

        > ────────┬───────────────────────────────
        > SEXPTYPE│R equivalent                   
        > ────────┼───────────────────────────────
        > `REALSXP` │numeric with storage mode      
        >         │`double`                         
        > ────────┼───────────────────────────────
        > `INTSXP`  │integer                        
        > ────────┼───────────────────────────────
        > `CPLXSXP` │complex                        
        > ────────┼───────────────────────────────
        > `LGLSXP`  │logical                        
        > ────────┼───────────────────────────────
        > `STRSXP`  │character                      
        > ────────┼───────────────────────────────
        > `VECSXP`  │list (generic vector)          
        > ────────┼───────────────────────────────
        > `LISTSXP` │pairlist                       
        > ────────┼───────────────────────────────
        > `DOTSXP`  │a ‘…’ object                   
        > ────────┼───────────────────────────────
        > `NILSXP`  │NULL                           
        > ────────┼───────────────────────────────
        > `SYMSXP`  │name/symbol                    
        > ────────┼───────────────────────────────
        > `CLOSXP`  │function or function closure   
        > ────────┼───────────────────────────────
        > `ENVSXP`  │environment                    
        > ────────┴───────────────────────────────

