        One that is commonly used is `Rf_allocVector`, the C-level equivalent of R-level
        `vector()` and its wrappers such as `integer()` and `character()`. One distinction is
        that whereas the R functions always initialize the elements of the vector,
        `Rf_allocVector` only does so for lists, expressions and character vectors (the
        cases where the elements are themselves R objects). Other useful allocation
        functions are `Rf_alloc3DArray`, `Rf_allocArray`, and `Rf_allocMatrix`.


        Next file: .console$manual("R-exts/05.09.02-allocating-storage-part-001.md")
