        ## 6 The R API: entry points for C code

        There are a large number of entry points in the R executable/DLL that can be
        called from C code (and a few that can be called from Fortran code). Only those
        documented here are stable enough that they will only be changed with
        considerable notice.

        As explained elsewhere in this manual, these functions should only be called
        from the main thread of the R process. (Doing otherwise can result in memory
        corruption and very hard-to-debug segfaults.)

        The recommended procedure to use these is to include the header file R.h in your
        C code by

        ```
        #include <R.h>
        ```

        This will include several other header files from the directory
        R_INCLUDE_DIR/R_ext, and there are other header files there that can be included
        too, but many of the features they contain should be regarded as undocumented
        and unstable.

        Most of these header files, including all those included by R.h, can be used
        from C++ code. (However, they cannot safely be included in a `extern "C" { }`
        block as they may include C++ headers when included from C++ code—and whether
        this succeeds is system-specific).

        > **Note:** Because R re-maps many of its external names to avoid clashes with
        > system or user code, it is *essential* to include the appropriate header files
        > when using these entry points.

        This remapping can cause problems[¹⁶⁴](99.360-141-part-001.md#FOOT164), and can be eliminated by defining
        `R_NO_REMAP` (before including any R headers) and prepending ‘Rf_’ to *all* the
        function names used from Rinternals.h and R_ext/Error.h. These problems can
        usually be avoided by including other headers (such as system headers and those
        for external software used by the package) before any R headers. (Headers from
        other packages may include R headers directly or *via* inclusion from further
        packages, and may define `R_NO_REMAP` with or without including Rinternals.h.)

        As from R 4.5.0, `R_NO_REMAP` is always defined when the R headers are included
        from C++ code.

        If you decide to define `R_NO_REMAP` in your code, do use something like

        ```
        #ifndef R_NO_REMAP
        # define R_NO_REMAP
        #endif
        ```

        to avoid distracting compiler warnings.

        Some of these entry points are declared in header Rmath.h, most of which are
        remapped there. That remapping can be eliminated by defining `R_NO_REMAP_RMATH`
        (before including any R headers) and prepending ‘Rf_’ to the function names used
        from that header except

        ```
        exp_rand norm_rand unif_rand signrank_free wilcox_free
        ```

        We can classify the entry points as

        *API*
          Entry points which are documented in this manual and declared in an installed
          header file. These can be used in distributed packages and ideally will only
          be changed after deprecation. See [API index](99.214-api-index-part-001.md#API-index).
        *public*
          Entry points declared in an installed header file that are exported on all R
          platforms but are not documented and subject to change without notice. Do not
          use these in distributed code. Their declarations will eventually be moved out
          of installed header files.
        *private*
          Entry points that are used when building R and exported on all R platforms but
          are not declared in the installed header files. Do not use these in
          distributed code.
        *hidden*
          Entry points that are where possible (Windows and some modern Unix-alike
          compilers/loaders when using R as a shared library) not exported.
        *experimental*
          Entry points declared in an installed header file that are part of an
          experimental API, such as R_ext/Altrep.h. These are subject to change, so
          package authors wishing to use these should be prepared to adapt. See
          [Experimental API index](99.216-experimental-api-index-part-001.md#Experimental-API-index).
        *embedding*
          Entry points intended primarily for embedding and creating new front-ends. It
          is not clear that this needs to be a separate category but it may be useful to
          keep it separate for now. See [Embedding API index](99.217-embedding-api-index-part-001.md#Embedding-API-index).

        If you would like to use an entry point or variable that is not identified as

