        ### 6.1 Memory allocation

        There are two types of memory allocation available to the C programmer, one in
        which R manages the clean-up and the other in which users have full control (and
        responsibility).

        These functions are declared in header R_ext/RS.h which is included by R.h.

        * [Transient storage allocation](#Transient-storage-allocation)
        * [User-controlled memory](#User_002dcontrolled-memory)

        #### 6.1.1 Transient storage allocation

        Here R will reclaim the memory at the end of the call to `.C`, `.Call` or `.External`.
        Use

        ```
        char *R_alloc(size_t n, int size)
        ```

        which allocates n units of size bytes each. A typical usage (from package **stats**)
        is

        ```
        x = (int *) R_alloc(nrows(merge)+2, sizeof(int));
        ```

        (`size_t` is defined in stddef.h which the header defining `R_alloc` includes.)

        There is a similar call, `S_alloc` (named for compatibility with older versions of
        S) which zeroes the memory allocated,

        ```
        char *S_alloc(long n, int size)
        ```

        and

        ```
        char *S_realloc(char *p, long new, long old, int size)
        ```

        which (for `new > old`) changes the allocation size from old to new units, and
        zeroes the additional units. NB: these calls are best avoided as `long` is
        insufficient for large memory allocations on 64-bit Windows (where it is limited
        to 2^31-1 bytes).

        This memory is taken from the heap, and released at the end of the `.C`, `.Call` or
        `.External` call. Users can also manage it, by noting the current position with a
        call to `vmaxget` and subsequently clearing memory allocated by a call to `vmaxset`.
        An example might be

        ```
        void *vmax = vmaxget()
        // a loop involving the use of R_alloc at each iteration
        vmaxset(vmax)
        ```

        This is only recommended for experts.

        Note that this memory will be freed on error or user interrupt (if allowed: see
        [Allowing interrupts](#Allowing-interrupts)).

        The memory returned is only guaranteed to be aligned as required for `double`
        pointers: take precautions if casting to a pointer which needs more. There is
        also

        ```
        long double *R_allocLD(size_t n)
        ```

        which is guaranteed to have the 16-byte alignment needed for `long double`
        pointers on some platforms.

        These functions should only be used in code called by `.C` etc, never from
        front-ends. They are not thread-safe.

        #### 6.1.2 User-controlled memory

        The other form of memory allocation is an interface to `malloc`, the interface
        providing R error signaling. This memory lasts until freed by the user and is
        additional to the memory allocated for the R workspace.

        The interface macros are

        ```
        type* R_Calloc(size_t n, type)
        type* R_Realloc(any *p, size_t n, type)
        void R_Free(any *p)
        ```


