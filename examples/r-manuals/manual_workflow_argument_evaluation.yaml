send:
  r: RShowDoc("R-lang#Argument-evaluation")
result:
  content:
    - type: text
      text: |
        Cache: <fixture>/cache/mcp-console/manuals/<identity>
        File: R-lang/04.03.01-evaluation-environment-part-001.md
        Also read: R-lang/04.03.03-argument-evaluation-part-001.md
        Location: The R Language Definition > 4 Functions > 4.3 Evaluation > 4.3.3 Argument evaluation

        #### 4.3.3 Argument evaluation

        One of the most important things to know about the evaluation of arguments to a
        function is that supplied arguments and default arguments are treated
        differently. The supplied arguments to a function are evaluated in the
        evaluation frame of the calling function. The default arguments to a function
        are evaluated in the evaluation frame of the function.

        The semantics of invoking a function in R argument are *call-by-value*. In
        general, supplied arguments behave as if they are local variables initialized
        with the value supplied and the name of the corresponding formal argument.
        Changing the value of a supplied argument within a function will not affect the
        value of the variable in the calling frame.

        R has a form of lazy evaluation of function arguments. Arguments are not
        evaluated until needed. It is important to realize that in some cases the
        argument will never be evaluated. Thus, it is bad style to use arguments to
        functions to cause side-effects. While in **C** it is common to use the form, `foo(x`
        `= y)` to invoke `foo` with the value of `y` and simultaneously to assign the value of
        `y` to `x` this same style should not be used in R. There is no guarantee that the
        argument will ever be evaluated and hence the assignment may not take place.

        It is also worth noting that the effect of `foo(x <- y)` if the argument is
        evaluated is to change the value of `x` in the calling environment and not in the
        evaluation environment of `foo`.

        It is possible to access the actual (not default) expressions used as arguments
        inside the function. The mechanism is implemented via promises. When a function
        is being evaluated the actual expression used as an argument is stored in the
        promise together with a pointer to the environment the function was called from.
        When (if) the argument is evaluated the stored expression is evaluated in the
        environment that the function was called from. Since only a pointer to the
        environment is used any changes made to that environment will be in effect
        during this evaluation. The resulting value is then also stored in a separate
        spot in the promise. Subsequent evaluations retrieve this stored value (a second
        evaluation is not carried out). Access to the unevaluated expression is also
        available using `substitute`.

        When a function is called, each formal argument is assigned a promise in the
        local environment of the call with the expression slot containing the actual
        argument (if it exists) and the environment slot containing the environment of
        the caller. If no actual argument for a formal argument is given in the call and
        there is a default expression, it is similarly assigned to the expression slot
        of the formal argument, but with the environment set to the local environment.

        The process of filling the value slot of a promise by evaluating the contents of
        the expression slot in the promise’s environment is called *forcing* the promise.
        A promise will only be forced once, the value slot content being used directly
        later on.

        A promise is forced when its value is needed. This usually happens inside
        internal functions, but a promise can also be forced by direct evaluation of the
        promise itself. This is occasionally useful when a default expression depends on
        the value of another formal argument or other variable in the local environment.
        This is seen in the following example where the lone `label` ensures that the
        label is based on the value of `x` before it is changed in the next line.

        ```
        function(x, label = deparse(x)) {
            label
            x <- x + 1
            print(label)
        }
        ```

        The expression slot of a promise can itself involve other promises. This happens
        whenever an unevaluated argument is passed as an argument to another function.
        When forcing a promise, other promises in its expression will also be forced
        recursively as they are evaluated.


        Next section: RShowDoc("R-lang#Scope")
  isError: false
