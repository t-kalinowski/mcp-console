---
command:
  - mcp-console
  - sandbox
  - --
  - python
  - -c
  - |
    import os
    import signal

    signal.signal(signal.SIGHUP, signal.SIG_IGN)
    print("ready", flush=True)
    try:
        os.read(0, 1)
    except OSError:
        pass
    raise SystemExit(23)
terminal: closed after readiness
exit_code: 23
