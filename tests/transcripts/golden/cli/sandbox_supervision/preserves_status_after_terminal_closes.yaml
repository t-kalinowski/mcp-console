---
command:
  - mcp-console
  - sandbox
  - --
  - python
  - -c
  - |
    import os
    import signal
    import sys

    signal.signal(signal.SIGHUP, signal.SIG_IGN)
    print("ready", flush=True)
    with open(sys.argv[1], encoding="utf-8") as release:
        assert release.readline() == "release\n"
    raise SystemExit(23)
  - <release gate>
terminal: closed after readiness
exit_code: 23
