---
command:
  - mcp-console
  - sandbox
  - --
  - python
  - -c
  - |
    import signal

    interrupts = 0


    def handle_interrupt(_signal, _frame):
        global interrupts
        interrupts += 1
        print("interrupted", flush=True)


    signal.signal(signal.SIGINT, handle_interrupt)
    print("ready", flush=True)
    print(input(), flush=True)
    while interrupts == 0:
        signal.pause()
    input()
    print(interrupts)
stdin: |
  sandbox input
  <Ctrl-C>
  report count
stdout: |
  1
