---
command:
  - mcp-console
  - sandbox
  - "--"
  - python
  - "-c"
  - |
    import sys

    for line in sys.stdin:
        if line == "EXIT\n":
            break

        sys.stdout.write(line)
        sys.stdout.flush()
        sys.stderr.write(line)
        sys.stderr.flush()
stdin: |
  echo exactly: $(literal)
stdout: |
  echo exactly: $(literal)
stderr: |
  echo exactly: $(literal)
---
stdin: |
  EXIT
exit_code: 0
...
