---
command:
  - mcp-console
  - sandbox
  - --
  - python
  - -c
  - |
    import os
    import subprocess
    import sys

    child = subprocess.Popen(
        ["/bin/sleep", "60"],
        stdin=subprocess.DEVNULL,
        stdout=subprocess.DEVNULL,
        stderr=subprocess.DEVNULL,
        start_new_session=True,
    )
    print(os.getpid())
    print(child.pid)
    print(os.environ["TMPDIR"])
    sys.stdout.flush()
    if sys.stdin.readline() == "exit\n":
        raise SystemExit(23)
    raise SystemExit(24)
stdout: |
  <sandbox root pid>
  <detached descendant pid>
  <sandbox temp>
stderr: >
  failed to control sandbox manager retirement: Broken pipe (os error 32);
  additionally, sandbox manager exited with status signal: 9 (SIGKILL);
  additionally, manager recovery failed: failed to signal sandbox
  descendant <sandbox root pid>: Operation not permitted (os error 1)
---
manager_signal: SIGKILL
manager_recovery_signal: EPERM
launcher_returncode: 1
verified_cleanup: sandbox root, detached descendant, and manager
verified_preservation: sandbox temp
