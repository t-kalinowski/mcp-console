---
command:
  - mcp-console
  - sandbox
  - --
  - python
  - -c
  - |
    import os
    import subprocess
    import sys

    child = subprocess.Popen(
        ["/bin/sleep", "60"],
        stdin=subprocess.DEVNULL,
        stdout=subprocess.DEVNULL,
        stderr=subprocess.DEVNULL,
        start_new_session=True,
    )
    print(os.getpid())
    print(child.pid)
    print(os.environ["TMPDIR"])
    sys.stdout.flush()
    if sys.stdin.readline() == "exit\n":
        raise SystemExit(23)
    raise SystemExit(24)
stdout: |
  <sandbox root pid>
  <detached descendant pid>
  <sandbox temp>
stderr: >
  failed to finish sandbox manager ownership: Broken pipe (os error 32);
  additionally, sandbox manager exited with status signal: 9 (SIGKILL);
  additionally, manager recovery failed: failed to signal sandbox
  descendant <sandbox process pid>: Operation not permitted (os error 1);
  additionally, timed out waiting for sandbox descendants to stop;
  additionally, failed to signal sandbox descendant <sandbox process pid>:
  Operation not permitted (os error 1); additionally, manager recovery
  failed: failed to stop sandbox process group: Operation not permitted
  (os error 1); additionally, failed to stop pinned sandbox root <sandbox
  process pid>: Operation not permitted (os error 1); additionally, failed
  to terminate direct /usr/bin/sandbox-exec process: Operation not
  permitted (os error 1); process-group termination also failed: Operation
  not permitted (os error 1)
---
manager_signal: SIGKILL
manager_monitor_signals: EPERM
owner_recovery_signals: EPERM
launcher_returncode: 1
verified_bounded_return: with root and detached descendant still live
verified_cleanup: sandbox manager
verified_preservation: sandbox temp
