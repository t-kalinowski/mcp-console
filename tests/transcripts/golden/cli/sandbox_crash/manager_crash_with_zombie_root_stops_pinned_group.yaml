---
command:
  - mcp-console
  - sandbox
  - --
  - python
  - -c
  - |
    import os
    import subprocess
    import sys

    child = subprocess.Popen(
        ["/bin/sleep", "60"],
        stdin=subprocess.DEVNULL,
        stdout=subprocess.DEVNULL,
        stderr=subprocess.DEVNULL,
        start_new_session=False,
    )
    print(os.getpid())
    print(child.pid)
    print(os.environ["TMPDIR"])
    sys.stdout.flush()
    if sys.stdin.readline() == "exit\n":
        raise SystemExit(23)
    raise SystemExit(24)
stdout: |
  <sandbox root pid>
  <same-group descendant pid>
  <sandbox temp>
stderr: >
  sandbox manager exited with status signal: 9 (SIGKILL); additionally,
  manager recovery failed: sandbox root <sandbox root pid> exited before
  fallback supervision
---
manager_signal: SIGSTOP then SIGKILL
verified_root_state: waitable zombie during recovery
launcher_returncode: 1
verified_cleanup: sandbox root, same-group descendant, and manager
verified_preservation: sandbox temp
