---
command:
  - mcp-console
  - sandbox
  - --
  - python
  - -c
  - |
    import os
    import subprocess
    import sys

    child = subprocess.Popen(
        ["/bin/sleep", "60"],
        stdin=subprocess.DEVNULL,
        stdout=subprocess.DEVNULL,
        stderr=subprocess.DEVNULL,
        process_group=0,
    )
    os.setpgid(0, child.pid)
    print(os.getpid())
    print(child.pid)
    print(os.environ["TMPDIR"])
    sys.stdout.flush()
    if sys.stdin.readline() == "exit\n":
        raise SystemExit(23)
    raise SystemExit(24)
stdout: |
  <sandbox root pid>
  <new-group descendant pid>
  <sandbox temp>
---
root_process_group: descendant PID
launcher_signal: SIGKILL
manager_old_group_stop: already empty
manager_root_stop_signal: EPERM
verified_bounded_return: within the cleanup deadline
verified_preservation: sandbox root, new-group descendant, and sandbox temp
