---
command:
  - mcp-console
  - sandbox
  - --
  - Rscript
  - --vanilla
  - -e
  - |
    pipeline <- processx::pipeline$new(
      list(
        c("/bin/sleep", "60"),
        c("/bin/cat")
      ),
      stdout = "|",
      stderr = "|",
      cleanup = FALSE
    )
    writeLines(as.character(pipeline$get_pids()))
    flush.console()
    stopifnot(identical(readLines("stdin", n = 1L), "exit"))
    quit(save = "no", status = 23L, runLast = FALSE)
exit_code: 23
stdout: |
  <pipeline stage pid>
  <pipeline stage pid>
