---
worker:
  kind: ready
---
server:
  kind: evaluate
  language: r
  source: |
    python <- Sys.which("python3")
    stopifnot(nzchar(python))
    reticulate::use_python(python, required = TRUE)
    suppressWarnings(invisible(reticulate::py_run_string("fork_ready = True")))
---
worker:
  kind: completed
---
server:
  kind: evaluate
  language: python
  source: |
    import os
    import sys

    assert fork_ready
    child = os.fork()
    if child == 0:
        print("fork child stdout", flush=True)
        sys.stderr.write("fork child stderr\n")
        sys.stderr.flush()
        os._exit(0)

    _, status = os.waitpid(child, 0)
    assert os.waitstatus_to_exitcode(status) == 0
    parent_stdout = sys.stdout.write("parent stdout\n")
    parent_stderr = sys.stderr.write("parent stderr\n")
---
stdout: |
  fork child stdout
stderr: |
  fork child stderr
---
worker:
  kind: console_output
  data: |
    parent stdout
---
worker:
  kind: console_diagnostic
  data: |
    parent stderr
---
worker:
  kind: completed
...
