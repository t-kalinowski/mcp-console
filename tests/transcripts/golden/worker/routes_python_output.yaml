server:
  kind: evaluate
  language: python
  source: |
    import os
    import subprocess
    import sys

    buffer_stdout = sys.stdout.buffer.write(b"buffer stdout\n")
    sys.stdout.buffer.flush()
    buffer_stderr = sys.stderr.buffer.write(b"buffer stderr\n")
    sys.stderr.buffer.flush()
    direct_stdout = os.write(1, b"direct stdout\n")
    direct_stderr = os.write(2, b"direct stderr\n")
    descendant_source = 'import os\n\nos.write(1, b"descendant stdout\\n")\nos.write(2, b"descendant stderr\\n")\n'
    descendant = subprocess.run(
        [sys.executable, "-c", descendant_source],
        check=True,
    )
---
worker:
  kind: completed
---
server:
  kind: shutdown
---
exit_code: 0
stdout: |
  buffer stdout
  direct stdout
  descendant stdout
stderr: |
  buffer stderr
  direct stderr
  descendant stderr
