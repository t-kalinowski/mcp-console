---
!same-as tests/transcripts/golden/server/initializes_and_lists_tools.yaml
---
id: 3
session:
  action: prepare
  requirements:
    r:
      - praise
result:
  content:
    - type: text
      text: "[prepared]"
  isError: false
---
id: 4
send:
  r: |
    sentinel <- 42L
    worker_pid <- Sys.getpid()
    initial_library <- .libPaths()[[1L]]
    .libPaths(initial_library, include.site = FALSE)
    stopifnot(isFALSE(require(zeallot)))
result:
  content:
    - type: text
      text: |
        Loading required package: zeallot
        Warning message:
        In library(package, lib.loc = lib.loc, character.only = TRUE, logical.return = TRUE,  :
          there is no package called ‘zeallot’
  isError: false
---
id: 5
session:
  action: prepare
  requirements:
    r:
      - zeallot
    python:
      - not a valid requirement !!!
result:
  content:
    - type: text
      text: |-
        managed Python resolution failed:
        resolver input:
        {
          "python": "3.12.x (reticulate default)",
          "packages": [
            "numpy",
            "pandas",
            "not a valid requirement !!!"
          ]
        }
        uv output:
        error: Failed to parse: `not a valid requirement !!!`
          Caused by: Expected one of `@`, `(`, `<`, `=`, `>`, `~`, `!`, `;`, found `a`
        not a valid requirement !!!
            ^
  isError: true
---
id: 6
send:
  r: |
    stopifnot(
      identical(sentinel, 42L),
      identical(Sys.getpid(), worker_pid),
      identical(.libPaths()[[1L]], initial_library),
      isFALSE(require(zeallot)),
      !"not a valid requirement !!!" %in%
        reticulate::py_require()$packages
    )
    42L
result:
  content:
    - type: text
      text: |
        Loading required package: zeallot
        Warning message:
        In library(package, lib.loc = lib.loc, character.only = TRUE, logical.return = TRUE,  :
          there is no package called ‘zeallot’
        [1] 42
  isError: false
...
