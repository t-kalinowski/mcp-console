---
!same-as tests/transcripts/golden/server/initializes_and_lists_tools.yaml
---
id: 3
session:
  action: prepare
  requirements:
    r:
      - praise
result:
  content:
    - type: text
      text: "[prepared]"
  isError: false
---
id: 4
send:
  r: |
    sentinel <- 42L
    worker_pid <- Sys.getpid()
    initial_lib_paths <- .libPaths()
    initial_library <- initial_lib_paths[[1L]]
    stopifnot(isFALSE(suppressWarnings(require(
      zeallot,
      lib.loc = initial_library,
      quietly = TRUE
    ))))
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
id: 5
session:
  action: prepare
  requirements:
    r:
      - zeallot
    python:
      - not a valid requirement !!!
result:
  content:
    - type: text
      text: |-
        managed Python resolution failed:
        resolver input:
        {
          "python": "3.12.x (reticulate default)",
          "packages": [
            "numpy",
            "pandas",
            "not a valid requirement !!!"
          ]
        }
        uv output:
        error: Failed to parse: `not a valid requirement !!!`
          Caused by: Expected one of `@`, `(`, `<`, `=`, `>`, `~`, `!`, `;`, found `a`
        not a valid requirement !!!
            ^
  isError: true
---
id: 6
send:
  r: |
    stopifnot(
      identical(sentinel, 42L),
      identical(Sys.getpid(), worker_pid),
      identical(.libPaths(), initial_lib_paths),
      isFALSE(suppressWarnings(require(
        zeallot,
        lib.loc = initial_library,
        quietly = TRUE
      ))),
      !"not a valid requirement !!!" %in%
        reticulate::py_require()$packages
    )
    42L
result:
  content:
    - type: text
      text: |
        [1] 42
  isError: false
...
