---
!same-as tests/transcripts/golden/server/initializes_and_lists_tools.yaml
---
id: 3
send:
  r: |
    sentinel <- 42L
    worker_pid <- Sys.getpid()
    invisible(reticulate::py_config())
    stopifnot(reticulate::py_available(initialize = FALSE))
    original_lib_paths <- base::.libPaths
    replacement_lib_paths <- base::local({
      original <- original_lib_paths
      function(new) {
        if (base::missing(new)) {
          return(original())
        }
        original(new)
        base::stop("blocked live R preparation")
      }
    })
    base::unlockBinding(".libPaths", base::baseenv())
    base::assign(
      ".libPaths",
      replacement_lib_paths,
      envir = base::baseenv()
    )
    base::lockBinding(".libPaths", base::baseenv())
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
id: 4
session:
  action: prepare
  requirements:
    r:
      - praise
    python:
      - py-yaml12
result:
  content:
    - type: text
      text: >-
        blocked live R preparation; further requirement changes are unavailable
        until session restart
  isError: true
---
id: 5
session:
  action: prepare
  requirements:
    r:
      - zeallot
result:
  content:
    - type: text
      text: "[restart required]"
  isError: false
---
id: 6
send:
  r: |
    saved <- base::unserialize(base::serialize(sentinel, NULL))
    saved_path <- tempfile(fileext = ".rds")
    saveRDS(saved, saved_path)
    stopifnot(
      identical(saved, 42L),
      identical(Sys.getpid(), worker_pid),
      is.character(base::.libPaths())
    )
    cat(saved_path)
result:
  content:
    - type: text
      text: <worker temporary RDS path>
  isError: false
---
id: 7
session:
  action: restart
result:
  content:
    - type: text
      text: |-
        [worker stopped: in-memory state lost]
        [starting new worker]
        [idle]
  isError: false
---
id: 8
session:
  action: prepare
  requirements:
    r:
      - zeallot
result:
  content:
    - type: text
      text: "[prepared]"
  isError: false
---
id: 9
send:
  r: |
    saved <- readRDS("<saved sentinel path>")
    stopifnot(
      identical(saved, 42L),
      !exists("sentinel", inherits = FALSE),
      "py-yaml12" %in% reticulate::py_require()$packages,
      reticulate::py_module_available("yaml12"),
      identical(dirname(find.package("zeallot")), .libPaths()[[1L]])
    )
result:
  content:
    - type: text
      text: "[done]"
  isError: false
...
