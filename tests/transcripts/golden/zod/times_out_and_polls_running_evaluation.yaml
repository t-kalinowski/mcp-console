---
id: 1
input:
  method: initialize
  params:
    protocolVersion: 2025-11-25
    capabilities: {}
    clientInfo:
      name: acceptance-test
      version: 1.0.0
output:
  result:
    protocolVersion: 2025-11-25
    capabilities:
      tools: {}
    serverInfo:
      name: mcp-console
      version: 0.1.0
---
input:
  method: notifications/initialized
---
id: 2
input:
  method: tools/list
output:
  result:
    tools:
      - name: send
        description: Evaluate one complete R code cell or poll its running evaluation.
        inputSchema:
          $schema: https://json-schema.org/draft/2020-12/schema
          additionalProperties: false
          type: object
          properties:
            r:
              description: >-
                Complete multiline R code evaluated in persistent state. Omit to poll a
                running cell.
              type: string
            timeout_ms:
              description: Maximum time this call waits. It does not limit or stop the computation.
              type: integer
              default: 60000
              minimum: 0
---
id: 3
input:
  method: tools/call
  params:
    name: send
    arguments:
      r: warm worker
output:
  result:
    content:
      - type: text
        text: |
          zod: warm worker
    isError: false
---
id: 4
input:
  method: tools/call
  params:
    name: send
    arguments:
      r: complete after timeout
      timeout_ms: 10
output:
  result:
    content:
      - type: text
        text: "[running]"
    isError: false
---
id: 5
input:
  method: tools/call
  params:
    name: send
    arguments:
      timeout_ms: 3000
output:
  result:
    content:
      - type: text
        text: |
          zod: complete after timeout
    isError: false
---
id: 6
input:
  method: tools/call
  params:
    name: send
    arguments:
      timeout_ms: 3000
output:
  result:
    content:
      - type: text
        text: another send call is already waiting for this evaluation
    isError: true
---
id: 7
input:
  method: tools/call
  params:
    name: send
    arguments:
      r: after timeout
output:
  result:
    content:
      - type: text
        text: |
          zod: after timeout
    isError: false
...
