---
id: 1
input:
  method: initialize
  params:
    protocolVersion: 2025-11-25
    capabilities: {}
    clientInfo:
      name: acceptance-test
      version: 1.0.0
output:
  result:
    protocolVersion: 2025-11-25
    capabilities:
      tools: {}
    serverInfo:
      name: mcp-console
      version: 0.1.0
---
input:
  method: notifications/initialized
---
id: 2
input:
  method: tools/list
output:
  result:
    tools:
      - name: send
        description: Evaluate one complete R code cell or poll its running evaluation.
        inputSchema:
          $schema: https://json-schema.org/draft/2020-12/schema
          additionalProperties: false
          type: object
          properties:
            r:
              description: >-
                Complete multiline R code evaluated in persistent state. Omit to poll a
                running cell.
              type: string
            timeout_ms:
              description: Maximum time this call waits. It does not limit or stop the computation.
              type: integer
              default: 60000
              minimum: 0
---
id: 3
input:
  method: tools/call
  params:
    name: send
    arguments:
      r: <large cell>
...
