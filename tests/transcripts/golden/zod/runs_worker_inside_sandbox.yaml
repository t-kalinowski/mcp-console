---
id: 1
input:
  method: initialize
  params:
    protocolVersion: 2025-11-25
    capabilities: {}
    clientInfo:
      name: acceptance-test
      version: 1.0.0
output:
  result:
    protocolVersion: 2025-11-25
    capabilities:
      tools: {}
    serverInfo:
      name: mcp-console
      version: 0.1.0
---
input:
  method: notifications/initialized
---
id: 2
input:
  method: tools/list
output:
  result:
    tools:
      - name: send
        description: >-
          Persistent R console. Send one complete r cell, or send stdin after the
          response ends with [input].
        inputSchema:
          $schema: https://json-schema.org/draft/2020-12/schema
          additionalProperties: false
          type: object
          properties:
            r:
              description: Complete multiline R code evaluated as top-level expressions.
              type:
                - string
                - "null"
            stdin:
              description: Exact text supplied after R requests interactive input.
              type:
                - string
                - "null"
---
id: 3
input:
  method: tools/call
  params:
    name: send
    arguments:
      r: probe sandbox
output:
  result:
    content:
      - type: text
        text: |
          sandbox blocked host write
    isError: false
...
