---
id: 1
input:
  method: initialize
  params:
    protocolVersion: 2025-11-25
    capabilities: {}
    clientInfo:
      name: acceptance-test
      version: 1.0.0
output:
  result:
    protocolVersion: 2025-11-25
    capabilities:
      tools: {}
    serverInfo:
      name: mcp-console
      version: 0.1.0
---
input:
  method: notifications/initialized
---
id: 2
input:
  method: tools/list
output:
  result:
    tools:
      - name: send
        description: "Evaluate one complete R code cell in persistent state. Stdin may accompany the cell or follow an [input] response."
        inputSchema:
          $schema: "https://json-schema.org/draft/2020-12/schema"
          additionalProperties: false
          type: object
          properties:
            r:
              description: Complete multiline R code evaluated in persistent state.
              type:
                - string
                - "null"
            stdin:
              description: |-
                Exact text supplied at this cell's first input request or an active [input]
                prompt. One value may satisfy multiple reads in the same evaluation. Each
                line is limited to 512 bytes, including its newline.
              type:
                - string
                - "null"
---
id: 3
input:
  method: tools/call
  params:
    name: send
    arguments:
      r: violate protocol
output:
  result:
    content:
      - type: text
        text: worker sent an unexpected ready message
    isError: true
---
id: 4
input:
  method: tools/call
  params:
    name: send
    arguments:
      r: hello
output:
  result:
    content:
      - type: text
        text: |
          zod: hello
    isError: false
...
