---
id: 1
input:
  method: initialize
  params:
    protocolVersion: 2025-11-25
    capabilities: {}
    clientInfo:
      name: acceptance-test
      version: 1.0.0
result:
  protocolVersion: 2025-11-25
  capabilities:
    tools: {}
  serverInfo:
    name: mcp-console
    version: 0.1.0
---
input:
  method: notifications/initialized
---
id: 2
input:
  method: tools/list
result:
  tools:
    - name: send
      description: >-
        Evaluate one complete R or Python code cell, write its stdin, or poll
        it.
      inputSchema:
        $schema: https://json-schema.org/draft/2020-12/schema
        additionalProperties: false
        type: object
        properties:
          r:
            description: >-
              Complete multiline R code evaluated in persistent state. Omit to write
              stdin or poll.
            type:
              - string
              - "null"
          python:
            description: >-
              Complete multiline Python code evaluated in persistent state. Omit to
              write stdin or poll.
            type:
              - string
              - "null"
          stdin:
            description: Exact UTF-8 text queued to worker fd 0 without adding a newline.
            type:
              - string
              - "null"
          timeout_ms:
            description: >-
              Maximum time this call waits for an evaluation. It does not limit or
              stop the computation.
            type: integer
            format: uint64
            minimum: 0
            default: 60000
...
