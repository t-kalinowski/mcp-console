---
id: 1
input:
  method: initialize
  params:
    protocolVersion: 2025-11-25
    capabilities: {}
    clientInfo:
      name: acceptance-test
      version: 1.0.0
result:
  protocolVersion: 2025-11-25
  capabilities:
    tools: {}
  serverInfo:
    name: mcp-console
    version: 0.1.0
---
input:
  method: notifications/initialized
---
id: 2
input:
  method: tools/list
result:
  tools:
    - name: send
      description: >-
        Evaluate one complete R, Python, or SQL code cell, write its stdin, or
        poll it.
      inputSchema:
        $schema: https://json-schema.org/draft/2020-12/schema
        additionalProperties: false
        type: object
        properties:
          r:
            description: |-
              Complete multiline R code evaluated in persistent state. Plots drawn on the default device
              return as PNG images in MCP results. Set their size with the R options
              `options(console.plot.width = ..., console.plot.height = ..., console.plot.dpi = ...)`;
              width and height are in inches. Keep each plot and its drawing operations in one cell. Omit
              to write stdin or poll.
            type:
              - string
              - "null"
          python:
            description: |-
              Complete multiline Python code evaluated in persistent state. R plots invoked through
              reticulate's `r` bridge return as PNG images under the same cell-scoped rules and R options
              as `r`. Omit to write stdin or poll.
            type:
              - string
              - "null"
          sql:
            description: >-
              Complete DuckDB SQL evaluated in the persistent catalog. Omit to write
              stdin or poll.
            type:
              - string
              - "null"
          stdin:
            description: Exact UTF-8 text queued to worker fd 0 without adding a newline.
            type:
              - string
              - "null"
          timeout_ms:
            description: >-
              Maximum time this call waits for an evaluation. It does not limit or
              stop the computation.
            type: integer
            format: uint64
            minimum: 0
            default: 60000
    - name: session
      description: >-
        Prepare additive R or Python requirements before the implicit session
        starts, or restart its worker while retaining prepared requirements.
        Restart starts a worker if none exists and loses all in-memory R,
        Python, and SQL state.
      inputSchema:
        $schema: https://json-schema.org/draft/2020-12/schema
        $defs:
          SessionAction:
            type: string
            enum:
              - prepare
              - restart
          Requirements:
            type: object
            properties:
              r:
                description: One or more additive, single-line R package references accepted by IR.
                type: array
                items:
                  type: string
                  minLength: 1
                maxItems: 64
                default: []
              python:
                description: One or more additive, single-line PEP 508 Python requirement strings.
                type: array
                items:
                  type: string
                  minLength: 1
                maxItems: 64
                default: []
            additionalProperties: false
        type: object
        properties:
          action:
            description: >-
              Prepare R or Python requirements or restart the implicit session,
              starting it if needed.
            $ref: "#/$defs/SessionAction"
          requirements:
            description: Additive requirements for prepare. Omit for restart.
            anyOf:
              - $ref: "#/$defs/Requirements"
              - type: "null"
        additionalProperties: false
        required:
          - action
...
