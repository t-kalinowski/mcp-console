---
input:
  jsonrpc: "2.0"
  id: 1
  method: initialize
  params:
    protocolVersion: 2025-11-25
    capabilities: {}
    clientInfo:
      name: acceptance-test
      version: 1.0.0
output:
  jsonrpc: "2.0"
  id: 1
  result:
    protocolVersion: 2025-11-25
    capabilities:
      tools: {}
    serverInfo:
      name: mcp-console
      version: 0.1.0
---
input:
  jsonrpc: "2.0"
  method: notifications/initialized
---
input:
  jsonrpc: "2.0"
  id: 2
  method: tools/list
output:
  jsonrpc: "2.0"
  id: 2
  result:
    tools:
      - name: console
        description: Echo the supplied arguments.
        inputSchema:
          $schema: https://json-schema.org/draft/2020-12/schema
          additionalProperties: true
          type: object
---
input:
  jsonrpc: "2.0"
  id: 3
  method: tools/call
  params:
    name: console
    arguments:
      python: print('hello')
      wait_ms: 0
output:
  jsonrpc: "2.0"
  id: 3
  result:
    content:
      - type: text
        text: |-
          {"python":"print('hello')","wait_ms":0}
    isError: false
...
