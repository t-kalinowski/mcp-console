---
id: 1
input:
  method: initialize
  params:
    protocolVersion: 2025-11-25
    capabilities: {}
    clientInfo:
      name: acceptance-test
      version: 1.0.0
output:
  result:
    protocolVersion: 2025-11-25
    capabilities:
      tools: {}
    serverInfo:
      name: mcp-console
      version: 0.1.0
---
input:
  method: notifications/initialized
---
id: 2
input:
  method: tools/call
  params:
    name: send
    arguments:
      r: |-
        name <- readline("name> ")
        paste("hello", name)
output:
  result:
    content:
      - type: text
        text: |-
          name>
          [input]
    isError: false
