---
id: 3
send:
  stdin: |
    cold fd 0
result:
  content:
    - type: text
      text: "\n[idle]"
  isError: false
---
id: 4
send:
  r: |
    local({
      connection <- suppressWarnings(file("/dev/stdin"))
      on.exit(close(connection))
      readLines(connection, n = 1)
    })
result:
  content:
    - type: text
      text: |
        [1] "cold fd 0"
  isError: false
---
id: 5
send:
  r: |
    prompted <- readline("bundled> ")
    direct <- local({
      connection <- suppressWarnings(file("/dev/stdin"))
      on.exit(close(connection))
      readLines(connection, n = 1)
    })
    paste(prompted, direct, sep = "|")
  stdin: |
    café
  timeout_ms: 50
result:
  content:
    - type: text
      text: "\n[running]"
  isError: false
