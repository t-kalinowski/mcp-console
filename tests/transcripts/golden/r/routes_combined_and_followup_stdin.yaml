---
!same-as tests/transcripts/golden/server/initializes_and_lists_tools.yaml
---
id: 3
send:
  r: |
    first <- readline("first> ")
    second <- readline("second> ")
    cat(paste(first, second, sep = "|"), "\n", sep = "")
  stdin: |
    Ada
    Lovelace
result:
  content:
    - type: text
      text: |
        [input requested: "first> "]
        [input requested: "second> "]
        Ada|Lovelace
  isError: false
---
id: 4
send:
  r: |
    direct <- local({
      connection <- suppressWarnings(file("/dev/stdin"))
      on.exit(close(connection))
      readLines(connection, n = 1)
    })
    prompted <- readline("after> ")
    cat(paste(direct, prompted, sep = "|"), "\n", sep = "")
  stdin: |
    direct
  timeout_ms: 1000
result:
  content:
    - type: text
      text: |-
        [input requested: "after> "]
        [stdin needed]
  isError: false
---
id: 5
send:
  stdin: |
    callback
result:
  content:
    - type: text
      text: |
        direct|callback
  isError: false
