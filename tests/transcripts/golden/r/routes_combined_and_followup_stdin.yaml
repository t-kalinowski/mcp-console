---
id: 1
input:
  method: initialize
  params:
    protocolVersion: 2025-11-25
    capabilities: {}
    clientInfo:
      name: acceptance-test
      version: 1.0.0
output:
  result:
    protocolVersion: 2025-11-25
    capabilities:
      tools: {}
    serverInfo:
      name: mcp-console
      version: 0.1.0
---
input:
  method: notifications/initialized
---
id: 2
input:
  method: tools/list
output:
  result:
    tools:
      - name: send
        description: "Evaluate one complete R code cell in persistent state. Stdin may accompany the cell or follow an [input] response."
        inputSchema:
          $schema: "https://json-schema.org/draft/2020-12/schema"
          additionalProperties: false
          type: object
          properties:
            r:
              description: Complete multiline R code evaluated in persistent state.
              type:
                - string
                - "null"
            stdin:
              description: "Exact text for this cell's first input request or an active [input] prompt."
              type:
                - string
                - "null"
---
id: 3
input:
  method: tools/call
  params:
    name: send
    arguments:
      r: "paste(\"hello\", readline(\"name> \"))"
      stdin: |
        Ada
        stale
output:
  result:
    content:
      - type: text
        text: |
          name>
          [1] "hello Ada"
    isError: false
---
id: 4
input:
  method: tools/call
  params:
    name: send
    arguments:
      r: "42"
      stdin: |
        unused
output:
  result:
    content:
      - type: text
        text: |-
          [1] 42
          [stdin discarded]
    isError: false
---
id: 5
input:
  method: tools/call
  params:
    name: send
    arguments:
      r: "paste(\"color\", readline(\"color> \"))"
output:
  result:
    content:
      - type: text
        text: |-
          color>
          [input]
    isError: false
---
id: 6
input:
  method: tools/call
  params:
    name: send
    arguments:
      stdin: bl
output:
  result:
    content:
      - type: text
        text: |-
          color>
          [input]
    isError: false
---
id: 7
input:
  method: tools/call
  params:
    name: send
    arguments:
      stdin: |
        ue
output:
  result:
    content:
      - type: text
        text: |
          [1] "color blue"
    isError: false
...
