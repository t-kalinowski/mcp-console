---
id: 1
input:
  method: initialize
  params:
    protocolVersion: 2025-11-25
    capabilities: {}
    clientInfo:
      name: acceptance-test
      version: 1.0.0
output:
  result:
    protocolVersion: 2025-11-25
    capabilities:
      tools: {}
    serverInfo:
      name: mcp-console
      version: 0.1.0
---
input:
  method: notifications/initialized
---
id: 2
input:
  method: tools/call
  params:
    name: send
    arguments:
      r: |-
        user_calls <- function() {
          vapply(sys.calls(), deparse1, character(1))
        }
        calls <- user_calls()
        cat("contains user call: ", "user_calls()" %in% calls, "\n", sep = "")
        cat(
          "contains internal call: ",
          any(grepl("mcp_console|base::get", calls)),
          "\n",
          sep = ""
        )
output:
  result:
    content:
      - type: text
        text: |
          contains user call: TRUE
          contains internal call: FALSE
    isError: false
---
id: 3
input:
  method: tools/call
  params:
    name: send
    arguments:
      r: |-
        invisible(addTaskCallback(
          local({
            first <- TRUE
            function(expr, ...) {
              if (first) {
                first <<- FALSE
                return(TRUE)
              }
              cat(deparse1(expr), "\n", sep = "")
              FALSE
            }
          }),
          name = "mcp-console-test"
        ))
        mcp_console_callback_probe <- 42
output:
  result:
    content:
      - type: text
        text: |
          mcp_console_callback_probe <- 42
    isError: false
---
id: 4
input:
  method: tools/call
  params:
    name: send
    arguments:
      r: |-
        warning("careful", call. = FALSE)
        invisible(42)
        cat(
          "last value: ",
          identical(base::.Last.value, 42),
          ", global binding: ",
          exists(".Last.value", envir = globalenv(), inherits = FALSE),
          "\n",
          sep = ""
        )
output:
  result:
    content:
      - type: text
        text: "Warning message:\ncareful\x20\nlast value: TRUE, global binding: FALSE\n"
    isError: false
...
