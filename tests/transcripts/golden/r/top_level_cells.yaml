---
id: 1
input:
  method: initialize
  params:
    protocolVersion: 2025-11-25
    capabilities: {}
    clientInfo:
      name: acceptance-test
      version: 1.0.0
output:
  result:
    protocolVersion: 2025-11-25
    capabilities:
      tools: {}
    serverInfo:
      name: mcp-console
      version: 0.1.0
---
input:
  method: notifications/initialized
---
id: 2
input:
  method: tools/call
  params:
    name: send
    arguments:
      r: |-
        answer <- (38 + 2)
        answer + 2
        cat("done\n")
        invisible(99)
output:
  result:
    content:
      - type: text
        text: |
          [1] 42
          done
    isError: false
---
id: 3
input:
  method: tools/call
  params:
    name: send
    arguments:
      r: silent <- 1
output:
  result:
    content:
      - type: text
        text: "[done]"
    isError: false
---
id: 4
input:
  method: tools/call
  params:
    name: send
    arguments:
      r: |-
        1
        2
        answer
output:
  result:
    content:
      - type: text
        text: |
          [1] 1
          [1] 2
          [1] 40
    isError: false
---
id: 5
input:
  method: tools/call
  params:
    name: send
    arguments:
      r: |-
        cores <- parallel::detectCores()
        "parallel" %in% names(getLoadedDLLs())
output:
  result:
    content:
      - type: text
        text: |
          [1] TRUE
    isError: false
---
id: 6
input:
  method: tools/call
  params:
    name: send
    arguments:
      r: |-
        ..mcp_console_value.. <- 42
        ..mcp_console_value..
output:
  result:
    content:
      - type: text
        text: |
          [1] 42
    isError: false
---
id: 7
input:
  method: tools/call
  params:
    name: send
    arguments:
      r: |-
        job <- parallel::mcparallel(cat("forked output\n"))
        invisible(parallel::mccollect(job))
output:
  result:
    content:
      - type: text
        text: "[done]"
    isError: false
...
