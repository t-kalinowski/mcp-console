---
!same-as tests/transcripts/golden/server/initializes_and_lists_tools.yaml
---
id: 3
send:
  r: |
    options(
      console.plot.width = 4,
      console.plot.height = 3,
      console.plot.dpi = 100
    )
    local({
      draw <- function(color, label) {
        grid::grid.newpage(recording = FALSE)
        grid::grid.rect(gp = grid::gpar(fill = color))
        grid::grid.text(label)
      }
      draw("red", "A1")
      device_a <- grDevices::dev.cur()
      grDevices::dev.new()
      draw("blue", "B1")
      device_b <- grDevices::dev.cur()
      grDevices::dev.set(device_a)
      draw("green", "A2")
      grDevices::dev.set(device_b)
      draw("purple", "B2")
      invisible(grDevices::dev.off())
      grDevices::dev.set(device_a)
      invisible(grDevices::dev.off())
    })
result:
  content:
    - type: image
      data: <PNG byte-identical to live Rscript page 1>
      mimeType: image/png
    - type: image
      data: <PNG byte-identical to live Rscript page 2>
      mimeType: image/png
    - type: image
      data: <PNG byte-identical to live Rscript page 3>
      mimeType: image/png
    - type: image
      data: <PNG byte-identical to live Rscript page 4>
      mimeType: image/png
  isError: false
...
