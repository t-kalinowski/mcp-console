---
!same-as tests/transcripts/golden/server/initializes_and_lists_tools.yaml
---
id: 3
session:
  action: prepare
  requirements:
    r:
      - later
result:
  content:
    - type: text
      text: "[prepared]"
  isError: false
---
id: 4
send:
  r: |
    callback_gate <- tempfile("mcp-console-callback-gate-")
    callback_checkpoint <- tempfile("mcp-console-callback-checkpoint-")
    run_callback <- function() {
      if (!file.exists(callback_gate)) {
        later::later(run_callback, delay = 0)
        return(invisible(NULL))
      }
      cat("direct callback waiting")
      connection <- suppressWarnings(file("/dev/stdin"))
      on.exit(close(connection))
      stopifnot(file.create(callback_checkpoint))
      readLines(connection, n = 1)
      cat("direct callback released\n")
    }
    later::later(run_callback, delay = 0)
    cat(callback_gate, callback_checkpoint, sep = "\n")
result:
  content:
    - type: text
      text: |-
        <worker callback gate>
        <worker callback checkpoint>
  isError: false
---
id: 5
send:
  r: cat("direct stdin cell ran\n")
  timeout_ms: 30000
result:
  content:
    - type: text
      text: |-
        direct callback waitingdirect callback released
        [stopped by session restart request before evaluation finished]
        [worker stopped: in-memory state lost]
  isError: true
---
id: 6
session:
  action: restart
result:
  content:
    - type: text
      text: |-
        [active evaluation stopped by session restart request]
        [worker stopped: in-memory state lost]
        [starting new worker]
        [idle]
  isError: false
...
