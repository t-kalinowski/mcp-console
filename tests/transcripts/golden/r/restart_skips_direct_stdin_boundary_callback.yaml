---
!same-as tests/transcripts/golden/server/initializes_and_lists_tools.yaml
---
id: 3
send:
  r: |
    dyn.load("./mcp_test_input_handler.so")
    invisible(.Call(
      "mcp_test_register_input_handler",
      file.path(tempdir(), "direct-stdin-boundary-fifo"),
      function() {
        cat("direct callback waiting")
        connection <- suppressWarnings(file("/dev/stdin"))
        on.exit(close(connection))
        readLines(connection, n = 1)
        cat("direct callback released\n")
      }
    ))
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
id: 4
send:
  r: cat("direct stdin cell ran\n")
  timeout_ms: 1000
result:
  content:
    - type: text
      text: |-
        direct callback waiting
        [running]
  isError: false
---
id: 5
session:
  action: restart
result:
  content:
    - type: text
      text: |-
        direct callback released
        [active evaluation stopped by session restart request]
        [worker stopped: in-memory state lost]
        [starting new worker]
        [idle]
  isError: false
...
