---
handshake: elided
---
id: 3
send:
  r: |-
    invisible(addTaskCallback(
      local({
        first <- TRUE
        function(expr, ...) {
          if (first) {
            first <<- FALSE
            return(TRUE)
          }
          cat(deparse1(expr), "\n", sep = "")
          FALSE
        }
      }),
      name = "mcp-console-test"
    ))
    mcp_console_callback_probe <- 42
output:
  result:
    content:
      - type: text
        text: |
          mcp_console_callback_probe <- 42
    isError: false
---
id: 4
send:
  r: |-
    warning("careful", call. = FALSE)
    invisible(42)
    cat("last value: ", identical(base::.Last.value, 42), "\n", sep = "")
output:
  result:
    content:
      - type: text
        text: |
          Warning message:
          careful 
          last value: TRUE
    isError: false
...
