      name: mcp-console
      version: 0.1.0
---
input:
  method: notifications/initialized
---
id: 2
input:
  method: tools/list
output:
  result:
    tools:
      - name: send
        description: "Evaluate one complete R code cell in persistent state. Stdin may accompany the cell or follow an [input] response."
        inputSchema:
          $schema: "https://json-schema.org/draft/2020-12/schema"
          additionalProperties: false
          type: object
          properties:
            r:
              description: Complete multiline R code evaluated in persistent state.
              type:
                - string
                - "null"
            stdin:
              description: "Exact text for this cell's first input request or an active [input] prompt."
              type:
                - string
                - "null"
---
id: 3
input:
  method: tools/call
  params:
    name: send
    arguments:
      r: |-
        answer <- 42
        answer + (
output:
  result:
    content:
      - type: text
        text: |
          Error: Incomplete code
    isError: false
