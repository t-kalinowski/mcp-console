---
id: 1
input:
  method: initialize
  params:
    protocolVersion: 2025-11-25
    capabilities: {}
    clientInfo:
      name: acceptance-test
      version: 1.0.0
output:
  result:
    protocolVersion: 2025-11-25
    capabilities:
      tools: {}
    serverInfo:
      name: mcp-console
      version: 0.1.0
---
input:
  method: notifications/initialized
---
id: 2
input:
  method: tools/list
output:
  result:
    tools:
      - name: send
        description: >-
          Persistent R console. Send one complete r cell, or send stdin after the
          response ends with [input].
        inputSchema:
          $schema: https://json-schema.org/draft/2020-12/schema
          additionalProperties: false
          type: object
          properties:
            r:
              description: Complete multiline R code evaluated as top-level expressions.
              type:
                - string
                - "null"
            stdin:
              description: Exact text supplied after R requests interactive input.
              type:
                - string
                - "null"
---
id: 3
input:
  method: tools/call
  params:
    name: send
    arguments:
      r: |-
        answer <- 40
        answer + 1
        answer + 2
        cat("done\n")
        invisible(99)
output:
  result:
    content:
      - type: text
        text: |
          [1] 41
          [1] 42
          done
    isError: false
---
id: 4
input:
  method: tools/call
  params:
    name: send
    arguments:
      r: |-
        identical(
          as.vector(splines::splineDesign(
            knots = c(0, 0, 0, 0, 1, 1, 1, 1),
            x = 0.5
          )),
          c(0.125, 0.375, 0.375, 0.125)
        )
output:
  result:
    content:
      - type: text
        text: |
          [1] TRUE
    isError: false
---
id: 5
input:
  method: tools/call
  params:
    name: send
    arguments:
      r: silent <- 1
output:
  result:
    content:
      - type: text
        text: "[done]"
    isError: false
---
id: 6
input:
  method: tools/call
  params:
    name: send
    arguments:
      r: |-
        job <- parallel::mcparallel(cat("forked output\n"))
        invisible(parallel::mccollect(job))
output:
  result:
    content:
      - type: text
        text: "[done]"
    isError: false
...
