---
!same-as tests/transcripts/golden/server/initializes_and_lists_tools.yaml
---
id: 3
session:
  action: prepare
  requirements:
    r:
      - later
result:
  content:
    - type: text
      text: "[prepared]"
  isError: false
---
id: 4
send:
  r: |
    callback_gate <- tempfile("mcp-console-callback-gate-")
    callback_checkpoint <- tempfile("mcp-console-callback-checkpoint-")
    run_callback <- function() {
      if (!file.exists(callback_gate)) {
        later::later(run_callback, delay = 0.01)
        return(invisible(NULL))
      }
      stopifnot(file.create(callback_checkpoint))
      collected_answer <<- readline("later> ")
    }
    later::later(run_callback, delay = 0.01)
    cat(callback_gate, callback_checkpoint, sep = "\n")
result:
  content:
    - type: text
      text: |-
        <worker callback gate>
        <worker callback checkpoint>
  isError: false
---
id: 5
send:
  timeout_ms: 100
result:
  content:
    - type: text
      text: |-
        [input requested: "later> "]
        [stdin needed]
  isError: false
---
id: 6
send:
  stdin: |
    yes
  timeout_ms: 3000
result:
  content:
    - type: text
      text: "\n[idle]"
  isError: false
---
id: 7
send:
  r: collected_answer
result:
  content:
    - type: text
      text: |
        [1] "yes"
  isError: false
...
