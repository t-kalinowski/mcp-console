---
!same-as tests/transcripts/golden/server/initializes_and_lists_tools.yaml
---
id: 3
send:
  r: |
    options(
      console.plot.width = 4,
      console.plot.height = 3,
      console.plot.dpi = 100
    )
    cat("before plots\n")
    plot(1:3)
    cat("between plots\n")
    grid::grid.newpage()
    grid::grid.lines(c(0.1, 0.9), c(0.1, 0.9))
    cat("after plots\n")
result:
  content:
    - type: text
      text: |
        before plots
    - type: image
      data: <PNG byte-identical to live Rscript page 1>
      mimeType: image/png
    - type: text
      text: |
        between plots
    - type: image
      data: <PNG byte-identical to live Rscript page 2>
      mimeType: image/png
    - type: text
      text: |
        after plots
  isError: false
---
id: 4
send:
  r: lines(1:3)
result:
  content:
    - type: text
      text: |
        Error: plot.new has not been called yet
  isError: false
---
id: 5
send:
  r: plot(3:1)
result:
  content:
    - type: image
      data: <PNG byte-identical to live Rscript page 1>
      mimeType: image/png
  isError: false
...
