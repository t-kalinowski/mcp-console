id: 3
send:
  r: |
    python_interrupt_r_forever <- function() {
      invisible(file.create(file.path(
        tempdir(),
        "python-r-call-interrupt-started"
      )))
      repeat {}
    }
    invisible(suppressMessages(base::trace(
      "py_eval",
      tracer = quote({
        invisible(file.create(file.path(
          tempdir(),
          "python-r-interrupt-started"
        )))
        repeat {}
      }),
      print = FALSE,
      where = asNamespace("reticulate")
    )))
result:
  content:
    - type: text
      text: "[done]"
  isError: false
