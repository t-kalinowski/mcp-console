id: 12
send:
  python: |
    import os
    from pathlib import Path

    try:
        Path(
            os.environ["TMPDIR"],
            "python-caught-interrupt-started",
        ).touch()
        while True:
            pass
    except KeyboardInterrupt:
        print("Caught Python interrupt; ", end="")
    finally:
        print("Running Python finally; ", end="")

    print("Python continued")
  timeout_ms: 0
result:
  content:
    - type: text
      text: |-

        [running]
  isError: false
