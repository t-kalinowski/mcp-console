---
!same-as tests/transcripts/golden/server/initializes_and_lists_tools.yaml
---
id: 3
send:
  r: |
    worker_pid <- Sys.getpid()
    worker_marker <- 42L
    stopifnot(!"reticulate" %in% loadedNamespaces())
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
id: 4
session:
  action: prepare
  requirements:
    python:
      - not a valid requirement !!!
result:
  content:
    - type: text
      text: |-
        managed Python resolution failed:
        resolver input:
        {
          "python": "3.12.x (reticulate default)",
          "packages": [
            "numpy",
            "not a valid requirement !!!"
          ]
        }
        uv output:
        error: Failed to parse: `not a valid requirement !!!`
          Caused by: Expected one of `@`, `(`, `<`, `=`, `>`, `~`, `!`, `;`, found `a`
        not a valid requirement !!!
            ^
  isError: true
---
id: 5
send:
  r: |
    stopifnot(
      identical(Sys.getpid(), worker_pid),
      identical(worker_marker, 42L),
      !reticulate::py_available(initialize = FALSE),
      !"not a valid requirement !!!" %in% reticulate::py_require()$packages
    )
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
id: 6
session:
  action: prepare
  requirements:
    python:
      - py-yaml12
result:
  content:
    - type: text
      text: "[prepared]"
  isError: false
---
id: 7
send:
  r: |
    stopifnot(
      identical(Sys.getpid(), worker_pid),
      identical(worker_marker, 42L),
      !reticulate::py_available(initialize = FALSE),
      "py-yaml12" %in% reticulate::py_require()$packages
    )
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
id: 8
send:
  python: import yaml12; (r.worker_marker, yaml12.__name__)
result:
  content:
    - type: text
      text: |
        (42, 'yaml12')
  isError: false
...
