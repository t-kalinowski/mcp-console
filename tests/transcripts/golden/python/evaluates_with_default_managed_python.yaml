---
!same-as tests/transcripts/golden/server/initializes_and_lists_tools.yaml
---
id: 3
send:
  r: |
    python <- Sys.getenv("RETICULATE_PYTHON", unset = NA_character_)
    config <- reticulate::py_config()
    history <- reticulate::py_require()$history
    stopifnot(
      identical(python, "managed"),
      file.exists(config$python),
      isTRUE(config$ephemeral),
      !any(vapply(
        history,
        function(request) identical(request$requested_from, "base"),
        logical(1L)
      ))
    )
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
id: 4
send:
  python: |
    40 + 2
result:
  content:
    - type: text
      text: |
        42
  isError: false
...
