---
!same-as tests/transcripts/golden/server/initializes_and_lists_tools.yaml
---
id: 3
send:
  r: |-
    invisible(reticulate::py_config())
    invisible(reticulate::py_require("py-yaml12"))
    stopifnot(reticulate::py_module_available("yaml12"))
    tools::pskill(Sys.getpid(), signal = 9L)
result:
  content:
    - type: text
      text: |-
        [worker sideband read failed: worker sideband closed]
        [worker stopped: in-memory state lost]
  isError: true
---
id: 4
send:
  r: |
    worker_pid <- Sys.getpid()
    "py-yaml12" %in% reticulate::py_require()$packages
result:
  content:
    - type: text
      text: |
        [starting new worker]
        [1] FALSE
  isError: false
---
id: 5
session:
  action: prepare
  requirements:
    python:
      - py-yaml12
result:
  content:
    - type: text
      text: "[prepared]"
  isError: false
---
id: 6
send:
  r: |
    identical(Sys.getpid(), worker_pid) && !reticulate::py_available(FALSE)
result:
  content:
    - type: text
      text: |
        [1] TRUE
  isError: false
---
id: 7
send:
  python: |
    import yaml12

    yaml12.__name__
result:
  content:
    - type: text
      text: |
        'yaml12'
  isError: false
...
