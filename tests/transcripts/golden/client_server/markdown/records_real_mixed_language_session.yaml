---
!same-as tests/transcripts/golden/client_server/server/initializes_and_lists_tools.yaml
---
send:
  r: |
    options(
      console.plot.width = 4,
      console.plot.height = 3,
      console.plot.dpi = 100
    )
    measurements <- data.frame(
      label = c("a", "b"),
      value = c(2L, 5L)
    )
    plot(measurements$value, type = "b")
result:
  content:
    - type: image
      data: <PNG byte-identical to live Rscript page 1>
      mimeType: image/png
  isError: false
---
send:
  python: |
    int(r.measurements["value"].sum())
result:
  content:
    - type: text
      text: |
        7
  isError: false
---
send:
  sql: |
    SELECT label, value * 10 AS scaled
    FROM measurements
    ORDER BY label
result:
  content:
    - type: text
      text: |
        # A tibble: 2 × 2
          label     scaled
          <string> <int32>
        1 "a"           20
        2 "b"           50
  isError: false
