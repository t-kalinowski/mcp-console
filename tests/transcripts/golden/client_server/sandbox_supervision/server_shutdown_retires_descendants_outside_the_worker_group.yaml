---
!same-as tests/transcripts/golden/client_server/server/initializes_and_lists_tools.yaml
---
send:
  r: |
    sandbox_child <- processx::process$new(
      "/bin/sleep",
      "60",
      stdout = "|",
      stderr = "|",
      cleanup = FALSE
    )
    sandbox_child$get_pid()
  requirements:
    r:
      - processx
result:
  content:
    - type: text
      text: |
        [1] <processx child pid>
  isError: false
...
