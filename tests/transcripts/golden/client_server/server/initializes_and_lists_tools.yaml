input:
  method: tools/list
result:
  tools:
    - name: send
      description: |-
        Persistent mixed-language computational workbench. Use it whenever exact computation or direct inspection would improve accuracy—from arithmetic, string counting, parsing, and file or binary-data inspection to data wrangling, exploratory analysis, visualization, statistics, simulation, and model training or tuning. Choose the clearest language for each step and switch freely between calls. The default R environment includes tidyverse, reticulate, DBI, and duckdb, together with their full dependency sets, such as ggplot2, dplyr, readr, and jsonlite. The built-in managed Python environment includes NumPy and pandas. DuckDB SQL is also available. State persists across calls. Python reads R globals through `r.name`; R reads Python globals through `py$name`; SQL queries R data frames by name; R accesses the DuckDB catalog through `sql_connection()`. Language-native help and introspection are available. In the built-in worker, R package namespaces are resolved on demand when an R cell first uses a missing plain CRAN package through `library()`, `require()`, `requireNamespace()`, `loadNamespace()`, `::`, or `:::`. Treat CRAN packages as available and use the packages best suited to the task; do not probe for installation or call `install.packages()`. Resolution is typically fast, especially after first use, because environments and package installations are cached. Resolution begins only when execution reaches one of those operations; R source is not scanned in advance. Resolution makes a package available but attaches it only through the user's original `library()` or `require()` call; `pkg::fun()` loads only its namespace, as usual. Use `requirements.r` only to stage packages ahead of time or provide an explicit IR reference such as a non-CRAN source. In the built-in managed Python environment, missing imports are resolved on demand. A curated mapping handles well-known differences between import names and PyPI distribution names; otherwise MCP Console assumes the distribution name matches the top-level module. Import the packages best suited to the task instead of probing availability or running pip. Resolution begins only when execution reaches the import; Python source is not scanned in advance. Preparation does not itself import a package; the original import continues normally. Successful automatic R and Python additions are cached, retained across cells, and reused after restart. Automatic Python imports infer only bare distribution names. Use `requirements.python` when the distribution differs from the inferred name, when a version, extra, or environment marker is needed, when an error asks for an exact requirement, or when the package should be prepared before the cell. Explicit `requirements.python` accepts supported named PEP 508 registry requirements. Explicit preparation does not load, import, or attach packages or extensions. If you use a user-selected Python environment, import packages already installed there directly. R default-device plots and open `matplotlib.pyplot` figures return as PNG images. Send exactly one complete `r`, `python`, or `sql` cell. Call `send` sequentially; concurrent calls are unsupported. Use `stdin` for interactive reads or debugger commands; omit code and stdin to poll an active evaluation or immediately collect output produced while the worker is idle. A wait timeout applies after a cell is dispatched and does not stop computation. Explicit requirement preparation happens first and can make the complete call take longer. Runtime R and Python import resolution are part of the running evaluation, so the wait can return `[running]` while a resolver continues; `session(action = "interrupt")` targets that resolver. Running work must be collected before new code is sent. R errors, Python exceptions, and DuckDB errors are ordinary console output, so inspect result text and continue or correct the cell. Evaluated code can read host files but cannot directly access the network and can write only within the worker's private temporary directory. Automatic R resolution and managed Python resolution, whether triggered by Python imports or evaluated R code, are host-side exceptions: they may access the network and execute installation or build code, so use only trusted packages. Automatic R discovery and Python import inference accept only plain names; use explicit requirements for other supported metadata. Managed Python version requests accept version numbers and supported PEP 440 comparison specifiers, not interpreter selectors. Python resolution uses the server's startup configuration; changes to `UV_*` made by evaluated code do not configure it. Starting the server with a nonempty user-selected `RETICULATE_PYTHON` disables automatic and explicit managed Python additions; install packages into that environment or restart with managed Python enabled. Package availability and system compatibility can still produce ordinary installation or load errors.
      inputSchema:
        $schema: https://json-schema.org/draft/2020-12/schema
        additionalProperties: false
        type: object
        properties:
          r:
            description: |-
              Complete multiline R cell evaluated in persistent global state. The default R environment
              includes tidyverse, reticulate, DBI, duckdb, and their full dependency sets, such as ggplot2,
              dplyr, readr, and jsonlite. Use other CRAN packages directly through `library()`, `require()`,
              `requireNamespace()`, `loadNamespace()`, `::`, or `:::`; the built-in worker resolves missing
              plain package names on demand and retains successful additions. Resolution makes a package
              available but does not attach it except through the original `library()` or `require()` call;
              `pkg::fun()` loads only the namespace as usual. Do not probe package availability or call
              `install.packages()`. Read
              Python globals through `py$name`; for example,
              `df <- tibble::as_tibble(py$df)`. R data frames are directly queryable by name from later SQL
              cells. Access DuckDB tables and views through the borrowed `sql_connection()` with DBI or
              dplyr; do not disconnect it. Default-device plots return as PNG images. Keep all drawing
              operations for one plot in the same cell. Set persistent dimensions with
              `options(console.plot.width = ..., console.plot.height = ..., console.plot.dpi = ...)`;
              width and height are in inches. Omit to send stdin or poll.
            type:
              - string
              - "null"
          python:
            description: |-
              Complete multiline Python cell evaluated in persistent `__main__` state; its final expression
              is displayed. The built-in managed Python environment includes NumPy and pandas. Import other
              packages directly. When an import is missing, the built-in worker resolves a PyPI distribution
              on demand, using a curated mapping for well-known import/distribution differences and otherwise
              assuming the distribution matches the top-level module. Successful additions are retained
              across cells and restart. Python source is not scanned; resolution starts only when execution
              reaches the import, and preparation does not itself import the package. Use
              `requirements.python` when exact distribution metadata is needed or automatic inference asks
              for it. A user-selected Python environment disables both automatic resolution and managed
              requirements; install packages into that environment or restart with managed Python enabled.
              Read R globals and call R functions through `r.name`; for example,
              `frame = r.df`. Return Python globals to R through `py$name`. Python data frames are not
              automatically visible to SQL; bind them to an R name first. At cell end, including after a
              Python error, every open `matplotlib.pyplot` figure returns once as a PNG image and is closed.
              `show()` is optional. R plots called through `r` follow the R plot rules. Omit to send stdin or
              poll.
            type:
              - string
              - "null"
          sql:
            description: |-
              Complete DuckDB SQL cell evaluated in the persistent catalog. Use it for filtering, joins,
              aggregation, and tabular inspection. An unqualified relation name can query a data frame in R
              global state; a DuckDB table or view with the same name takes precedence. Query results return
              a bounded preview. Use `SHOW TABLES`, `DESCRIBE`, `SUMMARIZE`, and `EXPLAIN` for discovery.
              DuckDB CLI dot commands are not supported. Omit to send stdin or poll.
            type:
              - string
              - "null"
          requirements:
            description: |-
              Additive R packages, Python packages, or DuckDB extensions to prepare before this cell and
              retain for later cells. Preparation does not import, attach, or load them. Ordinary CRAN
              packages used by the built-in R worker need not be declared here; use `requirements.r` to
              stage packages ahead of evaluation or provide explicit IR references. In the built-in managed
              Python environment, missing imports normally resolve at runtime. Use `requirements.python` to
              stage a distribution before the cell, provide a version, extra, or marker, or correct automatic
              inference. Python source is not pre-scanned, and SQL does not trigger package discovery. The
              cell is not run if explicit preparation fails or further changes require restart. Resolution
              runs outside the worker sandbox and may download packages or extensions or execute installation
              or build code on the host. Use only trusted requirements. This field requires one `r`, `python`,
              or `sql` cell.
            type:
              - object
              - "null"
            properties:
              duckdb:
                description: |-
                  Additive DuckDB extension names for `send`, `prepare`, or `restart`, for example `fts`,
                  `spatial`, or `excel`. JSON and ICU are already prepared for built-in workers. Names must
                  start with a lowercase ASCII letter and contain only lowercase ASCII letters, digits, and
                  underscores. The host resolver uses DuckDB's own `INSTALL` outside the sandbox, with
                  DuckDB's default extension repository and native cache. Preparation does not load extension
                  code; `LOAD` and automatic loading happen later inside the sandbox.
                type: array
                items:
                  type: string
                  minLength: 1
                  maxLength: 64
                maxItems: 64
                default: []
              r:
                description: |-
                  Additive, single-line IR package references for `send`, `prepare`, or `restart`, for example
                  `data.table`, `sf`, or `yaml12`. Use this field to stage packages ahead of evaluation or supply
                  an explicit supported remote IR reference. Automatic R discovery accepts only plain package
                  names. An idle worker that implements R preparation can add requirements without losing live
                  state. Local package sources are rejected because resolution runs with server permissions.
                type: array
                items:
                  type: string
                  minLength: 1
                maxItems: 64
                default: []
              python:
                description: |-
                  Additive, named PEP 508 registry requirements for `send`, `prepare`, or `restart`, for example
                  `polars>=1`, `scikit-learn`, or `matplotlib; python_version >= '3.10'`. Use explicit
                  requirements when automatic import inference needs a different distribution, a version, an
                  extra, or an environment marker, or when the distribution should be prepared before the cell.
                  Automatic imports infer bare distribution names only. Paths, file URLs, editable requirements,
                  direct references, local archives, and local projects are rejected. Preparation does not import
                  the package. An idle server-managed worker may activate compatible additions without losing
                  state. A nonempty user-selected `RETICULATE_PYTHON` disables automatic resolution and managed
                  Python requirements.
                type: array
                items:
                  type: string
                  minLength: 1
                maxItems: 64
                default: []
            additionalProperties: false
          stdin:
            description: |-
              Text for interactive reads and debugger commands such as R `readline()` or `browser()` and
              Python `input()`, `breakpoint()`, or `pdb`. Its UTF-8 encoding is queued exactly; no newline is
              added. When sent with a cell, requirement preparation completes first, then nonempty text is
              queued before the code is run; an already waiting interactive read may consume it before the
              new cell begins. Empty text queues nothing. Send it on its own while the console is running or
              idle. If output ends in `[stdin needed]`, send the requested input here. Unread text can satisfy
              later reads and is discarded by restart.
            type:
              - string
              - "null"
          timeout_ms:
            description: |-
              Maximum time this call waits once the cell has been dispatched, including one automatic
              worker replacement attempt. Requirement preparation happens first and may make the complete
              call take longer. Automatic R and Python import resolution are part of the running evaluation
              and count toward this wait. On expiry, the call returns available output followed by the
              current state, such as `[running]` or `[worker starting]`, without stopping the computation or
              startup. Poll by calling `send` again without `r`, `python`, `sql`, or `stdin`.
            type: integer
            format: uint64
            minimum: 0
            default: 60000
    - name: session
      description: >-
        Make additional R or Python packages and DuckDB extensions available,
        request SIGINT for an active host resolver or otherwise send it to the
        live worker, or restart the persistent console session. The built-in
        worker prepares DuckDB's JSON and ICU extensions by default. In the
        built-in worker, ordinary plain CRAN packages resolve automatically when
        used by R, and missing Python imports resolve automatically in the
        server-managed environment. Import appropriate Python packages directly.
        Use `prepare` to stage R packages ahead of a cell, supply explicit IR
        references such as supported remote sources, add DuckDB extensions, or
        prepare an exact Python distribution, version, extra, or marker before a
        cell. Preparation does not import, attach, or load packages or
        extensions. An idle worker can add R requirements or DuckDB extensions
        without losing live state; compatible Python additions require a
        server-managed worker. Requirements and successfully activated automatic
        R and Python additions are additive, idempotent, and persist across
        restart. After a recoverable live preparation or automatic R activation
        failure, evaluation remains available so state can be saved, but new
        requirement additions require restart. Automatic Python imports infer
        bare distribution names only. Explicit managed Python additions accept
        named PEP 508 registry requirements; paths, file URLs, editable
        requirements, direct references, local archives, and local projects are
        rejected. Managed Python resolution uses the server's startup `UV_*`
        configuration, which evaluated code cannot change. A nonempty
        user-selected `RETICULATE_PYTHON` disables automatic resolution and
        managed Python requirements. `interrupt` returns after targeting an
        active automatic R or Python resolver, another host resolver, or the
        live worker; user code may catch or delay it. `restart` may optionally
        add R, Python, and DuckDB requirements, then replaces the worker and
        loses all in-memory R, Python, and SQL state, debugger state, and unread
        stdin. Requirement resolution runs outside the execution sandbox and may
        download packages or extensions or execute package installation or build
        code on the host; use only trusted requirements. Automatic R discovery
        accepts only plain package names; use explicit `requirements.r` for
        other IR references. Use explicit `requirements.python` when exact
        distribution metadata is needed or automatic inference reports that it
        cannot recover safely.
      inputSchema:
        $schema: https://json-schema.org/draft/2020-12/schema
        required:
          - action
        type: object
        properties:
          action:
            description: |-
              `prepare` adds R or Python requirements or DuckDB extensions before a worker starts.
              After startup, it can add R requirements or DuckDB extensions while the worker is idle;
              compatible Python additions require a server-managed worker. `interrupt` requests SIGINT for
              an active host resolver, or otherwise sends it to the live worker. `restart` can add any of
              the same requirements before it replaces the worker and starts it if needed.
            type: string
            enum:
              - prepare
              - interrupt
              - restart
          requirements:
            description: |-
              Additive packages or DuckDB extensions to make available. `prepare` requires at least one R,
              Python, or DuckDB entry. `interrupt` accepts no requirements. `restart` accepts the same
              additions; omit `requirements` to restart unchanged. Requirements persist across restart but
              do not import, attach, or load packages or extensions. Successfully activated automatic R and
              Python additions also persist across restart. After a recoverable live preparation or automatic
              R activation failure, evaluation remains available so state can be saved, but new requirement
              additions return `[restart required]` until restart. Resolution runs outside the worker sandbox
              and may download packages or extensions or execute package installation or build code on the
              host. Managed Python uses the server's startup resolver configuration; evaluated code cannot
              configure that host resolver. Managed Python resolution, startup, and Matplotlib cache warming
              may also execute selected code on the host; use only trusted requirements.
            type:
              - object
              - "null"
            properties:
              duckdb:
                description: |-
                  Additive DuckDB extension names for `send`, `prepare`, or `restart`, for example `fts`,
                  `spatial`, or `excel`. JSON and ICU are already prepared for built-in workers. Names must
                  start with a lowercase ASCII letter and contain only lowercase ASCII letters, digits, and
                  underscores. The host resolver uses DuckDB's own `INSTALL` outside the sandbox, with
                  DuckDB's default extension repository and native cache. Preparation does not load extension
                  code; `LOAD` and automatic loading happen later inside the sandbox.
                type: array
                items:
                  type: string
                  minLength: 1
                  maxLength: 64
                maxItems: 64
                default: []
              r:
                description: |-
                  Additive, single-line IR package references for `send`, `prepare`, or `restart`, for example
                  `data.table`, `sf`, or `yaml12`. Use this field to stage packages ahead of evaluation or supply
                  an explicit supported remote IR reference. Automatic R discovery accepts only plain package
                  names. An idle worker that implements R preparation can add requirements without losing live
                  state. Local package sources are rejected because resolution runs with server permissions.
                type: array
                items:
                  type: string
                  minLength: 1
                maxItems: 64
                default: []
              python:
                description: |-
                  Additive, named PEP 508 registry requirements for `send`, `prepare`, or `restart`, for example
                  `polars>=1`, `scikit-learn`, or `matplotlib; python_version >= '3.10'`. Use explicit
                  requirements when automatic import inference needs a different distribution, a version, an
                  extra, or an environment marker, or when the distribution should be prepared before the cell.
                  Automatic imports infer bare distribution names only. Paths, file URLs, editable requirements,
                  direct references, local archives, and local projects are rejected. Preparation does not import
                  the package. An idle server-managed worker may activate compatible additions without losing
                  state. A nonempty user-selected `RETICULATE_PYTHON` disables automatic resolution and managed
                  Python requirements.
                type: array
                items:
                  type: string
                  minLength: 1
                maxItems: 64
                default: []
            additionalProperties: false
        additionalProperties: false
