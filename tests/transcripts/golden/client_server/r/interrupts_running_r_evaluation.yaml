---
!same-as tests/transcripts/golden/client_server/server/initializes_and_lists_tools.yaml
---
id: 3
send:
  r: |
    interrupt_state <- 41L
    invisible(file.create(file.path(
      tempdir(),
      "r-interrupt-started"
    )))
    repeat {}
  timeout_ms: 0
result:
  content:
    - type: text
      text: |-

        [running]
  isError: false
---
id: 4
session:
  action: interrupt
result:
  content:
    - type: text
      text: "[interrupt sent]"
  isError: false
---
id: 5
send:
  timeout_ms: 3000
result:
  content:
    - type: text
      text: "\n"
  isError: false
---
id: 6
send:
  r: interrupt_state + 1L
result:
  content:
    - type: text
      text: |
        [1] 42
  isError: false
---
id: 7
send:
  r: |
    dyn.load("./mcp_test_input_handler.so")
    invisible(.Call(
      "mcp_test_register_input_handler",
      file.path(tempdir(), "input-handler-fifo"),
      function() {
        invisible(file.create(file.path(
          tempdir(),
          "r-boundary-interrupt-started"
        )))
        on.exit(boundary_interrupt_cleanup <<- TRUE)
        repeat {}
      }
    ))
    boundary_interrupt_state <- 42L
    writer <- fifo(
      file.path(tempdir(), "input-handler-fifo"),
      open = "wb"
    )
    writeBin(as.raw(1), writer)
    close(writer)
  timeout_ms: 0
result:
  content:
    - type: text
      text: |-

        [running]
  isError: false
