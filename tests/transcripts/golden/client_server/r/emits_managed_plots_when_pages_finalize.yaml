---
!same-as tests/transcripts/golden/client_server/server/initializes_and_lists_tools.yaml
---
send:
  r: |
    options(
      console.plot.width = 4,
      console.plot.height = 3,
      console.plot.dpi = 100
    )
    local({
      plot(1:3)
      plot(3:1)
      cat("after first page finalized\n")
    })
result:
  content:
    - type: image
      data: <PNG byte-identical to live Rscript page 1>
      mimeType: image/png
    - type: text
      text: |
        after first page finalized
    - type: image
      data: <PNG byte-identical to live Rscript page 2>
      mimeType: image/png
  isError: false
...
