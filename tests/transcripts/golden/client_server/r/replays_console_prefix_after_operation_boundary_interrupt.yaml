---
!same-as tests/transcripts/golden/client_server/server/initializes_and_lists_tools.yaml
---
send:
  r: |
    dyn.load("./mcp_test_input_handler.so")
    tryCatch(
      .Call(
        "mcp_test_read_console_line",
        "small callbacks> "
      ),
      interrupt = function(condition) {
        cat("caught later-callback interrupt\n")
      }
    )
  stdin: part
result:
  content:
    - type: text
      text: |-
        [input requested: "small callbacks> "]
        [input requested: "small callbacks> "]
        [waiting for stdin]
  isError: false
---
session:
  action: interrupt
result:
  content:
    - type: text
      text: "[interrupt sent]"
  isError: false
---
send:
  timeout_ms: 3000
result:
  content:
    - type: text
      text: |
        caught later-callback interrupt
  isError: false
---
send:
  r: readline("after later callback> ")
  stdin: |
    !
result:
  content:
    - type: text
      text: |
        [input requested: "after later callback> "]
        [1] "part!"
  isError: false
---
send:
  r: |
    tryCatch(
      {
        partial <- .Call(
          "mcp_test_read_console_once",
          "between callbacks> "
        )
        stopifnot(nchar(partial, type = "bytes") == 3L)
        invisible(file.create(file.path(
          tempdir(),
          "between-console-callbacks-started"
        )))
        repeat {}
      },
      interrupt = function(condition) {
        cat("caught between-callback interrupt\n")
      }
    )
result:
  content:
    - type: text
      text: |-
        [input requested: "between callbacks> "]
        [waiting for stdin]
  isError: false
---
send:
  stdin: xxxxxx
  timeout_ms: 50
result:
  content:
    - type: text
      text: |-

        [running; poll with an empty send]
  isError: false
---
session:
  action: interrupt
result:
  content:
    - type: text
      text: "[interrupt sent]"
  isError: false
---
send:
  timeout_ms: 3000
result:
  content:
    - type: text
      text: |
        caught between-callback interrupt
  isError: false
---
send:
  r: identical(readline("after boundary> "), paste0(strrep("x", 6), "!"))
  stdin: |
    !
result:
  content:
    - type: text
      text: |
        [input requested: "after boundary> "]
        [1] TRUE
  isError: false
...
