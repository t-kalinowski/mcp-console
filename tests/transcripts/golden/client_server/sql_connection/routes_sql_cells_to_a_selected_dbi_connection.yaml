---
!same-as tests/transcripts/golden/client_server/server/initializes_and_lists_tools.yaml
---
send:
  sql: |
    CREATE TABLE managed_values AS SELECT CAST(42 AS INTEGER) AS value
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  r: |
    custom_connection <- DBI::dbConnect(
      RSQLite::SQLite(),
      ":memory:"
    )
    console_sql_connection(custom_connection)
    cat(
      "selected: ", identical(sql_connection(), custom_connection), "\n",
      "valid: ", DBI::dbIsValid(console_sql_connection()), "\n",
      sep = ""
    )
  requirements:
    r:
      - RSQLite
result:
  content:
    - type: text
      text: |
        selected: TRUE
        valid: TRUE
  isError: false
---
send:
  sql: |
    CREATE TABLE custom_values (label TEXT NOT NULL, value INTEGER NOT NULL)
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  sql: |
    INSERT INTO custom_values VALUES ('a', 2), ('b', 5)
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  sql: |
    -- The selected DBI backend handles this query.
    SELECT label, value
    FROM custom_values
    ORDER BY label
result:
  content:
    - type: text
      text: |
        # A tibble: 2 × 2
          label      value
          <string> <int32>
        1 "a"            2
        2 "b"            5
  isError: false
---
send:
  sql: |
    INSERT INTO custom_values VALUES ('c', 11) RETURNING label, value
result:
  content:
    - type: text
      text: |
        # A tibble: 1 × 2
          label      value
          <string> <int32>
        1 "c"           11
  isError: false
---
send:
  r: |
    selected <- console_sql_connection()
    console_sql_connection(NULL)
    cat(
      "restored: ", !identical(sql_connection(), selected), "\n",
      sep = ""
    )
    invisible(DBI::dbDisconnect(selected))
result:
  content:
    - type: text
      text: |
        restored: TRUE
  isError: false
---
send:
  sql: |
    SELECT value FROM managed_values
result:
  content:
    - type: text
      text: |
        # A tibble: 1 × 1
            value
          <int32>
        1      42
  isError: false
...
