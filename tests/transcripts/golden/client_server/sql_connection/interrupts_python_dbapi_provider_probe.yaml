---
!same-as tests/transcripts/golden/client_server/server/initializes_and_lists_tools.yaml
---
send:
  r: |
    probe_started <- tempfile("mcp-console-sql-probe-started-")
    Sys.setenv(MCP_CONSOLE_SQL_PROBE_STARTED = probe_started)
    cat(probe_started)
result:
  content:
    - type: text
      text: <probe started>
  isError: false
---
send:
  python: |
    import os
    import signal
    import sys


    class ProbeConnection:
        description = (("answer",),)

        def cursor(self):
            return self

        def execute(self, source):
            return self

        def fetchmany(self, size):
            return [(42,)][:size]


    def pause_provider_probe(frame, event, argument):
        if event == "call" and frame.f_globals.get("__name__") == "_mcp_console_sql":
            sys.settrace(None)
            with open(
                os.environ["MCP_CONSOLE_SQL_PROBE_STARTED"],
                "wb",
                buffering=0,
            ) as checkpoint:
                checkpoint.write(b"1")
            signal.pause()
        return pause_provider_probe


    console_sql_connection(ProbeConnection())
    sys.settrace(pause_provider_probe)
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  sql: ANSWER
  timeout_ms: 0
result:
  content:
    - type: text
      text: |-

        [running; poll with an empty send]
  isError: false
---
send:
  control: interrupt
  timeout_ms: 30000
result:
  content:
    - type: text
      text: |
        Traceback (most recent call last):
          File "<string>", line 254, in dispatch
          File "<mcp-console:python:e1>", line 28, in pause_provider_probe
        KeyboardInterrupt
  isError: false
---
send:
  sql: ANSWER
result:
  content:
    - type: text
      text: |
        answer
        ------
        42
  isError: false
