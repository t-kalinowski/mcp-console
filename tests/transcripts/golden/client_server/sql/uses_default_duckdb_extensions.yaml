---
!same-as tests/transcripts/golden/client_server/server/initializes_and_lists_tools.yaml
---
send:
  sql: |
    SELECT
      CASE
        WHEN json_extract_string('{"answer": 42}', '$.answer') = '42'
        THEN 1234567
        ELSE 0
      END AS json_ok,
      CASE
        WHEN timezone('America/New_York', TIMESTAMP '2020-01-01') IS NOT NULL
        THEN 1234567
        ELSE 0
      END AS icu_ok1
result:
  content:
    - type: text
      text: |
        # A tibble: 1 × 2
          json_ok icu_ok1
          <int32> <int32>
        1 1234567 1234567
  isError: false
---
send:
  sql: |
    SELECT CASE WHEN count(*) = 2 THEN 1234567 ELSE 0 END AS loaded1
    FROM duckdb_extensions()
    WHERE extension_name IN ('icu', 'json') AND loaded
result:
  content:
    - type: text
      text: |
        # A tibble: 1 × 1
          loaded1
          <int32>
        1 1234567
  isError: false
...
