---
!same-as tests/transcripts/golden/client_server/server/initializes_and_lists_tools.yaml
---
send:
  r: initial_r_library <- .libPaths()[[1L]]
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
session:
  action: prepare
  requirements:
    r:
      - zeallot
result:
  content:
    - type: text
      text: "[prepared]"
  isError: false
---
send:
  r: |
    cat(jsonlite::toJSON(.libPaths()[[1L]], auto_unbox = TRUE))
result:
  content:
    - type: text
      text: '"<current managed R library>"'
  isError: false
---
send:
  r: |
    reticulate::py_require("py-yaml12")
    invisible(reticulate::py_config())
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
session:
  action: restart
  requirements:
    r:
      - praise
    python:
      - six
result:
  content:
    - type: text
      text: |-
        [worker stopped: in-memory state lost]
        [starting new worker]
        [idle]
  isError: false
---
send:
  r: |
    cat(jsonlite::toJSON(.libPaths()[[1L]], auto_unbox = TRUE))
result:
  content:
    - type: text
      text: '"<current managed R library>"'
  isError: false
...
