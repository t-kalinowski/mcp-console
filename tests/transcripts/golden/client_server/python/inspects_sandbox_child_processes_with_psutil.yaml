---
!same-as tests/transcripts/golden/client_server/server/initializes_and_lists_tools.yaml
---
send:
  python: |
    import sys

    initial_executable = sys.executable
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  python: |
    import ctypes
    import errno
    import os
    import subprocess
    import sys

    import psutil

    if sys.platform == "darwin":
        mib = (ctypes.c_int * 3)(1, 14, 0)
        size = ctypes.c_size_t()
        ctypes.set_errno(0)
        result = ctypes.CDLL(None, use_errno=True).sysctl(
            mib,
            len(mib),
            None,
            ctypes.byref(size),
            None,
            0,
        )
        process_table_isolated = (
            result == -1 and ctypes.get_errno() == errno.EPERM
        )
    else:
        host_pid = int(os.environ["MCP_CONSOLE_TEST_HOST_PID"])
        process_table_isolated = not os.path.exists(f"/proc/{host_pid}")

    command = [sys.executable, "-c", "import time; time.sleep(30)"]
    child = subprocess.Popen(command)
    try:
        visible = psutil.pids()
        descendants = psutil.Process().children(recursive=True)
        observed = [process.pid for process in descendants]
        process_group = os.getpgrp()
        visible_groups = [os.getpgid(pid) for pid in visible]
    finally:
        child.terminate()
        child.wait()

    sandbox_scope = (
        1 not in visible
        if sys.platform == "darwin"
        else host_pid not in visible
    )
    worker_scope = all(group == process_group for group in visible_groups)

    (
        initial_executable != sys.executable,
        process_table_isolated,
        sandbox_scope,
        visible == sorted(visible),
        worker_scope,
        child.pid in visible,
        child.pid in observed,
    )
result:
  content:
    - type: text
      text: |
        (True, True, True, True, True, True, True)
  isError: false
