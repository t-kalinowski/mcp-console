---
!same-as tests/transcripts/golden/client_server/server/initializes_and_lists_tools.yaml
---
send:
  r: |
    invisible(suppressMessages(base::trace(
      "import",
      exit = quote({
        if (identical(module, "_mcp_console")) {
          invisible(file.create(file.path(
            tempdir(),
            "python-runtime-imported"
          )))
          repeat {}
        }
      }),
      print = FALSE,
      where = asNamespace("reticulate")
    )))
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  python: "42"
  timeout_ms: 0
result:
  content:
    - type: text
      text: |-

        [running]
  isError: false
---
session:
  action: interrupt
result:
  content:
    - type: text
      text: "[interrupt sent]"
  isError: false
---
send:
  timeout_ms: 3000
result:
  content:
    - type: text
      text: ""
  isError: false
---
send:
  r: |
    invisible(suppressMessages(base::untrace(
      "import",
      where = asNamespace("reticulate")
    )))
    length(getHook("reticulate::matplotlib.pyplot::load"))
result:
  content:
    - type: text
      text: |
        [1] 1
  isError: false
---
send:
  python: "42"
result:
  content:
    - type: text
      text: |
        42
  isError: false
---
send:
  python: |
    import logging

    sum(
        getattr(filter_, "_mcp_console_filter", False)
        for filter_ in logging.getLogger("matplotlib.font_manager").filters
    )
result:
  content:
    - type: text
      text: |
        1
  isError: false
...
