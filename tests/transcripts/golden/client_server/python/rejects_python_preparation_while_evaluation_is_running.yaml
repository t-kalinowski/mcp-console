---
!same-as tests/transcripts/golden/client_server/server/initializes_and_lists_tools.yaml
---
send:
  python: |
    runtime_generation_marker = "original runtime retained"
    import time; from pathlib import Path
    temporary = Path(__import__("os").environ["TMPDIR"])
    (temporary / "python-evaluation-running").touch()
    while not (temporary / "release-python").exists():
        time.sleep(0.01)
  timeout_ms: 0
result:
  content:
    - type: text
      text: <running>
  isError: false
---
session:
  action: prepare
  requirements:
    python:
      - py-yaml12
result:
  content:
    - type: text
      text: >-
        worker is already evaluating a cell; poll it before preparing
        requirements
  isError: true
---
send: {}
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  python: runtime_generation_marker
result:
  content:
    - type: text
      text: |
        'original runtime retained'
  isError: false
...
