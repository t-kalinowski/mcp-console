id: 15
send:
  r: |
    requirements <- reticulate::py_require()$packages
    stopifnot(
      "requests[socks]>=2; python_version < '0'" %in% requirements,
      "urllib3!=2.0.0; python_version < '0'" %in% requirements,
      !any(c(
        "<absolute project path>", "./project", "../project", "file://<absolute project path>", "-e ./project", "example @ https://example.invalid/example.whl", "<absolute archive path>", "package.whl", "package.tar.gz"
      ) %in% requirements),
      !file.exists(file.path(.libPaths()[[1L]], "praise", "DESCRIPTION"))
    )
result:
  content:
    - type: text
      text: "[done]"
  isError: false
