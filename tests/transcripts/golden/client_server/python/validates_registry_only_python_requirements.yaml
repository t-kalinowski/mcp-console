id: 15
send:
  r: |
    requirements <- reticulate::py_require()$packages
    stopifnot(
      "requests[socks]>=2; python_version < '0'" %in% requirements,
      "urllib3!=2.0.0; python_version < '0'" %in% requirements,
      !any(c(
        "<absolute project path>", "./project", "../project", "file://<absolute project path>", "-e ./project", "example @ https://example.invalid/example.whl", "<absolute archive path>", "package.whl", "package.tar.gz"
      ) %in% requirements),
      !file.exists(file.path(.libPaths()[[1L]], "praise", "DESCRIPTION"))
    )
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
id: 16
send:
  r: |
    selector_worker_pid <- Sys.getpid()
    selector_sentinel <- 42L
    packages <- reticulate::py_require()$packages
    environment_request <- jsonlite::toJSON(list(
      requirements = list(
        packages = I(packages),
        python_version = I("<worker executable path>")
      ),
      retained_requirements = list(
        packages = I(packages),
        python_version = I(">=3.10")
      )
    ), auto_unbox = TRUE)
    environment_error <- tryCatch(
      .Call("mcp_console_resolve_python", environment_request),
      error = conditionMessage
    )
    retained_environment_request <- jsonlite::toJSON(list(
      requirements = list(
        packages = I(packages),
        python_version = I(">=3.10")
      ),
      retained_requirements = list(
        packages = I(packages),
        python_version = I("<worker retained selector>")
      )
    ), auto_unbox = TRUE)
    retained_environment_error <- tryCatch(
      .Call("mcp_console_resolve_python", retained_environment_request),
      error = conditionMessage
    )
    version_request <- jsonlite::toJSON(list(
      constraints = I("<worker installation path>")
    ), auto_unbox = TRUE)
    version_error <- tryCatch(
      .Call("mcp_console_resolve_python_version", version_request),
      error = conditionMessage
    )
    cat(
      environment_error,
      retained_environment_error,
      version_error,
      sep = "\n"
    )
result:
  content:
    - type: text
      text: |
        Python version constraint `<worker executable path>` is not accepted: host-side managed resolution accepts version numbers and supported PEP 440 version specifiers only
        Python version constraint `<worker retained selector>` is not accepted: host-side managed resolution accepts version numbers and supported PEP 440 version specifiers only
        Python version constraint `<worker installation path>` is not accepted: host-side managed resolution accepts version numbers and supported PEP 440 version specifiers only
  isError: false
---
id: 17
