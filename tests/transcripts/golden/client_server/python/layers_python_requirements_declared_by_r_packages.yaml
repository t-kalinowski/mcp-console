---
!same-as tests/transcripts/golden/client_server/server/initializes_and_lists_tools.yaml
---
send:
  python: |
    import importlib.util
    import sys

    runtime_marker = 42
    initial_prefix = sys.prefix
    importlib.util.find_spec("yaml12") is None
result:
  content:
    - type: text
      text: |
        True
  isError: false
---
send:
  r: |
    initial_libpython <- reticulate::py_config()$libpython
    initial_worker <- Sys.getpid()
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  r: library(mcpconsolepyrequire)
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  r: |
    identical(reticulate::py_config()$libpython, initial_libpython) &&
      identical(Sys.getpid(), initial_worker)
result:
  content:
    - type: text
      text: |
        [1] TRUE
  isError: false
---
send:
  python: |
    import yaml12

    (runtime_marker, yaml12.__name__, sys.prefix != initial_prefix)
result:
  content:
    - type: text
      text: |
        (42, 'yaml12', True)
  isError: false
---
session:
  action: restart
result:
  content:
    - type: text
      text: |-
        [worker stopped: in-memory state lost]
        [starting new worker]
        [idle]
  isError: false
---
send:
  python: |
    import yaml12

    ("runtime_marker" in globals(), yaml12.__name__)
result:
  content:
    - type: text
      text: |
        (False, 'yaml12')
  isError: false
---
session:
  action: prepare
  requirements:
    python:
      - py-yaml12
result:
  content:
    - type: text
      text: "[prepared]"
  isError: false
...
