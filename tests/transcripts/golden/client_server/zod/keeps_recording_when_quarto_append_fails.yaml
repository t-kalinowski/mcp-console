---
!same-as tests/transcripts/golden/client_server/server/initializes_and_lists_tools.yaml
---
send:
  r: emit image
result:
  content:
    - type: text
      text: |
        before image
    - type: image
      data: iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=
      mimeType: image/png
    - type: text
      text: |
        after image
  isError: false
---
send:
  python: echo after projection failure
result:
  content:
    - type: text
      text: |
        zod python: after projection failure
  isError: false
---
derived projection failure:
  failure: append
  target: transcript.qmd
  journal events:
    - session_started
    - tool_call
    - artifact_created
    - tool_result
    - tool_call
    - tool_result
  artifact recorded: true
  surviving projection: transcript.md
  server stderr: >-
    mcp-console: transcript projection disabled: <projection failure>
