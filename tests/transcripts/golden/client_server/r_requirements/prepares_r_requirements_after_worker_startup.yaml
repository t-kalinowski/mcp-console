---
!same-as tests/transcripts/golden/client_server/server/initializes_and_lists_tools.yaml
---
session:
  action: prepare
  requirements:
    r:
      - praise
result:
  content:
    - type: text
      text: "[prepared]"
  isError: false
---
send:
  r: |
    sentinel <- 42L
    worker_pid <- Sys.getpid()
    initial_library <- .libPaths()[[1L]]
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  r: |
    stopifnot(
      identical(sentinel, 42L),
      identical(Sys.getpid(), worker_pid),
      !initial_library %in% .libPaths(),
      identical(dirname(find.package("zeallot")), .libPaths()[[1L]])
    )
    42L
  requirements:
    r:
      - zeallot
result:
  content:
    - type: text
      text: |
        [1] 42
  isError: false
...
