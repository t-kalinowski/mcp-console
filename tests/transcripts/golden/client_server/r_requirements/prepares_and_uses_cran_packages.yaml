---
!same-as tests/transcripts/golden/client_server/server/initializes_and_lists_tools.yaml
---
id: 3
session:
  action: prepare
  requirements:
    r:
      - "praise, zeallot"
result:
  content:
    - type: text
      text: "[prepared]"
  isError: false
---
id: 4
send:
  r: |
    stopifnot(
      identical(dirname(find.package("praise")), .libPaths()[[1L]]),
      identical(dirname(find.package("zeallot")), .libPaths()[[1L]])
    )
    result <- dplyr::summarise(
      data.frame(value = c(40L, 2L)),
      answer = sum(.data$value)
    )
    praise::praise(sprintf("answer: %d", result$answer))
result:
  content:
    - type: text
      text: |
        [1] "answer: 42"
  isError: false
...
