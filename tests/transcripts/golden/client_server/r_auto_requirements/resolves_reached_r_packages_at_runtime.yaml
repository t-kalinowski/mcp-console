---
!same-as tests/transcripts/golden/client_server/server/initializes_and_lists_tools.yaml
---
send:
  r: |
    invisible(suppressWarnings(suppressPackageStartupMessages({
      base::library(package = whoami, quietly = TRUE)
      library(
        "praise",
        help = stats,
        character.only = TRUE,
        quietly = TRUE
      )
      stopifnot(
        base::require(brio, quietly = TRUE),
        base::requireNamespace("desc", quietly = TRUE),
        is.environment(base::loadNamespace("pkgbuild")),
        is.environment(pkgload:::.__NAMESPACE__.),
        is.function(whoami::username),
        is.function("whoami"::username),
        is.function(whoami::username)
      )
    })))
    42L
result:
  content:
    - type: text
      text: |
        [1] 42
  isError: false
---
send:
  r: |
    invisible(suppressWarnings(suppressPackageStartupMessages({
      attached <- "diffobj"
      stopifnot(do.call(
        base::library,
        list(
          package = attached,
          help = NULL,
          character.only = TRUE,
          logical.return = TRUE,
          quietly = TRUE
        )
      ))
      package <- "waldo"
      stopifnot(do.call(
        base::requireNamespace,
        list(package = package, quietly = TRUE)
      ))
    })))
    42L
result:
  content:
    - type: text
      text: |
        [1] 42
  isError: false
