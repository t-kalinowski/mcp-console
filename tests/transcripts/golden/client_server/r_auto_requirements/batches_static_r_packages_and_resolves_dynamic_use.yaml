      base::library,
      list(
        package = attached,
        help = NULL,
        character.only = TRUE,
        logical.return = TRUE,
        quietly = TRUE
      )
    ))
    package <- "snakecase"
    stopifnot(do.call(
      base::requireNamespace,
      list(package = package, quietly = TRUE)
    ))
