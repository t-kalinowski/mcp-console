---
!same-as tests/transcripts/golden/client_server/server/initializes_and_lists_tools.yaml
---
send:
  r: |-
    echo <- 0L
    render_value <- 40L
    cat("executed-r=40\n")
result:
  content:
    - type: text
      text: |
        zod: <- 0L
        render_value <- 40L
        cat("executed-r=40\n")
  isError: false
---
send:
  python: |-
    echo = """before
    ````
    <div>not markdown</div>
    after"""
    print(f"executed-python={int(r.render_value) + 2}")
    print(echo)
result:
  content:
    - type: text
      text: |
        zod python: = """before
        ````
        <div>not markdown</div>
        after"""
        print(f"executed-python={int(r.render_value) + 2}")
        print(echo)
  isError: false
---
quarto document:
  executed client-authored R and Python cells through IR: true
  selected Python through reticulate defaults: true
  omitted recorded runtime results: true
  kept Markdown-looking source inside a code block: true
