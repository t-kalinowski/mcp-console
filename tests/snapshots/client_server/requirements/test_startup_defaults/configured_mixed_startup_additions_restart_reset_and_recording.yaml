---
!same-as MCP initialization for this execution mode
---
send:
  r: |
    stopifnot(
      !("praise" %in% loadedNamespaces()),
      nzchar(find.package("praise")),
      !("package:praise" %in% search())
    )
    cat("configured R available\n")
result:
  content:
    - type: text
      text: |
        configured R available
  isError: false
---
send:
  python: |
    import importlib.util
    import sys

    assert sys.version_info[:2] == (3, 13)
    assert importlib.util.find_spec("packaging") is not None
    assert "packaging" not in sys.modules
    print("configured Python available")
result:
  content:
    - type: text
      text: |
        configured Python available
  isError: false
---
send:
  requirements:
    action: get
  timeout_ms: 600000
result:
  content:
    - type: text
      text: |-
        {
          "requirements": {
            "r": [
              "praise"
            ],
            "python": [
              "packaging"
            ],
            "duckdb": [
              "icu",
              "json",
              "sqlite"
            ],
            "python_version": [
              "3.13"
            ],
            "exclude_newer": null
          },
          "runtime_requirements": {
            "r": [
              "DBI",
              "arrow",
              "duckdb",
              "jsonlite",
              "nanoarrow",
              "pillar",
              "reticulate",
              "tibble",
              "utf8"
            ],
            "python": []
          },
          "resolution": {
            "r": "automatic",
            "python": "automatic"
          },
          "selection": {
            "r": "<selected R home>",
            "python": "<selected Python>",
            "python_source": "python.managed"
          },
          "prepared": true
        }
  structuredContent:
    requirements:
      r:
        - praise
      python:
        - packaging
      duckdb:
        - icu
        - json
        - sqlite
      python_version:
        - "3.13"
      exclude_newer: ~
    runtime_requirements:
      r:
        - DBI
        - arrow
        - duckdb
        - jsonlite
        - nanoarrow
        - pillar
        - reticulate
        - tibble
        - utf8
      python: []
    resolution:
      r: automatic
      python: automatic
    selection:
      r: <selected R home>
      python: <selected Python>
      python_source: python.managed
    prepared: true
  isError: false
