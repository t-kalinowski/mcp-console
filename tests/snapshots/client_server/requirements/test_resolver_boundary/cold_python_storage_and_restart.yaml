---
!same-as tests/snapshots/client_server/server/test_tools/initializes_and_lists_tools.yaml
---
send:
  requirements:
    python:
      - six
  python: import sys, six; print(sys.executable)
result:
  content:
    - type: text
      text: |
        <managed-python>
  isError: false
---
send:
  python: retained = object(); retained_id = id(retained)
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  control: restart
  requirements:
    python:
      - mcp-console-no-such-resolver-package==0
  stdin: |
    queued
  python: raise AssertionError('must not run')
result:
  content:
    - type: text
      text: |-
        [managed Python resolution failed:
        resolver input:
        {
          "python": "3.12.15 (reticulate default)",
          "packages": [
            "numpy",
            "pandas",
            "duckdb",
            "mcp-console-no-such-resolver-package==0",
            "six"
          ]
        }
        uv output:
        error: No solution found when resolving tool dependencies
          cause: Because mcp-console-no-such-resolver-package was not found in the package registry and you require mcp-console-no-such-resolver-package==0, we can conclude that your requirements are unsatisfiable.]
  isError: true
---
send:
  python: assert id(retained) == retained_id; print('preserved')
result:
  content:
    - type: text
      text: |
        preserved
  isError: false
---
send:
  control: restart
  requirements:
    python:
      - packaging
  python: import packaging, six; print('prepared')
result:
  content:
    - type: text
      text: |-
        [worker stopped: in-memory state lost]
        [starting new worker]
        prepared
        [done]
  isError: false
