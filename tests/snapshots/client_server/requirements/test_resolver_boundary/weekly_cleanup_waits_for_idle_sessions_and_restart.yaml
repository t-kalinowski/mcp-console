---
!same-as tests/snapshots/client_server/server/test_tools/initializes_and_lists_tools.yaml
---
send:
  requirements:
    action: get
result:
  content:
    - type: text
      text: |-
        {
          "requirements": {
            "r": [],
            "python": [],
            "duckdb": [],
            "python_version": [],
            "exclude_newer": null
          },
          "prepared": false,
          "runtime_requirements": {
            "r": [],
            "python": []
          }
        }
  structuredContent:
    requirements:
      r: []
      python: []
      duckdb: []
      python_version: []
      exclude_newer: ~
    prepared: false
    runtime_requirements:
      r: []
      python: []
  isError: false
---
send:
  python: |
    import errno
    from pathlib import Path
    for path in ['<fixture>/cache/mcp-console/resolver/payload/retained-payload', '<fixture>/cache/mcp-console/resolver/control/metadata.json', '<console-executable>']:
        try:
            with Path(path).open("r+b"):
                pass
        except OSError as error:
            assert error.errno in (errno.EPERM, errno.EACCES, errno.EROFS), error
            print("write denied")
        else:
            raise AssertionError("protected file was writable")
result:
  content:
    - type: text
      text: |
        write denied
        write denied
        write denied
  isError: false
---
