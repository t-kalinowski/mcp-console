        - pandas
        - matplotlib
        - plotnine
        - py-yaml12
      duckdb:
        - icu
        - json
        - sqlite
      python_version: []
      exclude_newer: ~
    runtime_requirements:
      r:
        - DBI
        - arrow
        - duckdb
        - jsonlite
        - nanoarrow
        - pillar
        - reticulate
        - tibble
        - utf8
      python: []
    resolution:
      r: automatic
      python: automatic
    selection:
      r: <selected R home>
      python: <selected Python>
      python_source: default managed
    prepared: true
  isError: false
---
send:
  python: >-
    import yaml12; (id(identity) == identity_id, sys.executable !=
    initial_executable, yaml12.__name__)
result:
  content:
    - type: text
      text: |
        (True, True, 'yaml12')
  isError: false
