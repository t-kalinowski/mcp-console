---
!same-as writable MCP initialization for this execution mode
---
send:
  python: >-
    import sys; identity = object(); identity_id = id(identity);
    initial_executable = sys.executable; from pathlib import Path; _ =
    Path('initial-python').write_text(sys.executable)
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  r: |
    before <- reticulate::py_config()
    invisible(reticulate::py_require("py-yaml12"))
    after <- reticulate::py_config()
    stopifnot(
      identical(after$libpython, before$libpython),
      identical(
        after$executable,
        reticulate::py_eval("__import__('sys').executable")
      ),
      "py-yaml12" %in% reticulate::py_require()$packages
    )
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  requirements:
    action: get
result:
  content:
    - type: text
      text: |-
        {
          "requirements": {
            "r": [
              "DBI",
              "arrow",
              "dbplyr",
              "dplyr",
              "duckdb",
              "ggplot2",
              "nanoarrow",
              "reticulate",
              "tidyverse",
              "yyjsonr"
            ],
            "python": [
              "numpy",
              "pandas",
              "matplotlib",
              "plotnine",
              "py-yaml12"
            ],
            "duckdb": [
              "icu",
              "json",
              "sqlite"
            ],
            "python_version": [],
            "exclude_newer": null
          },
          "runtime_requirements": {
            "r": [
              "DBI",
              "arrow",
              "duckdb",
              "jsonlite",
              "nanoarrow",
              "pillar",
              "reticulate",
              "tibble",
              "utf8"
            ],
            "python": []
          },
          "resolution": {
            "r": "automatic",
            "python": "automatic"
          },
          "selection": {
            "r": "<selected R home>",
            "python": "<selected Python>",
            "python_source": "default managed"
          },
          "prepared": true
        }
  structuredContent:
    requirements:
      r:
        - DBI
        - arrow
        - dbplyr
        - dplyr
        - duckdb
        - ggplot2
        - nanoarrow
        - reticulate
        - tidyverse
        - yyjsonr
      python:
