        - duckdb
        - jsonlite
        - nanoarrow
        - pillar
        - reticulate
        - tibble
        - utf8
      python: []
  isError: false
---
send:
  r: |
    callback_gate <- tempfile("python-activation-gate-")
    callback_checkpoint <- tempfile("python-activation-checkpoint-")
    run_callback <- function() {
      if (!file.exists(callback_gate)) {
        later::later(run_callback, delay = 0.01)
        return(invisible(NULL))
      }
      condition <- tryCatch(
        reticulate::py_require("py-yaml12"),
        error = conditionMessage
      )
      stopifnot(grepl(
        "ValueError: idle activation failure",
        condition,
        fixed = TRUE
      ))
      cat("idle activation rejected\n")
      stopifnot(file.create(callback_checkpoint))
    }
    later::later(run_callback, delay = 0.01)
    cat(callback_gate, callback_checkpoint, sep = "\n")
result:
  content:
    - type: text
      text: |-
        <worker callback gate>
        <worker callback checkpoint>
  isError: false
---
send:
  python: assert id(identity) == identity_id; print('same object')
result:
  content:
    - type: text
      text: |
        idle activation rejected
        [output produced while idle]
        same object
  isError: false
