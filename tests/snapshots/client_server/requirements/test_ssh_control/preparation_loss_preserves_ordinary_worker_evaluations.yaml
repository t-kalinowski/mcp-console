---
send:
  r: value <- 41L; worker <- Sys.getpid()
  timeout_ms: 0
result:
  content:
    - type: text
      text: |-

        [running; poll with an empty send]
  isError: false
---
send: {}
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  requirements:
    r:
      - praise
result:
  content:
    - type: text
      text: >-
        SSH preparation retirement is unconfirmed: truncated SSH frame length:
        failed to fill whole buffer
  isError: true
---
send:
  r: stopifnot(Sys.getpid() == worker); value + 1L
result:
  content:
    - type: text
      text: |
        [1] 42
  isError: false
---
send:
  requirements:
    r:
      - praise
result:
  content:
    - type: text
      text: >-
        SSH preparation retirement is unconfirmed; this session cannot prepare
        or start a replacement: truncated SSH frame length: failed to fill whole
        buffer
  isError: true
---
send:
  control: restart
result:
  content:
    - type: text
      text: >-
        SSH preparation retirement is unconfirmed; this session cannot prepare
        or start a replacement: truncated SSH frame length: failed to fill whole
        buffer
  isError: true
