---
send:
  r: old_generation <- TRUE
  timeout_ms: 0
result:
  content:
    - type: text
      text: |-

        [running; poll with an empty send]
  isError: false
---
send:
  control: restart
result:
  content:
    - type: text
      text: |-
        [active evaluation stopped by session restart request]
        [starting new worker]
        [idle]
  isError: false
---
send:
  r: stopifnot(!exists("old_generation")); 42L
result:
  content:
    - type: text
      text: |
        [1] 42
  isError: false
