---
!same-as configured-r MCP initialization for this execution mode
---
send:
  r: >-
    cat("selected R retained\n"); Sys.setenv(R_HOME = "changed", PATH =
    "changed")
result:
  content:
    - type: text
      text: |
        selected R retained
  isError: false
---
send:
  requirements:
    action: get
result:
  content:
    - type: text
      text: |-
        {
          "requirements": {
            "r": [],
            "python": [],
            "duckdb": [],
            "python_version": [],
            "exclude_newer": null
          },
          "startup_requirements": {
            "r": [],
            "python": [],
            "duckdb": [],
            "python_version": [],
            "exclude_newer": null
          },
          "resolution": {
            "r": "disabled",
            "python": "disabled"
          },
          "selection": {
            "r": "<selected R home>",
            "python": "<selected Python>",
            "python_source": "RETICULATE_PYTHON"
          },
          "prepared": false,
          "runtime_requirements": {
            "r": [],
            "python": []
          }
        }
  structuredContent:
    requirements:
      r: []
      python: []
      duckdb: []
      python_version: []
      exclude_newer: ~
    startup_requirements:
      r: []
      python: []
      duckdb: []
      python_version: []
      exclude_newer: ~
    resolution:
      r: disabled
      python: disabled
    selection:
      r: <selected R home>
      python: <selected Python>
      python_source: RETICULATE_PYTHON
    prepared: false
    runtime_requirements:
      r: []
      python: []
  isError: false
---
send:
  control: restart
  requirements:
    r:
      - six
  r: cat("must not run\n")
result:
  content:
    - type: text
      text: >-
        R resolution is disabled by configuration for this operation (disabled);
        use resolution: explicit for MCP requirements changes or automatic for
        runtime preparation
  isError: true
---
send:
  control: restart
result:
  content:
    - type: text
      text: |-
        [worker stopped: in-memory state lost]
        [starting new worker]
        [idle]
  isError: false
---
send:
  r: cat("selected R retained\n")
result:
  content:
    - type: text
      text: |
        selected R retained
  isError: false
