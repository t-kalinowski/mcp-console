---
!same-as configured-r MCP initialization for this execution mode
---
send:
  r: cat("must not run\n")
result:
  content:
    - type: text
      text: >-
        r.executable <fixture>/selected R: No such file or directory (os error
        2)
  isError: true
---
send:
  control: restart
result:
  content:
    - type: text
      text: |-

        [idle]
  isError: false
---
send:
  r: retained <- TRUE; cat("repaired\n")
result:
  content:
    - type: text
      text: |
        repaired
  isError: false
---
send:
  control: restart
result:
  content:
    - type: text
      text: |-
        [worker stopped: in-memory state lost]
        [starting new worker]
        [r.executable: selected R installation changed at <fixture>/selected R; restart the server to select it again]
  isError: true
