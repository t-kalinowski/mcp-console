---
policy: automatic
---
!same-as configured-python MCP initialization for this execution mode
---
send:
  requirements:
    action: get
result:
  content:
    - type: text
      text: |-
        {
          "requirements": {
            "r": [],
            "python": [],
            "duckdb": [],
            "python_version": [],
            "exclude_newer": null
          },
          "startup_requirements": {
            "r": [],
            "python": [],
            "duckdb": [],
            "python_version": [],
            "exclude_newer": null
          },
          "resolution": {
            "r": "automatic",
            "python": "automatic"
          },
          "selection": {
            "r": null,
            "python": "<selected Python>",
            "python_source": "python.managed"
          },
          "prepared": true,
          "runtime_requirements": {
            "r": [],
            "python": []
          }
        }
  structuredContent:
    requirements:
      r: []
      python: []
      duckdb: []
      python_version: []
      exclude_newer: ~
    startup_requirements:
      r: []
      python: []
      duckdb: []
      python_version: []
      exclude_newer: ~
    resolution:
      r: automatic
      python: automatic
    selection:
      r: ~
      python: <selected Python>
      python_source: python.managed
    prepared: true
    runtime_requirements:
      r: []
      python: []
  isError: false
---
send:
  python: print('ready')
result:
  content:
    - type: text
      text: |
        ready
  isError: false
---
send:
  requirements:
    duckdb:
      - sqlite
  python: print('must not run')
result:
  content:
    - type: text
      text: >-
        DuckDB extension resolution failed with exit status: 1: DuckDB extension
        preparation needs an importable duckdb package in the candidate Python
        environment; include duckdb in requirements.python
  isError: true
---
send:
  python: |-
    try:
        import six
        print('available')
    except ModuleNotFoundError:
        print('missing')
result:
  content:
    - type: text
      text: |
        available
  isError: false
---
