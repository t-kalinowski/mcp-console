---
policy: automatic
initial:
  r: []
  python: []
  duckdb: []
  python_version: []
  exclude_newer: ~
after_import:
  r: []
  python:
    - six
  duckdb: []
  python_version: []
  exclude_newer: ~
extension:
  content:
    - type: text
      text: >-
        DuckDB extension resolution failed with exit status: 1: DuckDB extension
        preparation needs an importable duckdb package in the candidate Python
        environment; include duckdb in requirements.python
  isError: true
change:
  content:
    - type: text
      text: |
        changed
  isError: false
reset:
  r: []
  python: []
  duckdb: []
  python_version: []
  exclude_newer: ~
---
policy: explicit
initial:
  r: []
  python: []
  duckdb: []
  python_version: []
  exclude_newer: ~
after_import:
  r: []
  python: []
  duckdb: []
  python_version: []
  exclude_newer: ~
extension:
  content:
    - type: text
      text: >-
        DuckDB extension resolution failed with exit status: 1: DuckDB extension
        preparation needs an importable duckdb package in the candidate Python
        environment; include duckdb in requirements.python
  isError: true
change:
  content:
    - type: text
      text: |
        changed
  isError: false
reset:
  r: []
  python: []
  duckdb: []
  python_version: []
  exclude_newer: ~
---
policy: startup_only
initial:
  r: []
  python: []
  duckdb: []
  python_version: []
  exclude_newer: ~
after_import:
  r: []
  python: []
  duckdb: []
  python_version: []
  exclude_newer: ~
extension:
  content:
    - type: text
      text: >-
        DuckDB provider resolution is disabled by configuration for this
        operation (startup_only); use resolution: explicit for MCP requirements
        changes or automatic for runtime preparation
  isError: true
change:
  content:
    - type: text
      text: >-
        Python resolution is disabled by configuration for this operation
        (startup_only); use resolution: explicit for MCP requirements changes or
        automatic for runtime preparation
  isError: true
reset:
  r: []
  python: []
  duckdb: []
  python_version: []
  exclude_newer: ~
