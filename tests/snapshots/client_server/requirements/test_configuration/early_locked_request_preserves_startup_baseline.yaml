---
!same-as configured-python MCP initialization for this execution mode
---
send:
  control: restart
  requirements:
    action: set
    python: []
  python: early_cell_ran = True
result:
  content:
    - type: text
      text: >-
        Python resolution is disabled by configuration for this operation
        (startup_only); use resolution: explicit for MCP requirements changes or
        automatic for runtime preparation
  isError: true
---
input:
  method: ping
result: {}
---
send:
  python: >-
    import six; assert 'early_cell_ran' not in globals(); print('baseline
    retained')
result:
  content:
    - type: text
      text: |
        baseline retained
  isError: false
---
send:
  requirements:
    action: get
result:
  content:
    - type: text
      text: |-
        {
          "requirements": {
            "r": [],
            "python": [
              "six"
            ],
            "duckdb": [],
            "python_version": [],
            "exclude_newer": null
          },
          "runtime_requirements": {
            "r": [],
            "python": []
          },
          "resolution": {
            "r": "automatic",
            "python": "startup_only"
          },
          "selection": {
            "r": null,
            "python": "<selected Python>",
            "python_source": "python.managed"
          },
          "prepared": true
        }
  structuredContent:
    requirements:
      r: []
      python:
        - six
      duckdb: []
      python_version: []
      exclude_newer: ~
    runtime_requirements:
      r: []
      python: []
    resolution:
      r: automatic
      python: startup_only
    selection:
      r: ~
      python: <selected Python>
      python_source: python.managed
    prepared: true
  isError: false
