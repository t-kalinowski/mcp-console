---
!same-as MCP initialization for this execution mode
---
send:
  r: cat("R available\n")
result:
  content:
    - type: text
      text: |
        R available
  isError: false
---
send:
  requirements:
    python:
      - six
  python: import six; print(six.__version__)
result:
  content:
    - type: text
      text: |
        1.17.0
  isError: false
---
send:
  requirements:
    action: get
result:
  content:
    - type: text
      text: |-
        {
          "requirements": {
            "r": [],
            "python": [
              "six"
            ],
            "duckdb": [],
            "python_version": [],
            "exclude_newer": null
          },
          "runtime_requirements": {
            "r": [],
            "python": []
          },
          "resolution": {
            "r": "disabled",
            "python": "explicit"
          },
          "selection": {
            "r": "<selected R home>",
            "python": "<selected Python>",
            "python_source": "python.managed"
          },
          "prepared": true
        }
  structuredContent:
    requirements:
      r: []
      python:
        - six
      duckdb: []
      python_version: []
      exclude_newer: ~
    runtime_requirements:
      r: []
      python: []
    resolution:
      r: disabled
      python: explicit
    selection:
      r: <selected R home>
      python: <selected Python>
      python_source: python.managed
    prepared: true
  isError: false
