---
!same-as MCP initialization for this execution mode
---
send:
  r: retained <- 42; cat("retained\n")
result:
  content:
    - type: text
      text: |
        retained
  isError: false
---
send:
  requirements:
    action: get
result:
  content:
    - type: text
      text: |-
        {
          "requirements": {
            "r": [
              "dplyr"
            ],
            "python": [
              "six"
            ],
            "duckdb": [
              "icu",
              "json",
              "sqlite"
            ],
            "python_version": [],
            "exclude_newer": null
          },
          "startup_requirements": {
            "r": [
              "dplyr"
            ],
            "python": [
              "six"
            ],
            "duckdb": [
              "icu",
              "json",
              "sqlite"
            ],
            "python_version": [],
            "exclude_newer": null
          },
          "resolution": {
            "r": "startup_only",
            "python": "explicit"
          },
          "selection": {
            "r": "<selected R home>",
            "python": "<selected Python>",
            "python_source": "python.managed"
          },
          "prepared": true,
          "runtime_requirements": {
            "r": [
              "DBI",
              "arrow",
              "duckdb",
              "jsonlite",
              "nanoarrow",
              "pillar",
              "reticulate",
              "tibble",
              "utf8"
            ],
            "python": []
          }
        }
  structuredContent:
    requirements:
      r:
        - dplyr
      python:
        - six
      duckdb:
        - icu
        - json
        - sqlite
      python_version: []
      exclude_newer: ~
    startup_requirements:
      r:
        - dplyr
      python:
        - six
      duckdb:
        - icu
        - json
        - sqlite
      python_version: []
      exclude_newer: ~
    resolution:
      r: startup_only
      python: explicit
    selection:
      r: <selected R home>
      python: <selected Python>
      python_source: python.managed
    prepared: true
    runtime_requirements:
      r:
        - DBI
        - arrow
        - duckdb
        - jsonlite
        - nanoarrow
        - pillar
        - reticulate
        - tibble
        - utf8
      python: []
  isError: false
---
send:
  control: restart
  requirements:
    action: set
    python:
      - six
      - packaging
  r: retained <- NULL; cat("must not run\n")
result:
  content:
    - type: text
      text: >-
        R resolution is disabled by configuration for this operation
        (startup_only); use resolution: explicit for MCP requirements changes or
        automatic for runtime preparation
  isError: true
---
send:
  r: cat(retained, '\n', sep = '')
result:
