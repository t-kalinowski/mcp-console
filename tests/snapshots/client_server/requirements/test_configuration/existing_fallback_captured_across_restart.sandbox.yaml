---
!same-as configured-python MCP initialization for this execution mode
---
send:
  python: |
    import os, sys
    from pathlib import Path

    assert Path(sys.prefix) == Path.cwd() / "active venv"
    assert sys.prefix != sys.base_prefix
    os.environ["VIRTUAL_ENV"] = "missing-after-startup"
    os.environ["RETICULATE_PYTHON"] = "missing-after-startup"
    print("captured")
result:
  content:
    - type: text
      text: |
        captured
  isError: false
---
send:
  control: restart
result:
  content:
    - type: text
      text: |-
        [worker stopped: in-memory state lost]
        [starting new worker]
        [idle]
  isError: false
---
send:
