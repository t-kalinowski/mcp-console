---
send:
  r: sentinel <- 42L; worker <- Sys.getpid()
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  control: restart
  r: sentinel <- 0L
  requirements:
    r:
      - console.test.failure
result:
  content:
    - type: text
      text:
        text_bytes: 8192
        concat:
          - "[R package resolution failed with exit status: 1: "
          - repeat: "compile: α\t\"error\"\\source "
            count: 127
          - |
            compile: α	"error"\source
          - repeat: "compile: α\t\"error\"\\source "
            count: 20
          - "compile: α\t\"error\"\\[… omitted 1208447 rendered UTF-8 bytes; not retained …]ompile: α\t\"error\"\\source "
          - repeat: "compile: α\t\"error\"\\source "
            count: 20
          - |
            compile: α	"error"\source
          - repeat: "compile: α\t\"error\"\\source "
            count: 127
          - |-
            compile: α	"error"\source
            final diagnostic]
  isError: true
---
send:
  r: stopifnot(Sys.getpid() == worker); sentinel
result:
  content:
    - type: text
      text: |
        [1] 42
  isError: false
---
send:
  requirements:
    r:
      - praise
  r: sentinel
result:
  content:
    - type: text
      text: |
        [1] 42
  isError: false
