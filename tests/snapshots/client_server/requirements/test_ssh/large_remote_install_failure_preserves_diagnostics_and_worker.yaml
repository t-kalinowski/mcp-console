            count: 74
          - "compile: α\t\"error\"\\[… omitted 1212492 rendered UTF-8 bytes; not retained …]rce "
          - repeat: "compile: α\t\"error\"\\source "
            count: 73
          - |-
            compile: α	"error"\source
            final diagnostic]
