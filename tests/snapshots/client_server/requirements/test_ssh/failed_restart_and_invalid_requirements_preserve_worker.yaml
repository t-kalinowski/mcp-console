---
send:
  r: sentinel <- 42L; worker <- Sys.getpid()
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  r: sentinel <- 0L
  requirements:
    python:
      - /tmp/untrusted
result:
  content:
    - type: text
      text: >-
        Python requirement `/tmp/untrusted` is not accepted: host-side managed
        resolution accepts named package requirements only
  isError: true
---
send:
  r: sentinel <- 0L
  requirements:
    duckdb:
      - json; SELECT 1
result:
  content:
    - type: text
      text: >-
        DuckDB extension names must start with a lowercase ASCII letter and
        contain only lowercase ASCII letters, digits, and underscores
  isError: true
---
send:
  r: sentinel <- 0L
  requirements:
    r:
      - |
        praise
result:
  content:
    - type: text
      text: R requirement strings must not contain NUL or line breaks
  isError: true
---
send:
  r: |
    options(useFancyQuotes = FALSE)
    tryCatch(library("../untrusted"), error = function(e) cat(conditionMessage(e), "\n"))
result:
  content:
    - type: text
      text: |
        there is no package called '../untrusted' 
  isError: false
---
send:
  control: restart
  r: sentinel <- 0L
  requirements:
    r:
      - console.test.failure
result:
  content:
    - type: text
      text: >-
        [R package resolution failed with exit status: 1: synthetic `ir` failure
        for console.test.failure]
  isError: true
---
send:
  r: stopifnot(Sys.getpid() == worker); sentinel
result:
  content:
    - type: text
      text: |
        [1] 42
  isError: false
---
send:
  requirements:
    r:
      - praise
  r: sentinel
result:
  content:
    - type: text
      text: |
        [1] 42
  isError: false
