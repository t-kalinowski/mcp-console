---
send:
  r: sentinel <- 42L; worker <- Sys.getpid()
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  r: |
    local({
      invisible(suppressMessages(trace(
        ".libPaths",
        tracer = quote(if (!missing(new)) stop("remote activation failed")),
        print = FALSE, where = baseenv()
      )))
      on.exit(invisible(suppressMessages(untrace(".libPaths", where = baseenv()))))
      do.call(loadNamespace, list(package = "zeallot"))
    })
result:
  content:
    - type: text
      text: |
        Error: remote activation failed
  isError: false
---
send:
  r: stopifnot(Sys.getpid() == worker); sentinel
result:
  content:
    - type: text
      text: |
        [1] 42
  isError: false
---
send:
  requirements:
    r:
      - praise
result:
  content:
    - type: text
      text: "[restart required]"
  isError: false
---
send:
  control: restart
result:
  content:
    - type: text
      text: |-
        [worker stopped: in-memory state lost]
        [starting new worker]
        [idle]
  isError: false
---
send:
  r: >-
    stopifnot(!exists("sentinel"), requireNamespace("praise", quietly =
    TRUE)); 42L
result:
  content:
    - type: text
      text: |
        [1] 42
  isError: false
