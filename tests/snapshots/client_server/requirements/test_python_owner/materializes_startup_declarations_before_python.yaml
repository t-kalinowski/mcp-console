---
!same-as MCP initialization for this execution mode
---
send:
  r: >-
    stopifnot(startup_checks_complete, reticulate::py_available(initialize =
    FALSE))
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  requirements:
    python:
      - packaging
result:
  content:
    - type: text
      text: "[prepared]"
  isError: false
---
send:
  r: reticulate::py_available(initialize = FALSE)
result:
  content:
    - type: text
      text: |
        [1] TRUE
  isError: false
---
send:
  control: restart
result:
  content:
    - type: text
      text: |-
        [worker stopped: in-memory state lost]
        [starting new worker]
        [worker starting]
  isError: false
---
send:
  r: |
    requirements <- reticulate::py_require()
    stopifnot(
      all(c("py-yaml12", "packaging") %in% requirements$packages),
      !"humanize" %in% requirements$packages,
      identical(requirements$python_version, character()),
      is.null(requirements$exclude_newer),
      reticulate::py_available(initialize = FALSE)
    )
result:
  content:
    - type: text
      text: "[done]"
  isError: false
