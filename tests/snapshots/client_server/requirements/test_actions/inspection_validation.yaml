---
!same-as MCP initialization for this execution mode
---
send:
  requirements:
    action: get
result:
  content:
    - type: text
      text: |-
        {
          "requirements": {
            "r": [
              "DBI",
              "arrow",
              "duckdb",
              "nanoarrow",
              "reticulate",
              "tidyverse"
            ],
            "python": [
              "numpy",
              "pandas"
            ],
            "duckdb": [
              "icu",
              "json"
            ],
            "python_version": [],
            "exclude_newer": null
          },
          "prepared": false,
          "runtime_requirements": {
            "r": [
              "DBI",
              "arrow",
              "duckdb",
              "jsonlite",
              "nanoarrow",
              "pillar",
              "reticulate",
              "tibble",
              "utf8"
            ],
            "python": []
          }
        }
  structuredContent:
    requirements:
      r:
        - DBI
        - arrow
        - duckdb
        - nanoarrow
        - reticulate
        - tidyverse
      python:
        - numpy
        - pandas
      duckdb:
        - icu
        - json
      python_version: []
      exclude_newer: ~
    prepared: false
    runtime_requirements:
      r:
        - DBI
        - arrow
        - duckdb
        - jsonlite
        - nanoarrow
        - pillar
        - reticulate
        - tibble
        - utf8
      python: []
  isError: false
---
send:
  requirements:
    action: get
  python: "42"
result:
  content:
    - type: text
      text: >-
        requirements.action=get cannot be combined with code, stdin, or control
  isError: true
---
send:
  requirements:
    action: get
  stdin: ""
result:
  content:
    - type: text
      text: >-
        requirements.action=get cannot be combined with code, stdin, or control
  isError: true
---
send:
  requirements:
    action: get
  control: restart
result:
  content:
    - type: text
      text: >-
        requirements.action=get cannot be combined with code, stdin, or control
  isError: true
---
send:
