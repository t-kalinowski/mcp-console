---
!same-as configured-r MCP initialization for this execution mode
---
send:
  r: >-
    stopifnot(identical("--vanilla" %in% commandArgs(), FALSE));
    cat("layered R selected\n")
result:
  content:
    - type: text
      text: |
        layered R selected
  isError: false
---
send:
  requirements:
    action: get
result:
  content:
    - type: text
      text: |-
        {
          "requirements": {
            "r": [],
            "python": [],
            "duckdb": [],
            "python_version": [],
