---
!same-as configured-r MCP initialization for this execution mode
---
send:
  r: |
    expected <- normalizePath("R", mustWork = TRUE)
    stopifnot(identical(normalizePath(R.home()), expected))
    stopifnot(identical(Sys.getenv("RHOME"), expected))
    stopifnot(identical(
      unname(Sys.getenv(c("R_SHARE_DIR", "R_INCLUDE_DIR", "R_DOC_DIR"))),
      c("/Library/Frameworks/R.framework/Versions/4.6/Resources/share", "/Library/Frameworks/R.framework/Versions/4.6/Resources/include", "/Library/Frameworks/R.framework/Versions/4.6/Resources/doc")
    ))
    Sys.setenv(R_HOME = "changed", RHOME = "changed")
    cat("matching R installation\n")
result:
  content:
    - type: text
      text: |
        matching R installation
  isError: false
---
send:
  control: restart
result:
  content:
    - type: text
      text: |-
        [worker stopped: in-memory state lost]
        [starting new worker]
        [idle]
  isError: false
---
send:
