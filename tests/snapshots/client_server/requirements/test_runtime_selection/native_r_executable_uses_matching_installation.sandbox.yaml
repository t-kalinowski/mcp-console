---
!same-as configured-r MCP initialization for this execution mode
---
send:
  r: >-
    stopifnot(identical(normalizePath(R.home()),
    normalizePath("/Library/Frameworks/R.framework/Versions/4.6/Resources")));
    cat("native R selected\n")
result:
  content:
    - type: text
      text: |
        native R selected
  isError: false
---
send:
  control: restart
result:
  content:
    - type: text
      text: |-
        [worker stopped: in-memory state lost]
        [starting new worker]
        [idle]
  isError: false
---
send:
  r: >-
    stopifnot(identical(normalizePath(R.home()),
    normalizePath("/Library/Frameworks/R.framework/Versions/4.6/Resources")));
    cat("native R selected\n")
result:
  content:
    - type: text
      text: |
        native R selected
  isError: false
