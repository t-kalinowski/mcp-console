---
!same-as MCP initialization for this execution mode
---
send:
  r: |
    worker_pid <- Sys.getpid()
    reticulate::py_require("py-yaml12")
    stopifnot(!reticulate::py_available(initialize = FALSE))
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  requirements:
    python:
      - py-yaml12
result:
  content:
    - type: text
      text: "[prepared]"
  isError: false
---
send:
  r: |
    stopifnot(
      identical(Sys.getpid(), worker_pid),
      !reticulate::py_available(initialize = FALSE),
      "py-yaml12" %in% reticulate::py_require()$packages
    )
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  control: restart
result:
  content:
    - type: text
      text: |-
        [worker stopped: in-memory state lost]
        [starting new worker]
        [idle]
  isError: false
---
send:
  r: |
    stopifnot(
      !reticulate::py_available(initialize = FALSE),
      "py-yaml12" %in% reticulate::py_require()$packages
    )
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  python: |
    import yaml12

    yaml12.__name__
result:
  content:
    - type: text
      text: |
        'yaml12'
  isError: false
