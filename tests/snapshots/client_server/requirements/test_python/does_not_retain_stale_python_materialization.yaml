---
!same-as tests/snapshots/client_server/server/test_tools/initializes_and_lists_tools.yaml
---
send:
  r: invisible(reticulate::py_config())
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  r: |
    namespace <- asNamespace("reticulate")
    original_py_require <- get("py_require", envir = namespace)
    injected <- FALSE
    replacement <- function(...) {
      if (!injected) {
        injected <<- TRUE
        requirements <- original_py_require()
        invisible(get("uv_get_or_create_env", envir = namespace)(
          requirements$packages,
          requirements$python_version,
          requirements$exclude_newer
        ))
      }
      original_py_require(...)
    }
    unlockBinding("py_require", namespace)
    assign("py_require", replacement, envir = namespace)
    lockBinding("py_require", namespace)
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  requirements:
    python:
      - py-yaml12
result:
  content:
    - type: text
      text: "[prepared]"
  isError: false
---
send:
  control: restart
result:
  content:
    - type: text
      text: |-
        [worker stopped: in-memory state lost]
        [starting new worker]
        [idle]
  isError: false
---
send:
  python: import yaml12; yaml12.__name__
result:
  content:
    - type: text
      text: |
        'yaml12'
  isError: false
