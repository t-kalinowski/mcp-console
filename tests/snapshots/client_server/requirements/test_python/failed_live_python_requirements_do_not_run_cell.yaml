---
!same-as MCP initialization for this execution mode
---
send:
  python: import os; live_sentinel = 42; live_worker_pid = os.getpid()
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  r: |
    reticulate_namespace <- asNamespace("reticulate")
    unlockBinding("py_require", reticulate_namespace)
    assign("py_require", function(...) stop("tool entered reticulate declaration"),
           envir = reticulate_namespace)
    lockBinding("py_require", reticulate_namespace)
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  python: failed_live_python_cell = True
  requirements:
    python:
      - py-yaml12
result:
  content:
    - type: text
      text: |-
        managed Python resolution failed:
        resolver input:
        {
          "python": "/Users/tomasz/.cache/uv/archive-v0/ZL-eMrJCbkuI2JEQ/bin/python",
          "packages": [
            "numpy",
            "pandas",
            "py-yaml12"
          ]
        }
        uv output:
        synthetic uv failure
  isError: true
---
send:
  python: >-
    import yaml12; (live_sentinel, os.getpid() == live_worker_pid,
    'failed_live_python_cell' not in globals(), yaml12.__name__)
  requirements:
    python:
      - py-yaml12
result:
  content:
    - type: text
      text: |
        (42, True, True, 'yaml12')
  isError: false
