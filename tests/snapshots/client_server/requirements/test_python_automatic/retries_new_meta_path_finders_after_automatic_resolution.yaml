---
!same-as tests/snapshots/client_server/server/test_tools/initializes_and_lists_tools.yaml
---
send:
  python: None
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  python: |
    import importlib.util


    class AutomaticMetaLoader:
        def create_module(self, specification):
            return None

        def exec_module(self, module):
            module.answer = 42


    class AutomaticMetaFinder:
        def find_spec(self, fullname, path=None, target=None):
            if fullname == "mcp_console_activated_finder":
                return importlib.util.spec_from_loader(
                    fullname,
                    AutomaticMetaLoader(),
                )
            return None


    automatic_meta_finder = AutomaticMetaFinder()
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  r: |
    reticulate_namespace <- asNamespace("reticulate")
    original_py_require <- get("py_require", envir = reticulate_namespace)
    automatic_meta_finder_registered <- FALSE
    unlockBinding("py_require", reticulate_namespace)
    assign(
      "py_require",
      function(...) {
        result <- original_py_require(...)
        if (!automatic_meta_finder_registered) {
          reticulate::py_run_string(
            paste0(
              "import sys, __main__; ",
              "sys.meta_path.insert(0, __main__.automatic_meta_finder)"
            ),
            local = TRUE
          )
          automatic_meta_finder_registered <<- TRUE
        }
        result
      },
      envir = reticulate_namespace
    )
    lockBinding("py_require", reticulate_namespace)
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  python: >-
    import mcp_console_activated_finder; mcp_console_activated_finder.answer
result:
  content:
    - type: text
      text: |
        42
  isError: false
