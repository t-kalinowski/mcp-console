---
!same-as MCP initialization for this execution mode
---
send:
  r: |
    config <- reticulate::py_config()
    activation_ready <- tempfile("mcp-console-activation-ready-")
    activation_release <- tempfile("mcp-console-activation-release-")
    activation_sent <- tempfile("mcp-console-activation-sent-")
    cat(
      activation_ready,
      activation_release,
      activation_sent,
      config$python,
      sep = "\n"
    )
result:
  content:
    - type: text
      text: |-
        <activation ready>
        <activation release>
        <activation sent>
  isError: false
---
send:
  python: |
    import json
    import _mcp_console_native as native_services

    original_call = native_services.call

    def gated_call(request):
        if json.loads(request)["operation"] != "activate_python":
            return original_call(request)
        with open("<activation ready>", "wb", buffering=0) as ready:
            ready.write(b"1")
        with open("<activation release>", "rb", buffering=0) as release:
            assert release.read(1) == b"1"
        result = original_call(request)
        with open("<activation sent>", "wb", buffering=0) as sent:
            sent.write(b"1")
        return result

    native_services.call = gated_call
    import yaml12
  timeout_ms: 0
result:
  content:
    - type: text
      text: |-

        [running; poll with an empty send]
  isError: false
---
send:
  control: restart
  requirements:
    python:
      - mcp-console-restart-fixture
result:
  content:
    - type: text
      text: |-
        [active evaluation stopped by session restart request]
        [worker stopped: in-memory state lost]
        [starting new worker]
        [idle]
  isError: false
---
send:
  r: |
    packages <- reticulate::py_require()$packages
    c("mcp-console-restart-fixture" %in% packages, "py-yaml12" %in% packages)
result:
  content:
    - type: text
      text: |
        [1]  TRUE FALSE
  isError: false
