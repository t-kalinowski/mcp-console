---
!same-as MCP initialization for this execution mode
---
send:
  r: |
    config <- reticulate::py_config()
    activation_ready <- tempfile("mcp-console-activation-ready-")
    activation_release <- tempfile("mcp-console-activation-release-")
    activation_sent <- tempfile("mcp-console-activation-sent-")
    cat(
      activation_ready,
      activation_release,
      activation_sent,
      config$python,
      sep = "\n"
    )
result:
  content:
    - type: text
      text: |-
        <activation ready>
        <activation release>
        <activation sent>
  isError: false
---
send:
  python: |
    import _mcp_console_services as services

    original_publish = services.publish_python_activation


    def gated_publish(activation):
        with open(r.activation_ready, "wb", buffering=0) as ready:
            ready.write(b"1")
        with open(r.activation_release, "rb", buffering=0) as release:
            assert release.read(1) == b"1"
        original_publish(activation)
        with open(r.activation_sent, "wb", buffering=0) as sent:
            sent.write(b"1")


    services.publish_python_activation = gated_publish
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  python: import yaml12
  timeout_ms: 0
result:
  content:
    - type: text
      text: |-

        [running; poll with an empty send]
  isError: false
---
send:
  control: restart
  requirements:
    python:
      - mcp-console-restart-fixture
result:
  content:
    - type: text
      text: |-
        [active evaluation stopped by session restart request]
        [worker stopped: in-memory state lost]
        [starting new worker]
        [idle]
  isError: false
---
send:
  r: |
    packages <- reticulate::py_require()$packages
    c("mcp-console-restart-fixture" %in% packages, "py-yaml12" %in% packages)
result:
  content:
    - type: text
      text: |
        [1]  TRUE FALSE
  isError: false
