---
!same-as MCP initialization for this execution mode
---
send:
  r: |
    managed_index <- if (Sys.getenv("MCP_CONSOLE_SANDBOX") == "1") 2L else 1L
    packages <- c("tidyverse", "reticulate", "DBI", "duckdb", "arrow", "nanoarrow")
    # Loaded namespaces retain canonical cache paths; the managed
    # library contains symlinks to those same package installations.
    stopifnot(
      identical(
        normalizePath(find.package(packages)),
        normalizePath(file.path(.libPaths()[[managed_index]], packages))
      ),
      vapply(
        c("ggplot2", "dplyr", "readr", "jsonlite"),
        requireNamespace,
        logical(1L),
        quietly = TRUE
      )
    )
    csv <- readr::read_csv(I("value\n40\n2\n"), show_col_types = FALSE)
    json <- jsonlite::fromJSON('[{"value": 40}, {"value": 2}]')
    stopifnot(identical(as.integer(csv$value), json$value))
    dplyr::summarise(csv, answer = sum(.data$value))$answer
result:
  content:
    - type: text
      text: |
        [1] 42
  isError: false
---
send:
  requirements:
    r:
      - DBI
      - duckdb
      - arrow
      - nanoarrow
result:
  content:
    - type: text
      text: "[prepared]"
  isError: false
