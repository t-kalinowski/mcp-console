---
!same-as MCP initialization for this execution mode
---
send:
  r: |
    stopifnot(
      identical(dirname(find.package("praise")), .libPaths()[[1L]])
    )
    praise::praise("ready")
  requirements:
    r:
      - praise
result:
  content:
    - type: text
      text: |
        [1] "ready"
  isError: false
