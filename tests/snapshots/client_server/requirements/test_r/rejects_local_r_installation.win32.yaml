---
!same-as MCP initialization for this execution mode
---
send:
  requirements:
    r:
      - local::<absolute package path>?reinstall&nocache
result:
  content:
    - type: text
      text: "R package resolution failed with exit code: 1: <cache-dependent `ir` progress>\nError: IR_NO_LOCAL_SOURCES is set, but installing this environment would use packages from the local file system:\r\n- requested package `mcpconsolerinstallescape` from `file://<absolute package path>`\r\nUse a remote package source or unset IR_NO_LOCAL_SOURCES.\r\nExecution halted\r\nir: dependency resolution failed"
  isError: true
transcript_normalization:
  target: result.content[0].text
  replacements:
    cache_dependent_ir_progress: <cache-dependent `ir` progress>
