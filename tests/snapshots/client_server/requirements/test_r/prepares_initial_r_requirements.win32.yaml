    ir_pkg_deps_arguments: <ir-version-dependent arguments>
---
send:
  requirements:
    r:
      - zeallot
    python:
      - example @ https://example.invalid/example.whl
result:
  content:
    - type: text
      text: >-
        Python requirement `example @ https://example.invalid/example.whl` is
        not accepted: host-side managed resolution accepts named package
        requirements only
  isError: true
---
send:
  r: |
    managed_index <- if (Sys.getenv("MCP_CONSOLE_SANDBOX") == "1") 2L else 1L
    stopifnot(
      identical(
        dirname(find.package("praise")),
        .libPaths()[[managed_index]]
      ),
      normalizePath(.libPaths()[[managed_index + 1L]]) ==
        normalizePath(Sys.getenv("MCP_CONSOLE_AMBIENT_R_LIBRARY"))
    )
    42L
result:
  content:
    - type: text
      text: |
        [1] 42
  isError: false
