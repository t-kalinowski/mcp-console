---
!same-as MCP initialization for this execution mode
---
send:
  requirements:
    r:
      - praise
result:
  content:
    - type: text
      text: "[prepared]"
  isError: false
---
send:
  requirements:
    r:
      - not a valid requirement !!!
result:
  content:
    - type: text
      text: >-
        R package resolution failed with exit status: 1: synthetic `ir` failure
        for not a valid requirement !!!
  isError: true
---
send:
  requirements:
    r:
      - zeallot
    python:
      - example @ https://example.invalid/example.whl
result:
  content:
    - type: text
      text: >-
        Python requirement `example @ https://example.invalid/example.whl` is
        not accepted: host-side managed resolution accepts named package
        requirements only
  isError: true
---
send:
  r: |
    managed_index <- if (Sys.getenv("MCP_CONSOLE_SANDBOX") == "1") 2L else 1L
    stopifnot(
      identical(
        dirname(find.package("praise")),
        .libPaths()[[managed_index]]
      ),
      normalizePath(.libPaths()[[managed_index + 1L]]) ==
        normalizePath(Sys.getenv("MCP_CONSOLE_AMBIENT_R_LIBRARY"))
    )
    42L
result:
  content:
    - type: text
      text: |
        [1] 42
  isError: false
---
send:
  requirements:
    r:
      - praise
result:
  content:
    - type: text
      text: "[prepared]"
  isError: false
---
send:
  requirements:
    r:
      - zeallot
    python:
      - py-yaml12
result:
  content:
    - type: text
      text: "[prepared]"
  isError: false
---
send:
  r: |
    managed_index <- if (Sys.getenv("MCP_CONSOLE_SANDBOX") == "1") 2L else 1L
    stopifnot(
      "py-yaml12" %in% reticulate::py_require()$packages,
      identical(
        dirname(find.package("praise")),
        .libPaths()[[managed_index]]
      ),
      identical(
        dirname(find.package("zeallot")),
        .libPaths()[[managed_index]]
      ),
      normalizePath(.libPaths()[[managed_index + 1L]]) ==
        normalizePath(Sys.getenv("MCP_CONSOLE_AMBIENT_R_LIBRARY"))
    )
    42L
result:
  content:
    - type: text
      text: |
        [1] 42
  isError: false
---
send:
  control: restart
result:
  content:
    - type: text
      text: |-
        [worker stopped: in-memory state lost]
        [starting new worker]
        [idle]
  isError: false
---
send:
  r: |
    managed_index <- if (Sys.getenv("MCP_CONSOLE_SANDBOX") == "1") 2L else 1L
    stopifnot(
      "py-yaml12" %in% reticulate::py_require()$packages,
      identical(
        dirname(find.package("praise")),
        .libPaths()[[managed_index]]
      ),
      identical(
        dirname(find.package("zeallot")),
        .libPaths()[[managed_index]]
      ),
      normalizePath(.libPaths()[[managed_index + 1L]]) ==
        normalizePath(Sys.getenv("MCP_CONSOLE_AMBIENT_R_LIBRARY"))
    )
    42L
result:
  content:
    - type: text
      text: |
        [1] 42
  isError: false
