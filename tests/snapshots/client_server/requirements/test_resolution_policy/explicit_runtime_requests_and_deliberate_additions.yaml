---
!same-as MCP initialization for this execution mode
---
send:
  requirements:
    action: get
  timeout_ms: 600000
result:
  content:
    - type: text
      text: |-
        {
          "requirements": {
            "r": [
              "mcpfirst"
            ],
            "python": [],
            "duckdb": [
              "icu",
              "json",
              "sqlite"
            ],
            "python_version": [
              "3.13"
            ],
            "exclude_newer": null
          },
          "prepared": true,
          "runtime_requirements": {
            "r": [
              "DBI",
              "duckdb",
              "jsonlite",
              "nanoarrow",
              "pillar",
              "reticulate",
              "tibble",
              "utf8"
            ],
            "python": []
          }
        }
  structuredContent:
    requirements:
      r:
        - mcpfirst
      python: []
      duckdb:
        - icu
        - json
        - sqlite
      python_version:
        - "3.13"
      exclude_newer: ~
    prepared: true
    runtime_requirements:
      r:
        - DBI
        - duckdb
        - jsonlite
        - nanoarrow
        - pillar
        - reticulate
        - tibble
        - utf8
      python: []
  isError: false
