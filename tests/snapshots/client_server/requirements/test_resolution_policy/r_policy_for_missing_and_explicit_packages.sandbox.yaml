---
!same-as configured-r MCP initialization for this execution mode
---
send:
  requirements:
    action: get
result:
  content:
    - type: text
      text: |-
        {
          "requirements": {
            "r": [],
            "python": [],
            "duckdb": [
              "icu",
              "json",
              "sqlite"
            ],
            "python_version": [],
            "exclude_newer": null
          },
          "startup_requirements": {
            "r": [],
            "python": [],
            "duckdb": [
              "icu",
              "json",
              "sqlite"
            ],
            "python_version": [],
            "exclude_newer": null
          },
          "resolution": {
            "r": "automatic",
            "python": "disabled"
          },
          "selection": {
            "r": "<selected R home>",
            "python": "<selected Python>",
            "python_source": "python.existing"
          },
          "prepared": true,
          "runtime_requirements": {
            "r": [
              "DBI",
              "arrow",
              "duckdb",
              "jsonlite",
              "nanoarrow",
              "pillar",
              "reticulate",
              "tibble",
              "utf8"
            ],
            "python": []
          }
        }
  structuredContent:
    requirements:
      r: []
      python: []
      duckdb:
        - icu
        - json
        - sqlite
      python_version: []
      exclude_newer: ~
    startup_requirements:
      r: []
      python: []
      duckdb:
        - icu
        - json
        - sqlite
      python_version: []
      exclude_newer: ~
    resolution:
      r: automatic
      python: disabled
    selection:
      r: <selected R home>
      python: <selected Python>
      python_source: python.existing
    prepared: true
    runtime_requirements:
      r:
        - DBI
        - arrow
        - duckdb
        - jsonlite
        - nanoarrow
        - pillar
        - reticulate
        - tibble
        - utf8
      python: []
  isError: false
---
send:
  r: retained <- 42; cat("ready\n")
result:
  content:
    - type: text
      text: |
        ready
  isError: false
---
send:
  r: >-
    cat(requireNamespace("consolepolicyfixture", quietly = TRUE), "\n", sep
    = "")
result:
  content:
    - type: text
      text: |
        TRUE
  isError: false
---
send:
  requirements:
    r:
      - consolepolicyfixture
  r: cat("prepared\n")
result:
  content:
    - type: text
      text: |
        prepared
  isError: false
---
send:
  r: cat(consolepolicyfixture::fixture(), "\n", sep = "")
result:
  content:
    - type: text
      text: |
        TRUE
  isError: false
---
send:
  r: cat(retained, "\n", sep = "")
result:
  content:
    - type: text
      text: |
        42
  isError: false
