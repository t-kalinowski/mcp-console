        - arrow
        - duckdb
        - jsonlite
        - nanoarrow
        - pillar
        - reticulate
        - tibble
        - utf8
      python: []
  isError: false
---
send:
  r: >-
    tryCatch(reticulate::py_require("console_missing_policy_fixture"), error
    = function(error) cat(conditionMessage(error), "\n", sep = ""))
result:
  content:
    - type: text
      text: >
        runtime Python resolution is disabled by configuration for this
        operation (explicit); use resolution: explicit for MCP requirements
        changes or automatic for runtime preparation
  isError: false
