---
!same-as configured-r-python MCP initialization for this execution mode
---
send:
  r: >-
    stopifnot(identical(reticulate::py_eval("len([])"), 0L));
    cat("attached\n")
result:
  content:
    - type: text
      text: |
        attached
  isError: false
---
send:
  requirements:
    action: get
result:
  content:
    - type: text
      text: |-
        {
          "requirements": {
            "r": [],
            "python": [
              "six"
            ],
            "duckdb": [
              "icu",
              "json",
              "sqlite"
            ],
            "python_version": [],
            "exclude_newer": null
          },
          "startup_requirements": {
            "r": [],
            "python": [
              "six"
            ],
            "duckdb": [
              "icu",
              "json",
              "sqlite"
            ],
            "python_version": [],
            "exclude_newer": null
          },
          "resolution": {
            "r": "explicit",
            "python": "explicit"
          },
          "selection": {
            "r": "<selected R home>",
            "python": "<selected Python>",
            "python_source": "python.managed"
          },
          "prepared": true,
          "runtime_requirements": {
            "r": [
              "DBI",
              "arrow",
              "duckdb",
              "jsonlite",
              "nanoarrow",
              "pillar",
              "reticulate",
              "tibble",
              "utf8"
            ],
            "python": []
          }
        }
