---
!same-as r-only MCP initialization for this execution mode
---
send:
  requirements:
    action: get
  timeout_ms: 600000
result:
  content:
    - type: text
      text: |-
        {
          "requirements": {
            "r": [],
            "python": [],
            "duckdb": [
              "icu",
              "json",
              "sqlite"
            ],
            "python_version": [
              "3.13"
            ],
            "exclude_newer": null
          },
          "prepared": true,
          "runtime_requirements": {
            "r": [
              "DBI",
              "duckdb",
              "jsonlite",
              "nanoarrow",
              "pillar",
              "reticulate",
              "tibble",
              "utf8"
            ],
            "python": []
          }
        }
  structuredContent:
    requirements:
      r: []
      python: []
      duckdb:
        - icu
        - json
        - sqlite
      python_version:
        - "3.13"
      exclude_newer: ~
    prepared: true
    runtime_requirements:
      r:
        - DBI
        - duckdb
        - jsonlite
        - nanoarrow
        - pillar
        - reticulate
        - tibble
        - utf8
      python: []
  isError: false
---
send:
  r: |
    before <- reticulate::py_require()
    reticulate::py_require("six", python_version = ">=3.13")
    failure <- tryCatch(
      reticulate::py_write_requirements(NULL, NULL, freeze = FALSE, python = NULL),
      error = conditionMessage
    )
    stopifnot(grepl("python.managed.resolution=fixed", failure, fixed = TRUE))
    reticulate::py_require(
      as.character(before$packages),
      python_version = as.character(before$python_version),
      action = "set"
    )
result:
  content:
    - type: text
      text: "[done]"
  isError: false
