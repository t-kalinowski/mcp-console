---
!same-as MCP initialization for this execution mode
---
send:
  r: startup_cell_ran <- TRUE
  timeout_ms: 0
result:
  content:
    - type: text
      text: |-

        [running; poll with an empty send]
  isError: false
---
send:
  control: interrupt
  timeout_ms: 30000
result:
  content:
    - type: text
      text: "[worker startup interrupted]"
  isError: true
---
send:
  control: restart
result:
  content:
    - type: text
      text: |-
        [starting new worker]
        [worker starting]
  isError: false
---
send:
  r: exists("startup_cell_ran", inherits = FALSE)
  timeout_ms: 600000
result:
  content:
    - type: text
      text: |
        [1] FALSE
  isError: false
