---
!same-as MCP initialization for this execution mode
---
send:
  r: |
    defaults <- c(
      "tidyverse",
      "reticulate",
      "DBI",
      "duckdb",
      "arrow",
      "nanoarrow"
    )
    stopifnot(all(defaults %in% list.files(.libPaths()[[1L]])))
    stopifnot(identical(reticulate::py_require()$packages, c("numpy", "pandas")))
    cat("scientific defaults ready\n")
  timeout_ms: 0
result:
  content:
    - type: text
      text: |-

        [running; poll with an empty send]
  isError: false
---
send:
  timeout_ms: 0
result:
  content:
    - type: text
      text: |-

        [running; poll with an empty send]
  isError: false
---
send:
  timeout_ms: 600000
result:
  content:
    - type: text
      text: |
        scientific defaults ready
  isError: false
---
send:
  python: |
    import numpy, pandas

    print("Python defaults ready")
result:
  content:
    - type: text
      text: |
        Python defaults ready
  isError: false
---
send:
  sql: |
    SELECT extension_name
    FROM duckdb_extensions()
    WHERE installed AND extension_name IN ('icu', 'json')
    ORDER BY extension_name
result:
  content:
    - type: text
      text: |
        # A tibble: 2 × 1
          extension_name
          <string>      
        1 "icu"         
        2 "json"        
  isError: false
