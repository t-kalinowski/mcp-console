---
!same-as MCP initialization for this execution mode
---
send:
  r: shutdown output checkpoints
  timeout_ms: 40000
result:
  content:
    - type: text
      text: |
        before shutdown
    - type: image
      data: iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=
      mimeType: image/png
    - type: text
      text: |-
        after image
        [worker stopped before operation completed]
  isError: true
