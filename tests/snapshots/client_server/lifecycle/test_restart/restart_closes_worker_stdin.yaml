---
!same-as MCP initialization for this execution mode
---
send:
  r: wait for stdin close
  timeout_ms: 0
result:
  content:
    - type: text
      text: |-

        [running; poll with an empty send]
  isError: false
---
send:
  control: restart
result:
  content:
    - type: text
      text: |-
        zod stdin closed
        <large output>
        [active evaluation stopped by session restart request]
        [worker stopped: in-memory state lost]
        [starting new worker]
        [idle]
  isError: false
---
send:
  r: echo echo
result:
  content:
    - type: text
      text: |
        zod: echo
  isError: false
