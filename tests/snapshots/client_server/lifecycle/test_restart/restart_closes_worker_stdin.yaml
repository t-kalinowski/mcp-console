---
!same-as custom MCP initialization for this execution mode
---
send:
  r: wait for stdin close
  timeout_ms: 0
result:
  content:
    - type: text
      text: |-

        [running; poll with an empty send]
  isError: false
---
send:
  control: restart
result:
  content:
    - type: text
      text:
        text_bytes: 8050
        concat:
          - |
            zod stdin closed
          - repeat: x
            count: 3887
          - |

            [output omitted: 4186513 UTF-8 bytes; raw log on Console host: .agents/console/sessions/<run ID>/outputs/session.log]
          - repeat: y
            count: 3904
          - |-

            [active evaluation stopped by session restart request]
            [worker stopped: in-memory state lost]
            [starting new worker]
            [idle]
  isError: false
---
send:
  r: echo echo
result:
  content:
    - type: text
      text: |
        zod: echo
  isError: false
