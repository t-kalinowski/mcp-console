---
!same-as custom MCP initialization for this execution mode
---
send:
  requirements:
    action: get
  timeout_ms: 600000
result:
  content:
    - type: text
      text: |-
        {
          "requirements": {
            "r": [],
            "python": [],
            "duckdb": [],
            "python_version": [],
            "exclude_newer": null
          },
          "prepared": false,
          "runtime_requirements": {
            "r": [
              "DBI",
              "duckdb",
              "jsonlite"
            ],
            "python": []
          }
        }
  structuredContent:
    requirements:
      r: []
      python: []
      duckdb: []
      python_version: []
      exclude_newer: ~
    prepared: false
    runtime_requirements:
      r:
        - DBI
        - duckdb
        - jsonlite
      python: []
  isError: false
---
send:
  requirements:
    r:
      - blocked-standalone-resolver
result:
  content:
    - type: text
      text: "R package resolution failed with exit status: 130: "
  isError: true
---
send:
  control: interrupt
  timeout_ms: 0
result:
  content:
    - type: text
      text: |-

        [phase: dependency preparation]
        [running; poll with an empty send]
  isError: false
---
send:
  r: echo worker ready
result:
  content:
    - type: text
      text: |
        zod: worker ready
  isError: false
---
send:
  r: echo interrupted preparation cell ran
  requirements:
    r:
      - blocked-cell-resolver
result:
  content:
    - type: text
      text: "R package resolution failed with exit status: 130: "
  isError: true
---
send:
  control: interrupt
  timeout_ms: 0
result:
  content:
    - type: text
      text: |-

        [phase: dependency preparation]
        [running; poll with an empty send]
  isError: false
---
send:
  r: echo worker remains usable
result:
  content:
    - type: text
      text: |
        zod: worker remains usable
  isError: false
