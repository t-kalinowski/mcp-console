---
!same-as tests/snapshots/client_server/server/test_tools/initializes_and_lists_tools.direct.yaml
---
send:
  python: |
    import os
    from pathlib import Path

    temporary = Path(os.environ["TMPDIR"])
    Path("worker-temporary").write_text(str(temporary))
    parent = os.open(temporary, os.O_RDONLY | os.O_DIRECTORY)
    try:
        for _ in range(os.pathconf(temporary, "PC_PATH_MAX") // 64 + 1):
            name = "d" * 63
            os.mkdir(name, dir_fd=parent)
            child = os.open(name, os.O_RDONLY | os.O_DIRECTORY, dir_fd=parent)
            os.close(parent)
            parent = child
        os.fchmod(parent, 0o500)
    finally:
        os.close(parent)
    print("deep readonly storage created")
result:
  content:
    - type: text
      text: |
        deep readonly storage created
  isError: false
---
send:
  control: restart
result:
  content:
    - type: text
      text: |-
        [worker stopped: in-memory state lost]
        [starting new worker]
        [idle]
  isError: false
---
send:
  python: print('replacement ran')
result:
  content:
    - type: text
      text: |
        replacement ran
  isError: false
