---
!same-as tests/snapshots/client_server/server/test_tools/initializes_and_lists_tools.direct.yaml
---
send:
  python: |
    import os
    from pathlib import Path

    temporary = Path(os.environ["TMPDIR"])
    Path("worker-temporary").write_text(str(temporary))
    (temporary / "raced").mkdir()
    (temporary / "raced").chmod(0o500)
    (temporary / "vanishing").mkdir()
    (temporary / "retained.txt").write_text("private contents")
    Path("armed").touch()
    print("storage race armed")
result:
  content:
    - type: text
      text: |
        storage race armed
  isError: false
---
send:
  control: restart
result:
  content:
    - type: text
      text: |-
        [worker stopped: in-memory state lost]
        [starting new worker]
        [idle]
  isError: false
---
send:
  python: print('replacement ran')
result:
  content:
    - type: text
      text: |
        replacement ran
  isError: false
