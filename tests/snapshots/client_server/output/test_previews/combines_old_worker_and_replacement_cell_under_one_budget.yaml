---
!same-as custom MCP initialization for this execution mode
---
send:
  requirements:
    action: get
result:
  content:
    - type: text
      text: |-
        {
          "requirements": {
            "r": [],
            "python": [],
            "duckdb": [],
            "python_version": [],
            "exclude_newer": null
          },
          "runtime_requirements": {
            "r": [
              "DBI",
              "duckdb",
              "jsonlite"
            ],
            "python": []
          },
          "resolution": {
            "r": "automatic",
            "python": "automatic"
          },
          "selection": {
            "r": null,
            "python": null,
            "python_source": null
          },
          "prepared": false
        }
  structuredContent:
    requirements:
      r: []
      python: []
      duckdb: []
      python_version: []
      exclude_newer: ~
    runtime_requirements:
      r:
        - DBI
        - duckdb
        - jsonlite
      python: []
    resolution:
      r: automatic
      python: automatic
    selection:
      r: ~
      python: ~
      python_source: ~
    prepared: false
  isError: false
---
send:
  control: restart
result:
  content:
    - type: text
      text: |-
        [starting new worker]
        [idle]
  isError: false
---
send:
  r: overflow cell output file
  timeout_ms: 0
result:
  content:
    - type: text
      text: |-

        [elapsed: <elapsed>s since admission; no new output]
        [running; poll with an empty send]
  isError: false
---
send:
  control: restart
  r: preview huge line
result:
  content:
    - type: text
      text: |
        
        [output omitted: 41935302 UTF-8 bytes; retained logs: .agents/console/sessions/<run ID>/outputs/]

        [active evaluation stopped by session restart request]
        [worker stopped: in-memory state lost]
        [starting new worker]

        […]
        
        preview tail: final diagnostic
    - type: image
      data: iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=
      mimeType: image/png
    - type: text
      text: |-
        after final image
        [done]
  isError: false
---
send: {}
result:
  content:
    - type: text
      text: |-

        [idle]
  isError: false
