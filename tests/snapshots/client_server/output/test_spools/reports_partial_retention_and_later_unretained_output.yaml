---
!same-as custom MCP initialization for this execution mode
---
send:
  r: overflow cell output file
  timeout_ms: 0
result:
  content:
    - type: text
      text: |-

        [elapsed: <elapsed>s since admission; no new output]
        [running; poll with an empty send]
  isError: false
---
send:
  timeout_ms: 0
result:
  content:
    - type: text
      text:
        text_bytes: 8099
        concat:
          - repeat: x
            count: 3840
          - |

            [output omitted: 25158151 UTF-8 bytes; raw log: .agents/console/sessions/<run ID>/outputs/call-000001.log; logs contain prefixes; later raw text unavailable]
          - repeat: x
            count: 3840
          - |-

            [cell output file .agents/console/sessions/<run ID>/outputs/call-000001.log stopped after 25165827 retained bytes: File too large (os error 27); later text is not retained in this file]

            [elapsed: <elapsed>s since admission]
            [running; poll with an empty send]
  isError: false
---
send:
  timeout_ms: 0
result:
  content:
    - type: text
      text:
        text_bytes: 8094
        concat:
          - repeat: y
            count: 3968
          - |

            [output omitted: 8380679 UTF-8 bytes; raw log: .agents/console/sessions/<run ID>/outputs/call-000001.log; logs contain prefixes; later raw text unavailable]
          - repeat: y
            count: 3968
  isError: false
---
send:
  r: echo after failure
result:
  content:
    - type: text
      text: |
        zod: after failure
  isError: false
