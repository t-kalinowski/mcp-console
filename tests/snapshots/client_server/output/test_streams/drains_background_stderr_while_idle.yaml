---
!same-as custom MCP initialization for this execution mode
---
send:
  r: start background stderr
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  timeout_ms: 0
result:
  content:
    - type: text
      text:
        text_bytes: 8181
        concat:
          - |
            zod background stderr
          - repeat: x
            count: 3946
          - |

            [output preview: omitted <omitted byte count> rendered UTF-8 bytes; raw cell log: .agents/console/sessions/<run ID>/outputs/session.log (Console server recording workspace); <raw byte count> raw bytes retained, 0 raw bytes not retained]
          - repeat: y
            count: 3968
          - |-

            [idle]
  isError: false
