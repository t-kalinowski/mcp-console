---
!same-as custom MCP initialization for this execution mode
---
send:
  r: start background stderr
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  timeout_ms: 0
result:
  content:
    - type: text
      text:
        text_bytes: 8059
        concat:
          - |
            zod background stderr
          - repeat: x
            count: 3946
          - |

            [output omitted: <omitted byte count> UTF-8 bytes; raw log: .agents/console/sessions/<run ID>/outputs/session.log]
          - repeat: y
            count: 3968
          - |-

            [idle]
  isError: false
