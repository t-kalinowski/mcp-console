---
!same-as tests/snapshots/client_server/server/test_tools/initializes_and_lists_tools.custom.yaml
---
send:
  requirements:
    action: get
result:
  content:
    - type: text
      text: |-
        {
          "requirements": {
            "r": [],
            "python": [],
            "duckdb": [],
            "python_version": [],
            "exclude_newer": null
          },
          "runtime_requirements": {
            "r": [
              "DBI",
              "duckdb",
              "jsonlite"
            ],
            "python": []
          },
          "resolution": {
            "r": "automatic",
            "python": "automatic"
          },
          "selection": {
            "r": null,
            "python": null,
            "python_source": null
          },
          "prepared": false
        }
  structuredContent:
    requirements:
      r: []
      python: []
      duckdb: []
      python_version: []
      exclude_newer: ~
    runtime_requirements:
      r:
        - DBI
        - duckdb
        - jsonlite
      python: []
    resolution:
      r: automatic
      python: automatic
    selection:
      r: ~
      python: ~
      python_source: ~
    prepared: false
  isError: false
---
send:
  control: restart
result:
  content:
    - type: text
      text: |-
        [starting new worker]
        [idle]
  isError: false
---
send:
  r: kill relay and remain live
  timeout_ms: 0
result:
  content:
    - type: text
      text: |-

        [elapsed: <elapsed>s since admission; no new output]
        [running; poll with an empty send]
  isError: false
---
send: {}
result:
  content:
    - type: text
      text: |-
        zod worker pid: <worker pid>; relay process group: <relay process group>
        [worker relay stdout closed before retirement completed]
        [worker stopped: in-memory state lost]
        [starting new worker]
        [idle]
  isError: true
---
send:
  r: echo echo
result:
  content:
    - type: text
      text: |
        zod: echo
  isError: false
