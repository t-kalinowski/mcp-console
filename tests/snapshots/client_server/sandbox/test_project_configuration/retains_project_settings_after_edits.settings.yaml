---
initially_configured: true
validation_launches: 0
identical_worker_launches: 4
writable_roots:
  - workspace
network: restricted
proxy:
  enabled: true
  enableSocks5: true
  enableSocks5Udp: false
  allowUpstreamProxy: false
  dangerouslyAllowAllUnixSockets: false
  mode: full
  allowLocalBinding: false
  domains:
    127.0.0.1: allow
