---
scenario: sandbox defaults
runner_configuration:
  filesystem:
    kind: restricted
    entries:
      - path:
          type: special
          value:
            kind: root
        access: read
  network: restricted
  version: 2
  lifecycle:
    private_tmp:
      environment:
        - TMPDIR
transcript_normalization:
  host_directory: omitted
  server_pid: omitted
---
scenario: sandbox with roots
runner_configuration:
  filesystem:
    kind: restricted
    entries:
      - path:
          type: special
          value:
            kind: root
        access: read
      - path:
          type: path
          path: <host directory>/output café 雪
        access: write
      - path:
          type: path
          path: <host directory>/cache
        access: write
      - path:
          type: path
          path: <host directory>/future output
        access: write
  network: restricted
  version: 2
  lifecycle:
    private_tmp:
      environment:
        - TMPDIR
transcript_normalization:
  host_directory: omitted
  server_pid: omitted
