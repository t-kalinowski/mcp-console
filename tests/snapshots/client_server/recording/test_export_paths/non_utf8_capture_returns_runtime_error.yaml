---
!same-as MCP initialization for this execution mode
---
send:
  r: token <- new.env(); writeLines('original worker')
result:
  content:
    - type: text
      text: |
        original worker
  isError: false
---
send:
  r: paths <- .console$export_session("report")
result:
  content:
    - type: text
      text: |
        Error: session export requires a UTF-8 recording path
  isError: false
---
send:
  r: stopifnot(is.environment(token)); writeLines('same worker')
result:
  content:
    - type: text
      text: |
        same worker
  isError: false
