---
!same-as MCP initialization for this execution mode
---
send:
  r: token <- new.env(); cat("ready\n")
result:
  content:
    - type: text
      text: |
        ready
  isError: false
---
send:
  python: |
    import os

    os.mkdir(b"destination-\xff")
    os.chdir(b"destination-\xff")
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  r: .console$export_session("reports/r")
result:
  content:
    - type: text
      text: |
        Error: export destination requires a UTF-8 path
  isError: false
---
send:
  python: _console.export_session("reports/python")
result:
  content:
    - type: text
      text: |
        Traceback (most recent call last):
          File "<mcp-console:python:e2>", line 1, in <module>
          File "<string>", line 376, in export_session
        RuntimeError: export destination requires a UTF-8 path
  isError: false
---
send:
  python: os.chdir("..")
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  r: >-
    stopifnot(is.environment(token)); paths <-
    .console$export_session("report")
result:
  content:
    - type: text
      text: "[done]"
  isError: false
