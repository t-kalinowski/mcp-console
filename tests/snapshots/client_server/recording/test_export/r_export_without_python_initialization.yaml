---
!same-as MCP initialization for this execution mode
---
send:
  r: counter <- 1L; cat("original R result\n")
result:
  content:
    - type: text
      text: |
        original R result
  isError: false
---
send:
  r: >-
    paths <- .console$export_session("report"); stopifnot(counter == 1L,
    !reticulate::py_available(initialize = FALSE))
result:
  content:
    - type: text
      text: "[done]"
  isError: false
