---
!same-as MCP initialization for this execution mode
---
send:
  python: print('permission probe')
result:
  content:
    - type: text
      text: |
        permission probe
  isError: false
---
send:
  python: _console.export_session('denied')
result:
  content:
    - type: text
      text: |
        Traceback (most recent call last):
          File "<mcp-console:python:e2>", line 1, in <module>
          File "<string>", line 376, in export_session
        RuntimeError: cannot create export destination denied (it must not already exist): Read-only file system (os error 30)
