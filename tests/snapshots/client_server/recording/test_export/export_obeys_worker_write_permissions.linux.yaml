---
send:
  python: paths = _console.export_session('allowed/report')
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  python: >-
    _console.export_session('<workspace>/.agents/console/sessions/<recording
    ID>/working')
result:
  content:
    - type: text
      text: |
        Traceback (most recent call last):
          File "<mcp-console:python:e4>", line 1, in <module>
          File "<string>", line 376, in export_session
        RuntimeError: export destination must be outside the managed recording
  isError: false
