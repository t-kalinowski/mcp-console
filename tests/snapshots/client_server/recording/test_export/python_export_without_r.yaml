---
!same-as python-only MCP initialization for this execution mode
---
input:
  method: ping
result: {}
---
send:
  requirements:
    action: get
result:
  content:
    - type: text
      text: |-
        {
          "requirements": {
            "r": [],
            "python": [],
            "duckdb": [],
            "python_version": [],
            "exclude_newer": null
          },
          "prepared": false,
          "runtime_requirements": {
            "r": [],
            "python": []
          }
        }
  structuredContent:
    requirements:
      r: []
      python: []
      duckdb: []
      python_version: []
      exclude_newer: ~
    prepared: false
    runtime_requirements:
      r: []
      python: []
  isError: false
---
send:
  python: counter = 1; print('original result')
result:
  content:
    - type: text
      text: |
        startup result
        Traceback (most recent call last):
          File "<string>", line 499, in initialize_connection
        RuntimeError: startup must select a native connection with _console.sql_connection(connection)
        Error: configured startup did not complete; SQL withheld; explicit restart required
        original result
  isError: false
---
send:
  python: raise ValueError('retained failure')
result:
  content:
    - type: text
      text: |
        Traceback (most recent call last):
          File "<mcp-console:python:e2>", line 1, in <module>
        ValueError: retained failure
  isError: false
---
send:
  python: print('x' * 20000)
result:
  content:
    - type: text
      text: |
        
        [output omitted: 12065 UTF-8 bytes; raw log: .agents/console/sessions/<recording ID>/capture/sessions/001/cell-003.txt]
        
  isError: false
---
send:
  python: paths = _console.export_session('report'); print(counter)
result:
  content:
    - type: text
      text: |
        1
  isError: false
---
send:
  python: _console.export_session('report')
result:
  content:
    - type: text
      text: |
        Traceback (most recent call last):
          File "<mcp-console:python:e5>", line 1, in <module>
          File "<string>", line 376, in export_session
        RuntimeError: cannot create export destination report (it must not already exist): File exists (os error 17)
  isError: false
---
send:
  control: restart
  python: print('replacement result')
result:
  content:
    - type: text
      text: |-
        [worker stopped: in-memory state lost]
        [starting new worker]
        startup result
        Traceback (most recent call last):
          File "<string>", line 499, in initialize_connection
        RuntimeError: startup must select a native connection with _console.sql_connection(connection)
        Error: configured startup did not complete; SQL withheld; explicit restart required
        replacement result
        [done]
  isError: false
---
send:
  python: paths = _console.export_session('replacement')
result:
  content:
    - type: text
      text: "[done]"
  isError: false
