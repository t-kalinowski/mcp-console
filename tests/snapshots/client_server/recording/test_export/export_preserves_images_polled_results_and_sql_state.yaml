---
!same-as MCP initialization for this execution mode
---
send:
  sql: CREATE TABLE export_once AS SELECT 7 AS value
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  sql: INSERT INTO export_once VALUES (11) RETURNING value
result:
  content:
    - type: text
      text: |
        # A tibble: 1 × 1
            value
          <int32>
        1      11
  isError: false
---
send:
  r: |
    counter <- 1L
    cat("before plot\n")
    plot(1:3)
    cat("after plot\n")
    stop("recorded error")
result:
  content:
    - type: text
      text: |
        before plot
        after plot
        Error: recorded error
    - type: image
      data: <PNG byte-identical to exported and copied image>
      mimeType: image/png
  isError: false
---
send:
  r: >-
    answer <- readline("export gate: "); cat("later result:", answer, "\n")
  timeout_ms: 60000
result:
  content:
    - type: text
      text: |-
        [input requested: "export gate: "]
        [waiting for stdin]
  isError: false
---
send:
  stdin: |
    released
  timeout_ms: 60000
result:
  content:
    - type: text
      text: |
        later result: released 
  isError: false
---
send:
  r: paths <- .console$export_session("report"); stopifnot(counter == 1L)
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  r: >-
    stopifnot(identical(DBI::dbGetQuery(.console$sql_connection(), "SELECT
    value FROM export_once ORDER BY value")$value, c(7L, 11L)))
result:
  content:
    - type: text
      text: "[done]"
  isError: false
