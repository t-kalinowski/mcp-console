---
!same-as python-only MCP initialization for this execution mode
---
send:
  python: print('ready')
result:
  content:
    - type: text
      text: |
        ready
  isError: false
---
send:
  timeout_ms: 0
  python: |
    import os
    from pathlib import Path
    from threading import Thread


    def produce_during_export():
        with Path("produce").open("rb", buffering=0) as gate:
            assert gate.read(1) == b"1"
        os.write(1, b"observed while export is held\n")
        with Path("produced").open("wb", buffering=0) as gate:
            gate.write(b"1")


    Thread(target=produce_during_export, daemon=True).start()
    paths = _console.export_session("report")
    print("retired export returned")
result:
  content:
    - type: text
      text: |-

        [elapsed: <elapsed>s since admission; no new output]
        [running; poll with an empty send]
  isError: false
---
send:
  timeout_ms: 3000
result:
  content:
    - type: text
      text: |-
        observed while export is held

        [elapsed: <elapsed>s since admission]
        [running; poll with an empty send]
  isError: false
---
send:
  control: restart
  python: print('replacement responsive')
result:
  content:
    - type: text
      text: |-
        Traceback (most recent call last):
          File "<mcp-console:python:e2>", line 15, in <module>
          File "<string>", line 376, in export_session
        RuntimeError: session export interrupted by shutdown
        [active evaluation stopped by session restart request]
        [worker stopped: in-memory state lost]
        [starting new worker]
        replacement responsive
        [done]
  isError: false
---
send:
  python: paths = _console.export_session('replacement')
result:
  content:
    - type: text
      text: "[done]"
  isError: false
