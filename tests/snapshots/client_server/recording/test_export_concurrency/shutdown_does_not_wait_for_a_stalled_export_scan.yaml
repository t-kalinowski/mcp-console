---
!same-as python-only MCP initialization for this execution mode
---
send:
  python: print('ready')
result:
  content:
    - type: text
      text: |
        ready
  isError: false
---
send:
  python: paths = _console.export_session('report')
  timeout_ms: 0
result:
  content:
    - type: text
      text: |-

        [elapsed: <elapsed>s since admission; no new output]
        [running; poll with an empty send]
  isError: false
