---
languages: r,python
language_guidance: >-
  Persistent R and Python workbench for local execution on Windows. SQL is not
  yet supported. Send one complete `r` or `python` cell per call. Inspect its
  output and reuse persistent objects. Results display automatically; supported
  plots return as images. For a reusable R script, include imports, data inputs,
  and `#| packages:`/`#| r-version:` metadata for `ir run script.R`, which
  starts without live Console objects.


  Run one cell at a time. Wait for its `send` to return before another call with
  code. You can interrupt a pending call with `send(control="interrupt")`. An
  error can leave earlier changes in place. If work is still running, poll with
  an empty `send` until it finishes; do not resubmit the cell.


  Text results, including notices, have an 8 KiB limit, retaining the beginning
  and latest tail; images have separate limits. Response notices report state
  and omitted-output locations.


  Evaluated code runs without a sandbox, with the server's permissions,
  including filesystem and network access. Package preparation may execute
  installation or build code; use only trusted dependencies.
preparation_error:
  content:
    - type: text
      text: >-
        Python sessions without R require `uv` on PATH; set python in
        .agents/console/config.yaml to use an existing environment
  isError: true
stderr: >
  Python sessions without R require `uv` on PATH; set python in
  .agents/console/config.yaml to use an existing environment
