---
languages: r,python
language_guidance: >-
  Persistent R and Python workbench for local execution on Windows. State
  persists across calls. Enabled runtimes initialize in the background and can
  run without the other installed. With both runtimes and reticulate available,
  Python reads R globals through r.name and R can use reticulate to access
  Python. Managed R and Python requirements are prepared by ir and uv on the
  host. Explicit Python selections use preinstalled packages. SQL is not yet
  supported.


  Send one complete `r` or `python` cell per call. Code-bearing calls must be
  sequential; a control-only interrupt may overlap a pending `send`. Inspect
  intermediate results before submitting dependent cells. Cells are not
  transactional; changes made before an error may remain.


  Omit code to poll, supply stdin, control the session, or prepare requirements
  when available. If a response ends in `[running; poll with an empty send]`,
  call `send` again without code or stdin; do not resubmit the cell. Send
  `stdin` alone to answer an active prompt or debugger. Field descriptions
  specify preparation, control, and timeout ordering.


  Each result has at most 8 KiB of UTF-8 text, including notices; oversized
  output keeps its beginning and latest tail. Images have separate limits.
  Retained raw-log paths are relative to the server's launch directory for
  project recordings and absolute for home recordings. Full retained text
  requires filesystem access there through existing tools; Console provides no
  read/search interface.


  Evaluated code runs without a sandbox, with the server's permissions,
  including filesystem and network access. Dependency resolution, when
  available, may execute installation or build code; use only trusted
  dependencies.
preparation_error:
  content:
    - type: text
      text: >-
        Python sessions without R require `uv` on PATH; set python in
        .agents/console/config.yaml to use an existing environment
  isError: true
stderr: >
  Python sessions without R require `uv` on PATH; set python in
  .agents/console/config.yaml to use an existing environment
