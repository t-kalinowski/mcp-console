---
languages: r,python
language_guidance: >-
  Persistent R and Python workbench for local execution on Windows. SQL is not
  yet supported. Send one complete `r` or `python` cell per call. Inspect its
  output and reuse persistent objects. Results display automatically; supported
  plots return as images.


  Language fields describe the configured interface, not installed runtimes.
  Managed resolution needs execution-host resolver support. Bare runtimes and
  explicitly selected Python use preinstalled packages.


  Code-bearing calls must be sequential; a control-only interrupt may overlap a
  pending `send`. Cells are not transactional; effects before an error may
  remain. Poll running work with an empty `send`; do not resubmit the cell.


  Text results, including notices, have an 8 KiB limit, retaining the beginning
  and latest tail; images have separate limits. Response notices report state
  and omitted-output locations.


  Evaluated code runs without a sandbox, with the server's permissions,
  including filesystem and network access. Dependency resolution, when
  available, may execute installation or build code; use only trusted
  dependencies.
preparation_error:
  content:
    - type: text
      text: >-
        Python sessions without R require `uv` on PATH; set python in
        .agents/console/config.yaml to use an existing environment
  isError: true
stderr: >
  Python sessions without R require `uv` on PATH; set python in
  .agents/console/config.yaml to use an existing environment
