---
!same-as MCP initialization for this execution mode
---
send:
  requirements:
    action: get
result:
  content:
    - type: text
      text: |-
        {
          "requirements": {
            "r": [],
            "python": [],
            "duckdb": [],
            "python_version": [],
            "exclude_newer": null
          },
          "startup_requirements": {
            "r": [],
            "python": [],
            "duckdb": [],
            "python_version": [],
            "exclude_newer": null
          },
          "resolution": {
            "r": "automatic",
            "python": "disabled"
          },
          "selection": {
            "r": "<selected R home>",
            "python": "<selected Python>",
            "python_source": "RETICULATE_PYTHON"
          },
          "prepared": false,
          "runtime_requirements": {
            "r": [],
            "python": []
          }
        }
  structuredContent:
    requirements:
      r: []
      python: []
      duckdb: []
      python_version: []
      exclude_newer: ~
    startup_requirements:
      r: []
      python: []
      duckdb: []
      python_version: []
      exclude_newer: ~
    resolution:
      r: automatic
      python: disabled
    selection:
      r: <selected R home>
      python: <selected Python>
      python_source: RETICULATE_PYTHON
    prepared: false
    runtime_requirements:
      r: []
      python: []
  isError: false
---
send:
  r: answer <- 41L; answer + 1L
result:
  content:
    - type: text
      text: |
        [1] 42
  isError: false
---
send:
  control: restart
result:
  content:
    - type: text
      text: |-
        [worker stopped: in-memory state lost]
        [starting new worker]
        [idle]
  isError: false
---
send:
  r: answer <- 41L; answer + 1L
result:
  content:
    - type: text
      text: |
        [1] 42
  isError: false
