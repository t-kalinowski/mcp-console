---
!same-as tests/snapshots/client_server/server/test_tools/initializes_and_lists_tools.ssh.yaml
---
send:
  r: |
    x <- 41
    x + 1
result:
  content:
    - type: text
      text: |
        [1] 42
  isError: false
---
send:
  r: |
    stopifnot(
      getwd() == "<ssh-test>/remote workspace",
      Sys.getenv("CONSOLE_SSH_LITERAL") == "remote environment value"
    )
    x
result:
  content:
    - type: text
      text: |
        [1] 41
  isError: false
---
send:
  r: x <- -1
  control: restart
  requirements:
    r:
      - praise
  stdin: |
    unwanted
result:
  content:
    - type: text
      text: >-
        dynamic environment resolution is unavailable; install `ir` or `uv` and
        restart MCP Console
  isError: true
---
send:
  r: x
result:
  content:
    - type: text
      text: |
        [1] 41
  isError: false
---
send:
  python: |
    import os
    import sys

    answer = 42
    print(answer)
    print(sys.executable == os.environ["RETICULATE_PYTHON"])
result:
  content:
    - type: text
      text: |
        42
        True
  isError: false
---
send:
  python: |
    _ = os.write(1, b"raw output\n")
    with open("raw-output-release", "rb", buffering=0) as gate:
        assert gate.read(1) == b"1"
  timeout_ms: 1
result:
  content:
    - type: text
      text: |-
        raw output

        [running; poll with an empty send]
  isError: false
---
send: {}
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  python: |-
    try:
        import mcpConsoleDefinitelyMissingPackage
    except ModuleNotFoundError as error:
        print(error)
result:
  content:
    - type: text
      text: >
        No module named 'mcpConsoleDefinitelyMissingPackage'.


        MCP Console dynamic environment resolution is unavailable. Install the
        distribution into the ambient Python environment, or install `ir` or
        `uv` and restart MCP Console.
  isError: false
---
send:
  sql: SELECT 6 * 7 AS answer
result:
  content:
    - type: text
      text: |
        # A tibble: 1 × 1
           answer
          <int32>
        1      42
  isError: false
---
send:
  python: "print(input('remote prompt: '))"
result:
  content:
    - type: text
      text: |-
        [input requested: "remote prompt: "]
        [waiting for stdin]
  isError: false
---
send:
  stdin: |
    interactive value
result:
  content:
    - type: text
      text: |
        interactive value
  isError: false
---
send:
  r: plot(1:3)
result:
  content:
    - type: image
      data: <PNG byte-identical to local recording artifact>
      mimeType: image/png
  isError: false
---
send:
  r: |
    local({
      checkpoint <- fifo("loop-started", open = "wb", blocking = TRUE)
      writeBin(charToRaw("1"), checkpoint)
      close(checkpoint)
      repeat {
        Sys.sleep(60)
      }
    })
  timeout_ms: 1
result:
  content:
    - type: text
      text: |-

        [running; poll with an empty send]
  isError: false
---
send:
  control: interrupt
result:
  content:
    - type: text
      text: "\n"
  isError: false
---
send:
  r: x
result:
  content:
    - type: text
      text: |
        [1] 41
  isError: false
---
send:
  control: restart
result:
  content:
    - type: text
      text: |-
        [worker stopped: in-memory state lost]
        [starting new worker]
        [idle]
  isError: false
---
send:
  r: exists('x')
result:
  content:
    - type: text
      text: |
        [1] FALSE
  isError: false
---
send:
  r: quit(save='no', status=23)
result:
  content:
    - type: text
      text: |-
        [worker sideband read failed: worker sideband closed]
        [worker exited with status 23]
        [worker stopped: in-memory state lost]
        [starting new worker]
        [idle]
  isError: true
---
send:
  r: exists('x')
result:
  content:
    - type: text
      text: |
        [1] FALSE
  isError: false
