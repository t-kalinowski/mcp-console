---
send:
  r: one_cell_only <- TRUE
result:
  content:
    - type: text
      text: >-
        [worker relay stdout read failed: incompatible SSH bootstrap: expected
        protocol 2, Console 0.0.3; received protocol 999, Console 0.0.3;
        additionally failed to stop the worker: remote retirement is unconfirmed
        (SSH exit is not a cleanup barrier)]
  isError: true
---
send:
  r: must_not_replay <- TRUE
result:
  content:
    - type: text
      text: >-
        SSH target 'console-test' retirement is unconfirmed; this session cannot
        start a replacement
  isError: true
---
send:
  control: restart
  r: must_not_replace <- TRUE
result:
  content:
    - type: text
      text: >-
        SSH target 'console-test' retirement is unconfirmed; this session cannot
        start a replacement
  isError: true
---
standard_error: ""
