---
languages:
  - sql
  - python
provider: Python
---
!same-as sql-python MCP initialization for this execution mode
---
send:
  python: |
    import pandas as pd

    frame = pd.DataFrame({"value": [19, 23]})
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  python: _ = sql_connection().register("visible_frame", frame)
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  sql: SELECT sum(value) AS answer FROM visible_frame
result:
  content:
    - type: text
      text: |
        answer
        ------
        42
  isError: false
