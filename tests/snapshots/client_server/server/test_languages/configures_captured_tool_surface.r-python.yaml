---
languages:
  - r
  - python
---
input:
  method: initialize
  params:
    protocolVersion: 2025-11-25
    capabilities: {}
    clientInfo:
      name: acceptance-test
      version: 1.0.0
result:
  protocolVersion: 2025-11-25
  capabilities:
    tools: {}
  serverInfo:
    name: mcp-console
    version: 0.0.4
---
input:
  method: notifications/initialized
---
input:
  method: tools/list
result:
  tools:
    - name: send
      description: >-
        Persistent custom-worker workbench. Send one complete `r` or `python`
        cell per call. Inspect its output and reuse persistent objects.


        Language fields describe the configured interface; evaluation, display,
        connections, and sharing depend on the worker. Console does not supply
        built-in runtime packages, import hooks, or a default database
        connection. Managed requirements require host resolver support and
        compatible worker callbacks; registry package preparation is
        unavailable. Switch languages when useful, using the worker's
        capabilities.


        Code-bearing calls must be sequential; a control-only interrupt may
        overlap a pending `send`. Cells are not transactional; effects before an
        error may remain. Poll running work with an empty `send`; do not
        resubmit the cell.


        Text results, including notices, have an 8 KiB limit, retaining the
        beginning and latest tail; images have separate limits. Response notices
        report state and omitted-output locations.


        Evaluated code runs without a sandbox, with the server's permissions,
        including filesystem and network access. Dependency resolution, when
        available, may execute installation or build code; use only trusted
        dependencies.
      inputSchema:
        $schema: https://json-schema.org/draft/2020-12/schema
        additionalProperties: false
        type: object
        properties:
          r:
            description: One complete R cell, if supported by the custom worker.
            type:
              - string
              - "null"
          python:
            description: >-
              One complete Python cell, if supported by the custom worker.
            type:
              - string
              - "null"
          control:
            description: >-
              Apply control before same-call input/code. `interrupt` requests SIGINT
              from the active host resolver or a cooperative interrupt from the
              worker, preserving live state. A following cell runs only if prior work
              stops. `restart` discards live state, including debugger and unread
              input; same-call stdin/code go only to the replacement. Requirements
              resolve before replacement; resolution failure preserves the current
              worker.
            type: string
            enum:
              - interrupt
              - restart
          requirements:
            description: >-
              Inspect declarations or prepare dependencies on the execution host
              without importing, attaching, or loading them. Alone, performs
              standalone preparation. With a cell, preparation precedes code; without
              control it also precedes bundled stdin. Failure or a required restart
              withholds the cell. Compatible additions preserve live state on an idle
              worker; other changes need restart. With restart, candidate resolution
              precedes replacement; resolution failure preserves the current worker
              and sends no stdin/code. Standalone preparation rejects nonempty stdin.
              Only add can accompany interrupt, with a following cell; providers
              without this preparation support reject the combination before signaling
              or input. Otherwise interrupt and stdin precede deferred
              validation/preparation and are not rolled back on failure.
            type:
              - object
              - "null"
            properties:
              action:
                description: |-
                  get reads the retained declaration, not an installed-package inventory, without starting a
                  worker or consuming output; use it alone, without code, stdin, control, or payload fields.
                  The complete declaration is in structuredContent.requirements.
                  add (default) accumulates up to 64 entries per language per call; bare {} is invalid.
                  set replaces the whole declaration without defaults; omitted lists/constraints are empty,
                  even with only action supplied. reset restores startup defaults and rejects payload fields.
                  Changed set/reset with a live worker require control="restart"; unchanged declarations are
                  no-ops. set accepts the complete accumulated manifest without add's per-list limit.
                type: string
                enum:
                  - get
                  - add
                  - set
                  - reset
              python_version:
                description: |-
                  Python version numbers or ==, !=, <, <=, >, >= constraints (e.g. >=3.11).
                  add appends; changes with a live worker require control="restart".
                type: array
                items:
                  type: string
              exclude_newer:
                description: |-
                  Package publication cutoff accepted by uv, e.g. "2026-01-01".
                  set clears an omitted/null cutoff; add preserves omission and cannot replace an existing one.
                type:
                  - string
                  - "null"
              duckdb:
                description: |-
                  Managed DuckDB extension names, e.g. fts or spatial: lowercase ASCII letter first, then
                  lowercase letters, digits, or underscores (at most 64 characters).
                  Use DuckDB's LOAD or automatic loading after preparation.
                type: array
                items:
                  type: string
                  minLength: 1
                  maxLength: 64
              r:
                description: >-
                  Single-line ir package references for host-provider preparation, e.g.
                  DBI or duckdb, including supported remote references; local sources and
                  NUL/line breaks are rejected. Use when a provider notice requests
                  preparation.
                type: array
                items:
                  type: string
                  minLength: 1
              python:
                description: >-
                  Named PEP 508 registry requirements for host-provider preparation, e.g.
                  duckdb>=1, with versions, extras, or markers. Paths, URLs, editable
                  requirements, direct references, and local sources are rejected. Bare or
                  user-selected environments and custom workers disable managed registry
                  requirements.
                type: array
                items:
                  type: string
                  minLength: 1
            additionalProperties: false
          stdin:
            description: >-
              Send stdin alone to answer an active read, prompt, or debugger. UTF-8
              text is queued exactly; no newline is added, so line input normally
              needs a trailing `\n`. Empty text queues nothing. With a cell, input
              queues before code; an already waiting read may consume it first,
              including while interrupted work unwinds. Unread input can satisfy later
              reads; restart discards it.
            type:
              - string
              - "null"
          timeout_ms:
            description: >-
              Wait budget in milliseconds (default 60,000); omit for ordinary calls.
              `0` starts background work without waiting for completion. Expiry
              returns available output without cancelling execution, startup, or
              resolution. This is not a whole-call deadline: explicit preparation and
              lifecycle control may exceed it; standalone preparation is not limited
              by it.
            type: integer
            format: uint64
            minimum: 0
            default: 60000
