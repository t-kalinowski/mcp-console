---
languages:
  - sql
  - python
provider: R
---
!same-as sql-python MCP initialization for this execution mode
---
send:
  python: |
    import pandas as pd

    frame = pd.DataFrame({"value": [19, 23]})
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  python: r.visible_frame = frame
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  sql: SELECT sum(value) AS answer FROM visible_frame
result:
  content:
    - type: text
      text: |
        # A tibble: 1 × 1
            answer
          <double>
        1     42.0
  isError: false
