              are part of the restart transaction, with or without a cell. Only
              add can accompany interrupt, and only when a cell follows. When
              the provider cannot prepare during interrupt, the call is rejected
              before signaling or queuing input; prepare separately or use
              restart. Preparation does not import, attach, or load
              dependencies. On a code-bearing call without control, preparation
              completes before same-call nonempty stdin is queued. Standalone
              preparation cannot queue nonempty stdin. With restart, failure
              leaves the current worker unchanged and sends neither stdin nor
