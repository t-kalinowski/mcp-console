languages:
  - sql
---
!same-as tests/snapshots/client_server/server/test_tools/initializes_and_lists_tools.custom-sql.direct.yaml
---
languages:
  - sql
  - python
---
input:
  method: initialize
  params:
    protocolVersion: 2025-11-25
    capabilities: {}
    clientInfo:
      name: acceptance-test
      version: 1.0.0
result:
  protocolVersion: 2025-11-25
  capabilities:
    tools: {}
  serverInfo:
    name: mcp-console
    version: 0.0.4
---
input:
  method: notifications/initialized
---
input:
  method: tools/list
result:
  tools:
    - name: send
      description: >-
        Persistent custom-worker workbench. Language fields describe the
        configured interface; evaluation, display, database connections, and
        sharing depend on the selected worker. Console does not supply built-in
        runtime packages, automatic import hooks, or a default database
        connection to custom workers. Managed requirements require
        execution-host resolver support and compatible worker preparation
        callbacks; registry package preparation is unavailable with a custom
        worker. Switch languages when useful, using capabilities supplied by the
        worker.


        Send one complete `python` or `sql` cell per call. Code-bearing calls
        must be sequential; a control-only interrupt may overlap a pending
        `send`. Inspect intermediate results before submitting dependent cells.
        Cells are not transactional; changes made before an error may remain.


        Omit code to poll, supply stdin, control the session, or prepare
        requirements when available. If a response ends in `[running; poll with
        an empty send]`, call `send` again without code or stdin; do not
        resubmit the cell. Send `stdin` alone to answer an active prompt or
        debugger. Field descriptions specify preparation, control, and timeout
        ordering.


        Each result has at most 8 KiB of UTF-8 text, including notices;
        oversized output keeps its beginning and latest tail. Images have
        separate limits. Retained raw-log paths are relative to the server's
        launch directory for project recordings and absolute for home
        recordings. Full retained text requires filesystem access there through
        existing tools; Console provides no read/search interface.


        Evaluated code runs without a sandbox, with the server's permissions,
        including filesystem and network access. Dependency resolution, when
        available, may execute installation or build code; use only trusted
        dependencies.
      inputSchema:
        $schema: https://json-schema.org/draft/2020-12/schema
        additionalProperties: false
        type: object
        properties:
          python:
            description: >-
              One complete Python cell, if supported by the custom worker. Evaluation,
              display, packages, graphics, and bridges are supplied by that worker.
              Omit for polling or stdin-only calls.
            type:
              - string
              - "null"
          sql:
            description: >-
              One complete SQL cell, if supported by the custom worker. Its selected
              connection supplies the dialect, packages, and result display. Console
              does not create a default database for a custom worker. Omit for polling
              or stdin-only calls.
            type:
              - string
              - "null"
          control:
            description: |-
              Applies lifecycle control alone or before compatible same-call fields. `interrupt` requests
              SIGINT from the active host resolver or live worker and preserves in-memory state. After
              successful delivery, stdin is queued and `send` waits 100 milliseconds before observing the
              earlier evaluation or attempting an optional following cell; the cell is not run if the
              interrupted evaluation remains active. When `requirements` is available, restart resolves
              same-call requirements before replacement. It then discards in-memory, debugger, and
              unread-stdin state and sends same-call stdin and code only to the replacement.
            type: string
            enum:
              - interrupt
              - restart
          requirements:
            description: >-
              Inspect or manage retained package and database-extension
              requirements. action=get returns a read-only snapshot, including
              runtime constraints and separate infrastructure. It cannot
              accompany code, stdin, control, or payload fields. The complete
              manifest is in structuredContent.requirements even when it exceeds
              the text preview limit. action=add is the default; action=set
              replaces the whole declaration without injecting defaults;
              action=reset restores startup defaults. Changed replacements
              require control="restart" with a live worker. Empty set means no
              optional requirements; bare {} is invalid.


              Requirements alone perform standalone preparation. With one cell,
              they are preconditions of that cell. With control="restart", they
              are part of the restart transaction, with or without a cell. Only
              add can accompany interrupt, and only when a cell follows. When
              the provider cannot prepare during interrupt, the call is rejected
              before signaling or queuing input; prepare separately or use
              restart. Preparation does not import, attach, or load
              dependencies. On a code-bearing call without control, preparation
              completes before same-call nonempty stdin is queued. Standalone
              preparation cannot queue nonempty stdin. With restart, failure
              leaves the current worker unchanged and sends neither stdin nor
              code. With add, interrupt, and a following cell, signal delivery
              and stdin enqueue happen before requirements are validated or
              prepared and are not rolled back if that later work fails. SQL
              does not trigger package discovery. Provider preparation may
              require fields whose direct code language is hidden; follow the
              missing-provider diagnostic. A cell is not run if explicit
              preparation fails or further changes require restart. Resolution
              uses the execution host's resolver policy and may download
              packages or extensions or execute installation or build code. Use
              only trusted requirements.
            type:
              - object
              - "null"
            properties:
              action:
                description: |-
                  get inspects the committed declaration without starting a worker or consuming output.
                  add (default) accumulates requirements. set replaces all lists and Python constraints;
                  omitted fields are empty, including when only action is supplied. reset restores startup
                  defaults. get and reset reject payload fields. Changed set/reset with a live worker require
                  control="restart"; the complete candidate resolves before the old worker is retired.
                  add accepts up to 64 entries per language per call; set accepts the complete accumulated manifest.
                type: string
                enum:
                  - get
                  - add
                  - set
                  - reset
              python_version:
                description: |-
                  Python version constraints, preserved by get and replaced as a whole by set. Add appends
                  constraints; changing constraints with a live worker requires control="restart".
                type: array
                items:
                  type: string
              exclude_newer:
                description: |-
                  Python package publication cutoff accepted by uv, for example "2026-01-01". set clears an
                  omitted or null cutoff; add preserves an omitted cutoff and cannot replace an existing one.
                type:
                  - string
                  - "null"
              duckdb:
                description: |-
                  DuckDB extension names for the managed DuckDB backend, for standalone preparation,
                  preparation before a cell, or a restart transaction, for example `fts`, `spatial`, or `excel`.
                  JSON and ICU are included in built-in defaults. Names must start with a lowercase ASCII
                  letter and contain only lowercase ASCII letters, digits, and underscores. The host resolver
                  uses DuckDB's own `INSTALL`, with DuckDB's default extension repository and
                  native cache. Preparation does not load extension code; `LOAD` and automatic loading happen
                  later inside the worker.
                type: array
                items:
                  type: string
                  minLength: 1
                  maxLength: 64
              r:
                description: >-
                  Single-line ir package references for host-provider preparation, for
                  example DBI or duckdb. Use this field when a provider diagnostic
                  requests it, for standalone preparation, preparation before a cell, or a
                  restart transaction. An idle worker with a compatible package adapter
                  can add requirements without losing live state. Local package sources
                  are rejected by the managed resolution contract.
                type: array
                items:
                  type: string
                  minLength: 1
              python:
                description: >-
                  Named PEP 508 registry requirements for host-provider preparation, for
                  example duckdb>=1. Use this field when a provider diagnostic requests
                  it, for standalone preparation, preparation before a cell, or a restart
                  transaction. Paths, file URLs, editable requirements, direct references,
                  local archives, and local projects are rejected. Preparation does not
                  import the package. A server-managed worker may activate compatible
                  additions without losing state. A user-selected environment disables
                  managed registry requirements; a custom worker does not support them.
                type: array
                items:
                  type: string
                  minLength: 1
            additionalProperties: false
          stdin:
            description: |-
              Input for an active read, prompt, or debugger. When responding to active input, omit code and send stdin on its own. Its UTF-8 encoding is queued exactly; no newline is added.
              Line-oriented input therefore normally needs a trailing `\n`. On a code-bearing call without
              control, available requirements are prepared before nonempty stdin is queued. Standalone
              preparation cannot queue nonempty stdin. After `interrupt`, nonempty stdin is queued before the
              100-millisecond grace and may be consumed while the earlier operation unwinds. After `restart`,
              same-call stdin is sent only to the replacement. When sent with a cell, nonempty text is queued
              before the code is run; an already waiting interactive read may consume it before the new cell
              begins. Empty text queues nothing. If output ends in `[waiting for stdin]`, send the requested
              input here. Unread text can satisfy later reads and is discarded by restart.
            type:
              - string
              - "null"
          timeout_ms:
            description: |-
              Omit for normal calls and polls. This limits how long the tool waits; it returns immediately
              when execution completes. Reaching the timeout does not cancel execution. Use `0` to start
              background work, then poll with an empty `send`.

              Defaults to 60,000 milliseconds. One deadline starts at call entry and includes initial
              background startup, evaluation observation, and one automatic worker replacement attempt.
              It does not cancel resolution or startup. Inline control, interrupt grace, restart, and explicit
              requirement preparation happen before dispatch and may make the complete call take longer.
              This value does not limit standalone preparation. Automatic dependency resolution is part of
              the running evaluation and counts toward this wait. On expiry, the call returns available output
              and a state marker, such as `[running; poll with an empty send]` or `[worker starting]`.
              If evaluation remains active, poll with an empty `send` call; do not resubmit the cell.
            type: integer
            format: uint64
            minimum: 0
            default: 60000
