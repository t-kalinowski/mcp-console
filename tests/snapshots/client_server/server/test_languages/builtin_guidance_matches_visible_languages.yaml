    with `requirements={"action":"add","duckdb":["fts"]}`. SQL results include
    bounded table previews that abbreviate long text cells; return focused
    queries and summaries for inspection.


    Language fields describe the configured interface, not installed runtimes.
    With R-owned managed DuckDB, bind Python data frames to R names through
    `r.name` before querying them. Without R, Python-owned DuckDB requires
    explicit frame registration with `sql_connection().register(name, frame)`.
    Python can select a user-owned connection with
    `console_sql_connection(connection)`. SQL uses its configured provider
    without a setup cell. Managed DuckDB uses R when available and Python
    otherwise, independently of visible language fields. Hidden R or Python
    runtimes can implement SQL. Keep `requirements.r` and `requirements.python`
    available for provider preparation; a missing-provider diagnostic identifies
    the required package and restart. Managed dependency preparation requires
    resolver support on the execution host; bare runtimes require preinstalled
    packages, and explicitly selected Python uses its preinstalled Python
    packages.


