languages:
  - r
  - sql
tool:
  description: >-
    Persistent R and SQL workbench for exact computation, file and data
    inspection, transformation, visualization, statistics, simulation, and
    modeling. State persists across calls.


    For databases and structured files, consider DuckDB SQL first for schema
    inspection, filtering, joins, aggregation, and nested JSON extraction. Use R
    for vectorized data and string operations, statistics, and plots. Switch
    languages when useful, reusing persistent state.


    DuckDB can query CSV, Parquet, JSON, and JSONL directly; JSON support is
    built in. Built-in managed defaults include SQLite when dependency
    preparation is available; sessions without DuckDB preparation require
    preinstalled extensions. For SQLite, use an available sqlite extension and
    attach the database read-only with `ATTACH 'path' AS name (TYPE sqlite,
    READ_ONLY)`. When preparation is supported, prepare additional extensions
    with `requirements={"action":"add","duckdb":["fts"]}`. SQL results include
    bounded table previews that abbreviate long text cells; return focused
    queries and summaries for inspection.


    Language fields describe the configured interface, not installed runtimes.
    With R-owned managed DuckDB active, SQL can query R data frames by name. R
    accesses its SQL connection through `sql_connection()` and can select a
    user-owned connection with `console_sql_connection(connection)`. SQL uses
    its configured provider without a setup cell. Managed DuckDB uses R when
    available and Python otherwise, independently of visible language fields.
    Hidden R or Python runtimes can implement SQL. Keep `requirements.r` and
    `requirements.python` available for provider preparation; a missing-provider
    diagnostic identifies the required package and restart. Managed dependency
    preparation requires resolver support on the execution host; bare runtimes
    require preinstalled packages, and explicitly selected Python uses its
    preinstalled Python packages.


    Send one complete `r` or `sql` cell per call. Code-bearing calls must be
    sequential; a control-only interrupt may overlap a pending `send`. Inspect
    intermediate results before submitting dependent cells. Cells are not
    transactional; changes made before an error may remain.


    Omit code to poll, supply stdin, control the session, or prepare
    requirements when available. If a response ends in `[running; poll with an
    empty send]`, call `send` again without code or stdin; do not resubmit the
    cell. Send `stdin` alone to answer an active prompt or debugger. Field
    descriptions specify preparation, control, and timeout ordering.


    Each result has at most 8 KiB of UTF-8 text, including notices; oversized
    output keeps its beginning and latest tail. Images have separate limits.
    Retained raw-log paths are relative to the server's launch directory for
    project recordings and absolute for home recordings. Full retained text
    requires filesystem access there through existing tools; Console provides no
    read/search interface.


    Evaluated code runs without a sandbox, with the server's permissions,
    including filesystem and network access. Dependency resolution, when
    available, may execute installation or build code; use only trusted
    dependencies.
  sources:
    r:
      description: |-
        One complete R cell evaluated in persistent global state. Prefer Console for R execution,
        including tests and package checks. When a fresh session is needed and existing in-memory
        state can be discarded, send `control: "restart"` and `r` together; the code runs in the new
        worker. For background execution, use `timeout_ms: 0`, then poll with an empty `send`.
        Avoid `callr` merely to obtain fresh state or nonblocking execution. Use a subprocess when
        the task requires separate process isolation, preserving the current session while running
        independently, or ordinary R behavior without Console's runtime hooks.

        The cell's final visible expression autoprints through R's normal console display; R also
        autoprints earlier visible top-level expressions. Leave the primary result last and print
        only when additional output is needed.
        When dynamic resolution is available, the built-in worker resolves missing plain CRAN
        package names on demand through `library()`, `require()`, `requireNamespace()`,
        `loadNamespace()`, `::`, or `:::`. Use packages directly; do not probe package availability
        or call `install.packages()`. Resolution makes a package available but attaches it only
        through the original `library()` or `require()` call. In a bare runtime, packages must
        already be installed and these operations keep their ordinary R behavior. R source is not
        scanned in advance. With R-owned managed DuckDB active, R data frames are directly queryable
        by name from later SQL cells. `sql_connection()` returns the R-owned SQL connection for DBI or dplyr use. Select a user-owned DBI connection for later SQL
        cells with `console_sql_connection(connection)` and restore managed DuckDB with
        `console_sql_connection(NULL)`. Do not disconnect the managed DuckDB connection, and restore a
        selected connection before disconnecting it. Default-device plots return as PNG images. Keep
        all drawing operations for one plot in the same cell. Set persistent dimensions with
        `options(console.plot.width_in = ..., console.plot.height_in = ..., console.plot.dpi = ...)`;
        width and height are in inches. Omit this field for polling or stdin-only calls.
      type:
        - string
        - "null"
    sql:
      description: |-
        One complete SQL cell evaluated through the active connection. The managed DuckDB backend is
        used by default when its adapter and packages are available and keeps a persistent catalog.
        A result with columns returns a bounded preview. With R-owned managed DuckDB, an unqualified
        relation name can query a data frame in R global state, and a DuckDB table or view with the
        same name takes precedence. A user-selected R connection receives cells through `DBI::dbSendQuery()`; a Python DB-API connection executes
        them through its connection or cursor protocol. The selected driver supplies its own SQL
        dialect and type mappings. Use DBI from an R cell for commands that require the statement
        interface. Without R, managed DuckDB uses Python; it does not scan Python globals.
        Managed DuckDB conveniences and extension requirements apply only to the managed
        backend. With the sandbox enabled, use `ATTACH 'path' AS name (READ_ONLY)` for existing DuckDB
        databases outside the sandbox's writable paths; the sandbox blocks DuckDB's
        default writable mode for those paths. Use `SHOW TABLES`, `DESCRIBE`, `SUMMARIZE`, and `EXPLAIN`
        for DuckDB discovery. DuckDB CLI dot commands are not supported. Omit this field for polling
        or stdin-only calls.
      type:
        - string
        - "null"
  session_fields:
    - control
    - requirements
    - stdin
    - timeout_ms
  requirements_fields:
    - action
    - duckdb
    - exclude_newer
    - python
    - python_version
    - r
