---
languages:
  - sql
tool:
  description: >-
    Persistent SQL workbench for exact computation, file and data inspection,
    transformation, visualization, statistics, simulation, and modeling. State
    persists across calls.


    For databases and structured files, consider DuckDB SQL first for schema
    inspection, filtering, joins, aggregation, and nested JSON extraction.


    DuckDB can query CSV, Parquet, JSON, and JSONL directly; JSON support is
    built in. Built-in managed defaults include SQLite when dependency
    preparation is available; sessions without DuckDB preparation require
    preinstalled extensions. For SQLite, use an available sqlite extension and
    attach the database read-only with `ATTACH 'path' AS name (TYPE sqlite,
    READ_ONLY)`. When preparation is supported, prepare additional extensions
    with `requirements={"action":"add","duckdb":["fts"]}`. SQL results include
    bounded table previews that abbreviate long text cells; return focused
    queries and summaries for inspection.


    Language fields describe the configured interface, not installed runtimes.
    SQL uses its configured provider without a setup cell. Hidden R or Python
    runtimes can implement SQL. Keep `requirements.r` and `requirements.python`
    available for provider preparation; a missing-provider diagnostic identifies
    the required package and restart. Managed dependency preparation requires
    resolver support on the execution host; bare runtimes require preinstalled
    packages, and explicitly selected Python uses its preinstalled Python
    packages.


    Send one complete `sql` cell per call. Code-bearing calls must be
    sequential; a control-only interrupt may overlap a pending `send`. Inspect
    intermediate results before submitting dependent cells. Cells are not
    transactional; changes made before an error may remain.


    Omit code to poll, supply stdin, control the session, or prepare
    requirements when available. If a response ends in `[running; poll with an
    empty send]`, call `send` again without code or stdin; do not resubmit the
    cell. Send `stdin` alone to answer an active prompt or debugger. Field
    descriptions specify preparation, control, and timeout ordering.


    Each result has at most 8 KiB of UTF-8 text, including notices; oversized
    output keeps its beginning and latest tail. Images have separate limits.
    Retained raw-log paths are relative to the server's launch directory for
    project recordings and absolute for home recordings. Full retained text
    requires filesystem access there through existing tools; Console provides no
    read/search interface.


    Evaluated code runs without a sandbox, with the server's permissions,
    including filesystem and network access. Dependency resolution, when
    available, may execute installation or build code; use only trusted
    dependencies.
  sources:
    sql:
      description: |-
        One complete SQL cell evaluated through the active connection. The managed DuckDB backend is
        used by default when its adapter and packages are available and keeps a persistent catalog.
        A result with columns returns a bounded preview. A user-selected R connection receives cells through `DBI::dbSendQuery()`; a Python DB-API connection executes
        them through its connection or cursor protocol. The selected driver supplies its own SQL
        dialect and type mappings.
        Managed DuckDB conveniences and extension requirements apply only to the managed
        backend. With the sandbox enabled, use `ATTACH 'path' AS name (READ_ONLY)` for existing DuckDB
        databases outside the sandbox's writable paths; the sandbox blocks DuckDB's
        default writable mode for those paths. Use `SHOW TABLES`, `DESCRIBE`, `SUMMARIZE`, and `EXPLAIN`
        for DuckDB discovery. DuckDB CLI dot commands are not supported. Omit this field for polling
        or stdin-only calls.
      type:
        - string
        - "null"
  session_fields:
    - control
    - requirements
    - stdin
    - timeout_ms
  requirements_fields:
    - action
    - duckdb
    - exclude_newer
    - python
    - python_version
    - r
---
languages:
  - sql
  - python
tool:
  description: >-
    Persistent Python and SQL workbench for exact computation, file and data
    inspection, transformation, visualization, statistics, simulation, and
    modeling. State persists across calls.


    For databases and structured files, consider DuckDB SQL first for schema
    inspection, filtering, joins, aggregation, and nested JSON extraction. Use
    Python when its libraries or format-specific parsing simplify the task.
    Switch languages when useful, reusing persistent state.


    DuckDB can query CSV, Parquet, JSON, and JSONL directly; JSON support is
    built in. Built-in managed defaults include SQLite when dependency
    preparation is available; sessions without DuckDB preparation require
    preinstalled extensions. For SQLite, use an available sqlite extension and
    attach the database read-only with `ATTACH 'path' AS name (TYPE sqlite,
    READ_ONLY)`. When preparation is supported, prepare additional extensions
    with `requirements={"action":"add","duckdb":["fts"]}`. SQL results include
    bounded table previews that abbreviate long text cells; return focused
    queries and summaries for inspection.


    Language fields describe the configured interface, not installed runtimes.
    Without R, Python-owned DuckDB requires explicit frame registration with
    `sql_connection().register(name, frame)`. Python can select a user-owned
    connection with `console_sql_connection(connection)`. SQL uses its
    configured provider without a setup cell. Hidden R or Python runtimes can
    implement SQL. Keep `requirements.r` and `requirements.python` available for
    provider preparation; a missing-provider diagnostic identifies the required
    package and restart. Managed dependency preparation requires resolver
    support on the execution host; bare runtimes require preinstalled packages,
    and explicitly selected Python uses its preinstalled Python packages.


    Send one complete `python` or `sql` cell per call. Code-bearing calls must
    be sequential; a control-only interrupt may overlap a pending `send`.
    Inspect intermediate results before submitting dependent cells. Cells are
    not transactional; changes made before an error may remain.


    Omit code to poll, supply stdin, control the session, or prepare
    requirements when available. If a response ends in `[running; poll with an
    empty send]`, call `send` again without code or stdin; do not resubmit the
    cell. Send `stdin` alone to answer an active prompt or debugger. Field
    descriptions specify preparation, control, and timeout ordering.


    Each result has at most 8 KiB of UTF-8 text, including notices; oversized
    output keeps its beginning and latest tail. Images have separate limits.
    Retained raw-log paths are relative to the server's launch directory for
    project recordings and absolute for home recordings. Full retained text
    requires filesystem access there through existing tools; Console provides no
    read/search interface.


    Evaluated code runs without a sandbox, with the server's permissions,
    including filesystem and network access. Dependency resolution, when
    available, may execute installation or build code; use only trusted
    dependencies.
  sources:
    python:
      description: |-
        One complete Python cell evaluated in persistent `__main__` state. Its final visible expression
        autoprints through Python's normal display hook. Leave the primary result last and print only
        when additional output is needed. When dynamic resolution is available and an import is
        missing, the built-in managed worker resolves a PyPI distribution on demand, using a curated mapping for well-known
        import/distribution differences and otherwise assuming the distribution matches the top-level
        module. Python source is not scanned; resolution starts only when execution reaches the import.
        Use `requirements.python` when the distribution differs from the inferred name, exact registry
        metadata is needed, or the package should be prepared before the cell. A user-selected Python
        environment or bare runtime disables both automatic resolution and managed requirements;
        import packages already installed there directly. Select a user-owned DB-API
        connection for later SQL cells with `console_sql_connection(connection)` and restore managed DuckDB with
        `console_sql_connection(None)`. Without R, `sql_connection()` returns the Python-owned connection;
        register frames explicitly with `sql_connection().register(name, frame)`. At cell end,
        including after a Python error, every open `matplotlib.pyplot` figure returns once as a PNG
        image and is closed.
        `show()` is optional. Omit this field for
        polling or stdin-only calls.
      type:
        - string
        - "null"
    sql:
      description: |-
        One complete SQL cell evaluated through the active connection. The managed DuckDB backend is
        used by default when its adapter and packages are available and keeps a persistent catalog.
        A result with columns returns a bounded preview. A user-selected R connection receives cells through `DBI::dbSendQuery()`; a Python DB-API connection executes
        them through its connection or cursor protocol. The selected driver supplies its own SQL
        dialect and type mappings. Without R, managed DuckDB uses Python and requires explicit frame registration
        through `sql_connection().register(name, frame)`; it does not scan Python globals.
        Managed DuckDB conveniences and extension requirements apply only to the managed
        backend. With the sandbox enabled, use `ATTACH 'path' AS name (READ_ONLY)` for existing DuckDB
        databases outside the sandbox's writable paths; the sandbox blocks DuckDB's
        default writable mode for those paths. Use `SHOW TABLES`, `DESCRIBE`, `SUMMARIZE`, and `EXPLAIN`
        for DuckDB discovery. DuckDB CLI dot commands are not supported. Omit this field for polling
        or stdin-only calls.
      type:
        - string
        - "null"
  session_fields:
    - control
    - requirements
    - stdin
    - timeout_ms
  requirements_fields:
    - action
    - duckdb
    - exclude_newer
    - python
    - python_version
    - r
