---
configuration: unrestricted restricted (string)
description: >-
  Persistent custom-worker workbench. Send one complete `r`, `python`, or `sql`
  cell per call. Inspect its output and reuse persistent objects.


  Language fields describe the configured interface; evaluation, display, SQL,
  and sharing depend on the worker. Console does not supply built-in runtime
  packages, import hooks, or a default SQL connection. Managed requirements
  require host resolver support and compatible worker callbacks; Python
  requirements are unavailable. Switch languages when useful, using the worker's
  capabilities.


  Code-bearing calls must be sequential; a control-only interrupt may overlap a
  pending `send`. Cells are not transactional; effects before an error may
  remain. Poll running work with an empty `send`; do not resubmit the cell.


  Text results, including notices, have an 8 KiB limit, retaining the beginning
  and latest tail; images have separate limits. Response notices report state
  and omitted-output locations.


  Evaluated code has unrestricted filesystem access and cannot directly access
  the network. Dependency resolution may run installation or build code in a
  separate native resolver sandbox on macOS and Linux with its own read, write,
  and network policy; use only trusted dependencies.
