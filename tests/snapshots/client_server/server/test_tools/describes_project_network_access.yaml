---
configuration: restricted
description: >-
  Persistent custom-worker workbench. Language fields describe the configured
  interface; supported languages, evaluation, display, SQL, and cross-language
  sharing depend on the selected worker. Console does not supply built-in
  runtime packages, automatic import hooks, or a default SQL connection to
  custom workers. Managed requirements require execution-host resolver support
  and compatible worker preparation callbacks; Python requirements are
  unavailable with a custom worker. Switch languages when useful, using
  capabilities supplied by the worker.


  Send one complete `r`, `python`, or `sql` cell per call. Code-bearing calls
  must be sequential; a control-only interrupt may overlap a pending `send`.
  Inspect intermediate results before submitting dependent cells. Cells are not
  transactional; changes made before an error may remain.


  Omit code to poll, supply stdin, control the session, or prepare requirements
  when available. If a response ends in `[running; poll with an empty send]`,
  call `send` again without code or stdin; do not resubmit the cell. Send
  `stdin` alone to answer an active prompt or debugger. Field descriptions
  specify preparation, control, and timeout ordering.


  Each result has at most 8 KiB of UTF-8 text, including notices; oversized
  output keeps its beginning and latest tail. Images have separate limits.
  Retained raw-log paths are relative to the server's launch directory for
  project recordings and absolute for home recordings. Full retained text
  requires filesystem access there through existing tools; Console provides no
  read/search interface.


  Evaluated code can read host files, cannot directly access the network, and
  can write in the worker's private temporary directory and to paths explicitly
  allowed by the launcher. Dependency resolution, when available, uses a
  separate native resolver sandbox on macOS and Linux with configurable host
  reads, cache writes, and proxy destinations. Installation or build code may
  run there; use only trusted dependencies.
