---
languages: r
description: >-
  Persistent R, Python, and SQL workbench for exact computation, file and data
  inspection, transformation, visualization, statistics, simulation, and
  modeling. State persists across calls.


  Use R for vectorized data and string operations, statistics, and plots.


  Reuse live state when switching: Python reads R globals through `r.name`, R
  reads Python globals through `py$name`, and managed DuckDB SQL can query R
  data frames by name. R accesses its SQL connection through `sql_connection()`;
  R or Python can select a user-owned connection with
  `console_sql_connection(connection)`.


  Send one complete `r`, `python`, or `sql` cell per call. Code-bearing calls
  must be sequential; a control-only interrupt may overlap a pending `send`.
  Inspect intermediate results before submitting dependent cells. Cells are not
  transactional; changes made before an error may remain.


  Omit code to poll, supply stdin, control the session, or prepare requirements
  when available. If a response ends in `[running; poll with an empty send]`,
  call `send` again without code or stdin; do not resubmit the cell. Send
  `stdin` alone to answer an active prompt or debugger. Field descriptions
  specify preparation, control, and timeout ordering.


  Each result has at most 8 KiB of UTF-8 text, including notices; oversized
  output keeps its beginning and latest tail. Images have separate limits.
  Retained raw-log paths are relative to the server's launch directory for
  project recordings and absolute for home recordings (both on the controller
  for remote targets). Full retained text requires filesystem access there
  through existing tools; Console provides no read/search interface.


  Evaluated code runs without a sandbox, with the server's permissions,
  including filesystem and network access. Dependency resolution, when
  available, may execute installation or build code; use only trusted
  dependencies.
