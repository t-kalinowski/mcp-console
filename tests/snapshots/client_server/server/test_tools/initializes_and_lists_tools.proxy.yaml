    version: 0.0.4
---
input:
  method: notifications/initialized
---
input:
  method: tools/list
result:
  tools:
    - name: send
      description: >-
        Persistent R, Python, and SQL workbench for calculations, data analysis,
        and plots. Send one complete `r`, `python`, or `sql` cell per call.
        Inspect its output and reuse persistent objects. Results display
        automatically; supported plots return as images.


        For databases and structured files, consider DuckDB SQL first for
        inspection, joins, and aggregation. Use R for vectorized data and string
        operations, statistics, and plots. Use Python when its libraries or
        format-specific parsing simplify the task. Switch languages when useful.


        DuckDB can query CSV, Parquet, JSON, and JSONL directly, including
        nested JSON. Built-in managed defaults include SQLite when preparation
        is available; otherwise extensions must be preinstalled. SQL uses its
        configured provider without a setup cell. Provider choice is independent
        of visible language fields; missing-provider notices identify required
        preparation.


        Language fields describe the configured interface, not installed
        runtimes. Managed resolution needs execution-host resolver support. Bare
        runtimes and explicitly selected Python use preinstalled packages.


        Code-bearing calls must be sequential; a control-only interrupt may
        overlap a pending `send`. Cells are not transactional; effects before an
        error may remain. Poll running work with an empty `send`; do not
        resubmit the cell.


        Text results, including notices, have an 8 KiB limit, retaining the
        beginning and latest tail; images have separate limits. Response notices
        report state and omitted-output locations.


        Evaluated code can read host files, can access the network subject to
        the launcher's proxy settings, and can write in the worker's private
        temporary directory and to paths explicitly allowed by the launcher.
        Dependency resolution may run installation or build code in a separate
        native resolver sandbox on macOS and Linux with its own read, write, and
        network policy; use only trusted dependencies.
      inputSchema:
        $schema: https://json-schema.org/draft/2020-12/schema
        additionalProperties: false
        type: object
        properties:
          r:
            description: >-
              One complete R cell in persistent global state. Visible top-level
              expressions autoprint; leave the primary result last. With managed
              resolution, use missing CRAN packages directly through `library()`,
              `require()`, `requireNamespace()`, `loadNamespace()`, `::`, or `:::`;
              avoid availability probes or `install.packages()`. With both runtimes
              and their bridge available, access Python globals through `py$name`.
              `sql_connection()` returns the R-owned SQL connection for DBI/dplyr.
              Select a user-owned DBI connection for SQL cells with
              `console_sql_connection(connection)`; restore managed DuckDB with
              `console_sql_connection(NULL)`. Never disconnect the managed connection;
              restore it before disconnecting a selection. Default-device plots return
              as PNGs and finalize at cell end, including after errors; draw each plot
              in one cell. Explicit devices are not captured. Set persistent
              dimensions in inches and DPI with `options(console.plot.width_in = ...,
              console.plot.height_in = ..., console.plot.dpi = ...)`.
            type:
              - string
              - "null"
          python:
            description: >-
              One complete Python cell in persistent `__main__` state. The final
              visible expression autoprints; leave the primary result last. Managed
              imports can resolve missing PyPI distributions; use
              `requirements.python` when import/distribution names differ or
              preparation is needed before execution. Bare or explicitly selected
              environments use preinstalled packages. With both runtimes and their
              bridge available, read R globals and call functions through `r.name`.
              Select a user-owned DB-API connection for SQL cells with
              `console_sql_connection(connection)`; restore managed DuckDB with
              `console_sql_connection(None)`. With R-owned DuckDB, bind Python frames
              to an R name before querying. Without R, `sql_connection()` returns the
              Python-owned connection; register frames with
              `sql_connection().register(name, frame)` (globals are not scanned). At
              cell end, even after errors, open `matplotlib.pyplot` figures return
              once as PNGs and close; `show()` is optional. Closing a figure
              suppresses capture. R plots through `r` follow the R plot rules.
            type:
              - string
              - "null"
          sql:
            description: >-
              One complete SQL cell through the active connection. Managed DuckDB
              keeps a persistent catalog. Results are bounded table previews that
              abbreviate long text cells; query focused subsets or aggregates. The
              selected driver supplies its own SQL dialect and types. With R-owned
              managed DuckDB, query R data frames by name; DuckDB tables/views take
              precedence. Use DBI from an R cell for commands requiring the statement
              interface. Managed conveniences/extensions apply only to DuckDB. For
              SQLite, use an available sqlite extension with `ATTACH 'path' AS name
              (TYPE sqlite, READ_ONLY)`. With a sandbox, attach existing DuckDB
              databases outside writable paths using `ATTACH 'path' AS name
              (READ_ONLY)`. Use `SHOW TABLES`, `DESCRIBE`, `SUMMARIZE`, or `EXPLAIN`;
              CLI dot commands are not supported.
            type:
              - string
              - "null"
          control:
            description: >-
              Apply control before same-call input/code. `interrupt` requests SIGINT
              from the active host resolver or a cooperative interrupt from the
              worker, preserving live state. A following cell runs only if prior work
              stops. `restart` discards live interpreter, database, debugger, and
              unread-input state; same-call stdin/code go only to the replacement.
              Requirements resolve before replacement; resolution failure preserves
              the current worker.
            type: string
            enum:
              - interrupt
              - restart
          requirements:
            description: >-
              Inspect declarations or prepare dependencies on the execution host
              without importing, attaching, or loading them. Alone, performs
              standalone preparation. With a cell, preparation precedes code; without
              control it also precedes bundled stdin. Failure or a required restart
              withholds the cell. Compatible additions preserve live state on an idle
              worker; other changes need restart. With restart, candidate resolution
              precedes replacement; resolution failure preserves the current worker
              and sends no stdin/code. Standalone preparation rejects nonempty stdin.
              Only add can accompany interrupt, with a following cell; providers
              without this preparation support reject the combination before signaling
              or input. Otherwise interrupt and stdin precede deferred
              validation/preparation and are not rolled back on failure. SQL does not
              discover packages; follow missing-provider notices for preparation,
              including requirements for hidden providers.
            type:
              - object
              - "null"
            properties:
              action:
                description: |-
                  get reads the retained declaration, not an installed-package inventory, without starting a
                  worker or consuming output; use it alone, without code, stdin, control, or payload fields.
                  The complete declaration is in structuredContent.requirements.
                  add (default) accumulates up to 64 entries per language per call; bare {} is invalid.
                  set replaces the whole declaration without defaults; omitted lists/constraints are empty,
                  even with only action supplied. reset restores startup defaults and rejects payload fields.
                  Changed set/reset with a live worker require control="restart"; unchanged declarations are
                  no-ops. set accepts the complete accumulated manifest without add's per-list limit.
                type: string
                enum:
                  - get
                  - add
                  - set
                  - reset
              python_version:
                description: |-
                  Python version numbers or ==, !=, <, <=, >, >= constraints (e.g. >=3.11).
                  add appends; changes with a live worker require control="restart".
                type: array
                items:
                  type: string
              exclude_newer:
                description: |-
                  Package publication cutoff accepted by uv, e.g. "2026-01-01".
                  set clears an omitted/null cutoff; add preserves omission and cannot replace an existing one.
                type:
                  - string
                  - "null"
              duckdb:
                description: |-
                  Managed DuckDB extension names, e.g. fts or spatial: lowercase ASCII letter first, then
                  lowercase letters, digits, or underscores (at most 64 characters).
                  Use DuckDB's LOAD or automatic loading after preparation.
                type: array
                items:
                  type: string
                  minLength: 1
                  maxLength: 64
              r:
                description: |-
                  Single-line ir package references, e.g. data.table or sf, including supported remote
                  references; local sources and NUL/line breaks are rejected. Automatic R loads accept plain
                  package names only; use this field for explicit references or preparation before use.
                type: array
                items:
                  type: string
                  minLength: 1
              python:
                description: |-
                  Named PEP 508 registry requirements with versions, extras, or markers, e.g. polars>=1 or
                  requests[socks]. Paths, URLs, editable requirements, direct references, and local sources
                  are rejected. Bare or explicitly selected Python environments and custom workers disable
                  managed Python requirements.
                type: array
                items:
                  type: string
                  minLength: 1
            additionalProperties: false
          stdin:
            description: >-
              Send stdin alone to answer an active read, prompt, or debugger. UTF-8
              text is queued exactly; no newline is added, so line input normally
              needs a trailing `\n`. Empty text queues nothing. With a cell, input
              queues before code; an already waiting read may consume it first,
              including while interrupted work unwinds. Unread input can satisfy later
              reads; restart discards it.
            type:
              - string
              - "null"
          timeout_ms:
            description: |-
              Wait budget in milliseconds (default 60,000); omit for ordinary calls. `0` starts
              background work without waiting for completion. Expiry returns available output without cancelling
              execution, startup, or resolution. This is not a whole-call deadline: explicit preparation
              and lifecycle control may exceed it; standalone preparation is not limited by it.
            type: integer
            format: uint64
            minimum: 0
            default: 60000
