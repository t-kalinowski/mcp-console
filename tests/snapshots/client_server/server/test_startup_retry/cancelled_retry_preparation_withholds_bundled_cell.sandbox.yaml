---
!same-as writable MCP initialization for this execution mode
---
send: {}
result:
  content:
    - type: text
      text: >-
        python.managed: managed Python sessions require `uv` on PATH; install uv
        or select an existing environment
  isError: true
---
send:
  control: restart
  requirements:
    action: set
    python:
      - six
  stdin: |
    cancelled input
  python: |
    from pathlib import Path

    Path("cancelled-cell").write_text("ran")
    print("cancelled cell ran")
id: <cancelled request 1>
---
input:
  method: notifications/cancelled
  params:
    requestId: <cancelled request 1>
---
input:
  method: ping
result: {}
---
send: {}
result:
  content:
    - type: text
      text: |-
        [runtime discovery retried]
        request cancelled before cell admission; cell was not run
  isError: true
---
send:
  requirements:
    action: get
result:
  content:
    - type: text
      text: |-
        {
          "requirements": {
            "r": [],
            "python": [
              "six"
            ],
            "duckdb": [],
            "python_version": [],
            "exclude_newer": null
          },
          "startup_requirements": {
            "r": [],
            "python": [
              "numpy",
              "pandas",
              "matplotlib",
              "plotnine",
              "duckdb"
            ],
            "duckdb": [
              "icu",
              "json",
              "sqlite"
            ],
            "python_version": [],
            "exclude_newer": null
          },
          "resolution": {
            "r": "automatic",
            "python": "automatic"
          },
          "selection": {
            "r": null,
            "python": "<selected Python>",
            "python_source": "default managed"
          },
          "prepared": true,
          "runtime_requirements": {
            "r": [],
            "python": []
          }
        }
  structuredContent:
    requirements:
      r: []
      python:
        - six
      duckdb: []
      python_version: []
      exclude_newer: ~
    startup_requirements:
      r: []
      python:
        - numpy
        - pandas
        - matplotlib
        - plotnine
        - duckdb
      duckdb:
        - icu
        - json
        - sqlite
      python_version: []
      exclude_newer: ~
    resolution:
      r: automatic
      python: automatic
    selection:
      r: ~
      python: <selected Python>
      python_source: default managed
    prepared: true
    runtime_requirements:
      r: []
      python: []
  isError: false
---
send:
  python: |
    import six
    from pathlib import Path

    assert not Path("cancelled-cell").exists()
    answer = 42
    answer
result:
  content:
    - type: text
      text: |
        42
  isError: false
---
send:
  python: answer + 1
result:
  content:
    - type: text
      text: |
        43
  isError: false
