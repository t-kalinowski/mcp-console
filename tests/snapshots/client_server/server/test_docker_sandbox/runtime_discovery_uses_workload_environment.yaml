---
arguments:
  - serve
inherit_environment: true
---
send:
  r: |
    stopifnot(
      R.home() == "/usr/lib/R",
      Sys.getenv("DISCOVERY_VALUE") == "selected"
    )
    cat("workload R discovered\n")
result:
  content:
    - type: text
      text: |
        workload R discovered
  isError: false
