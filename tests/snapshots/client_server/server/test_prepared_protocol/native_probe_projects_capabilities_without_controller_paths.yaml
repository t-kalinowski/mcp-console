input:
  method: tools/list
result:
  tools:
    - name: send
      description: >-
        Persistent Docker Sandbox Python and SQL workbench without R. State
        persists across calls. SQL uses a lazy in-memory DuckDB connection. In
        Python, sql_connection() returns the active SQL connection;
        console_sql_connection(connection) selects a user-owned DB-API
        connection and console_sql_connection(None) restores the Console-owned
        DuckDB catalog. Register Python data frames explicitly with
        sql_connection().register(name, frame). R cells, live requirements,
        DuckDB extension preparation, and automatic package installation are
        unavailable in this session. Python uses the environment selected at
        server startup; restart resets objects and retains that environment.


        Send one complete `python` or `sql` cell per call. Code-bearing calls
        must be sequential; a control-only interrupt may overlap a pending
        `send`. Inspect intermediate results before submitting dependent cells.
        Cells are not transactional; changes made before an error may remain.


        Omit code to poll, supply stdin, control the session, or prepare
        requirements when available. If a response ends in `[running; poll with
        an empty send]`, call `send` again without code or stdin; do not
        resubmit the cell. Send `stdin` alone to answer an active prompt or
        debugger. Field descriptions specify preparation, control, and timeout
        ordering.


        Each result has at most 8 KiB of UTF-8 text, including notices;
        oversized output keeps its beginning and latest tail. Images have
        separate limits. Retained raw-log paths are relative to the server's
        launch directory for project recordings and absolute for home recordings
        (both on the controller for remote targets). Full retained text requires
        filesystem access there through existing tools; Console provides no
        read/search interface.


        Evaluated code runs inside a Console-owned Docker Sandbox microVM,
        enforced by Docker Sandboxes and its current inherited
        machine/organization policy and host integrations. Both relay and worker
        run in the VM. Native filesystem, network, proxy, and metadata defaults
        do not apply. Writable shares can expose .git, .agents, and controller
        records. Provider rules can change during the session. --no-sandbox
        retains the microVM and cannot bypass Docker policy.


        Execution target:
        {"transport":{"kind":"local"},"workspace":"/workspace","compute":{"kind":"docker_sandbox","template":"docker.io/example/console@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","template_identity":"docker.io/example/console@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","mounts":[],"cli_version":"sbx
        version: v0.42.1
        fixture"},"runtime":{"kind":"python","managed":false,"r_home":null,"python":"/target-only/bin/python3","libpython":"/target-only/lib/libpython.so","prefix":"/target-only","exec_prefix":"/target-only","base_prefix":"/target-only","base_exec_prefix":"/target-only"},"provider":"compute","inner_native_runner":false}.
        Each generation uses the captured immutable template identity and
        runtime selection. Use preinstalled Python and SQL packages; dynamic
        package preparation is disabled even if ir or uv is installed. Records,
        output spools, and returned images are written by the controller beneath
        its existing project .agents/console directory or its Console home
        directory; declared shares can expose them to the worker. Restart
        discards files stored only in the VM and preserves shared files. Quarto
        exports execute recorded cells when rendered; prepare the target
        environment and files first.


        Runtimes were inspected inside the captured template. All dependencies
        and DuckDB extensions must be preinstalled there; Console never invokes
        dependency resolvers or installs missing imports. Rebuild the template
        and start a new server session to change its runtime or packages. Plain
        worker restart retains the selected interpreter and creates fresh
        language state and an empty in-memory SQL catalog.
      inputSchema:
        $schema: https://json-schema.org/draft/2020-12/schema
        additionalProperties: false
        type: object
        properties:
          python:
            description: >-
              One complete Python cell in persistent state. The final expression
              displays automatically. Use input() for managed stdin; Matplotlib
              plots return as PNG images when installed. Use packages already in
              the selected environment. sql_connection() returns the active SQL
              connection, and console_sql_connection(connection) selects a
              user-owned DB-API connection. R integration, live requirements,
              and automatic package installation are unavailable. Use control:
              restart with python to run in a fresh worker using the same
              environment, or timeout_ms: 0 then poll for background execution.
              Dependencies must be preinstalled in the template.
            type:
              - string
              - "null"
          sql:
            description: >-
              One complete SQL cell through the active Python DB-API connection.
              Console opens its in-memory DuckDB catalog lazily when the adapter
              and DuckDB are preinstalled in the template. Python data frames
              require explicit registration with sql_connection().register(name,
              frame). console_sql_connection(connection) selects a user-owned
              connection, and console_sql_connection(None) restores the
              Console-owned catalog without discarding it. A query with columns
              returns a bounded preview. Extensions load from the template's
              cache; Console does not install extensions or resolve packages.
              Spill files and stored secrets use private disposable worker
              storage. Worker replacement resets the catalog. Missing DuckDB
              leaves Python and custom connections usable. R cells are
              unavailable.
            type:
              - string
              - "null"
          control:
            description: >-
              Applies lifecycle control alone or before compatible same-call
              fields. interrupt requests SIGINT from the live worker and
              preserves Python state. After successful delivery, stdin is queued
              and send waits 100 milliseconds before observing the earlier
              evaluation or attempting an optional following cell; that cell is
              not run if the interrupted evaluation remains active. restart
              discards Python objects, debugger state, and unread stdin, retains
              the selected environment, and sends same-call stdin and code only
              to the replacement worker.
            type: string
            enum:
              - interrupt
              - restart
          requirements:
            type:
              - object
              - "null"
            description: >-
              Inspect the server's retained declaration with action=get.
              Preparation is unavailable for this target; the declaration is not
              an installed-package inventory.
            properties:
              action:
                type: string
                enum:
                  - get
            required:
              - action
            additionalProperties: false
          stdin:
            description: >-
              Input for an active read, prompt, or debugger. When responding to
              active input, omit code and send stdin on its own. Its UTF-8
              encoding is queued exactly; no newline is added. Line-oriented
              input normally needs a trailing `\n`. After interrupt, nonempty
              stdin is queued before the 100-millisecond grace and may be
              consumed while the earlier operation unwinds. After restart,
              same-call stdin goes only to the replacement. When sent with a
              cell, nonempty text is queued before code runs. Empty text queues
              nothing. If output ends in [waiting for stdin], send the requested
              input here. Unread text can satisfy later reads and is discarded
              by restart.
            type:
              - string
              - "null"
          timeout_ms:
            description: >-
              Omit for normal calls and polls. Defaults to 60,000 milliseconds.
              This limits the wait after cell dispatch or attachment to an
              active evaluation and includes one automatic worker replacement
              attempt. Reaching the timeout does not cancel execution or
              startup. Inline control, interrupt grace, and restart happen
              before dispatch and may make the complete call take longer. Use 0
              for background execution, then poll with an empty send. If a
              response ends with [running; poll with an empty send] or [worker
              starting], poll without resubmitting the cell.
            type: integer
            format: uint64
            minimum: 0
            default: 60000
---
send:
  requirements:
    action: get
result:
