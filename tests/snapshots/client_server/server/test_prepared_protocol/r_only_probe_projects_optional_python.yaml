---
input:
  method: initialize
  params:
    protocolVersion: 2025-11-25
    capabilities: {}
    clientInfo:
      name: acceptance-test
      version: 1.0.0
result:
  protocolVersion: 2025-11-25
  capabilities:
    tools: {}
  serverInfo:
    name: mcp-console
    version: 0.0.4
---
input:
  method: notifications/initialized
---
input:
  method: tools/list
result:
  tools:
    - name: send
      description: >-
        Persistent R, Python, and SQL workbench for exact computation, file and
        data inspection, transformation, visualization, statistics, simulation,
        and modeling. State persists across calls.


        For databases and structured files, consider DuckDB SQL first for schema
        inspection, filtering, joins, aggregation, and nested JSON extraction.
        Use R for vectorized data and string operations, statistics, and plots.
        Use Python when its libraries or format-specific parsing simplify the
        task. Switch languages when useful, reusing persistent state.


        DuckDB can query CSV, Parquet, JSON, and JSONL directly; JSON support is
        built in. For SQLite, use an available sqlite extension and attach the
        database read-only with `ATTACH 'path' AS name (TYPE sqlite,
        READ_ONLY)`. SQL results include bounded table previews that abbreviate
        long text cells; return focused queries and summaries for inspection.


        Language fields describe the configured interface, not installed
        runtimes. With both runtimes and their bridge available, Python reads R
        globals through `r.name` and R reads Python globals through `py$name`.
        R-owned Console-owned DuckDB SQL can query R data frames by name;
        without R, Python-owned DuckDB requires explicit frame registration with
        `_console.sql_connection().register(name, frame)`. Get the active native
        connection with `.console$sql_connection()` in R or
        `_console.sql_connection()` in Python; a getter errors if the connection
        belongs to the other runtime. Pass a connection to select it, or
        NULL/None to restore the managed default without closing user
        connections. Dependency preparation is unavailable on this target.


        Send one complete `r`, `python`, or `sql` cell per call. Code-bearing
        calls must be sequential; a control-only interrupt may overlap a pending
        `send`. Inspect intermediate results before submitting dependent cells.
        Cells are not transactional; changes made before an error may remain.


        Omit code to poll, supply stdin, control the session, or prepare
        requirements when available. If a response ends in `[running; poll with
        an empty send]`, call `send` again without code or stdin; do not
        resubmit the cell. Send `stdin` alone to answer an active prompt or
        debugger. Field descriptions specify preparation, control, and timeout
        ordering.


        Each result has at most 8 KiB of UTF-8 text, including notices;
        oversized output keeps its beginning and latest tail. Images have
        separate limits. Retained raw-log paths are relative to the server's
        launch directory for project recordings and absolute for home recordings
        (both on the controller for remote targets). Full retained text requires
        filesystem access there through existing tools; Console provides no
        read/search interface.


        Evaluated code runs inside a Console-owned Docker Sandbox microVM,
        enforced by Docker Sandboxes and its current inherited
        machine/organization policy and host integrations. Both relay and worker
        run in the VM. Native filesystem, network, proxy, and metadata defaults
        do not apply. Writable shares can expose .git, .agents, and controller
        records. Provider rules can change during the session. --no-sandbox
        retains the microVM and cannot bypass Docker policy.


        Configured local transport. Configured execution workspace:
        "/workspace". Startup captures an immutable template identity and
        runtime selection for subsequent generations. Use preinstalled runtime
        packages; dynamic package preparation is disabled even if ir or uv is
        installed. Records, output spools, and returned images are written by
        the controller beneath its existing project .agents/console directory or
        its Console home directory; declared shares can expose them to the
        worker. Restart discards files stored only in the VM and preserves
        shared files. Quarto exports execute recorded cells when rendered;
        prepare the target environment and files first.


        Runtime availability depends on the configured template. All
        dependencies and DuckDB extensions must be preinstalled there; Console
        never invokes dependency resolvers or installs missing imports. Rebuild
        the template and start a new server session to change its runtime or
        packages. Plain worker restart retains the selected interpreter and
        creates fresh language state and an empty in-memory SQL catalog.
      inputSchema:
        $schema: https://json-schema.org/draft/2020-12/schema
        additionalProperties: false
        type: object
        properties:
          r:
            description: >-
              One complete R cell when R is available. Expressions display
              automatically; R plots return as PNG images. When both runtimes and
              their bridge are available, read Python globals through py$name. R-owned
              DuckDB can query R global data frames by name. .console$sql_connection()
              returns the active native DBI connection, or errors if SQL uses Python;
              .console$sql_connection(connection) selects a user-owned DBI connection,
              and .console$sql_connection(NULL) restores the Console-owned catalog.
              Missing packages report ordinary R errors; automatic package
              installation is unavailable. Omit for polling or stdin-only calls.
              Dependencies must be preinstalled in the template.
            type:
              - string
              - "null"
          python:
            description: >-
              One complete Python cell when Python is available. The final expression
              displays automatically. Use input() for managed stdin; Matplotlib plots
              return as PNG images when installed. When both runtimes and their bridge
              are available, read R globals through r.name.
              _console.sql_connection(connection) selects a user-owned DB-API
              connection, and _console.sql_connection(None) restores the Console-owned
              catalog. _console.sql_connection() returns the active native Python
              connection, or errors if SQL uses R. Missing imports report ordinary
              Python errors; automatic package installation is unavailable. Omit for
              polling or stdin-only calls. Dependencies must be preinstalled in the
              template.
            type:
              - string
              - "null"
          sql:
            description: >-
              One complete SQL cell through the active R DBI or Python DB-API
              connection, depending on available runtimes and the selected connection.
              Console opens its in-memory DuckDB catalog during background startup
              when SQL is enabled and the adapter and DuckDB are preinstalled;
              first-query work remains deferred. R-owned DuckDB can query R global
              data frames by name; without R, Python data frames require explicit
              registration with _console.sql_connection().register(name, frame).
              _console.sql_connection(connection) in Python or
              .console$sql_connection(connection) in R selects a user-owned
              connection; passing None/NULL restores the Console-owned catalog without
              discarding it. A query with columns returns a bounded preview. Use the
              selected driver's SQL dialect; DuckDB CLI dot commands are unsupported.
              Extensions must be preinstalled; Console does not install extensions or
              resolve packages. Worker replacement resets the catalog. Omit for
              polling or stdin-only calls. Dependencies must be preinstalled in the
              template.
            type:
              - string
              - "null"
          control:
            description: >-
              Applies lifecycle control alone or before compatible same-call fields.
              interrupt signals the live worker and preserves state; compatible
              following input is queued before the 100-millisecond interrupt grace. A
              following cell runs only after the earlier operation finishes. restart
              discards language objects, debugger state, unread stdin, and the
              in-memory SQL catalog, retains the captured image/template and
              interpreter, and sends same-call input and code only to the replacement
              worker. Dependency preparation is unavailable. Dependencies must be
              preinstalled in the template.
            type: string
            enum:
              - interrupt
              - restart
          requirements:
            type:
              - object
              - "null"
            description: >-
              Inspect the server's retained declaration with action=get. Preparation
              is unavailable for this target; the declaration is not an
              installed-package inventory.
            properties:
              action:
                type: string
                enum:
                  - get
            required:
              - action
            additionalProperties: false
          stdin:
            description: |-
              Input for an active read, prompt, or debugger. When responding to active input, omit R, Python,
              and SQL code and send stdin on its own. Its UTF-8 encoding is queued exactly; no newline is added.
              Line-oriented input therefore normally needs a trailing `\n`. On a code-bearing call without
              control, available requirements are prepared before nonempty stdin is queued. Standalone
              preparation cannot queue nonempty stdin. After `interrupt`, nonempty stdin is queued before the
              100-millisecond grace and may be consumed while the earlier operation unwinds. After `restart`,
              same-call stdin is sent only to the replacement. When sent with a cell, nonempty text is queued
              before the code is run; an already waiting interactive read may consume it before the new cell
              begins. Empty text queues nothing. If output ends in `[waiting for stdin]`, send the requested
              input here. Unread text can satisfy later reads and is discarded by restart.
            type:
              - string
              - "null"
          timeout_ms:
            description: |-
              Omit for normal calls and polls. This limits how long the tool waits; it returns immediately
              when execution completes. Reaching the timeout does not cancel execution. Use `0` to start
              background work, then poll with an empty `send`.

              Defaults to 60,000 milliseconds. One deadline starts at call entry and includes initial
              background startup, evaluation observation, and one automatic worker replacement attempt. It does not cancel resolution
              or startup. Inline control, interrupt grace, restart, and explicit requirement preparation happen
              before dispatch and may make the complete call take longer. This value does not limit standalone
              preparation. Automatic R and Python import
              resolution are part of the running evaluation and count toward this wait. On expiry, the call
              returns available output and a state marker, such as
              `[running; poll with an empty send]` or `[worker starting]`. If evaluation remains active, poll
              with an empty `send` call; do not resubmit the cell.
            type: integer
            format: uint64
            minimum: 0
            default: 60000
---
send:
  python: raise AssertionError('unavailable cell ran')
result:
  content:
    - type: text
      text: "Python cells are unavailable: the target has no Python runtime"
  isError: true
