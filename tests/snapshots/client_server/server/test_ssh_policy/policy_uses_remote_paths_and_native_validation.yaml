---
send:
  r: |
    writable <- function(path) {
      tryCatch({writeLines("remote value", path); TRUE}, error = function(error) FALSE)
    }
    suppressWarnings(stopifnot(
      writable("results/value"),
      writable("cli/value"),
      !writable("denied/value"),
      !writable("workspace-value")
    ))
    cat("remote relative and CLI grants verified\n")
result:
  content:
    - type: text
      text: |
        remote relative and CLI grants verified
  isError: false
---
send:
  r: must_not_run <- TRUE
result:
  content:
    - type: text
      text: >-
        [worker relay stdout read failed: remote launcher exited with exit
        status: 1; remote retirement is unconfirmed (SSH exit is not a cleanup
        barrier); additionally failed to stop the worker: remote retirement is
        unconfirmed (SSH exit is not a cleanup barrier)]
  isError: true
---
standard_error: |
  mcp-console-sandbox: invalid configuration JSON (Data at line 1, column <column>)
  remote launcher exited with exit status: 1
---
standalone_sandbox_remained_local: true
