---
send:
  r: |
    writable <- function(path) {
      tryCatch(
        {
          writeLines("remote value", path)
          TRUE
        },
        error = function(error) FALSE
      )
    }
    suppressWarnings(stopifnot(
      writable("results/value"),
      writable("cli/value"),
      writable("workspace-value"),
      !writable("../outside-workspace")
    ))
    cat("remote workspace grant verified\n")
result:
  content:
    - type: text
      text: |
        remote workspace grant verified
  isError: false
---
send:
  r: must_not_run <- TRUE
result:
  content:
    - type: text
      text: >-
        [worker relay stdout read failed: remote launcher exited with exit
        status: 1; additionally failed to stop the worker: SSH process exited
        with exit status: 1; additionally failed to retire worker I/O: remote
        retirement is unconfirmed (SSH exit is not a cleanup barrier)]
  isError: true
---
standard_error: |
  mcp-console-sandbox: invalid configuration JSON (Data at line 1, column <column>)
  remote launcher exited with exit status: 1
---
standalone_sandbox_remained_local: true
