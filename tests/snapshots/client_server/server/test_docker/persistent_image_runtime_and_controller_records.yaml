---
send:
  r: >-
    x <- 41; stopifnot(getwd() == "/workspace", file.exists("/.dockerenv"));
    x + 1
result:
  content:
    - type: text
      text: |
        [1] 42
  isError: false
---
send:
  python: |
    import os, sys, json
    from pathlib import Path
    assert sys.executable == os.environ["RETICULATE_PYTHON"]
    assert os.environ["MCP_CONSOLE_DYNAMIC_ENVIRONMENT_RESOLUTION"] == "0"
    assert os.environ["RETICULATE_USE_MANAGED_VENV"] == "no"
    assert Path('/read only, "quoted"/value').read_text() == "read-only data"
    try:
        Path('/read only, "quoted"/forbidden').write_text("bad")
    except OSError:
        print("read-only mount enforced")
    else:
        raise AssertionError("read-only mount was writable")
    Path("result.txt").write_text("persistent bind")
    Path("/tmp/layer-state").write_text("ephemeral layer")
    print(r.x + 1)
result:
  content:
    - type: text
      text: |
        read-only mount enforced
        42.0
  isError: false
---
send:
  sql: SELECT 6 * 7 AS answer
result:
  content:
    - type: text
      text: |
        # A tibble: 1 × 1
           answer
          <int32>
        1      42
  isError: false
---
send:
  python: 'print(input("container prompt: "))'
result:
  content:
    - type: text
      text: |-
        [input requested: "container prompt: "]
        [waiting for stdin]
  isError: false
---
send:
  stdin: |
    input value
result:
  content:
    - type: text
      text: |
        input value
  isError: false
---
send:
  r: plot(1:3)
result:
  content:
    - type: image
      data: <PNG byte-identical to controller recording>
      mimeType: image/png
  isError: false
---
send:
  r: cat("interrupt gate\n"); flush.console(); repeat Sys.sleep(60)
  timeout_ms: 1
result:
  content:
    - type: text
      text: |-
        interrupt gate

        [running; poll with an empty send]
  isError: false
---
send:
  control: interrupt
result:
  content:
    - type: text
      text: "\n"
  isError: false
---
send:
  r: gctorture(TRUE); stop("container expected error")
result:
  content:
    - type: text
      text: |
        Error: container expected error
  isError: false
---
send:
  r: gctorture(FALSE); x
result:
  content:
    - type: text
      text: |
        [1] 41
  isError: false
---
send:
  requirements:
    r:
      - praise
result:
  content:
    - type: text
      text: >-
        dynamic environment resolution is disabled for Docker targets; install
        packages in the image and start a new server session
  isError: true
---
send:
  python: print(Path("/etc/hostname").read_text().strip())
result:
  content:
    - type: text
      text: |
        <container>
  isError: false
---
send:
  control: restart
result:
  content:
    - type: text
      text: |-
        [worker stopped: in-memory state lost]
        [starting new worker]
        [idle]
  isError: false
---
send:
  python: >-
    from pathlib import Path; print(Path("result.txt").read_text());
    print(Path("/tmp/layer-state").exists())
result:
  content:
    - type: text
      text: |
        persistent bind
        False
  isError: false
