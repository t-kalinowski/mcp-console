---
!same-as tests/snapshots/client_server/server/test_tools/initializes_and_lists_tools.yaml
---
send:
  r: writeLines("from R", "result.txt"); answer <- 42
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  r: answer
result:
  content:
    - type: text
      text: |
        [1] 42
  isError: false
---
send:
  control: restart
result:
  content:
    - type: text
      text: |-
        [worker stopped: in-memory state lost]
        [starting new worker]
        [idle]
  isError: false
---
send:
  r: exists("answer")
result:
  content:
    - type: text
      text: |
        [1] FALSE
  isError: false
