---
!same-as MCP initialization for this execution mode
---
send:
  python: |
    import os
    import sys

    docs = _console.python_docs()
    assert docs["python_minor"] == os.environ["EXPECTED_DOCS_MINOR"]
    assert docs["python_minor"] == f"{sys.version_info.major}.{sys.version_info.minor}"
    assert docs["directory"].parent.name == docs["python_minor"]
    print("selected interpreter manual")
result:
  content:
    - type: text
      text: |
        selected interpreter manual
  isError: false
---
send:
  control: restart
result:
  content:
    - type: text
      text: |-
        [worker stopped: in-memory state lost]
        [starting new worker]
        [idle]
  isError: false
---
send:
  python: print(_console.python_docs()); print(42)
result:
  content:
    - type: text
      text: |
        None
        42
  isError: false
