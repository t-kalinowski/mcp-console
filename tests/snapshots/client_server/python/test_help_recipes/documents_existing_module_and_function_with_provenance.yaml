---
!same-as MCP initialization for this execution mode
---
send:
  python: import importlib.metadata, platform, pydoc, recipe_example
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  python: |
    module = recipe_example
    print(f"Python {platform.python_version()}")
    print(f"Module {module.__name__}: {module.__spec__.origin}")
    print(
        f"Distribution recipe-distribution: {importlib.metadata.version('recipe-distribution')}"
    )
    for target in (module, module.double):
        encoded = pydoc.render_doc(target, renderer=pydoc.plaintext).encode("utf-8")
        preview = encoded[:4096].decode("utf-8", errors="ignore")
        print(preview, end="")
        omitted = len(encoded) - len(preview.encode("utf-8"))
        if omitted:
            print(f"\n[documentation preview; {omitted} UTF-8 bytes omitted]")
result:
  content:
    - type: text
      text: |
        Python <installed version>
        Module recipe_example: <workspace>/recipe_example.py
        Distribution recipe-distribution: 1.2.3
        Python Library Documentation: module recipe_example

        NAME
            recipe_example - A local documentation example.

        FUNCTIONS
            double(value: int) -> int
                Return twice the value.

        FILE
            <workspace>/recipe_example.py

        Python Library Documentation: function double in module recipe_example

        double(value: int) -> int
            Return twice the value.
  isError: false
