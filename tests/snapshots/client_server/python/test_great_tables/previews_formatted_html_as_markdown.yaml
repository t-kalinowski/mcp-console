---
!same-as MCP initialization for this execution mode
---
send: {}
result:
  content:
    - type: text
      text: |-

        [idle]
  isError: false
---
send:
  python: |
    import pandas as pd
    from great_tables import GT, loc, md, style

    table = (
        GT(
            pd.DataFrame(
                {
                    "Region": ["North", "South"],
                    "Revenue": [1234.5, 9876.0],
                    "Share": [0.126, 0.874],
                }
            )
        )
        .tab_header(title=md("**Quarterly sales**"))
        .fmt_currency(columns="Revenue", currency="USD", decimals=2)
        .fmt_percent(columns="Share", decimals=1)
        .tab_style(style=style.fill(color="#e5f5ff"), locations=loc.column_labels())
        .tab_style(style=style.fill(color="#fff2cc"), locations=loc.body(columns="Revenue"))
        .tab_options(table_width="500px")
    )
  timeout_ms: 600000
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  python: |
    from bs4 import BeautifulSoup
    from markdownify import markdownify

    # Convert the formatted HTML, keeping the title outside the Markdown table.
    rendered = BeautifulSoup(table.as_raw_html(), "html.parser").select_one("table")
    heading = rendered.select_one("tr.gt_heading")
    print(markdownify(heading.select_one("td").decode_contents()).strip())
    print()
    heading.decompose()
    print(markdownify(str(rendered)).strip())
  timeout_ms: 600000
result:
  content:
    - type: text
      text: |
        **Quarterly sales**

        | Region | Revenue | Share |
        | --- | --- | --- |
        | North | $1,234.50 | 12.6% |
        | South | $9,876.00 | 87.4% |
  isError: false
