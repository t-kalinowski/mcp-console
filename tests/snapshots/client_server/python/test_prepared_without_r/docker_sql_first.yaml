---
send:
  requirements:
    action: get
result:
  content:
    - type: text
      text: |-
        {
          "requirements": {
            "r": [],
            "python": [],
            "duckdb": [],
            "python_version": [],
            "exclude_newer": null
          },
          "prepared": false,
          "runtime_requirements": {
            "r": [],
            "python": []
          }
        }
  structuredContent:
    requirements:
      r: []
      python: []
      duckdb: []
      python_version: []
      exclude_newer: ~
    prepared: false
    runtime_requirements:
      r: []
      python: []
  isError: false
---
send:
  sql: CREATE TABLE retained AS SELECT 42 AS answer; SELECT * FROM retained
result:
  content:
    - type: text
      text: |
        answer
        ------
        42
  isError: false
---
send:
  python: |
    import os, sys, shutil, subprocess

    assert shutil.which("R") is None
    assert shutil.which("Rscript") is None
    assert not os.environ.get("R_HOME")
    assert sys.executable == "/opt/console-python/bin/python3"
    assert sys.prefix == "/opt/console-python"
    assert (
        subprocess.check_output(
            [sys.executable, "-c", "import sys; print(sys.prefix)"], text=True
        ).strip()
        == sys.prefix
    )
    retained = 41
    print(retained + 1)
result:
  content:
    - type: text
      text: |
        42
  isError: false
---
send:
  sql: SELECT * FROM retained
result:
  content:
    - type: text
      text: |
        answer
        ------
        42
  isError: false
---
send:
  control: restart
result:
  content:
    - type: text
      text: |-
        [worker stopped: in-memory state lost]
        [starting new worker]
        [idle]
  isError: false
---
send:
  python: print("retained" in globals())
result:
  content:
    - type: text
      text: |
        False
  isError: false
---
send:
  sql: SHOW TABLES
result:
