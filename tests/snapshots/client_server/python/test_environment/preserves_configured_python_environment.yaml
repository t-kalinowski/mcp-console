---
!same-as MCP initialization for this execution mode
---
send:
  r: |
    external_python_worker <- Sys.getpid()
    external_python_state <- 42L
    stopifnot(
      identical(
        Sys.getenv("RETICULATE_PYTHON", unset = NA_character_),
        "configured-by-user"
      )
    )
    "configured-by-user"
result:
  content:
    - type: text
      text: |
        [1] "configured-by-user"
  isError: false
---
send:
  requirements:
    python:
      - numpy
result:
  content:
    - type: text
      text: >-
        managed Python requirements are disabled because the session uses a
        user-selected Python environment
  isError: true
---
send:
  control: restart
  requirements:
    python:
      - numpy
result:
  content:
    - type: text
      text: >-
        managed Python requirements are disabled because the session uses a
        user-selected Python environment
  isError: true
---
send:
  r: external_python_combined_side_effect <- TRUE
  requirements:
    python:
      - numpy
result:
  content:
    - type: text
      text: >-
        managed Python requirements are disabled because the session uses a
        user-selected Python environment
  isError: true
---
send:
  python: 6 * 7
result:
  content:
    - type: text
      text: >
        Error: Python is unavailable: cannot run `configured-by-user`: No such
        file or directory (os error 2)
  isError: false
---
send:
  r: |
    stopifnot(
      identical(Sys.getpid(), external_python_worker),
      identical(external_python_state, 42L),
      !exists("external_python_combined_side_effect", inherits = FALSE),
      identical(
        Sys.getenv("RETICULATE_PYTHON", unset = NA_character_),
        "configured-by-user"
      )
    )
    42L
result:
  content:
    - type: text
      text: |
        [1] 42
  isError: false
