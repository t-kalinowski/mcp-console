---
!same-as MCP initialization for this execution mode
---
send:
  requirements:
    action: get
result:
  content:
    - type: text
      text: |-
        {
          "requirements": {
            "r": [
              "DBI",
              "arrow",
              "duckdb",
              "nanoarrow",
              "reticulate",
              "tidyverse",
              "yyjsonr"
            ],
            "python": [
              "numpy",
              "pandas"
            ],
            "duckdb": [
              "icu",
              "json",
              "sqlite"
            ],
            "python_version": [],
            "exclude_newer": null
          },
          "prepared": true,
          "runtime_requirements": {
            "r": [
              "DBI",
              "arrow",
              "duckdb",
              "jsonlite",
              "nanoarrow",
              "pillar",
              "reticulate",
              "tibble",
              "utf8"
            ],
            "python": []
          }
        }
  structuredContent:
    requirements:
      r:
        - DBI
        - arrow
        - duckdb
        - nanoarrow
        - reticulate
        - tidyverse
        - yyjsonr
      python:
        - numpy
        - pandas
      duckdb:
        - icu
        - json
        - sqlite
      python_version: []
      exclude_newer: ~
    prepared: true
    runtime_requirements:
      r:
        - DBI
        - arrow
        - duckdb
        - jsonlite
        - nanoarrow
        - pillar
        - reticulate
        - tibble
        - utf8
      python: []
  isError: false
---
send:
  control: restart
result:
  content:
    - type: text
      text: |-
        [worker stopped: in-memory state lost]
        [starting new worker]
        [idle]
  isError: false
---
send:
  r: |
    worker_cache <- Sys.getenv("MCP_CONSOLE_TEST_WORKER_UV_CACHE")
    Sys.setenv(
      UV_CACHE_DIR = worker_cache,
      UV_DEFAULT_INDEX = "file:///worker-selected-index"
    )
    reticulate::py_require("py-yaml12")
    invisible(reticulate::py_config())
    stopifnot(
      reticulate::py_module_available("yaml12"),
      identical(Sys.getenv("UV_CACHE_DIR"), worker_cache),
      identical(
        Sys.getenv("UV_DEFAULT_INDEX"),
        "file:///worker-selected-index"
      )
    )
result:
  content:
    - type: text
      text: "[done]"
  isError: false
