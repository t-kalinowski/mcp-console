---
!same-as tests/snapshots/client_server/server/test_tools/initializes_and_lists_tools.yaml
---
send:
  python: |
    import torch

    assert torch.backends.openmp.is_available()
    torch.set_num_threads(2)
    x = torch.ones(65536, dtype=torch.float64, device="cpu", requires_grad=True)
    loss = x.square().sum()
    loss.backward()
    assert torch.equal(x.grad, torch.full_like(x, 2))
    result = (loss.item(), x.grad[0].item(), torch.get_num_threads())
    assert result == (65536.0, 2.0, 2)
    result
  requirements:
    python:
      - torch==2.14.0
result:
  content:
    - type: text
      text: |
        OMP: Warning #179: Function Can't set size of /tmp file failed:
        <string>:137: FutureWarning: The pynvml package is deprecated. Please install nvidia-ml-py instead. If you did not install pynvml directly, please report this to the maintainers of the package that installed pynvml for you.
        (65536.0, 2.0, 2)
  isError: false
transcript_normalization:
  target: result.content[0].text
  response_cuts: coalesced
  cross_source_position: omitted
