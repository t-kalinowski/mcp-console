---
!same-as bare MCP initialization for this execution mode
---
send:
  python: never_run = True
  timeout_ms: 0
result:
  content:
    - type: text
      text: |-

        [running; poll with an empty send]
  isError: false
---
send:
  control: interrupt
  timeout_ms: 10000
result:
  content:
    - type: text
      text: >
        Error: Python is unavailable: cannot run `<workspace>/python`:
        KeyboardInterrupt
  isError: false
---
send:
  python: |
    import os

    assert os.getpid() == <worker pid>
    "never_run" in globals()
result:
  content:
    - type: text
      text: |
        False
  isError: false
