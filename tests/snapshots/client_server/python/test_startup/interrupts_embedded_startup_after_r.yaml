---
!same-as MCP initialization for this execution mode
---
send:
  r: startup_state <- 41L; Sys.getpid()
result:
  content:
    - type: text
      text: |
        [1] <worker pid>
  isError: false
---
send:
  python: never_run = True
  timeout_ms: 10000
result:
  content:
    - type: text
      text: |-
        [input requested: "startup interrupt> "]
        [waiting for stdin]
  isError: false
---
send:
  control: interrupt
  timeout_ms: 10000
result:
  content:
    - type: text
      text: |
        Traceback (most recent call last):
          File "<string>", line 80, in initialize_site
          File "<frozen site>", line <line>, in main
          File "<frozen site>", line <line>, in execsitecustomize
          File "<site-packages>/sitecustomize.py", line 14, in <module>
            input("startup interrupt> ")
          File "<string>", line 51, in _console_input
        KeyboardInterrupt
  isError: false
---
send:
  python: |
    import builtins
    import os

    assert os.getpid() == <worker pid>
    assert builtins.startup_attempts == 2
    "never_run" in globals()
result:
  content:
    - type: text
      text: |
        False
  isError: false
---
send:
  python: builtins.startup_attempts
result:
  content:
    - type: text
      text: |
        2
  isError: false
---
send:
  r: startup_state + 1L
result:
  content:
    - type: text
      text: |
        [1] 42
  isError: false
