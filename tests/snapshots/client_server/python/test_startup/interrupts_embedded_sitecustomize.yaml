---
!same-as bare MCP initialization for this execution mode
---
send:
  python: never_run = True
  timeout_ms: 0
result:
  content:
    - type: text
      text: |-

        [running; poll with an empty send]
  isError: false
---
send:
  control: interrupt
  timeout_ms: 10000
result:
  content:
    - type: text
      text: |
        Traceback (most recent call last):
          File "<frozen site>", line <line>, in main
          File "<frozen site>", line <line>, in execsitecustomize
          File "<site-packages>/sitecustomize.py", line 15, in <module>
            signal.pause()
          File "<string>", line 92, in _interrupt
        KeyboardInterrupt
        Error: Python function `site.main` failed
  isError: false
---
send:
  python: |
    import builtins
    import os

    assert os.getpid() == <worker pid>
    assert builtins.startup_attempts == 2
    "never_run" in globals()
result:
  content:
    - type: text
      text: |
        False
  isError: false
---
send:
  python: builtins.startup_attempts
result:
  content:
    - type: text
      text: |
        2
  isError: false
