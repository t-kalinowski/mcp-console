              "numpy",
              "pandas",
              "py-yaml12"
            ],
            "duckdb": [
              "icu",
              "json",
              "sqlite"
            ],
            "python_version": [],
            "exclude_newer": null
          },
          "prepared": true,
          "runtime_requirements": {
