---
!same-as MCP initialization for this execution mode
---
send:
  r: |
    selection_serializations <- 0L
    invisible(suppressMessages(base::trace(
      "toJSON",
      tracer = quote({
        if (
          is.list(x) &&
            identical(
              names(x),
              c("python", "libpython", "python_home")
            )
        ) {
          selection_serializations <<- selection_serializations + 1L
          if (selection_serializations == 2L) {
            stop(base::structure(
              base::list(
                message = "synthetic serialization interrupt",
                call = NULL
              ),
              class = c("interrupt", "condition")
            ))
          }
        }
      }),
      print = FALSE,
      where = asNamespace("jsonlite")
    )))
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  python: 41 + 1
result:
  content:
    - type: text
      text: |
        42
  isError: false
---
send:
  r: stopifnot(selection_serializations == 1L); 42L
result:
  content:
    - type: text
      text: |
        [1] 42
  isError: false
