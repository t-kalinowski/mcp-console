---
!same-as MCP initialization for this execution mode
---
send:
  r: |
    stopifnot(callback_calls == 1L, attachment_calls == 1L)
    config <- reticulate::py_config()
    stopifnot(config$available, file.exists(config$libpython))
    reticulate::py_run_string("owned_object = object(); owned_id = id(owned_object)")
    cat("one native bootstrap and bridge attachment\n")
result:
  content:
    - type: text
      text: |
        one native bootstrap and bridge attachment
  isError: false
---
send:
  python: >-
    assert id(owned_object) == owned_id; assert int(r.callback_calls) == 1;
    42
result:
  content:
    - type: text
      text: |
        42
  isError: false
