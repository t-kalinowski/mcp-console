---
!same-as MCP initialization for this execution mode
---
send:
  python: raise AssertionError('failed startup ran code')
result:
  content:
    - type: text
      text: |-
        Error in callback() : synthetic startup attachment failure
        Python bridge failed during R evaluation
        [worker sideband read failed: worker sideband closed]
        [worker exited with status 1]
        [worker stopped: in-memory state lost]
  isError: true
---
input:
  method: ping
result: {}
---
send:
  python: raise AssertionError('failed startup ran code again')
result:
  content:
    - type: text
      text: "[worker sideband read failed: worker sideband closed]"
  isError: true
---
send:
  control: restart
  python: raise AssertionError('replacement startup ran code')
result:
  content:
    - type: text
      text: |-
        [starting new worker]
        Error in callback() : synthetic startup attachment failure
        Python bridge failed during R evaluation
        [worker sideband read failed: worker sideband closed]
        [worker exited with status 1]
        [worker stopped: in-memory state lost]
  isError: true
---
send:
  python: raise AssertionError('replacement retried startup')
result:
  content:
    - type: text
      text: "[worker sideband read failed: worker sideband closed]"
  isError: true
---
send:
  control: restart
result:
  content:
    - type: text
      text: |-
        [starting new worker]
        [worker starting]
  isError: false
---
send:
  r: stopifnot(startup_recovered); 42L
result:
  content:
    - type: text
      text: |
        [1] 42
  isError: false
