---
!same-as MCP initialization for this execution mode
---
send:
  r: |
    startup_probe <- dyn.load("<test python probe>")
    startup_calls <- 0L
    invisible(suppressMessages(base::trace(
      "py_initialize",
      tracer = quote({
        assign(
          "startup_calls",
          get("startup_calls", envir = .GlobalEnv) + 1L,
          envir = .GlobalEnv
        )
        stopifnot(identical(
          .C(
            getNativeSymbolInfo(
              "mcp_console_probe_python_initialized",
              PACKAGE = .GlobalEnv$startup_probe
            ),
            value = 0L
          )$value,
          1L
        ))
      }),
      print = FALSE,
      where = asNamespace("reticulate")
    )))
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  python: |
    startup_value = 41
    startup_value + 1
result:
  content:
    - type: text
      text: |
        42
  isError: false
---
send:
  r: |
    stopifnot(startup_calls == 1L)
    reticulate::py_to_r(reticulate::py$startup_value) + 1L
result:
  content:
    - type: text
      text: |
        [1] 42
  isError: false
