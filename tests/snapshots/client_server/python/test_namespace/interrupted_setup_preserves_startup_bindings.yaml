---
!same-as MCP initialization for this execution mode
---
send:
  python: raise AssertionError("interrupted setup ran the cell")
result:
  content:
    - type: text
      text: |-
        [input requested: "namespace setup> "]
        [waiting for stdin]
  isError: false
---
send:
  control: interrupt
result:
  content:
    - type: text
      text: |
        Traceback (most recent call last):
          File "<string>", line 109, in initialize_site
          File "<frozen site>", line 709, in main
          File "<frozen site>", line 648, in execsitecustomize
          File "<namespace-workspace>/modules/sitecustomize.py", line 4, in <module>
            exec(checkpoint)
            ~~~~^^^^^^^^^^^^
          File "<namespace setup checkpoint>", line 7, in <module>
          File "<string>", line 50, in _console_input
        KeyboardInterrupt
  isError: false
---
send:
  python: |
    assert all(a is b for a, b in zip((os, sys, tempfile), namespace_bindings))
    assert os is __import__("os") and tempfile is __import__("tempfile")
    assert not any(name.startswith("_mcp_console") for name in vars(__import__("builtins")))
    print("startup namespace preserved")
result:
  content:
    - type: text
      text: |
        startup namespace preserved
  isError: false
---
send:
  r: >-
    stopifnot(reticulate::py_eval("all(a is b for a, b in zip((os, sys,
    tempfile), namespace_bindings))"))
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  control: restart
result:
  content:
    - type: text
      text: |-
        [worker stopped: in-memory state lost]
        [starting new worker]
        [idle]
  isError: false
---
send:
  python: |
    assert globals() is __import__("__main__").__dict__
    assert __name__ == "__main__"
    assert globals().keys() <= {
        "__name__", "__doc__", "__package__", "__loader__", "__spec__",
        "__builtins__", "__annotations__", "r",
    }
    assert not {"os", "sys", "tempfile"} & globals().keys()
    assert not {"os", "sys", "tempfile"} & vars(__import__("builtins")).keys()
    assert not any(name.startswith("_mcp_console") for name in vars(__import__("builtins")))
    assert callable(_console.sql_connection)
    assert hasattr(__import__("builtins"), "r")
    print("clean Python namespace")
result:
  content:
    - type: text
      text: |
        clean Python namespace
  isError: false
