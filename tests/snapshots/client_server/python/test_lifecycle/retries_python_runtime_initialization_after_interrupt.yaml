---
!same-as MCP initialization for this execution mode
---
send:
  r: |
    options(reticulate.python.afterInitialized = function() {
      reticulate::py_run_string(paste(
        "import numpy as np",
        "original_get_printoptions = np.get_printoptions",
        "runtime_identity = object()",
        "runtime_identity_id = id(runtime_identity)",
        "def configuration_checkpoint():",
        "    np.get_printoptions = original_get_printoptions",
        "    input('python runtime configuring> ')",
        "    return original_get_printoptions()",
        "np.get_printoptions = configuration_checkpoint",
        sep = "\n"
      ))
    })
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  python: "42"
result:
  content:
    - type: text
      text: |-
        [input requested: "python runtime configuring> "]
        [waiting for stdin]
  isError: false
---
send:
  control: interrupt
  timeout_ms: 0
result:
  content:
    - type: text
      text: ""
  isError: false
---
send:
  r: options(reticulate.python.afterInitialized = NULL)
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  python: assert id(runtime_identity) == runtime_identity_id; 42
result:
  content:
    - type: text
      text: |
        42
  isError: false
---
send:
  python: import yaml12; yaml12.__name__
result:
  content:
    - type: text
      text: |
        [resolved PyPI distribution 'py-yaml12' for Python import 'yaml12']
        'yaml12'
  isError: false
---
send:
  python: |
    import logging

    sum(
        getattr(filter_, "_mcp_console_filter", False)
        for filter_ in logging.getLogger("matplotlib.font_manager").filters
    )
result:
  content:
    - type: text
      text: |
        1
  isError: false
