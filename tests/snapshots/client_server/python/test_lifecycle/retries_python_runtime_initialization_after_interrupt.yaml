---
!same-as MCP initialization for this execution mode
---
send:
  r: |
    invisible(suppressMessages(base::trace(
      "py_set_attr",
      tracer = quote({
        if (
          identical(name, "operation") &&
            identical(value, "configure_import_resolution")
        ) {
          invisible(readline("python runtime configuring> "))
        }
      }),
      print = FALSE,
      where = asNamespace("reticulate")
    )))
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  python: "42"
result:
  content:
    - type: text
      text: |-
        [input requested: "python runtime configuring> "]
        [waiting for stdin]
  isError: false
---
send:
  control: interrupt
  timeout_ms: 0
result:
  content:
    - type: text
      text: ""
  isError: false
---
send:
  r: |
    invisible(suppressMessages(base::untrace(
      "py_set_attr",
      where = asNamespace("reticulate")
    )))
    length(getHook("reticulate::matplotlib.pyplot::load"))
result:
  content:
    - type: text
      text: |
        [1] 1
  isError: false
---
send:
  python: "42"
result:
  content:
    - type: text
      text: |
        42
  isError: false
---
send:
  python: import yaml12; yaml12.__name__
result:
  content:
    - type: text
      text: |
        [resolved PyPI distribution 'py-yaml12' for Python import 'yaml12']
        'yaml12'
  isError: false
---
send:
  python: |
    import logging

    sum(
        getattr(filter_, "_mcp_console_filter", False)
        for filter_ in logging.getLogger("matplotlib.font_manager").filters
    )
result:
  content:
    - type: text
      text: |
        1
  isError: false
