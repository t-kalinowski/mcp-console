---
send:
  r: 42L
result:
  content:
    - type: text
      text: "[R cells are unavailable in Python sessions without R]"
  isError: true
---
send:
  sql: SELECT 42 AS value
result:
  content:
    - type: text
      text: >
        Error: DuckDB is unavailable; add duckdb with requirements.python and
        control: restart in a managed session, install it before starting a
        selected Python environment, or select a DB-API connection with
        console_sql_connection(connection)
  isError: false
---
send:
  python: |-
    import os, sqlite3, sys
    assert sys.executable == os.path.join(os.getcwd(), '.venv/bin/python')
    connection = sqlite3.connect(':memory:')
    console_sql_connection(connection)
    print('selected remote Python')
result:
  content:
    - type: text
      text: |
        selected remote Python
  isError: false
---
send:
  sql: CREATE TABLE answer(value INTEGER)
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  sql: INSERT INTO answer VALUES (42)
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  sql: SELECT value FROM answer
result:
  content:
    - type: text
      text: |
        value
        -----
        42
  isError: false
---
send:
  requirements:
    python:
      - six
result:
  content:
    - type: text
      text: >-
        Python requirements are unavailable in this non-managed Python session;
        install packages before starting the session
  isError: true
---
send:
  python: print(connection.execute('SELECT value FROM answer').fetchone()[0])
result:
  content:
    - type: text
      text: |
        42
  isError: false
---
send:
  python: input('interrupt> ')
result:
  content:
    - type: text
      text: |-
        [input requested: "interrupt> "]
        [waiting for stdin]
  isError: false
---
send:
  control: interrupt
result:
  content:
    - type: text
      text: |
        Traceback (most recent call last):
          File "<mcp-console:python:e3>", line 1, in <module>
        KeyboardInterrupt
  isError: false
---
send:
  sql: SELECT value FROM answer
result:
  content:
    - type: text
      text: |
        value
        -----
        42
  isError: false
