---
send:
  python: |
    import builtins
    import ctypes
    import os
    import sqlite3
    import sys
    import numpy as np

    def r_initialized():
        try:
            return bool(ctypes.c_void_p.in_dll(ctypes.CDLL(None), "R_GlobalEnv").value)
        except ValueError:
            return False

    assert not r_initialized(), "R initialized before Python demand"
    assert builtins.peer_startups == 1
    persistent = object()
    connection = sqlite3.connect(":memory:")
    connection.execute("create table peer(value integer)")
    connection.execute("insert into peer values (42)")
    console_sql_connection(connection)
    np.set_printoptions(linewidth=73)
    before = (id(persistent), id(connection), sys.executable, sys.prefix,
              os.environ["MPLCONFIGDIR"], os.environ["XDG_CACHE_HOME"])
    print("Python live; R absent")
result:
  content:
    - type: text
      text: |
        Python live; R absent
  isError: false
---
send:
  r: >-
    peer_from_r <- 41L; stopifnot(reticulate::py_eval('persistent is not
    None'))
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  python: |
    assert r_initialized()
    assert builtins.peer_startups == 1
    assert before == (
        id(persistent),
        id(connection),
        sys.executable,
        sys.prefix,
        os.environ["MPLCONFIGDIR"],
        os.environ["XDG_CACHE_HOME"],
    )
    assert connection.execute("select value from peer").fetchone() == (42,)
    assert np.get_printoptions()["linewidth"] == 73


    def nested_peer():
        return int(r["sum(c(40, 2))"])


    print("Python state and services retained")
result:
  content:
    - type: text
      text: |
        Python state and services retained
  isError: false
---
send:
  sql: select value from peer
result:
  content:
    - type: text
      text: |
        value
        -----
        42
  isError: false
---
send:
  r: stopifnot(identical(reticulate::py$nested_peer(), 42L))
result:
  content:
    - type: text
      text: "[done]"
  isError: false
