---
send:
  python: >-
    assert peer_startups == 1; cell_count = globals().get('cell_count', 0) +
    1
  timeout_ms: 0
result:
  content:
    - type: text
      text: |-

        [running; poll with an empty send]
  isError: false
---
send: {}
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  python: >-
    assert peer_startups == 1 and cell_count == 1; print('initialized once,
    evaluated once')
result:
  content:
    - type: text
      text: |
        initialized once, evaluated once
  isError: false
