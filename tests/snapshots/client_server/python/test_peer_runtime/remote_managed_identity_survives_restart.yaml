---
send:
  python: import sys; peer_object = object(); peer_id = id(peer_object)
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  requirements:
    python:
      - py-yaml12
result:
  content:
    - type: text
      text: "[prepared]"
  isError: false
---
send:
  python: >-
    import yaml12; assert id(peer_object) == peer_id; print('live identity
    retained')
result:
  content:
    - type: text
      text: |
        live identity retained
  isError: false
---
send:
  control: restart
  python: import yaml12; print('accepted environment retained')
result:
  content:
    - type: text
      text: |-
        [worker stopped: in-memory state lost]
        [starting new worker]
        accepted environment retained
        [done]
  isError: false
