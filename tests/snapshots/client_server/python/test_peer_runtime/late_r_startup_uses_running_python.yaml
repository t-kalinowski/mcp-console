---
send:
  python: before_r = object(); before_r_identity = id(before_r)
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  r: invisible(NULL)
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  r: |
    stopifnot(
      "mcpconsoleearlypython" %in% getOption("defaultPackages"),
      identical(isTRUE(reticulate::py_config()$ephemeral), FALSE),
      identical(search()[[2L]], "tools:mcp-console"),
      identical(find("py")[[1L]], "tools:mcp-console"),
      identical(find("sql_connection")[[1L]], "tools:mcp-console"),
      identical(find("console_sql_connection")[[1L]], "tools:mcp-console")
    )
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  python: >-
    assert id(before_r) == before_r_identity; assert early_executable ==
    sys.executable; print('startup package attached to running Python')
result:
  content:
    - type: text
      text: |
        startup package attached to running Python
  isError: false
---
send:
  r: |
    incompatible <- tryCatch(
        reticulate::use_python("/incompatible-python", required = TRUE),
        error = conditionMessage
    )
    stopifnot(identical(incompatible, "Python is already initialized with another selection; restart required"))
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  python: |
    import os
    import sys
    import numpy as np
    assert np.arange(3).tolist() == [0, 1, 2]
    assert os.path.samefile(sys.executable, os.environ["MCP_CONSOLE_TEST_PYTHON"])
    assert os.path.realpath(sys.prefix) == os.path.realpath(
        os.environ["MCP_CONSOLE_TEST_PYTHON_PREFIX"]
    )
    peer_value = 40
    print("shared stdout")
    sys.stderr.write("shared stderr\n")
    peer_value + 1
result:
  content:
    - type: text
      text: |
        shared stdout
        shared stderr
        41
  isError: false
---
send:
  python: |
    peer_value += 2
    raise ValueError("peer runtime sentinel")
result:
  content:
    - type: text
      text: |
        Traceback (most recent call last):
          File "<mcp-console:python:e4>", line 2, in <module>
        ValueError: peer runtime sentinel
  isError: false
---
send:
  python: |
    (
        peer_value,
        "_mcp_console" not in globals(),
        "_mcp_console" in sys.modules,
    )
result:
  content:
    - type: text
      text: |
        (42, True, True)
  isError: false
