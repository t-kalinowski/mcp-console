---
send:
  python: |
    import os
    import sys
    import tempfile
    from pathlib import Path
    import matplotlib.pyplot as plt

    assert "RETICULATE_PYTHON" not in os.environ
    assert sys.prefix != sys.base_prefix
    value = 40
    temporary = Path(tempfile.gettempdir())
    (temporary / "owned.txt").write_text("owned")
    print(temporary)
result:
  content:
    - type: text
      text: |
        <worker temporary>
  isError: false
---
send:
  python: value += 1; print('before error'); raise ValueError('recoverable')
result:
  content:
    - type: text
      text: |
        before error
        Traceback (most recent call last):
          File "<string>", line 466, in _mcp_console_eval_cell
          File "<mcp-console:python:e2>", line 1, in <module>
        ValueError: recoverable
  isError: false
---
send:
  python: value + 1
result:
  content:
    - type: text
      text: |
        42
  isError: false
---
send:
  python: answer = input('value> '); answer
result:
  content:
    - type: text
      text: |-
        [input requested: "value> "]
        [waiting for stdin]
  isError: false
