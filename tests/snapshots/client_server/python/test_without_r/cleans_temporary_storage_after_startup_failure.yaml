---
!same-as MCP initialization for this execution mode
---
send:
  python: raise AssertionError('startup failure ran the cell')
result:
  content:
    - type: text
      text: |-
        [worker sideband read failed: worker sideband closed]
        [worker exited with status 47]
        [worker stopped: in-memory state lost]
  isError: true
---
send:
  python: raise AssertionError('failure was not retained')
result:
  content:
    - type: text
      text: >-
        [runtime initialization failed: worker sideband read failed: worker
        sideband closed; restart required]
  isError: true
---
send:
  control: restart
  python: print('replacement initialized')
result:
  content:
    - type: text
      text: |-
        [starting new worker]
        replacement initialized
        [done]
  isError: false
