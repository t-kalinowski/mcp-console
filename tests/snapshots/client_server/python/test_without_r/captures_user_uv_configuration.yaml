---
!same-as python-managed MCP initialization for this execution mode
---
send:
  python: retained = 42
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  control: restart
  requirements:
    python:
      - py-yaml12
  python: import yaml12; 42
result:
  content:
    - type: text
      text: |-
        [worker stopped: in-memory state lost]
        [starting new worker]
        42
        [done]
  isError: false
