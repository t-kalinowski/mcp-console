---
!same-as python-only MCP initialization for this execution mode
---
send:
  python: recorded_value = 41; recorded_value + 1
result:
  content:
    - type: text
      text: |
        42
  isError: false
---
send:
  python: raise ValueError('recorded failure')
result:
  content:
    - type: text
      text: |
        Traceback (most recent call last):
          File "<mcp-console:python:e2>", line 1, in <module>
        ValueError: recorded failure
  isError: false
---
send:
  control: restart
  python: "'recorded_value' in globals()"
result:
  content:
    - type: text
      text: |-
        [worker stopped: in-memory state lost]
        [starting new worker]
        False
        [done]
  isError: false
---
recording:
  events:
    - cell_ended
    - cell_output
    - cell_started
    - delivery
    - environment_discovered
    - output_text
    - protocol
    - recording_activated
    - recording_ended
    - recording_started
    - source_admitted
    - source_associated
    - source_attached
    - source_finished
    - tool_call
    - tool_result
    - worker_ended
    - worker_ready
    - worker_started
  markdown and quarto: Python source retained
  output log: |
    42
