---
stage: restart
---
!same-as python-only MCP initialization for this execution mode
---
send:
  python: |
    import os
    from pathlib import Path

    temporary = Path(os.environ["TMPDIR"])
    Path("worker-temporary").write_text(str(temporary))
    restricted = temporary / "restricted"
    restricted.mkdir()
    (restricted / "retained.txt").write_text("private contents")
    restricted.chmod(0)
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  python: temporary.chmod(0)
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  control: restart
  python: print('replacement ran')
result:
  content:
    - type: text
      text: |-
        [cannot remove worker temporary directory <worker temporary>: Permission denied (os error 13); additionally failed to retire worker I/O: cannot remove worker temporary directory <worker temporary>: Permission denied (os error 13)]
        session restart did not complete; cell was not run
  isError: true
---
stderr: >
