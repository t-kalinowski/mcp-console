---
stage: restart
---
!same-as MCP initialization for this execution mode
---
send:
  python: |
    import os
    from pathlib import Path

    temporary = Path(os.environ["TMPDIR"])
    Path("worker-temporary").write_text(str(temporary))
    restricted = temporary / "restricted"
    restricted.mkdir()
    (restricted / "retained.txt").write_text("private contents")
    restricted.chmod(0)
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  python: temporary.chmod(0)
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  control: restart
  python: print('replacement ran')
result:
  content:
    - type: text
      text: |-
        [worker stopped: in-memory state lost]
        [cannot remove worker temporary directory <worker temporary>: Permission denied (os error 13)]
        session restart did not complete; cell was not run
  isError: true
---
stderr: >
  cannot remove worker temporary directory <worker temporary>: Permission
  denied (os error 13)
---
stage: shutdown
---
!same-as MCP initialization for this execution mode
---
send:
  python: |
    import os
    from pathlib import Path

    temporary = Path(os.environ["TMPDIR"])
    Path("worker-temporary").write_text(str(temporary))
    restricted = temporary / "restricted"
    restricted.mkdir()
    (restricted / "retained.txt").write_text("private contents")
    restricted.chmod(0)
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
stderr: >
  cannot remove worker temporary directory <worker temporary>: Permission
  denied (os error 13)
---
stage: startup failure
---
!same-as MCP initialization for this execution mode
---
send:
  python: "42"
result:
  content:
    - type: text
      text: |-
        [worker sideband read failed: worker sideband closed; additionally failed to stop the worker: cannot remove worker temporary directory <worker temporary>: Permission denied (os error 13)]
        [worker exited with status 47]
  isError: true
---
stderr: >
  cannot remove worker temporary directory <worker temporary>: Permission
  denied (os error 13)
