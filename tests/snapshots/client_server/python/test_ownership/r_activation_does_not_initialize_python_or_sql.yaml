---
!same-as MCP initialization for this execution mode
---
send:
  r: |
    stopifnot(!any(c("reticulate", "duckdb", "DBI") %in% loadedNamespaces()))
    answer <- 41L
    answer + 1L
result:
  content:
    - type: text
      text: |
        [1] 42
  isError: false
---
send:
  python: r.answer + 1
result:
  content:
    - type: text
      text: |
        42
  isError: false
