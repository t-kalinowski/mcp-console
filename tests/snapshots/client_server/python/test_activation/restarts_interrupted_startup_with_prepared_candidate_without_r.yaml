---
!same-as MCP initialization for this execution mode
---
send:
  requirements:
    action: reset
result:
  content:
    - type: text
      text: "[prepared]"
  isError: false
---
send:
  requirements:
    action: get
result:
  content:
    - type: text
      text: |-
        {
          "requirements": {
            "r": [],
            "python": [
              "numpy",
              "pandas",
              "duckdb"
            ],
            "duckdb": [
              "sqlite"
            ],
            "python_version": [],
            "exclude_newer": null
          },
          "prepared": true,
          "runtime_requirements": {
            "r": [],
            "python": []
          }
        }
  structuredContent:
    requirements:
      r: []
      python: []
      duckdb:
        - sqlite
      python_version: []
      exclude_newer: ~
    prepared: true
    runtime_requirements:
      r: []
      python: []
  isError: false
---
send:
  requirements:
    action: set
    r: []
    python: []
    duckdb:
      - sqlite
    python_version: []
    exclude_newer: ~
result:
  content:
    - type: text
      text: "[prepared]"
  isError: false
---
send:
  requirements:
    python:
      - console-activation-fixture
result:
  content:
    - type: text
      text: "[prepared]"
  isError: false
---
send:
  requirements:
    action: get
result:
  content:
    - type: text
      text: |-
        {
          "requirements": {
            "r": [],
            "python": [
              "console-activation-fixture"
            ],
            "duckdb": [
              "sqlite"
            ],
            "python_version": [],
            "exclude_newer": null
          },
          "prepared": true,
          "runtime_requirements": {
            "r": [],
            "python": []
          }
        }
  structuredContent:
    requirements:
      r: []
      python:
        - console-activation-fixture
      duckdb:
        - sqlite
      python_version: []
      exclude_newer: ~
    prepared: true
    runtime_requirements:
      r: []
      python: []
  isError: false
---
send:
  python: startup_cell_ran = True
  timeout_ms: 0
result:
  content:
    - type: text
      text: |-

        [running; poll with an empty send]
  isError: false
---
send:
  control: interrupt
  timeout_ms: 30000
result:
  content:
    - type: text
      text: |-
        Python initialization did not complete; restart required
        [worker sideband read failed: worker sideband closed]
        [worker exited with status 1]
        [worker stopped: in-memory state lost]
  isError: true
---
send:
  requirements:
    action: get
result:
  content:
    - type: text
      text: |-
        {
          "requirements": {
            "r": [],
            "python": [
              "console-activation-fixture"
            ],
            "duckdb": [
              "sqlite"
            ],
            "python_version": [],
            "exclude_newer": null
          },
          "prepared": true,
          "runtime_requirements": {
            "r": [],
            "python": []
          }
        }
  structuredContent:
    requirements:
      r: []
      python:
        - console-activation-fixture
      duckdb:
        - sqlite
      python_version: []
      exclude_newer: ~
    prepared: true
    runtime_requirements:
      r: []
      python: []
  isError: false
---
send:
  python: raise AssertionError('startup must stay failed')
result:
  content:
    - type: text
      text: >-
        [runtime initialization failed: worker sideband read failed: worker
        sideband closed; restart required]
  isError: true
---
send:
  control: restart
result:
  content:
    - type: text
      text: |-
        [starting new worker]
        [worker starting]
  isError: false
---
send:
  python: |
    import os
    import console_unloaded
    from pathlib import Path

    assert os.getpid() != int(Path("worker-pid").read_text())
    assert "startup_cell_ran" not in globals()
    print(console_unloaded.origin)
result:
  content:
    - type: text
      text: |
        candidate
  isError: false
---
send:
  sql: SELECT 42 AS answer
result:
  content:
    - type: text
      text: |
        answer
        ------
        42
  isError: false
