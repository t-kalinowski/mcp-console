---
!same-as MCP initialization for this execution mode
---
send:
  requirements:
    action: reset
result:
  content:
    - type: text
      text: "[prepared]"
  isError: false
---
send:
  requirements:
    action: get
result:
  content:
    - type: text
      text: |-
        {
          "requirements": {
            "r": [
              "DBI",
              "arrow",
              "duckdb",
              "nanoarrow",
              "reticulate",
              "tidyverse"
            ],
            "python": [
              "numpy",
              "pandas"
            ],
            "duckdb": [
              "icu",
              "json",
              "sqlite"
            ],
            "python_version": [],
            "exclude_newer": null
          },
          "prepared": false,
          "runtime_requirements": {
            "r": [
              "DBI",
              "arrow",
              "duckdb",
              "jsonlite",
              "nanoarrow",
              "pillar",
              "reticulate",
              "tibble",
              "utf8"
            ],
            "python": []
          }
        }
  structuredContent:
    requirements:
      r:
        - DBI
        - arrow
        - duckdb
        - nanoarrow
        - reticulate
        - tidyverse
      python: []
      duckdb:
        - icu
        - json
        - sqlite
      python_version: []
      exclude_newer: ~
    prepared: false
    runtime_requirements:
      r:
        - DBI
        - arrow
        - duckdb
        - jsonlite
        - nanoarrow
        - pillar
        - reticulate
        - tibble
        - utf8
      python: []
  isError: false
---
send:
  requirements:
    action: set
    r:
      - DBI
      - arrow
      - duckdb
      - nanoarrow
      - reticulate
      - tidyverse
    python: []
    duckdb:
      - icu
      - json
      - sqlite
    python_version: []
    exclude_newer: ~
result:
  content:
    - type: text
      text: "[prepared]"
  isError: false
---
send:
  r: |
    cat(
      tempfile("probe-ready-"),
      tempfile("probe-release-"),
      tempfile("probe-pid-"),
      sep = "\n"
    )
result:
  content:
    - type: text
      text: |-
        <probe ready>
        <probe release>
        <probe pid>
  isError: false
---
send:
  python: marker = object(); marker_id = id(marker)
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  r: probe_r_state <- 42L
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  sql: CREATE TABLE probe_state AS SELECT 42 AS answer
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  requirements:
    python:
      - console-activation-fixture
result:
  content:
    - type: text
      text: Python preparation cancelled by restart
  isError: true
---
send:
  control: restart
result:
  content:
    - type: text
      text: |-
        [worker stopped: in-memory state lost]
        [starting new worker]
        [worker starting]
  isError: false
---
send:
  python: '"marker" not in globals()'
result:
  content:
    - type: text
      text: |
        True
  isError: false
---
send:
  requirements:
    python:
      - console-activation-fixture
result:
  content:
    - type: text
      text: "[prepared]"
  isError: false
