---
!same-as MCP initialization for this execution mode
---
send:
  control: restart
result:
  content:
    - type: text
      text: |-
        [starting new worker]
        [idle]
  isError: false
---
send:
  requirements:
    python:
      - console-activation-fixture
result:
  content:
    - type: text
      text: "[prepared]"
  isError: false
---
send:
  requirements:
    action: get
result:
  content:
    - type: text
      text: |-
        {
          "requirements": {
            "r": [],
            "python": [
              "numpy",
              "pandas",
              "console-activation-fixture",
              "duckdb"
            ],
            "duckdb": [
              "sqlite"
            ],
            "python_version": [],
            "exclude_newer": null
          },
          "prepared": true,
          "runtime_requirements": {
            "r": [],
            "python": []
          }
        }
  structuredContent:
    requirements:
      r: []
      python:
        - numpy
        - pandas
        - console-activation-fixture
        - duckdb
      duckdb:
        - sqlite
      python_version: []
      exclude_newer: ~
    prepared: true
    runtime_requirements:
      r: []
      python: []
  isError: false
---
send:
  python: print('initialized')
  timeout_ms: 0
result:
  content:
    - type: text
      text: |-

        [running; poll with an empty send]
  isError: false
---
send:
  control: interrupt
  timeout_ms: 30000
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  requirements:
    action: get
result:
  content:
    - type: text
      text: |-
        {
          "requirements": {
            "r": [],
            "python": [
              "numpy",
              "pandas",
              "console-activation-fixture",
              "duckdb"
            ],
            "duckdb": [
              "sqlite"
            ],
            "python_version": [],
            "exclude_newer": null
          },
          "prepared": true,
          "runtime_requirements": {
            "r": [],
            "python": []
          }
        }
  structuredContent:
    requirements:
      r: []
      python:
        - numpy
        - pandas
        - console-activation-fixture
        - duckdb
      duckdb:
        - sqlite
      python_version: []
      exclude_newer: ~
    prepared: true
    runtime_requirements:
      r: []
      python: []
  isError: false
---
send:
  python: |
    import os
    import console_unloaded
    from pathlib import Path

    assert os.getpid() == int(Path("worker-pid").read_text())
    print(console_unloaded.origin)
result:
  content:
    - type: text
      text: |
        candidate
  isError: false
---
send:
  control: restart
result:
  content:
    - type: text
      text: |-
        [worker stopped: in-memory state lost]
        [starting new worker]
        [idle]
  isError: false
---
send:
  python: import console_unloaded; print(console_unloaded.origin)
result:
  content:
    - type: text
      text: |
        candidate
  isError: false
