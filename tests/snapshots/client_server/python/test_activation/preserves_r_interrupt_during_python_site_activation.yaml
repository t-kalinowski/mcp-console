---
!same-as MCP initialization for this execution mode
---
send:
  requirements:
    action: reset
result:
  content:
    - type: text
      text: "[prepared]"
  isError: false
---
send:
  requirements:
    action: get
result:
  content:
    - type: text
      text: |-
        {
          "requirements": {
            "r": [
              "DBI",
              "arrow",
              "duckdb",
              "nanoarrow",
              "reticulate",
              "tidyverse"
            ],
            "python": [
              "numpy",
              "pandas"
            ],
            "duckdb": [
              "icu",
              "json",
              "sqlite"
            ],
            "python_version": [],
            "exclude_newer": null
          },
          "prepared": false,
          "runtime_requirements": {
            "r": [
              "DBI",
              "arrow",
              "duckdb",
              "jsonlite",
              "nanoarrow",
              "pillar",
              "reticulate",
              "tibble",
              "utf8"
            ],
            "python": []
          }
        }
  structuredContent:
    requirements:
      r:
        - DBI
        - arrow
        - duckdb
        - nanoarrow
        - reticulate
        - tidyverse
      python: []
      duckdb:
        - icu
        - json
        - sqlite
      python_version: []
      exclude_newer: ~
    prepared: false
    runtime_requirements:
      r:
        - DBI
        - arrow
        - duckdb
        - jsonlite
        - nanoarrow
        - pillar
        - reticulate
        - tibble
        - utf8
      python: []
  isError: false
---
send:
  requirements:
    action: set
    r:
      - DBI
      - arrow
      - duckdb
      - nanoarrow
      - reticulate
      - tidyverse
    python: []
    duckdb:
      - icu
      - json
      - sqlite
    python_version: []
    exclude_newer: ~
result:
  content:
    - type: text
      text: "[prepared]"
  isError: false
---
send:
  r: |
    before_config <- reticulate::py_config()
    before_requirements <- reticulate::py_require()
    worker_pid <- Sys.getpid()
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  python: |
    import os
    import sys

    original_environment = dict(os.environ)
    original_paths = list(sys.path)
    original_prefixes = sys.prefix, sys.exec_prefix, sys.executable
    original_real_prefix = getattr(sys, "real_prefix", None)
    marker = object()
    marker_id = id(marker)
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  r: |
    outcome <- tryCatch(
      {
        reticulate::py_require("console-activation-fixture")
        "activated"
      },
      interrupt = function(condition) {
        stopifnot(identical(class(condition), c("interrupt", "condition")))
        "interrupt"
      },
      error = function(condition) paste("error:", conditionMessage(condition))
    )
    print(outcome)
    stopifnot(
      identical(reticulate::py_require(), before_requirements),
      identical(reticulate::py_config(), before_config),
      identical(Sys.getpid(), worker_pid)
    )
result:
  content:
    - type: text
      text: |
        [1] "interrupt"
  isError: false
---
send:
  python: |
    assert dict(os.environ) == original_environment
    assert sys.path == original_paths
    assert (sys.prefix, sys.exec_prefix, sys.executable) == original_prefixes
    assert getattr(sys, "real_prefix", None) == original_real_prefix
    assert id(marker) == marker_id
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  r: reticulate::py_require("console-activation-fixture")
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  python: import console_unloaded; console_unloaded.origin
result:
  content:
    - type: text
      text: |
        'candidate'
  isError: false
