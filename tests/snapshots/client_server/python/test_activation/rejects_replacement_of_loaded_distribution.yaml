---
!same-as MCP initialization for this execution mode
---
send:
  requirements:
    action: reset
result:
  content:
    - type: text
      text: "[prepared]"
  isError: false
---
send:
  requirements:
    action: get
result:
  content:
    - type: text
      text: |-
        {
          "requirements": {
            "r": [
              "DBI",
              "arrow",
              "duckdb",
              "nanoarrow",
              "reticulate",
              "tidyverse"
            ],
            "python": [
              "numpy",
              "pandas"
            ],
            "duckdb": [
              "icu",
              "json",
              "sqlite"
            ],
            "python_version": [],
            "exclude_newer": null
          },
          "prepared": false,
          "runtime_requirements": {
            "r": [
              "DBI",
              "arrow",
              "duckdb",
              "jsonlite",
              "nanoarrow",
              "pillar",
              "reticulate",
              "tibble",
              "utf8"
            ],
            "python": []
          }
        }
  structuredContent:
    requirements:
      r:
        - DBI
        - arrow
        - duckdb
        - nanoarrow
        - reticulate
        - tidyverse
      python: []
      duckdb:
        - icu
        - json
        - sqlite
      python_version: []
      exclude_newer: ~
    prepared: false
    runtime_requirements:
      r:
        - DBI
        - arrow
        - duckdb
        - jsonlite
        - nanoarrow
        - pillar
        - reticulate
        - tibble
        - utf8
      python: []
  isError: false
---
send:
  requirements:
    action: set
    r:
      - DBI
      - arrow
      - duckdb
      - nanoarrow
      - reticulate
      - tidyverse
    python: []
    duckdb:
      - icu
      - json
      - sqlite
    python_version: []
    exclude_newer: ~
result:
  content:
    - type: text
      text: "[prepared]"
  isError: false
---
send:
  python: |
    import console_loaded
    import os
    import sys

    marker = console_loaded.value
    identity = sys.prefix, sys.exec_prefix, sys.executable, list(sys.path)
    process_environment = dict(os.environ)
    worker_pid = os.getpid()
    print(console_loaded.__version__)
result:
  content:
    - type: text
      text: |
        1.0
  isError: false
---
send:
  python: cell_was_run = True
  requirements:
    python:
      - console-activation-fixture
result:
  content:
    - type: text
      text: >-
        Cannot replace loaded console-loaded 1.0 with 2.0. Restart with
        compatible requirements; the running interpreter and objects are
        unchanged.
  isError: true
---
send:
  python: |
    assert identity == (sys.prefix, sys.exec_prefix, sys.executable, sys.path)
    assert process_environment == dict(os.environ)
    assert console_loaded.value is marker and os.getpid() == worker_pid
    assert "cell_was_run" not in globals()
    print(console_loaded.__version__)
result:
  content:
    - type: text
      text: |
        1.0
  isError: false
---
send:
  control: restart
result:
  content:
    - type: text
      text: |-
        [worker stopped: in-memory state lost]
        [starting new worker]
        [worker starting]
  isError: false
---
send:
  python: |
    import console_loaded
    import console_unloaded

    assert console_unloaded.origin == "initial"
    print(console_loaded.__version__)
result:
  content:
    - type: text
      text: |
        1.0
  isError: false
