---
!same-as MCP initialization for this execution mode
---
send:
  r: |
    options(
      console.plot.width_in = 2,
      console.plot.height_in = 2,
      console.plot.dpi = 96
    )
    plot_state <- 42L
    cat(Sys.getpid(), file = "worker-pid")
    cat(tempdir(), file = "worker-tempdir")
    graphics_gate_dll <- dyn.load("./mcp_test_graphics_gate.so")
    graphics_gate <- getNativeSymbolInfo(
      "mcp_test_wait_graphics_gate",
      PACKAGE = graphics_gate_dll
    )
    invisible(trace(
      "dev.off",
      where = asNamespace("grDevices"),
      print = FALSE,
      tracer = quote({
        invisible(.Call(
          .GlobalEnv$graphics_gate,
          "close-started",
          "close-release"
        ))
      })
    ))
result:
  content:
    - type: text
      text: |
        Tracing function "dev.off" in package "namespace:grDevices"
  isError: false
---
send:
  r: plot(1:3)
  timeout_ms: 0
result:
  content:
    - type: text
      text: |-

        [running; poll with an empty send]
  isError: false
---
send:
  control: interrupt
  timeout_ms: 0
result:
  content:
    - type: text
      text: |-

        [running; poll with an empty send]
  isError: false
---
send:
  timeout_ms: 30000
result:
  content:
    - type: image
      data: <PNG byte-identical to live Rscript interrupted plot>
      mimeType: image/png
    - type: text
      text: "\n"
  isError: false
---
send:
  r: |
    invisible(untrace("dev.off", where = asNamespace("grDevices")))
    stopifnot(identical(plot_state, 42L), is.null(dev.list()))
    plot(3:1)
result:
  content:
    - type: text
      text: |
        Untracing function "dev.off" in package "namespace:grDevices"
    - type: image
      data: <PNG byte-identical to live Rscript recovery plot>
      mimeType: image/png
  isError: false
