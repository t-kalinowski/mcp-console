---
!same-as r-only MCP initialization for this execution mode
---
send:
  r: discard <- capture.output(path <- .console$manual("R-exts"))
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  r: |
    Sys.setenv(
      CONSOLE_TEST_CACHE_OPEN_TARGET = path,
      CONSOLE_TEST_CACHE_OPEN_MARKER = file.path(getwd(), "cache-file-replaced")
    )
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
