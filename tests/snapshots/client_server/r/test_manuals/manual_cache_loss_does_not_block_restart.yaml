---
!same-as r-only MCP initialization for this execution mode
---
send:
  r: 1 + 1
result:
  content:
    - type: text
      text: |
        [1] 2
  isError: false
---
send:
  r: old_session <- TRUE
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  control: restart
result:
  content:
    - type: text
      text: |-
        [worker stopped: in-memory state lost]
        [starting new worker]
        [idle]
  isError: false
---
send:
  r: |
    stopifnot(!exists("old_session"), 1 + 1 == 2)
    cat("ordinary R execution works after cache loss\n")
result:
  content:
    - type: text
      text: |
        ordinary R execution works after cache loss
  isError: false
---
send:
  r: utils::RShowDoc("R-exts#Grouped-B")
