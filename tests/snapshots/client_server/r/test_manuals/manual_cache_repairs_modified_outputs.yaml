---
!same-as r-only MCP initialization for this execution mode
---
send:
  r: >-
    discard <- capture.output(path <-
    .console$manual("R-exts#Small-sections"))
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  r: |
    manifest <- file.path(dirname(dirname(path)), "manifest.json")
    for (file in c(path, manifest)) {
      text <- readLines(file, encoding = "UTF-8", warn = FALSE)
      writeLines(
        sub("Parent-only text.", "INJECTED-CACHE-TEXT", text, fixed = TRUE),
        file,
        useBytes = TRUE
      )
    }
    cat("modified chunk and manifest\n")
result:
  content:
    - type: text
      text: |
        modified chunk and manifest
  isError: false
---
send:
  r: .console$manual_search("INJECTED-CACHE-TEXT")
result:
  content:
    - type: text
      text: |
        Manual search: "INJECTED-CACHE-TEXT"
        Cache: <fixture>/cache/mcp-console/manuals/<identity>
        No matches.
  isError: false
---
send:
  r: unlink(path)
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  r: .console$manual("R-exts#Small-sections")
result:
  content:
    - type: text
      text: |
        Cache: <fixture>/cache/mcp-console/manuals/<identity>
        File: R-exts/01-small-sections-part-001.md
        Location: Writing R Extensions > 1 Small sections

        ## 1 Small sections

        Parent-only text.


        Next section: RShowDoc("R-exts#Grouped-A")
  isError: false
---
send:
  r: writeLines("invalid manifest", manifest)
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  control: restart
result:
  content:
    - type: text
      text: |-
        [worker stopped: in-memory state lost]
        [starting new worker]
        [idle]
  isError: false
---
send:
  r: utils::RShowDoc("R-exts")
result:
  content:
    - type: text
      text: |
        Cache: <fixture>/cache/mcp-console/manuals/<identity>
        File: R-exts/index.md

        # Writing R Extensions

        [Collection](../index.md)


        - [Writing R Extensions](00.00-writing-r-extensions-part-001.md#Top)
          - [1 Small sections](01-small-sections-part-001.md#Small-sections)
          - [2 Needle examples](02-needle-examples-part-001.md#Needle-examples)
          - [3 Long Unicode line](03-long-unicode-line-part-001.md#Long-line)
          - [4 HTML and Markdown examples](04-html-and-markdown-examples-part-001.md#Code-anchors)
          - [Appendix B Fixture reference](B-fixture-reference-part-001.md#Appendix-B)

        Read: `RShowDoc("R-exts#original-anchor")`
        Search: `.console$manual_search("phrase", manual = "R-exts")`
        Full TOC: `.console$manual("R-exts/index.md")`
  isError: false
---
send:
  r: >-
    discard <- capture.output(complete <- .console$manual_export("R-exts"));
    writeLines("INJECTED-CACHE-TEXT", complete)
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  r: .console$manual_export("R-exts")
result:
  content:
    - type: text
      text: |
        Complete Markdown: <fixture>/cache/mcp-console/manuals/<identity>/exports/R-exts.md
        Read bounded ranges with readLines(); exports are excluded from manual search.
  isError: false
