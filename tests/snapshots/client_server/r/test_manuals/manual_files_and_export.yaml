---
!same-as r-only MCP initialization for this execution mode
---
send:
  r: .console$manual()
result:
  content:
    - type: text
      text: |
        Cache: <fixture>/cache/mcp-console/manuals/<identity>
        File: index.md

        # Installed R manuals

        R version <installed>

        - [Writing R Extensions (R-exts)](R-exts/index.md)
        - [R Language Definition (R-lang)](R-lang/index.md)

        Read: `RShowDoc("R-exts")`
        Search: `.console$manual_search("phrase")`
        Export: `.console$manual_export("R-exts")`

        The per-manual directories contain non-overlapping content files and TOCs.
        Complete exports live separately in `exports/`; exclude them from filesystem searches.
  isError: false
---
send:
  r: .console$manual_export("R-exts")
result:
  content:
    - type: text
      text: |
        Complete Markdown: <fixture>/cache/mcp-console/manuals/<identity>/exports/R-exts.md
        Read bounded ranges with readLines(); exports are excluded from manual search.
  isError: false
---
send:
  r: |
    discard <- capture.output(path <- .console$manual("R-exts#Grouped-B"))
    text <- readLines(path, encoding = "UTF-8")
    stopifnot(
      any(grepl('<a id="Grouped-B"></a>', text, fixed = TRUE)),
      any(grepl("café λ", text, fixed = TRUE)),
      any(grepl("needle", text, ignore.case = TRUE))
    )
    cat("file access and R navigation use the same cache\n")
result:
  content:
    - type: text
      text: |
        file access and R navigation use the same cache
  isError: false
