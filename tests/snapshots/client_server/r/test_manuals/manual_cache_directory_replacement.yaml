---
!same-as r-only MCP initialization for this execution mode
---
send:
  r: discard <- capture.output(path <- .console$manual("R-exts"))
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  r: |
    Sys.setenv(
      CONSOLE_TEST_CACHE_DIRECTORY = if (FALSE) {
        file.path(dirname(path), "unexpected")
      } else {
        dirname(path)
      },
      CONSOLE_TEST_CACHE_DIRECTORY_SKIP = if (FALSE) "0" else "1",
      CONSOLE_TEST_CACHE_LINK_TARGET = file.path(getwd(), "unrelated-directory"),
      CONSOLE_TEST_CACHE_DIRECTORY_MARKER = file.path(getwd(), "directory-replaced")
    )
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  r: discard <- capture.output(RShowDoc("R-exts"))
result:
  content:
    - type: text
      text: "[done]"
  isError: false
