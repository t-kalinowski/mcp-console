---
!same-as MCP initialization for this execution mode
---
send:
  r: |
    options(
      console.plot.width = 4,
      console.plot.height = 3,
      console.plot.dpi = 100
    )
    plot(1:3)
    path <- attr(.Devices[[dev.cur()]], "filepath")
    cat(dirname(path), "\n", sep = "")
    invisible(readline("finish plot> "))
result:
  content:
    - type: text
      text: |-
        <managed plot directory>
        [input requested: "finish plot> "]
        [waiting for stdin]
  isError: false
---
send:
  stdin: "\n"
result:
  content:
    - type: image
      data: <PNG byte-identical to live Rscript page 1>
      mimeType: image/png
  isError: false
