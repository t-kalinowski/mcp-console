---
!same-as tests/snapshots/client_server/server/test_tools/initializes_and_lists_tools.yaml
---
send:
  r: |
    cores <- parallel::detectCores()
    stopifnot(
      length(cores) == 1L,
      !is.na(cores),
      cores >= 1L
    )
    writeLines("R core detection available")
result:
  content:
    - type: text
      text: |
        R core detection available
  isError: false
