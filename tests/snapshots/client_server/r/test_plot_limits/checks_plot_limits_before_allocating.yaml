---
!same-as MCP initialization for this execution mode
---
send:
  r: |
    local({
      # Stop at the public PNG entry point, before native allocation.
      invisible(suppressMessages(trace(
        "png",
        where = asNamespace("grDevices"),
        tracer = quote({
          stopifnot(
            identical(units, "in"),
            identical(width, getOption("console.plot.width", 800 / 96)),
            identical(height, getOption("console.plot.height", 600 / 96)),
            identical(res, getOption("console.plot.dpi", 96))
          )
          stop("PNG allocation intercepted", call. = FALSE)
        }),
        print = FALSE
      )))
      on.exit(suppressMessages(untrace(
        "png",
        where = asNamespace("grDevices")
      )))
      check_plot <- function(label, size, accepted) {
        options(
          console.plot.width = size[[1]],
          console.plot.height = size[[2]],
          console.plot.dpi = size[[3]]
        )
        message <- tryCatch(plot(1:3), error = conditionMessage)
        cat(label, ": ", message, "\n", sep = "")
        if (accepted) {
          stopifnot(identical(message, "PNG allocation intercepted"))
        } else {
          stopifnot(startsWith(message, "managed R plot exceeds limit:"))
        }
        stopifnot(grDevices::dev.cur() == 1L)
      }
      rejected <- list(
        mistaken_pixels = c(1600, 1050, 100),
        wide = c(16385, 1, 1),
        tall = c(1, 16385, 1),
        area = c(4097, 4096, 1),
        fractional_width = c(16384.25, 1, 1),
        fractional_area = c(4096.25, 4096, 1),
        dpi = c(1, 1, 16385),
        dimension_overflow = c(1e308, 1, 100),
        height_overflow = c(1, 1e308, 100),
        area_overflow = c(1e200, 1e200, 1)
      )
      for (label in names(rejected)) {
        check_plot(label, rejected[[label]], FALSE)
      }
      accepted <- list(
        defaults = list(NULL, NULL, NULL),
        corrected_inches = c(16, 10.5, 100),
        wide_boundary = c(16384, 1024, 1),
        tall_boundary = c(1024, 16384, 1),
        square_boundary = c(4096, 4096, 1),
        scaled_boundary = c(16, 16, 256)
      )
      for (label in names(accepted)) {
        check_plot(label, accepted[[label]], TRUE)
      }
      check_plot("rejection_before_recovery", rejected$mistaken_pixels, FALSE)
      cat("plot limits checked before allocation\n")
    })
result:
  content:
    - type: text
      text: |
        mistaken_pixels: managed R plot exceeds limit: 1600 x 1050 inches at 100 DPI requests 160000 x 105000 pixels; maximum 16384 pixels per side and 16777216 pixels total. Reduce console.plot.width, console.plot.height (inches), or console.plot.dpi.
        wide: managed R plot exceeds limit: 16385 x 1 inches at 1 DPI requests 16385 x 1 pixels; maximum 16384 pixels per side and 16777216 pixels total. Reduce console.plot.width, console.plot.height (inches), or console.plot.dpi.
        tall: managed R plot exceeds limit: 1 x 16385 inches at 1 DPI requests 1 x 16385 pixels; maximum 16384 pixels per side and 16777216 pixels total. Reduce console.plot.width, console.plot.height (inches), or console.plot.dpi.
        area: managed R plot exceeds limit: 4097 x 4096 inches at 1 DPI requests 4097 x 4096 pixels; maximum 16384 pixels per side and 16777216 pixels total. Reduce console.plot.width, console.plot.height (inches), or console.plot.dpi.
        fractional_width: managed R plot exceeds limit: 16384.25 x 1 inches at 1 DPI requests 16385 x 1 pixels; maximum 16384 pixels per side and 16777216 pixels total. Reduce console.plot.width, console.plot.height (inches), or console.plot.dpi.
        fractional_area: managed R plot exceeds limit: 4096.25 x 4096 inches at 1 DPI requests 4097 x 4096 pixels; maximum 16384 pixels per side and 16777216 pixels total. Reduce console.plot.width, console.plot.height (inches), or console.plot.dpi.
        dpi: managed R plot exceeds limit: 1 x 1 inches at 16385 DPI requests 16385 x 16385 pixels; maximum 16384 pixels per side and 16777216 pixels total. Reduce console.plot.width, console.plot.height (inches), or console.plot.dpi.
        dimension_overflow: managed R plot exceeds limit: 1e+308 x 1 inches at 100 DPI requests Inf x 100 pixels; maximum 16384 pixels per side and 16777216 pixels total. Reduce console.plot.width, console.plot.height (inches), or console.plot.dpi.
        height_overflow: managed R plot exceeds limit: 1 x 1e+308 inches at 100 DPI requests 100 x Inf pixels; maximum 16384 pixels per side and 16777216 pixels total. Reduce console.plot.width, console.plot.height (inches), or console.plot.dpi.
        area_overflow: managed R plot exceeds limit: 1e+200 x 1e+200 inches at 1 DPI requests 1e+200 x 1e+200 pixels; maximum 16384 pixels per side and 16777216 pixels total. Reduce console.plot.width, console.plot.height (inches), or console.plot.dpi.
        defaults: PNG allocation intercepted
        corrected_inches: PNG allocation intercepted
        wide_boundary: PNG allocation intercepted
        tall_boundary: PNG allocation intercepted
        square_boundary: PNG allocation intercepted
        scaled_boundary: PNG allocation intercepted
        rejection_before_recovery: managed R plot exceeds limit: 1600 x 1050 inches at 100 DPI requests 160000 x 105000 pixels; maximum 16384 pixels per side and 16777216 pixels total. Reduce console.plot.width, console.plot.height (inches), or console.plot.dpi.
        plot limits checked before allocation
  isError: false
---
send:
  r: |
    options(
      console.plot.width = 16,
      console.plot.height = 10.5,
      console.plot.dpi = 100
    )
    plot(3:1)
result:
  content:
    - type: image
      data: <PNG byte-identical to live Rscript page 1>
      mimeType: image/png
  isError: false
