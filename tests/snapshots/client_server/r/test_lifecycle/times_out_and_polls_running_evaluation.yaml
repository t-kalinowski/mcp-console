---
!same-as tests/snapshots/client_server/server/test_tools/initializes_and_lists_tools.yaml
---
send:
  r: invisible(NULL)
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  r: |
    Sys.sleep(0.25)
    answer <- 42
    answer
  timeout_ms: 10
result:
  content:
    - type: text
      text: |-

        [running; poll with an empty send]
  isError: false
---
send:
  timeout_ms: 3000
result:
  content:
    - type: text
      text: |
        [1] 42
  isError: false
---
send:
  r: answer + 1
result:
  content:
    - type: text
      text: |
        [1] 43
  isError: false
