send:
  r: |
    quotes_page <- read_r_help("base", "Quotes")
    prefix <- "Unicode paging fixture: "
    quotes_page$text[1L] <- paste0(
      prefix,
      "\u2018\u2019",
      strrep("x", 80L)
    )
    unicode_budget <- nchar(prefix, type = "bytes") + 5L
    show_r_help(quotes_page, from = 1L, n = 1L, bytes = unicode_budget)
result:
  content:
