send:
  r: |
    search <- utils::help.search(
      "^plot$",
      fields = "alias",
      agrep = FALSE,
      package = c("base", "graphics"),
      lib.loc = .libPaths(),
      types = "help"
    )
    matches <- search$matches
    candidates <- sprintf(
      "%s::%s | %s",
      matches$Package,
      matches$Topic,
      matches$Title
    )
    writeLines(substr(head(candidates, 10L), 1L, 120L), useBytes = TRUE)
    if (length(candidates) > 10L) {
      writeLines("More candidates remain in matches.")
    }
result:
  content:
    - type: text
      text: |
        base::plot | Generic X-Y Plotting
        graphics::plot.default | The Default Scatterplot Function
  isError: false
