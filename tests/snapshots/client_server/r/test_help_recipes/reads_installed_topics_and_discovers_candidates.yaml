---
!same-as MCP initialization for this execution mode
---
send:
  r: |
    options(useFancyQuotes = FALSE)
    tools::Rd2txt_options(width = 80L, underline_titles = FALSE)
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  r: |
    utils::help("mean", package = "base", help_type = "text")
result:
  content:
    - type: text
      text: |
        Installed base::mean text matches Rscript reference.
  isError: false
---
send:
  r: |
    options(
      help_type = "html",
      browser = function(...) stop("browser invoked"),
      pager = function(...) stop("inherited pager invoked"),
      menu.graphics = TRUE,
      useFancyQuotes = FALSE
    )
    inherited_options <- options()[c("help_type", "browser", "pager")]
    inherited_format <- tools::Rd2txt_options()
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  r: |
    local({
      old <- options(pager = function(files, header, title, delete.file) {
        writeLines(enc2utf8(readLines(files, warn = FALSE)), useBytes = TRUE)
        if (delete.file) unlink(files)
      })
      on.exit(options(old))
      print(utils::help("mean", package = "base", help_type = "text"))
    })
result:
  content:
    - type: text
      text: |
        Installed base::mean text matches Rscript reference.
  isError: false
---
send:
  r: >-
    stopifnot(identical(options()[names(inherited_options)],
    inherited_options))
result:
  content:
    - type: text
      text: "[done]"
  isError: false
