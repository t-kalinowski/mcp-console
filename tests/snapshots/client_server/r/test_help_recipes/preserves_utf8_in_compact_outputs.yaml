---
!same-as MCP initialization for this execution mode
---
send:
  r: |
    help_locale <- Sys.getlocale("LC_CTYPE")
    local({
      before <- l10n_info()
      locale_warnings <- character()
      selected_help_locale <- withCallingHandlers(
        Sys.setlocale("LC_CTYPE", "<native euro locale>"),
        warning = function(w) {
          locale_warnings <<- c(locale_warnings, conditionMessage(w))
          invokeRestart("muffleWarning")
        }
      )
      after <- l10n_info()
      expected_warnings <- character()
      # Windows warns only when changing away from its system code page.
      if (
        .Platform$OS.type == "windows" &&
          after$codepage != 0L &&
          after$codepage != after$system.codepage &&
          before$codepage != after$codepage
      ) {
        expected_warnings <- gettextf(
          "using locale code page other than %d%s may cause problems",
          after$system.codepage,
          if (after$system.codepage == 65001L) ' ("UTF-8")' else "",
          domain = "R"
        )
      }
      stopifnot(
        identical(locale_warnings, expected_warnings),
        nzchar(selected_help_locale),
        !after[["UTF-8"]]
      )
    })
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  r: |
    help_text <- local({
      package <- "mcpconsolehelp"
      topic <- "currency"
      path <- find.package(package, lib.loc = .libPaths(), quiet = TRUE)
      if (!length(path)) {
        stop(paste("Package is not installed:", package), call. = FALSE)
      }
      text <- character()
      old <- options(pager = function(files, header, title, delete.file) {
        text <<- enc2utf8(readLines(files, warn = FALSE))
        if (delete.file) unlink(files)
      })
      on.exit(options(old))
      old_format <- tools::Rd2txt_options(width = 80L, underline_titles = FALSE)
      on.exit(tools::Rd2txt_options(old_format), add = TRUE)
      page <- utils::help(
        (topic),
        package = (package),
        lib.loc = dirname(path),
        help_type = "text",
        try.all.packages = FALSE,
        verbose = FALSE
      )
      if (length(page) != 1L) {
        stop("Expected one installed help page", call. = FALSE)
      }
      print(page)
      writeLines(
        substr(paste(head(text, 8L), collapse = "\n"), 1L, 1500L),
        useBytes = TRUE
      )
      writeLines("[Excerpt; full text retained in help_text.]")
      text
    })
result:
  content:
    - type: text
      text: |
        currency            package:mcpconsolehelp             R Documentation

        Currency €2.50

        Description:

             A Unicode help fixture.

        [Excerpt; full text retained in help_text.]
  isError: false
---
send:
  r: |
    search <- utils::help.search(
      "^currency$",
      fields = "alias",
      agrep = FALSE,
      package = "mcpconsolehelp",
      lib.loc = .libPaths(),
      types = "help"
    )
    matches <- search$matches
    candidates <- sprintf(
      "%s::%s | %s",
      matches$Package,
      matches$Topic,
      matches$Title
    )
    writeLines(substr(head(candidates, 10L), 1L, 120L), useBytes = TRUE)
    if (length(candidates) > 10L) {
      writeLines("More candidates remain in matches.")
    }
result:
  content:
    - type: text
      text: |
        mcpconsolehelp::currency | Currency €2.50
  isError: false
---
send:
  r: invisible(Sys.setlocale("LC_CTYPE", help_locale))
result:
  content:
    - type: text
      text: "[done]"
  isError: false
