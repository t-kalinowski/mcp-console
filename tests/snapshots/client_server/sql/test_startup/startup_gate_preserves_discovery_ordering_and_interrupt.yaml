---
interrupted: false
calls:
  - id: 3
    input:
      method: ping
    result: {}
  - id: 4
    send:
      sql: CREATE TABLE first_cell AS SELECT answer FROM selected
    result:
      content:
        - type: text
          text: |-
            [input requested: "Startup gate> "]
            [waiting for stdin]
      isError: false
  - id: 5
    send:
      stdin: |
        continue
    result:
      content:
        - type: text
          text: "[done]"
      isError: false
  - id: 6
    send:
      sql: SELECT answer FROM first_cell
    result:
      content:
        - type: text
          text: |
            answer
            ------
            42
      isError: false
  - id: 7
    send:
      python: assert startup_count == 1
    result:
      content:
        - type: text
          text: "[done]"
      isError: false
---
interrupted: true
calls:
  - id: 3
    input:
      method: ping
    result: {}
  - id: 4
    send:
      sql: CREATE TABLE first_cell AS SELECT answer FROM selected
    result:
      content:
        - type: text
          text: |-
            [input requested: "Startup gate> "]
            [waiting for stdin]
      isError: false
  - id: 5
    send:
      control: interrupt
      timeout_ms: 0
    result:
      content:
        - type: text
          text: |
            Traceback (most recent call last):
              File "<string>", line 380, in initialize_connection
              File "<console startup>", line 6, in <module>
              File "<string>", line 50, in _console_input
            KeyboardInterrupt
            Error: configured startup did not complete; SQL withheld; explicit restart required
      isError: false
  - id: 6
    send:
      python: |
        assert startup_count == 1
        assert native.execute("SELECT count(*) FROM sqlite_master").fetchone() == (0,)
    result:
      content:
        - type: text
          text: "[done]"
      isError: false
  - id: 7
    send:
      sql: SELECT 42 AS answer
    result:
      content:
        - type: text
          text: >
            Error: SQL unavailable: configured startup did not complete; explicit
            restart required
      isError: false
  - id: 8
    send:
      control: restart
      stdin: |
        continue
      sql: SELECT answer FROM selected
    result:
      content:
        - type: text
          text: |-
            [worker stopped: in-memory state lost]
            [starting new worker]
            [input requested: "Startup gate> "]
            answer
            ------
            42
            [done]
      isError: false
  - id: 9
    send:
      python: assert startup_count == 1
    result:
      content:
        - type: text
          text: "[done]"
      isError: false
