---
!same-as MCP initialization for this execution mode
---
send:
  r: |
    values <- data.frame(origin = "r")
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  sql: |
    CREATE TABLE values AS SELECT 'sql' AS origin;
    SELECT origin FROM values
result:
  content:
    - type: text
      text: |
        # A tibble: 1 × 1
          origin  
          <string>
        1 "sql"   
  isError: false
