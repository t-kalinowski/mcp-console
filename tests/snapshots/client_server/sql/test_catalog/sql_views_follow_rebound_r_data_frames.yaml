---
!same-as MCP initialization for this execution mode
---
send:
  r: |
    measurements <- data.frame(value = 2L)
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  sql: |
    CREATE VIEW live_measurements AS
    SELECT value FROM measurements
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  r: |
    measurements <- data.frame(value = 7L)
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  sql: |
    SELECT value FROM live_measurements
result:
  content:
    - type: text
      text: |
        # A tibble: 1 × 1
            value
          <int32>
        1       7
  isError: false
