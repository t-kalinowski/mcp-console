---
!same-as tests/snapshots/client_server/server/test_tools/initializes_and_lists_tools.yaml
---
send:
  sql: |
    LOAD fts;
    SELECT count(*) AS loaded
    FROM duckdb_extensions()
    WHERE extension_name = 'fts' AND loaded
  requirements:
    duckdb:
      - fts
result:
  content:
    - type: text
      text: |
        # A tibble: 1 × 1
           loaded
          <int64>
        1       1
  isError: false
...
