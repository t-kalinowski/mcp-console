---
!same-as tests/snapshots/client_server/server/test_tools/initializes_and_lists_tools.yaml
---
send:
  sql: |
    CREATE TABLE retained_values AS
    SELECT * FROM (VALUES ('a', 2), ('b', 5)) AS values(label, value)
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  r: |
    rm(list = ls())
    values <- DBI::dbGetQuery(
      sql_connection(),
      "SELECT label, value FROM retained_values ORDER BY label"
    )
    writeLines(paste(values$label, values$value, sep = ":"))
result:
  content:
    - type: text
      text: |
        a:2
        b:5
  isError: false
...
