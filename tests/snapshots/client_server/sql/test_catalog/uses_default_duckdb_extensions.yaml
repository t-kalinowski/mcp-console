---
!same-as MCP initialization for this execution mode
---
send:
  requirements:
    action: get
result:
  content:
    - type: text
      text: |-
        {
          "requirements": {
            "r": [
              "DBI",
              "arrow",
              "duckdb",
              "nanoarrow",
              "reticulate",
              "tidyverse",
              "yyjsonr"
            ],
            "python": [
              "numpy",
              "pandas"
            ],
            "duckdb": [
              "icu",
              "json",
              "sqlite"
            ],
            "python_version": [],
            "exclude_newer": null
          },
          "prepared": true,
          "runtime_requirements": {
            "r": [
              "DBI",
              "arrow",
              "duckdb",
              "jsonlite",
              "nanoarrow",
              "pillar",
              "reticulate",
              "tibble",
              "utf8"
            ],
            "python": []
          }
        }
  structuredContent:
    requirements:
      r:
        - DBI
        - arrow
        - duckdb
        - nanoarrow
        - reticulate
        - tidyverse
        - yyjsonr
      python:
        - numpy
        - pandas
      duckdb:
        - icu
        - json
        - sqlite
      python_version: []
      exclude_newer: ~
    prepared: true
    runtime_requirements:
      r:
        - DBI
        - arrow
        - duckdb
        - jsonlite
        - nanoarrow
        - pillar
        - reticulate
        - tibble
        - utf8
      python: []
  isError: false
---
send:
  sql: SET autoinstall_known_extensions = false
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  sql: ATTACH 'audit.sqlite' AS audit (TYPE sqlite, READ_ONLY)
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  sql: SELECT payload->>'$.answer' AS answer FROM audit.events
result:
  content:
    - type: text
      text: |
        # A tibble: 1 × 1
          answer
          <string>
        1 "42"
  isError: false
---
send:
  sql: |
    SELECT
      CASE
        WHEN json_extract_string('{"answer": 42}', '$.answer') = '42'
        THEN 1234567
        ELSE 0
      END AS json_ok,
      CASE
        WHEN timezone('America/New_York', TIMESTAMP '2020-01-01') IS NOT NULL
        THEN 1234567
        ELSE 0
      END AS icu_ok1
result:
  content:
    - type: text
      text: |
        # A tibble: 1 × 2
          json_ok icu_ok1
          <int32> <int32>
        1 1234567 1234567
  isError: false
---
send:
  sql: |
    SELECT CASE WHEN count(*) = 2 THEN 1234567 ELSE 0 END AS loaded1
    FROM duckdb_extensions()
    WHERE extension_name IN ('icu', 'json') AND loaded
result:
  content:
    - type: text
      text: |
        # A tibble: 1 × 1
          loaded1
          <int32>
        1 1234567
  isError: false
