send:
  sql: SELECT NULL::DECIMAL(10,2) AS amount WHERE FALSE
result:
  content:
    - type: text
      text: |
        # A tibble: 0 × 1
        # ℹ 1 variable: amount <decimal128(10, 2)>
        [0 rows]
  isError: false
---
send:
  r: |
    empty <- .console$sql_last_result()$fetch()
    stopifnot(grepl(
      "decimal128(10, 2)",
      format(empty$get_schema()$children$amount),
      fixed = TRUE
    ))
    stopifnot(is.null(empty$get_next()))
    writeLines("empty stream keeps its exact schema")
result:
  content:
    - type: text
      text: |
        empty stream keeps its exact schema
  isError: false
