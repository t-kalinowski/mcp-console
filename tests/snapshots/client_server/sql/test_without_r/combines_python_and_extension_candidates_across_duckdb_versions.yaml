---
send:
  requirements:
    action: set
    python:
      - duckdb==1.4.4
      - six
    duckdb:
      - fts
  python: >-
    import duckdb, six; assert duckdb.__version__ == '1.4.4'; print('first
    candidate')
result:
  content:
    - type: text
      text: |
        first candidate
  isError: false
---
send:
  requirements:
    action: get
result:
  content:
    - type: text
      text: |-
        {
          "requirements": {
            "r": [],
            "python": [
              "duckdb==1.4.4",
              "six"
            ],
            "duckdb": [
              "fts"
            ],
            "python_version": [],
            "exclude_newer": null
          },
          "startup_requirements": {
            "r": [],
            "python": [
              "numpy",
              "pandas",
              "matplotlib",
              "plotnine",
              "duckdb"
            ],
            "duckdb": [
              "icu",
              "json",
              "sqlite"
            ],
            "python_version": [],
            "exclude_newer": null
          },
          "resolution": {
            "r": "automatic",
            "python": "automatic"
          },
          "selection": {
            "r": null,
            "python": "<selected Python>",
            "python_source": "default managed"
          },
          "prepared": true,
          "runtime_requirements": {
            "r": [],
            "python": []
          }
        }
  structuredContent:
    requirements:
      r: []
      python:
        - duckdb==1.4.4
        - six
      duckdb:
        - fts
      python_version: []
      exclude_newer: ~
    startup_requirements:
      r: []
      python:
        - numpy
        - pandas
        - matplotlib
        - plotnine
        - duckdb
      duckdb:
        - icu
        - json
        - sqlite
      python_version: []
      exclude_newer: ~
    resolution:
      r: automatic
      python: automatic
    selection:
      r: ~
      python: <selected Python>
      python_source: default managed
    prepared: true
    runtime_requirements:
      r: []
      python: []
  isError: false
---
send:
  control: restart
  requirements:
    action: set
    python:
      - duckdb==1.5.5
      - six
    duckdb:
      - fts
  sql: SET autoinstall_known_extensions = false; LOAD fts
result:
  content:
    - type: text
      text: |-
        [worker stopped: in-memory state lost]
        [starting new worker]
        Success
        -------
        [0 rows]
        [done]
  isError: false
---
send:
  python: import duckdb, six; print(duckdb.__version__)
result:
  content:
    - type: text
      text: |
        1.5.5
  isError: false
