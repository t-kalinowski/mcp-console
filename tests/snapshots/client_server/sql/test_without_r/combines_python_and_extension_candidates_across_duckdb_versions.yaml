---
send:
  control: restart
  requirements:
    action: set
    python:
      - six
    duckdb: []
  python: sentinel = object(); original = sentinel
result:
  content:
    - type: text
      text: |-
        [worker stopped: in-memory state lost]
        [starting new worker]
        [done]
  isError: false
