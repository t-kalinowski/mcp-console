---
send:
  python: |
    retained = 42
    retained
result:
  content:
    - type: text
      text: |
        42
  isError: false
---
send:
  requirements:
    duckdb:
      - parquet
result:
  content:
    - type: text
      text: "[prepared]"
  isError: false
---
send:
  python: >-
    _console.sql_connection().execute('SELECT ?::JSON',
    [retained]).fetchone()
result:
  content:
    - type: text
      text: |
        ('42',)
  isError: false
