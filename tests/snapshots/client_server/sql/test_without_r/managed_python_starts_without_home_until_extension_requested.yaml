---
send:
  python: identity = object(); original = id(identity); print('ready')
result:
  content:
    - type: text
      text: |
        ready
  isError: false
---
send:
  requirements:
    duckdb:
      - fts
  python: identity = None
result:
  content:
    - type: text
      text: >-
        DuckDB extension preparation requires an absolute HOME at server startup
  isError: true
---
send:
  control: restart
  requirements:
    duckdb:
      - fts
  python: identity = None
result:
  content:
    - type: text
      text: >-
        [DuckDB extension preparation requires an absolute HOME at server
        startup]
  isError: true
---
send:
  python: assert id(identity) == original; print('retained')
result:
  content:
    - type: text
      text: |
        retained
  isError: false
---
send:
  requirements:
    action: get
result:
  content:
    - type: text
      text: |-
        {
          "requirements": {
            "r": [],
            "python": [
              "numpy",
              "pandas",
              "duckdb"
            ],
            "duckdb": [],
            "python_version": [],
            "exclude_newer": null
          },
          "prepared": true,
          "runtime_requirements": {
            "r": [],
            "python": []
          }
        }
  structuredContent:
    requirements:
      r: []
      python:
        - numpy
        - pandas
        - duckdb
      duckdb: []
      python_version: []
      exclude_newer: ~
    prepared: true
    runtime_requirements:
      r: []
