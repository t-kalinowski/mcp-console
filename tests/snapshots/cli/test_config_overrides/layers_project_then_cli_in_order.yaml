---
command: serve
error: >
  managed resolver storage requires the default, :workspace, or :read-only
  worker filesystem policy without custom filesystem rules or native
  extensions
overrides:
  - -c
  - sandbox.environment.BEFORE=first
  - -c
  - sandbox.environment.CHANGE=first
  - -c
  - >-
    sandbox={environment: {CHANGE=last, ADD: cli}, filesystem: {entries:
    [{path={type=path, path='./cli'}, access=write}], glob_scan_max_depth:
    3}}
  - -c
  - extends=null
  - -c
  - sandbox.workspace_options=null
---
command: sandbox
overrides:
  - -c
  - sandbox.environment.BEFORE=first
  - -c
  - sandbox.environment.CHANGE=first
  - -c
  - >-
    sandbox={environment: {CHANGE=last, ADD: cli}, filesystem: {entries:
    [{path={type=path, path='./cli'}, access=write}], glob_scan_max_depth:
    3}}
  - -c
  - extends=null
  - -c
  - sandbox.workspace_options=null
environment:
  KEEP: project
  CHANGE: last
  BEFORE: first
  ADD: cli
workspace_options: ~
glob_scan_max_depth: 3
paths:
  - cli
