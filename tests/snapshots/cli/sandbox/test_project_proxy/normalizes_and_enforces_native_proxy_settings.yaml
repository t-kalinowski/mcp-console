---
case: omitted domains
proxy:
  enabled: true
  enableSocks5: true
  enableSocks5Udp: false
  allowUpstreamProxy: false
  dangerouslyAllowAllUnixSockets: false
  mode: full
  allowLocalBinding: false
network: restricted
stdout: |
  direct network denied
  native proxy returned 403
