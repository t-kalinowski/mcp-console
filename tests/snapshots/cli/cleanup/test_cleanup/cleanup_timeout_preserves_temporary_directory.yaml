---
command:
  - mcp-console
  - sandbox
  - --
  - python
  - -c
  - |
    import os
    import subprocess
    import sys

    child = subprocess.Popen(
        ["/bin/sleep", "60"],
        stdin=subprocess.DEVNULL,
        stdout=subprocess.DEVNULL,
        stderr=subprocess.DEVNULL,
        start_new_session=True,
    )
    print(os.getpid())
    print(child.pid)
    print(os.environ["TMPDIR"])
    sys.stdout.flush()
    if sys.stdin.readline() == "exit\n":
        raise SystemExit(23)
    raise SystemExit(24)
stdout: |
  <sandbox root pid>
  <detached descendant pid>
  <sandbox temp>
stderr: >
  timed out waiting for sandbox manager cleanup; additionally, sandbox
  manager exited with status signal: 9 (SIGKILL); additionally, manager
  recovery failed: sandbox root <sandbox root pid> exited before fallback
  supervision
---
manager_cleanup: completion held past launcher timeout
launcher_returncode: 1
verified_cleanup: sandbox root, detached descendant, and manager
verified_preservation: sandbox temp
