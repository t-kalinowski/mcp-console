---
command:
  - mcp-console
  - sandbox
  - --
  - python
  - -c
  - |
    import os
    import subprocess
    import sys

    child = subprocess.Popen(
        ["/bin/sleep", "60"],
        stdin=subprocess.DEVNULL,
        stdout=subprocess.DEVNULL,
        stderr=subprocess.DEVNULL,
        start_new_session=True,
    )
    print(os.getpid())
    print(child.pid)
    print(os.environ["TMPDIR"])
    sys.stdout.flush()
    if sys.stdin.readline() == "exit\n":
        raise SystemExit(23)
    raise SystemExit(24)
stdout: |
  <sandbox root pid>
  <detached descendant pid>
  <sandbox temp>
---
manager_checkpoint: retirement cleanup
verified_manager_state: cleanup complete before directory removal
verified_cleanup: detached descendant
---
launcher_signal: SIGKILL
launcher_returncode: -9
verified_cleanup: sandbox root and manager
verified_removal: sandbox temp
