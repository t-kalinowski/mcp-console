---
command:
  - mcp-console
  - sandbox
  - --
  - python
  - -c
  - |
    import os
    import subprocess
    import sys

    child = subprocess.Popen(
        ["/bin/sleep", "60"],
        stdin=subprocess.DEVNULL,
        stdout=subprocess.DEVNULL,
        stderr=subprocess.DEVNULL,
        start_new_session=True,
    )
    print(os.getpid())
    print(child.pid)
    print(os.environ["TMPDIR"])
    sys.stdout.flush()
    if sys.stdin.readline() == "exit\n":
        raise SystemExit(23)
    raise SystemExit(24)
stdout: |
  <sandbox root pid>
  <detached descendant pid>
  <sandbox temp>
stderr: >
  timed out waiting for sandbox manager cleanup; additionally, failed to
  stop sandbox manager: failed to signal sandbox descendant <sandbox
  manager pid>: Operation not permitted (os error 1); additionally,
  sandbox manager did not stop after forced termination
---
manager_cleanup: completion held past both owner deadlines
manager_stop_signal: EPERM
launcher_returncode: 1
verified_bounded_return: within the recovery deadline
verified_detached_monitor: no recovery after root reap
verified_cleanup: sandbox root, detached descendant, and manager
verified_preservation: sandbox temp
