---
command: mcp-console
exit_code: 2
stdout: ""
stderr: |
  Persistent R, Python, and SQL sessions for MCP clients

  Usage: mcp-console <COMMAND>

  Commands:
    serve    Run the MCP server over standard input and output
    sandbox  Run a command with the default or an explicit sandbox policy
    help     Print this message or the help of the given subcommand(s)

  Options:
    -h, --help     Print help
    -V, --version  Print version

  Examples:
    mcp-console serve
    mcp-console sandbox -- python -c 'print("hello")'
---
command: mcp-console --help
stdout: |
  Persistent R, Python, and SQL sessions for MCP clients

  Usage: mcp-console <COMMAND>

  Commands:
    serve    Run the MCP server over standard input and output
    sandbox  Run a command with the default or an explicit sandbox policy
    help     Print this message or the help of the given subcommand(s)

  Options:
    -h, --help     Print help
    -V, --version  Print version

  Examples:
    mcp-console serve
    mcp-console sandbox -- python -c 'print("hello")'
---
command: mcp-console serve --help
stdout: |
  Run the MCP server over standard input and output

  Usage: mcp-console serve [OPTIONS]

  Options:
        --no-sandbox  Run evaluated code with server permissions, without sandbox isolation or descendant cleanup
    -h, --help        Print help
---
command: mcp-console worker --help
stdout: |
  Run the internal R worker

  Usage: mcp-console worker

  Options:
    -h, --help  Print help
---
command: mcp-console sandbox
exit_code: 2
stdout: ""
stderr: |
  error: the following required arguments were not provided:
    <COMMAND>...

  Usage: mcp-console sandbox <COMMAND>...

  For more information, try '--help'.
---
command: mcp-console sandbox --help
stdout: |
  Run a command with the default or an explicit sandbox policy

  Usage: mcp-console sandbox [OPTIONS] <COMMAND>...

  Arguments:
    <COMMAND>...  Command and arguments to run

  Options:
        --config-env <NAME>  Read the runner configuration as JSON from this launch environment variable
    -h, --help               Print help

  Examples:
    mcp-console sandbox -- Rscript analysis.R
    mcp-console sandbox -- python script.py
