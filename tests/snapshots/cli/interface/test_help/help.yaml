---
command: mcp-console serve --help
stdout: |
  Run the MCP server over standard input and output

  Usage: mcp-console serve [OPTIONS]

  Options:
    -c, --config <KEY=VALUE>    Override project configuration; repeat for multiple dotted KEY=VALUE assignments
        --no-sandbox            Skip inner native enforcement; retain any selected Docker container or Sandbox microVM and its provider policy
        --writable-root <PATH>  Allow writes to an additional path (temporary launch option)
    -h, --help                  Print help
