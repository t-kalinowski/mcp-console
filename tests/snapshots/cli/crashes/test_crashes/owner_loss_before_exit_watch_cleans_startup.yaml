---
command:
  - mcp-console
  - sandbox
  - --exit-with-parent
  - <owner pid>
  - --
  - /bin/echo
  - target ran
owner_signal: SIGKILL before owner-watch registration
owner_returncode: -9
stderr: |
  sandbox owner <owner pid> exited before exit observation
verified_target: did not run
verified_cleanup: sandbox root and private directory
