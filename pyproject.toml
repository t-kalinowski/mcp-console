[build-system]
requires = ["maturin>=1.10,<2.0"]
build-backend = "maturin"

[project]
name = "mcp-console"
dynamic = ["version"]
description = "Persistent R, Python, and SQL sessions for MCP clients"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
keywords = ["mcp", "r", "python", "sql", "duckdb"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/t-kalinowski/mcp-console"
Repository = "https://github.com/t-kalinowski/mcp-console"
Issues = "https://github.com/t-kalinowski/mcp-console/issues"
"Private runner source" = "https://github.com/t-kalinowski/codex/archive/7ecfbdb5c9bc267484be6f2eaad572aa433cf296.tar.gz"

[tool.maturin]
bindings = "bin"
compatibility = "pypi"
data = "target/private-wheel-data"
locked = true
