[build-system]
requires = ["maturin>=1.15,<2.0"]
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "mcp-console"
dynamic = ["version"]
description = "Persistent R, Python, and SQL sessions for MCP clients"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["typing-extensions>=4.16.0"]
license = "MIT"
keywords = ["mcp", "r", "python", "sql", "duckdb"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
anthropic = ["anthropic[mcp]>=1.4.0", "anyio>=4.9", "mcp>=2.2.0,<3"]
chatlas = ["chatlas[mcp]>=0.23.0", "anyio>=4.9", "mcp>=2.2.0,<3"]
client = ["anyio>=4.9", "mcp>=2.2.0,<3"]
codex = ["openai-codex>=0.147.0"]
openai = ["openai>=3.11.0", "anyio>=4.9", "mcp>=2.2.0,<3"]
openai-agents = ["openai-agents>=0.22.2", "anyio>=4.9", "mcp>=2.2.0,<3"]

[project.urls]
Homepage = "https://github.com/t-kalinowski/mcp-console"
Repository = "https://github.com/t-kalinowski/mcp-console"
Issues = "https://github.com/t-kalinowski/mcp-console/issues"

[tool.maturin]
bindings = "bin"
compatibility = "pypi"
locked = true
module-name = "mcp_console"
python-source = "python"
data = "wheel-data"
include = [
    { path = "wheel-data/data/.gitignore", format = "sdist" },
    { path = "build_backend.py", format = "sdist" },
    { path = "scripts/stage-sandbox-runner", format = "sdist" },
    { path = "sandbox-runner.json", format = "sdist" },
]
exclude = [
    { path = "wheel-data/data/.gitignore", format = "wheel" },
    { path = "wheel-data/data/libexec/**", format = "sdist" },
    { path = "wheel-data/data/share/**", format = "sdist" },
]
